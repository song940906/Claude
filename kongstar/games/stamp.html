<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 도장 쾅</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 도장 쾅: 밤 우체국 벽·책상(bg) → 도장 틀·단추·우편함(cv) → 콩이(stage) → 컨베이어 띠·봉투·도장·글자(fx) → 점수판 순서로 겹친다
   (콩이 앞발이 단추 위에, 띠가 콩이 아랫몸 앞에 오게) */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .hp { gap: 3px; padding: 0 9px; }
#hud .hp svg { width: 17px; height: 17px; display: block; transition: opacity .2s, transform .2s; }
#hud .hp svg.off { opacity: .28; transform: scale(.82); }
#hud .hp.hurt { animation: hpHurt .5s; }
@keyframes hpHurt { 0%, 100% { background: rgba(18,22,52,.62); } 30% { background: rgba(229,72,77,.8); } }
#hud .hp.heal { animation: hpHeal .6s; }
@keyframes hpHeal { 0%, 100% { background: rgba(18,22,52,.62); } 35% { background: rgba(37,174,107,.75); } }
#hud .cb { background: rgba(255,200,97,.9); color: #3B2A00; border-color: rgba(255,255,255,.4); }
#hud .cb small { color: #6B5200; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
@media (orientation: landscape) and (max-height: 400px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  /* 시작 카드: 최고 기록이 있어도 단추까지 화면 안에 들어오게 */
  body #cardStart .kg-card { padding: 10px 16px; }
  body #cardStart .kg-card h2 { font-size: 18px; line-height: 1.25; margin-bottom: 0; }
  body #cardStart .how { margin-top: 4px; padding: 6px 12px; }
  body #cardStart .how p { font-size: 13px; line-height: 1.35; }
  body #cardStart .kg-diff { margin-top: 6px; }
  body #cardStart .kg-diff button { height: 32px; }
  body #cardStart .rec { margin-top: 5px; }
  body #cardStart .rec span { padding: 4px 9px; font-size: 12px; }
  body #cardStart .row { margin-top: 7px; }
  body #cardStart .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="봉투가 지나가는 우체국 책상. 누르면 도장을 찍어요"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
  <div class="hp" id="hudHp"></div>
  <div class="cb" id="hudCb" hidden><small>콤보</small><span id="hudCbN">0</span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 도장 쾅</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>봉투의 점선 칸</b>이 도장 밑에 오면 <b>눌러서 쾅!</b></p>
      <p><b>「찍지 마세요」 소포</b>와 이미 찍힌 봉투는 그냥 보내요(Normal부터).</p>
      <p id="stKeys" hidden><b>스페이스</b>로도 찍어요 · <b>Esc</b> 멈추기</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">하트를 다 썼어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>찍은 봉투<b id="edMail"></b></span><span>퍼펙트<b id="edPerf"></b></span><span>최고 콤보<b id="edCombo"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'stamp', TITLE = J(name, '의') + ' 도장 쾅';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 크기: 모든 길이는 u(화면에 맞춘 한 칸) 단위. 가로 위치는 도장 한가운데가 0, 오른쪽이 + ═══════
  const EH = 1.4, BH = 2.1;                     // 봉투 높이 · 컨베이어 띠 높이
  const LW = 2.3, BW = 3.4, PW = 2.1;           // 편지 · 큰 봉투 · 소포 폭
  const KS = 3.4;                               // 콩이 크기
  const BEAM = 2.69, ST_TOP = 0.42, ST_PAD = 1.04;   // 띠 가운데에서 틀 막대 꼭대기까지 · 막대에서 쉬는 도장 손잡이 꼭대기까지 · 손잡이 꼭대기에서 고무판 바닥까지
  const DROP = 0.06, HOLD = 0.05;             // 도장이 내려가는 시간(이때 판정) · 찍고 머무는 시간
  const MAXH = 3;                               // 하트
  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   v0 처음 빠르기(u/초) → v1 (ramp 통째 보낸 뒤) → 한 통에 0.01씩 vMax 까지 → 그 뒤로 한 통에 0.003씩 vCap 까지
  //     (vCap 은 큰 봉투 두 칸 사이를 도장이 다시 올라오는 시간 안에 지나지 않는 빠르기 — 깰 수 없는 봉투가 나오지 않게) · box 점선 칸 폭(u) · perf 퍼펙트 범위(칸 반폭에 대한 비율)
  //   cool 한 번 찍은 뒤 다시 찍을 수 있을 때까지(초) · g0 처음 봉투 사이 빈 시간[최소, 최대](초) → g1 (점점 불규칙)
  //   dec 섞여 나오는 「찍으면 안 되는 것」 확률(처음 → 끝) · big 칸 두 개짜리 큰 봉투 확률 · heal 성공 몇 번마다 하트 하나 돌아오기(0 이면 없음) · late 봉투를 이만큼 보낸 뒤로는 heal 이 두 배(끝없이 버티기만 하는 판이 되지 않게, 0 이면 없음)
  //   hint 칸이 도장 밑에 오면 칸이 초록으로 빛난다
  //   wave (Very Hard 만, 없으면 꺼짐) 벨트 빠르기 물결: 놀이 at 초 뒤부터, 빠르기 배율을 1 ± amp[최소, 최대] 로 번갈아(빠르게 ↔ 느리게) 바꾼다.
  //     tr 초 동안 부드럽게 바뀌고 hold[최소, 최대] 초 머문다. 순간 빠르기는 vCap 을 넘지 않는다
  //     (원래 곡선이 vCap 에 가까워 빠르게 쪽 여유가 amp 최대보다 작으면 빠르게·느리게 폭을 같은 비율로 줄인다 — 느려지기만 하지 않게). 안개 구간과 그 뒤 grace 초 동안은 새로 바꾸지 않는다
  //     (안개 예고가 뜨기 전에 다 바뀌지 못할 바꿈은 안개가 걷힌 뒤로 미룬다 — 예고부터 안개가 걷힐 때까지 빠르기가 그대로)
  //   fog  (Very Hard 만, 없으면 꺼짐) 안개 구간: 놀이 at 초 뒤 첫 구간, 그 뒤로 gap[최소, 최대] 초마다. warn 초 예고 → fade 초 동안 짙어짐 → len[최소, 최대] 초 → fade 초 동안 걷힘
  //     안개는 도장 왼쪽 l 부터 오른쪽 r 까지(u) 그려지고 양끝 edge(u) 는 흐려진다. 판정은 보일 때와 똑같다
  //     가리는 것은 봉투 「통째로」: 봉투의 맨 앞 칸이 l-edge → l 을 지나는 동안 봉투 전체(꼬리·모서리까지)가 흐려져 사라지고,
  //     맨 뒤 칸이 r → r+edge 를 지나면 다시 보인다 (안개 밖으로 삐져나온 꼬리로 칸 자리를 알 수 없게)
  //     view 세로처럼 좁은 화면에서 칸 전체가 안개 전에 보이는 최소 거리(u). 화면 왼쪽 끝에서 이만큼 + 칸 폭 + edge 를 남기도록 l 을 도장 쪽으로 당긴다
  //     안개가 끼어 있는 동안 벨트 빠르기는 끼기 직전 값 그대로, 걷힌 뒤 ease 초 동안 원래 곡선으로 부드럽게 돌아간다
  const DIFF = {
    easy:   { v0: 1.45, v1: 2.25, vMax: 2.5, vCap: 4.0, ramp: 60, box: 1.2,  perf: 0.42, cool: 0.34, g0: [0.8, 1.3],  g1: [0.5, 1.3],  dec: [0, 0],       big: [0, 0],       heal: 10, late: 300, hint: true },
    normal: { v0: 1.85, v1: 2.9,  vMax: 3.2, vCap: 4.2, ramp: 70, box: 1.0,  perf: 0.36, cool: 0.30, g0: [0.6, 1.0],  g1: [0.3, 1.1],  dec: [0.12, 0.28], big: [0, 0],       heal: 20, late: 0, hint: false },
    hard:   { v0: 2.25, v1: 3.45, vMax: 3.85, vCap: 4.4, ramp: 80, box: 0.82, perf: 0.33, cool: 0.27, g0: [0.5, 0.85], g1: [0.22, 1.0], dec: [0.16, 0.32], big: [0.1, 0.24], heal: 30, late: 0, hint: false },
    vhard:  { v0: 2.65, v1: 3.9,  vMax: 4.3, vCap: 5.0, ramp: 80, box: 0.7,  perf: 0.30, cool: 0.24, g0: [0.4, 0.75], g1: [0.18, 0.95], dec: [0.2, 0.35], big: [0.16, 0.3], heal: 0,  hint: false,
              wave: { at: 8, hold: [2.5, 4], amp: [0.12, 0.22], tr: 0.8, grace: 0.8 },
              fog: { at: 20, gap: [10, 16], len: [5, 7], warn: 1.6, fade: 0.4, ease: 0.8, l: -1.3, r: 0.7, edge: 0.45, view: 2.0 } }
  };
  let diffId = 'normal', D = DIFF.normal;
  const P_GOOD = 10, P_PERF = 20, P_COMBO = 2, P_PASS = 5, P_BIG = 10;
  const ENV = [   // 편지 봉투 색 (파스텔)
    { f: '#FFF8EC', e: '#F2D9B8', s: '#F3A0A8' }, { f: '#FFEFF3', e: '#F4C9D3', s: '#8FB8F0' },
    { f: '#EEF5FF', e: '#C8DAF5', s: '#F5C26B' }, { f: '#EDFAF2', e: '#C2E8D2', s: '#C29BF0' }
  ];
  const INK = '#E04E68';

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '컨베이어로 지나가는 편지에 ' + J(name, '의') + ' 발바닥 도장을 찍어 줘요.';
  if (KEYS_OK) $('stKeys').hidden = false;
  const HEART = '<svg viewBox="0 0 24 24"><path fill="#FF8FA3" stroke="#fff" stroke-width="1.2" d="M12 20.5s-7.5-4.6-7.5-10.1C4.5 7.6 6.6 5.5 9.1 5.5c1.3 0 2.3.6 2.9 1.6.6-1 1.6-1.6 2.9-1.6 2.5 0 4.6 2.1 4.6 4.9 0 5.5-7.5 10.1-7.5 10.1z"/></svg>';
  $('hudHp').innerHTML = HEART.repeat(MAXH);
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 140);
  const HAS_WAVE = K.has('wave');

  // ═══════ 상태 ═══════
  let state = 'ready';     // ready · play · pause · over · result
  let items = [], score = 0, hearts = MAXH, combo = 0, maxCombo = 0, perfects = 0, goods = 0, mailed = 0, misses = 0, sent = 0, healN = 0, presses = 0;
  let speed = 1.8, beltPos = 0, gapLeft = 0, decoyRun = 0, overT = 0, overAt = 0, isNew = false, quit = false, playT = 0;
  const stamp = { t: 9, judged: true, deny: 0 };
  // Very Hard 안개·빠르기 물결 (D.fog · D.wave 가 없으면 그대로 꺼져 있다)
  //   fogPh: none · warn(예고) · in(짙어짐) · on(가림) · out(걷힘) · fogA 가림 진하기 0~1 · holdV 안개 동안 고정한 빠르기
  //   mul 지금 빠르기 배율 · mul0→mul1 로 mulK(0~1) 만큼 바뀌는 중 · mulAt 다음에 바꿀 시각 · cue 벨트 위 짧은 알림 글자
  let fogPh = 'none', fogT = 0, fogLen = 0, fogAt = 1e9, fogEnd = -1e9, fogA = 0, fogN = 0, holdV = 0;
  let mul = 1, mul0 = 1, mul1 = 1, mulK = 1, mulAt = 1e9, mulSign = 1, cue = null;
  let floats = [], parts = [], splats = [];
  let mood = 'idle', moodT = 0, tAnim = 0, shakeT = 0;
  let W = 0, H = 0, DPR = 1, U = 40, CX = 0, BY = 0, SAF = { t: 0, b: 0, l: 0, r: 0 }, wide = false, KSZ = 160, kx = 0, ky = 0, beamY = 0, btnX = 0, MX = 0;
  const px = x => CX + x * U;            // u → 화면 x
  const leftU = () => -(CX - SAF.l) / U - 0.3, rightU = () => (W - SAF.r - CX) / U + 0.3;
  const mailU = () => (MX - CX) / U;
  // 콩이 wave 자세에서 든 앞발 바닥의 자리 (발밑 기준, 콩이 크기에 대한 비율) — 실제 그림을 재서 맞춘 값
  const PAW_DX = -0.22, PAW_DY = -0.43;

  // ═══════ 화면 맞추기 ═══════

  function layout() {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H;
    const hudTop = wide ? SAF.t + 16 : SAF.t + 62, topLim = wide ? SAF.t + 60 : SAF.t + 102;
    const avail = H - topLim - SAF.b - 4;
    // 세로로 띠 가운데 위 4.5u(도장 틀·콩이 머리) + 아래 1.35u(띠 아래 반·책상 끝)

    kx = btnX - PAW_DX * KSZ;
    MX = W - SAF.r - 0.85 * U;

    hud.classList.toggle('tight', W < 340);
    bar.setTitle(wide ? '' : W < 350 ? '도장 쾅' : TITLE);

  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));

  function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  // 밤 우체국: 위는 별 뜬 밤하늘 창, 아래는 나무 책상
  function buildBg() {
    const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.55, '#1E2366'); lg.addColorStop(1, '#3F3790');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.2, H * 0.15, Math.max(W, H) * 0.5, 'rgba(130,130,255,.14)'); blob(W * 0.85, BY - 3 * U, Math.max(W, H) * 0.4, 'rgba(255,190,140,.10)');
    const rnd = mulberry32(37), n = Math.round(clamp(W * BY / 2800, 50, 320));
    for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * (BY - 1.5 * U), r = rnd() < 0.07 ? 1.1 + rnd() * 0.7 : 0.4 + rnd() * 0.7; c.globalAlpha = 0.3 + rnd() * 0.6; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
    // 책상: 띠 바로 위부터 아래 끝까지
    const dt = BY - (BH / 2 + 0.35) * U, db = BY + (BH / 2 + 0.3) * U;
    const lw = c.createLinearGradient(0, dt, 0, db); lw.addColorStop(0, '#F4DCBB'); lw.addColorStop(1, '#E6C397');
    c.fillStyle = lw; c.fillRect(0, dt, W, db - dt);
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(0, dt, W, 2);
    const lf = c.createLinearGradient(0, db, 0, H); lf.addColorStop(0, '#D7AD7E'); lf.addColorStop(1, '#B98D63');
    c.fillStyle = lf; c.fillRect(0, db, W, H - db);
    c.fillStyle = 'rgba(90,50,20,.18)'; c.fillRect(0, db, W, 3);

  }
  // 도장 틀(기둥·위 막대·준비 불)·단추·우편함 — 콩이 뒤(cv)
  function drawFrame() {
    const c = g; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bandTop = BY - BH / 2 * U, bt = 0.24 * U;
    // 기둥
    c.fillStyle = '#C9D0F0';
    for (const d of [-0.72, 0.72]) { rr(c, px(d) - 0.07 * U, beamY, 0.14 * U, bandTop - beamY + 0.1 * U, 0.07 * U); c.fill(); }
    // 위 막대
    c.save(); c.shadowColor = 'rgba(4,6,24,.35)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    const lg = c.createLinearGradient(0, beamY, 0, beamY + bt); lg.addColorStop(0, '#F3F5FF'); lg.addColorStop(1, '#C9D0F0');
    c.fillStyle = lg; rr(c, px(-1.0), beamY, 2.35 * U, bt, bt / 2); c.fill(); c.restore();

      c.fillStyle = sg; rr(c, sx0, st, sw, sb - st + 0.2 * U, 0.08 * U); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(kx - 0.12 * U, st, 0.24 * U, sb - st);
      c.fillStyle = 'rgba(120,70,30,.25)'; c.fillRect(sx0, st, sw, Math.max(1.5, 0.05 * U));
    }

  }

  // ═══════ 그림 조각 ═══════
  // 콩이 발바닥 도장: 가운데 x,y · 반지름 r(큰 볼록살 기준) · 기울기 · 진하기 · 번짐
  function pawPrint(c, x, y, r, rot, col, alpha, smudge) {
    const ga = c.globalAlpha;   // 바깥 진하기(안개로 흐려지는 봉투·우편함으로 날아가는 봉투)에 곱한다
    c.save(); c.translate(x, y); c.rotate(rot || 0); c.globalAlpha = ga * alpha; c.fillStyle = col;
    c.beginPath(); c.ellipse(0, r * 0.32, r * 0.62, r * 0.5, 0, 0, TAU); c.fill();
    for (const [tx, ty, tr] of [[-0.62, -0.28, 0.24], [-0.22, -0.62, 0.25], [0.22, -0.62, 0.25], [0.62, -0.28, 0.24]]) { c.beginPath(); c.ellipse(tx * r, ty * r, tr * r, tr * r * 1.15, tx * 0.5, 0, TAU); c.fill(); }

    c.restore();
  }
  function dashBox(c, x, y, w, h, col, glow) {

    c.strokeStyle = col; c.lineWidth = Math.max(1.4, 0.05 * U); c.setLineDash([Math.max(3, 0.12 * U), Math.max(2.5, 0.09 * U)]);

  }
  function drawItem(c, it, ox, oy, sc) {
    const w = it.w * U * sc, h = EH * U * sc, L = ox - w / 2, T = oy - h / 2, u = U * sc;
    c.save();
    c.fillStyle = 'rgba(10,12,40,.28)'; rr(c, L + 0.06 * u, T + 0.1 * u, w, h, 0.14 * u); c.fill();
    if (it.kind === 'parcel') {
      c.fillStyle = '#F7AFAF'; rr(c, L, T, w, h, 0.14 * u); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(L + w * 0.12, T, 0.14 * u, h); c.fillRect(L + w * 0.88 - 0.14 * u, T, 0.14 * u, h);
      const bh = 0.62 * u; c.fillStyle = '#E5484D'; c.fillRect(L, oy - bh / 2, w, bh);
      const txt = '✋ 찍지 마세요'; c.font = '800 10px ' + FONT; const fs = clamp(Math.min(0.3 * u, (w - 0.24 * u) / (c.measureText(txt).width / 10)), 6, 40);   // 소포 폭 안에 들어가게
      c.fillStyle = '#fff'; c.font = '800 ' + fs + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(txt, ox, oy + 0.02 * u);

    } else {
      const col = it.kind === 'big' ? { f: '#F4DDBA', e: '#DDBB8C', s: '#C98B52' } : it.kind === 'done' ? { f: '#ECEEF4', e: '#CDD2DE', s: '#A9B0C2' } : ENV[it.hue];

      c.strokeStyle = col.e; c.lineWidth = Math.max(1, 0.04 * u); rr(c, L, T, w, h, 0.14 * u); c.stroke();

      if (it.kind === 'big') { c.fillStyle = '#C98B52'; c.font = '800 ' + Math.max(9, 0.26 * u) + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('두 번 쾅', L + (it.boxes[0].off + it.boxes[1].off) / 2 * u, T + 0.26 * u); }
      for (const b of it.boxes) {

  // ═══════ 봉투 만들기 ═══════
  const prog = () => clamp(sent / D.ramp, 0, 1);
  function curSpeed() {
    if (sent <= D.ramp) return lerp(D.v0, D.v1, prog());
    const k = sent - D.ramp, a = D.v1 + k * 0.01;
    return a <= D.vMax ? a : Math.min(D.vCap, D.vMax + (k - (D.vMax - D.v1) / 0.01) * 0.003);
  }
  function makeItem() {
    const p = prog();
    let kind = 'letter';
    const pd = sent < 4 ? 0 : lerp(D.dec[0], D.dec[1], p), pb = sent < 6 ? 0 : lerp(D.big[0], D.big[1], p);
    const r = Math.random();
    if (decoyRun < 2 && r < pd) kind = Math.random() < 0.5 ? 'parcel' : 'done';
    else if (r < pd + pb) kind = 'big';
    decoyRun = kind === 'parcel' || kind === 'done' ? decoyRun + 1 : 0;
    const s = D.box, it = { kind, target: kind === 'letter' || kind === 'big', x: 0, w: kind === 'big' ? BW : kind === 'parcel' ? PW : LW, boxes: [], marks: [], hue: Math.floor(Math.random() * ENV.length), missed: false, spoiled: false, ok: false, mail: -1, id: sent };
    if (kind === 'letter' || kind === 'done') it.boxes.push({ off: it.w - s / 2 - 0.22, s, stamped: kind === 'done', pre: kind === 'done' ? rand(-0.4, 0.4) || 0.1 : 0, gone: false, print: null });
    else if (kind === 'big') { it.boxes.push({ off: it.w * 0.27, s, stamped: false, gone: false, print: null }); it.boxes.push({ off: it.w * 0.8, s, stamped: false, gone: false, print: null }); }
    sent++;
    return it;
  }
  function spawn(first) {
    const it = makeItem();
    if (first) it.x = Math.max(leftU() - it.w, -4.2 - (it.boxes[0] ? it.boxes[0].off : it.w / 2));
    else it.x = leftU() - it.w + clamp(-gapLeft, 0, 1);   // 한 장면 사이에 더 간 만큼
    items.push(it);
    // 다음 봉투는 이 봉투 왼쪽 끝이 화면 왼쪽에서 「빈 시간 × 빠르기」만큼 들어왔을 때 들어온다 → 띠가 더 가야 할 거리
    const p = prog(), lo = lerp(D.g0[0], D.g1[0], p), hi = lerp(D.g0[1], D.g1[1], p);
    gapLeft = Math.max(0.3, rand(lo, hi) * speed - (it.x - leftU()));
  }

  // ═══════ 찍기 ═══════
  function press() {
    if (state !== 'play') return false;
    if (stamp.t < D.cool) { stamp.deny = 0.25; tone(260, 0.04, 'sine', 0.03); return false; }
    stamp.t = 0; stamp.judged = false; presses++;
    tone(520, 0.05, 'sine', 0.04, 0, 300);
    return true;
  }
  function impact() {
    noise(0.09, 0.13, 420, 120); tone(115, 0.1, 'sine', 0.13);
    if (!reduceMotion) shakeT = 0.12;
    const it = items.find(i => i.mail < 0 && i.x <= 0 && i.x + i.w >= 0);
    const fy = floatY();
    if (!it) { splats.push({ x: 0, life: 0.6, rot: rand(-0.5, 0.5) }); miss('허공에 찍었어요', fy); return; }
    const local = -it.x, rot = rand(-0.25, 0.25);
    if (!it.target) { it.spoiled = true; it.marks.push({ dx: local, rot }); miss(it.kind === 'parcel' ? '찍지 마세요 소포예요!' : '이미 찍힌 봉투예요', fy, it); return; }
    // 잘못 찍은 봉투는 그 뒤 칸을 놓치거나 또 잘못 찍어도 하트를 한 번 더 깎지 않는다 (miss 의 it.hurt)
    if (it.boxes.some(b => b.stamped && Math.abs(local - b.off) <= b.s / 2)) { it.marks.push({ dx: local, rot }); it.missed = true; miss('이미 찍은 칸이에요', fy, it); return; }
    let bb = null, bd = 1e9;
    for (const b of it.boxes) if (!b.stamped && !b.gone) { const d = Math.abs(local - b.off); if (d < bd) { bd = d; bb = b; } }
    if (!bb || bd > bb.s / 2) { it.marks.push({ dx: local, rot }); it.missed = true; miss('칸 밖이에요', fy, it); return; }
    // 성공
    const perf = bd <= bb.s / 2 * D.perf;
    bb.stamped = true; bb.print = { dx: local - bb.off, rot: perf ? rot * 0.3 : rot, perf };
    let pts;
    if (perf) { combo++; perfects++; maxCombo = Math.max(maxCombo, combo); pts = P_PERF + P_COMBO * Math.min(combo - 1, 15); }
    else { combo = 0; goods++; pts = P_GOOD; }
    const done = it.boxes.every(b => b.stamped);
    if (done) { mailed++; if (it.kind === 'big') pts += P_BIG; }
    score += pts; bumpScore();
    addFloat(px(-0.35), fy, perf ? (combo >= 2 ? '퍼펙트! ×' + combo : '퍼펙트!') : '좋아요', perf ? '#FFE08A' : '#fff', perf);
    addFloat(px(-0.35), fy + 22, '+' + pts, perf ? '#FFE08A' : '#DDE3FF', false);
    if (!reduceMotion) for (let i = 0; i < (perf ? 10 : 5); i++) { const a = rand(-Math.PI, 0), v = rand(60, 170); parts.push({ x: px(0), y: BY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.55), col: perf ? pick(['#FFE08A', '#FF9DB0', '#fff']) : '#FFD0DA' }); }
    if (perf) { tone(880 + Math.min(combo, 10) * 45, 0.12, 'triangle', 0.06); tone(1320 + Math.min(combo, 10) * 45, 0.14, 'triangle', 0.045, 0.06); setMood('joy', 0.7); if (combo % 10 === 0) KG.lick(0.85, 0.1); }   // 11-28: 퍼펙트 10연속마다 칭찬 핥기

  // 안개: 도장 왼쪽 l ~ 오른쪽 r 을 봉투째 가린다. 양끝 edge 는 흐려지며, 예고 중에는 자리만 옅게 깜빡인다
  function drawFog(c, bt, bb) {
    const F = D.fog; if (!F) return;
    const warn = fogPh === 'warn' ? (0.26 + 0.12 * Math.sin(tAnim * 9)) * clamp(fogT / 0.3, 0, 1) : 0;
    const a = Math.max(fogA, warn); if (a <= 0.005) return;
    const L = px(fogL()), R = px(F.r), E = F.edge * U, top = bt - 0.3 * U, bot = bb + 0.14 * U;
    c.save(); c.globalAlpha = a;
    const lg = c.createLinearGradient(L - E, 0, R + E, 0), e = E / (R - L + 2 * E);
    lg.addColorStop(0, 'rgba(204,208,240,0)'); lg.addColorStop(e, 'rgba(204,208,240,1)'); lg.addColorStop(1 - e, 'rgba(204,208,240,1)'); lg.addColorStop(1, 'rgba(204,208,240,0)');
    c.fillStyle = lg; c.fillRect(L - E, top, R - L + 2 * E, bot - top);
    // 위·아래 뭉게구름 테두리 (가운데 짙은 곳에만 — 겹쳐도 얼룩지지 않게 불투명 색)
    c.fillStyle = '#CCD0F0';
    const n = Math.max(3, Math.round((R - L) / (0.42 * U)));
    for (let i = 0; i <= n; i++) {
      const x = L + (R - L) * i / n, w = Math.sin(tAnim * 1.3 + i * 1.9);
      c.beginPath(); c.arc(x, top + 0.04 * U * w, (0.26 + 0.05 * (i % 2)) * U, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + 0.2 * U, bot - 0.02 * U * w, 0.18 * U, 0, TAU); c.fill();
    }
    // 안에서 천천히 흐르는 옅은 김
    c.beginPath(); c.rect(L, top - 0.3 * U, R - L, bot - top + 0.6 * U); c.clip();
    c.fillStyle = 'rgba(255,255,255,.38)';
    for (let i = 0; i < 4; i++) {
      const span = R - L + 1.6 * U, x = L - 0.8 * U + (((tAnim * 0.35 * U + i * span / 4) % span) + span) % span, y = BY + (i % 2 ? 0.35 : -0.3) * U;
      c.beginPath(); c.ellipse(x, y, 0.55 * U, 0.16 * U, 0, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(120,126,180,.18)'; c.fillRect(L - E, bb - 0.25 * U, R - L + 2 * E, 0.4 * U);
    c.restore();
  }
  function drawKong() {
    const playing = state === 'play' || state === 'pause' || state === 'over';
    const won = state === 'result' && score > 0 && !quit;
    const pose = (playing || won) && HAS_WAVE ? 'wave' : 'sit';
    if (K.rig.pose !== pose) K.setPose(pose);
    // 다음에 찍을 칸 쪽을 본다
    let tgt = null;
    // 안개 속 봉투는 쳐다보지 않는다 (눈길로 자리를 알려 주지 않게) — 안개를 보거나 다음에 들어오는 봉투를 본다
    const veiled = i => veil(i) > 0.3;
    if (playing) {
      const n = items.filter(i => i.mail < 0 && i.target && i.boxes.some(b => !b.stamped && !b.gone)).sort((a, b) => b.x - a.x);
      const v = n.find(i => !veiled(i));
      if (n.length && v === n[0]) tgt = { x: px(v.x + v.w / 2), y: BY };
      else if (n.length) tgt = { x: px((fogL() + D.fog.r) / 2), y: BY };
    }
    const hd = K.head(); let lx = -0.5, ly = 0.4;
    if (tgt) { lx = clamp((tgt.x - hd.x) / 160, -1, 1); ly = clamp((tgt.y - hd.y) / 160, -1, 1); }
    const sad = mood === 'sad' || (state === 'over' && !quit), joy = mood === 'joy', happy = mood === 'happy' || joy;
    // 앞발 누르기: 찍는 동안 콩이가 조금 아래로 (단추를 꾹)
    const push = pose === 'wave' && playing ? stampOffset() * 0.16 * U : 0;
    const hop = !reduceMotion && joy ? Math.sin(clamp(moodT / 0.7, 0, 1) * Math.PI) * 10 : 0;
    K.render({ t: tAnim, eyes: sad ? 'closed' : happy || won ? 'happy' : 'open', mouth: sad ? 'closed' : 'open', look: sad ? [0, 0.6] : [lx, ly],
      tilt: sad ? -8 : Math.sin(tAnim * 1.3) * 2.5 + (happy ? 4 : 0), hop: 0, squash: push ? -0.06 : 0, earLift: sad ? -8 : happy ? 7 : 0, nod: sad ? 2 : 0,
      tailAmp: sad ? 3 : happy || won ? 24 : 12, tailRate: happy || won ? 3.6 : 2.2, blush: happy || won ? 1 : 0 });
    K.place(kx, ky + push - hop, 1);
  }
  let last = 0;
  // 절전: 놀이 중이 아니면(시작·멈춤·결과 카드) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let calmKey = '', calmAt = 0, drawnAt = -1e9;
  function calmSkip(now) {
    const key = state + '|' + W + 'x' + H;
    if (key !== calmKey) { calmKey = key; calmAt = now; }
    if ((state !== 'ready' && state !== 'pause' && state !== 'result') || now - calmAt < 1000 || now - drawnAt >= 200) { drawnAt = now; return false; }
    return true;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (calmSkip(now)) return;
    draw();
  }

  // ═══════ 점수판 ═══════
  function paintHud() {
    $('hudScore').textContent = fmt(score);
    const hs = $('hudHp').children; for (let i = 0; i < hs.length; i++) hs[i].classList.toggle('off', i >= hearts);
    $('hudCb').hidden = combo < 2; $('hudCbN').textContent = combo;
  }

  // ═══════ 시작·멈춤·끝 ═══════
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd']) $(k).hidden = k !== id; if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  function reset() {
    items = []; score = 0; hearts = MAXH; combo = 0; maxCombo = 0; perfects = 0; goods = 0; mailed = 0; misses = 0; sent = 0; healN = 0; presses = 0;
    beltPos = 0; decoyRun = 0; playT = 0; quit = false; isNew = false; floats = []; parts = []; splats = []; mood = 'idle'; moodT = 0;
    fogPh = 'none'; fogT = 0; fogA = 0; fogN = 0; fogEnd = -1e9; holdV = 0; fogAt = D.fog ? D.fog.at : 1e9;
    mul = mul0 = mul1 = 1; mulK = 1; mulAt = D.wave ? D.wave.at : 1e9; mulSign = Math.random() < 0.5 ? 1 : -1; cue = null;
    stamp.t = 9; stamp.judged = true; stamp.deny = 0; speed = curSpeed(); gapLeft = 0;
  }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    reset(); spawn(true);
    state = 'play'; paintHud();
    showCard(null); btnPause.hidden = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    KG.unlockAudio(); tone(659, 0.1, 'triangle', 0.05); tone(880, 0.18, 'triangle', 0.05, 0.1);
  }
  function pause() {
    if (state !== 'play') return; state = 'pause';
    $('psText').textContent = fmt(score) + '점 · 하트 ' + hearts + '개예요. ' + J(name, '이/가') + ' 도장을 들고 기다려요.';
    showCard('cardPause', 'btnResume'); if (document.activeElement === btnPause) btnPause.blur();
  }
  function resume() { if (state !== 'pause') return; state = 'play'; showCard(null); last = performance.now(); }
  function gameOver() {
    if (state !== 'play') return;
    state = 'over'; overT = 1.3; btnPause.hidden = true; sfx('lose'); setMood('sad', 2);
  }
  function end() {   // 「그만하기」: 지금 점수로 끝낸다
    if (state === 'pause') { state = 'play'; showCard(null); }
    if (state !== 'play') return;
    quit = true; state = 'over'; overT = 0.3; btnPause.hidden = true;
  }
  function showResult() {
    if (state !== 'over') return;
    state = 'result'; overAt = performance.now();
    isNew = score > 0 && setBest(KG.dkey(KEY, diffId), score);
    $('edScore').textContent = fmt(score); $('edMail').textContent = fmt(mailed) + '통'; $('edPerf').textContent = fmt(perfects) + '번'; $('edCombo').textContent = fmt(maxCombo);
    $('edTitle').textContent = quit ? '여기까지 했어요' : mailed >= 40 ? '도장 달인이에요!' : '하트를 다 썼어요';
    if (!quit && mailed >= 40 && KG.master) KG.master('stamp');   // 업적 「게임 달인」 (11-27)
    $('edText').textContent = mailed > 0 ? J(name, '이/가') + ' 편지 ' + fmt(mailed) + '통을 우편함에 넣었어요.' + (maxCombo >= 3 ? ' 퍼펙트 ' + maxCombo + '번 연속!' : '') : '점선 칸이 도장 바로 밑에 올 때 눌러 봐요.';
    paintBest(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win'); else if (score > 0 && !quit) KG.lick(0.9, 0.35);   // 11-28: 결과 기쁨 핥기 (신기록이면 공통이 짖으니 뺀다)
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);

  // ═══════ 입력: 화면 어디든 누르면 쾅 · 스페이스 ═══════
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault(); press();
  });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === ' ' || k === 'Enter' || k === 'ArrowDown') {
      if (state === 'play') { e.preventDefault(); if (e.repeat || KG.rulesOpen || k === 'Enter') return; press(); return; }
      if (k === 'ArrowDown') return;
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  // 시작 전 화면: 띠 위에 봉투 몇 개를 미리 놓아 둔다 (무엇을 하는 게임인지 보이게)
  function demo() {
    D = DIFF[KG.diff()] || DIFF.normal; reset();
    // 소포는 소포가 나오는 난이도(Normal 부터)에서만 보여 준다. Easy 는 편지 두 장
    const a = makeItem(); a.x = -3.6; const b = makeItem(); b.x = 0.9;
    if (D.dec[1] > 0) { b.kind = 'parcel'; b.target = false; b.boxes = []; b.w = PW; }
    items = [a, b]; sent = 0;
  }
  function onDiff() { paintBest(); if (state === 'ready') demo(); }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
  layout(); demo(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '우체국 컨베이어로 지나가는 편지에 발바닥 도장을 찍는 놀이예요.', items: [
    ['👆', '화면 아무 데나 누르면 도장이 쾅! 봉투의 점선 칸 안에 찍어요' + (KEYS_OK ? ' (스페이스).' : '.')],
    ['🎯', '칸 한가운데일수록 퍼펙트! 퍼펙트를 이어 가면 콤보 점수가 붙어요.'],
    ['🚫', '빨간 「찍지 마세요」 소포와 이미 찍힌 봉투는 그냥 보내요(Normal부터). 칸이 두 개인 큰 봉투는 두 번(Hard부터)!'],
    ['❤️', '칸 밖·허공에 찍거나 봉투를 그냥 보내면 하트가 줄어요(봉투 한 장에 한 번만). 잘 찍으면 가끔 하트가 돌아와요(Very Hard 빼고).'],
    ['☁️', 'Very Hard 는 벨트가 빨라졌다 느려졌다 하고, 가끔 안개가 껴서 도장 밑이 안 보여요. 안개 속에선 빠르기가 그대로니 박자로 찍어요!']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  // nextIn(): 지금부터 몇 초 뒤에 누르면 다음 찍을 칸 한가운데에 찍히는지 (도장이 내려가는 시간 포함). 찍을 칸이 없으면 null
  function nextIn() {
    let bestT = null;
    for (const it of items) { if (it.mail >= 0 || !it.target) continue; for (const b of it.boxes) { if (b.stamped || b.gone) continue; const c = it.x + b.off; const t = -c / speed - DROP; if (t > -b.s / 2 / speed && (bestT == null || t < bestT)) bestT = t; } }
    return bestT;
  }
  window.GAME = {
    DIFF, get state() { return state; }, get score() { return score; }, get hearts() { return hearts; }, get combo() { return combo; }, get maxCombo() { return maxCombo; },
    get perfects() { return perfects; }, get goods() { return goods; }, get mailed() { return mailed; }, get misses() { return misses; }, get sent() { return sent; }, get speed() { return speed; }, get diff() { return diffId; },
    get ready() { return state === 'play' && stamp.t >= D.cool; }, get playT() { return playT; }, get cool() { return D.cool; }, DROP,
    // alpha 봉투가 그려지는 진하기(1 = 다 보임) · hidden 안개에 통째로 묻혀 안 보이나 (칸마다 같은 값)
    items: () => items.map(i => { const a = 1 - veil(i); return { id: i.id, kind: i.kind, x: i.x, w: i.w, target: i.target, mail: i.mail, alpha: a, hidden: a <= 0.01, boxes: i.boxes.map(b => ({ c: i.x + b.off, s: b.s, stamped: b.stamped, gone: b.gone, hidden: a <= 0.01 })) }; }),
    // Very Hard 안개·물결: ph 단계 · a 가림 진하기 · hidden 안개가 다 꼈나 · n 몇 번째 안개 · at 다음 안개 시각(놀이 초) · l 이 화면에서 쓰는 안개 왼쪽 끝(좁은 화면은 당겨짐) · l0 표의 l · r 오른쪽 끝(u)
    fog: () => ({ ph: fogPh, a: fogA, hidden: fogA >= 0.99, n: fogN, at: fogAt, l: D.fog ? fogL() : null, l0: D.fog ? D.fog.l : null, r: D.fog ? D.fog.r : null }),
    // speedMul 물결 배율(표 그대로) · speedMulEff 실제 벨트 빠르기 ÷ 원래 곡선 (vCap 근처에서 줄인 폭·안개 고정까지 들어간 값)
    get speedMul() { return mul; }, get speedMulEff() { return speed / curSpeed(); }, get baseSpeed() { return curSpeed(); }, get cue() { return cue ? cue.txt : null; },
    field: () => ({ W, H, U, CX, BY, kx, ky, KSZ, beamY, btnX, MX, leftU: leftU(), hud: hud.getBoundingClientRect().toJSON() }),
    nextIn, press, start, end, pause, resume,
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
