<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 간식가게</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 간식가게: 밤하늘·가게(bg) → 콩이(stage) → 손님·계산대(fx) → 말풍선·점수판 → 진열대(panel) 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; pointer-events: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .hp { padding: 0 9px; gap: 3px; }
#hud .hp svg { width: 17px; height: 17px; display: block; transition: opacity .25s, transform .25s; }
#hud .hp svg.off { opacity: .22; transform: scale(.82); }
#hud .hp svg.pop { animation: hpPop .45s; }
@keyframes hpPop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
#hud .cu { color: #D5DBFF; font-weight: 500; }
#hud .st { color: #FFE9A8; }
#hud .sc { margin-left: auto; }
#hud .sc small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-left: 1px; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
#hud.tight .hp { padding: 0 7px; gap: 2px; }
#hud.tight .hp svg { width: 15px; height: 15px; }

/* 말풍선 (손님의 주문) */
#bubble { position: fixed; z-index: 9; box-sizing: border-box; background: #fff; color: var(--ink); border-radius: 18px; padding: 8px 10px 9px; box-shadow: 0 6px 18px rgba(60,40,30,.18); text-align: center; pointer-events: none; transform-origin: 50% 100%; animation: bbIn .22s ease-out; }
@keyframes bbIn { from { opacity: 0; transform: translateY(6px) scale(.92); } to { opacity: 1; transform: none; } }
#bubble::after { content: ""; position: absolute; left: var(--tx, 50%); bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: #fff; transform: rotate(45deg); border-radius: 3px; }
#bubble .items { position: relative; z-index: 1; display: flex; justify-content: center; gap: 2px; white-space: nowrap; }
#bubble .it { width: 30px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 23px; line-height: 1; border-radius: 10px; }
#bubble .it.q { background: var(--soft); color: #9AA3B2; font-size: 16px; font-weight: 700; width: 26px; margin: 0 2px; }
#bubble .it.x { opacity: .35; position: relative; }
#bubble .it.x::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 2.5px; border-radius: 2px; background: #E5484D; transform: rotate(-20deg); }
#bubble.small .it { width: 26px; height: 28px; font-size: 20px; }
#bubble.small .it.q { width: 22px; font-size: 14px; }
#bubble .msg { position: relative; z-index: 1; font-size: 14px; font-weight: 600; padding: 5px 6px; white-space: nowrap; }
#bubble .not { position: relative; z-index: 1; margin-top: 4px; font-size: 12.5px; font-weight: 600; color: #C0392B; background: #FFECEC; border-radius: 9px; padding: 3px 8px; white-space: nowrap; display: inline-block; }
#bubble .bar { position: relative; z-index: 1; height: 6px; border-radius: 3px; background: var(--soft); margin: 6px 2px 0; overflow: hidden; }
#bubble .bar i { display: block; height: 100%; width: 100%; border-radius: 3px; background: #5CCB8F; transform-origin: 0 50%; }
#bubble .bar i.mid { background: #FFC24D; }
#bubble .bar i.low { background: #F0696E; }
#bubble.good { box-shadow: 0 0 0 2.5px #7ED9A6, 0 6px 18px rgba(60,40,30,.18); }
#bubble.bad { box-shadow: 0 0 0 2.5px #F3A0A3, 0 6px 18px rgba(60,40,30,.18); }
body.paused #bubble .items, body.paused #bubble .not { visibility: hidden; }

/* 아래 판: 쟁반 + 진열대 */
#panel { position: fixed; z-index: 8; box-sizing: border-box; background: var(--card); color: var(--ink); border-radius: 24px 24px 0 0; padding: 12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); box-shadow: 0 -6px 24px rgba(8,10,28,.22); --rowh: clamp(54px, 8.2vh, 68px); --trayh: clamp(48px, 7vh, 58px); }
body.wide #panel { border-radius: 24px; padding: 12px; --rowh: 54px; --trayh: 48px; box-shadow: 0 8px 28px rgba(8,10,28,.3); }
#trayRow { display: flex; align-items: stretch; gap: 8px; height: var(--trayh); }
#tray { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; background: #FFF1DF; border-radius: 16px; box-shadow: inset 0 0 0 2px #F6D9B4; padding: 0 8px; }
#tray .slot { flex: 0 1 38px; min-width: 0; aspect-ratio: 1; max-height: calc(var(--trayh) - 10px); border-radius: 50%; box-sizing: border-box; border: 2px dashed #E7C79C; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
#tray .slot.on { border: 0; background: #fff; box-shadow: 0 1px 4px rgba(120,80,40,.18); animation: slotIn .16s ease-out; }
#tray .slot.next { border-color: #E39A63; }
@keyframes slotIn { from { transform: scale(.6); } to { transform: none; } }
#tray.good { box-shadow: inset 0 0 0 2.5px #7ED9A6; background: #EAF9F0; }
#tray.bad { box-shadow: inset 0 0 0 2.5px #F3A0A3; background: #FFEFEF; animation: shakeX .32s; }
@keyframes shakeX { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
#tray .hint { font-size: 13px; color: #B08A5E; font-weight: 500; }
#btnReset { flex: none; height: auto; min-height: 44px; min-width: 76px; padding: 0 12px; font-size: 14px; border-radius: 16px; }
#btnReset:disabled { opacity: .45; }
#shelf { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: var(--rowh); gap: 6px; height: calc(var(--rowh) * 2 + 6px); margin-top: 8px; }
#shelf button { border: 0; border-radius: 16px; background: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; min-width: 0; min-height: 44px; touch-action: manipulation; transition: transform .08s, background .08s; }
#shelf .empty { border-radius: 16px; border: 2px dashed #E8EBF0; box-sizing: border-box; }
#shelf button .e { font-size: 25px; line-height: 1.05; }
#shelf button .n { font-size: 11px; line-height: 1.1; font-weight: 600; color: var(--sub); letter-spacing: -.3px; }
#shelf button.hit { transform: scale(.93); background: #E6E9F4; }
#shelf button.new { animation: newIn .5s ease-out; box-shadow: inset 0 0 0 2px var(--gold); }
@keyframes newIn { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }
#shelf button:focus-visible, #btnReset:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }

.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } #btnReset { min-width: 68px; padding: 0 8px; font-size: 13px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면(높이 360px 이하): 결과 카드가 300px 안팎으로 좁아져 기록 칸이 두 줄이 되고 「다시 하기」가 카드 밖으로 잘린다 — 공통 배치로는 안 되는 이 게임 결과 카드의 높이만 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card #edText { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
@media (prefers-reduced-motion: reduce) { #bubble, #tray .slot.on, #tray.bad, #shelf button.new { animation: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="hp" id="hudHp"></div>
  <div class="cu" id="hudCust">손님 1</div>
  <div class="st" id="hudStreak" hidden></div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>

<div id="bubble" hidden role="status" aria-live="polite">
  <div class="items" id="bbItems"></div>
  <div class="not" id="bbNot" hidden></div>
  <div class="bar" id="bbBarBox"><i id="bbBar"></i></div>
</div>

<div id="panel">
  <div id="trayRow">
    <div id="tray" aria-label="쟁반"></div>
    <button class="kg-btn" id="btnReset" type="button" disabled>다시 담기</button>
  </div>
  <div id="shelf" role="group" aria-label="간식 진열대"></div>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 간식가게</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>주문을 잘 보고</b> 아래 간식을 <b>순서대로</b> 눌러 쟁반에 담아요.<span id="stKeys" hidden> 숫자 키 1~8 로도 담을 수 있어요.</span></p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><a class="kg-btn" href="index.html">그만하기</a><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2>오늘 장사 끝!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>맞춘 주문<b id="edServed"></b></span><span>최고 연속<b id="edStreak"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const TITLE = J(name, '의') + ' 간식가게';

  // ═══════ 간식 8종 (진열대에는 앞에서부터 차례로 놓인다) · 손님 강아지 6종 ═══════
  const SNACKS = [
    { id: 'bone', e: '🦴', n: '뼈다귀' }, { id: 'yam', e: '🍠', n: '고구마' }, { id: 'chick', e: '🍗', n: '닭다리' }, { id: 'cheese', e: '🧀', n: '치즈' },
    { id: 'carrot', e: '🥕', n: '당근' }, { id: 'apple', e: '🍎', n: '사과' }, { id: 'meat', e: '🥩', n: '고기' }, { id: 'cookie', e: '🍪', n: '쿠키' }
  ];
  const SN = {}; SNACKS.forEach((s, i) => { SN[s.id] = s; s.i = i; });
  // 콩이(붉은 갈색 곱슬 푸들)와 헷갈리지 않게 갈색 계열은 쓰지 않는다
  const DOGS = [
    { id: 'nuri',  nm: '누렁이', fur: '#F6CF72', dark: '#E0AC42', muzzle: '#FFF6DC', ear: 'point' },
    { id: 'white', nm: '흰둥이', fur: '#FFFFFF', dark: '#E9ECF5', muzzle: '#FFFFFF', ear: 'fluff', line: true },
    { id: 'spot',  nm: '점박이', fur: '#FBFBFD', dark: '#34384A', muzzle: '#FFFFFF', ear: 'drop', spots: true, line: true },
    { id: 'husky', nm: '허스키', fur: '#8F9BB8', dark: '#6B7797', muzzle: '#FFFFFF', ear: 'point', mask: true, eye: '#3F9BE8' },
    { id: 'gray',  nm: '수염이', fur: '#AEB4C2', dark: '#878E9E', muzzle: '#FFFFFF', ear: 'fold', beard: true },
    { id: 'black', nm: '까망이', fur: '#44485E', dark: '#2F3244', muzzle: '#6A6F8A', ear: 'long', bow: '#FF8DB2', light: true }
  ];

  // ═══════ 난이도 표 ═══════
  //   len0~lenMax 주문 길이(손님 lenEvery 마리마다 +1) · kinds0~kindsMax 진열대 간식 수(kindEvery 마리마다 +1)
  //   showBase + showPer×개수 = 주문을 보여 주는 시간(초, 둘 다 0 이면 계속 보임)
  //   기다리는 시간 = max(waitMin, wait0 − waitDec×손님 번호) + perItem×담을 개수
  //   vari "○○ 빼고" 주문 비율(variFrom 번째 손님부터) · reg 단골 비율(regFrom 번째부터) · heal 연속 이만큼 맞히면 하트 +1(0 = 없음)
  const DIFF = {
    easy:   { hearts: 3, len0: 2, lenMax: 4, lenEvery: 7, kinds0: 4, kindsMax: 5, kindEvery: 12, showBase: 0,    showPer: 0,    wait0: 16,  waitMin: 11,  waitDec: 0.15, perItem: 1.8, vari: 0.06, variFrom: 8, reg: 0.12, regFrom: 4, heal: 5 },
    normal: { hearts: 3, len0: 2, lenMax: 5, lenEvery: 5, kinds0: 4, kindsMax: 6, kindEvery: 7,  showBase: 1.0,  showPer: 0.60, wait0: 11,  waitMin: 6.5, waitDec: 0.22, perItem: 1.3, vari: 0.15, variFrom: 5, reg: 0.14, regFrom: 4, heal: 10 },
    hard:   { hearts: 3, len0: 3, lenMax: 6, lenEvery: 4, kinds0: 5, kindsMax: 8, kindEvery: 5,  showBase: 0.7,  showPer: 0.45, wait0: 9,   waitMin: 3.5, waitDec: 0.25, perItem: 0.9, vari: 0.25, variFrom: 3, reg: 0.14, regFrom: 4, heal: 0 },
    vhard:  { hearts: 3, len0: 3, lenMax: 6, lenEvery: 3, kinds0: 6, kindsMax: 8, kindEvery: 4,  showBase: 0.45, showPer: 0.34, wait0: 7.5, waitMin: 2.5, waitDec: 0.30, perItem: 0.7, vari: 0.35, variFrom: 2, reg: 0.14, regFrom: 4, heal: 0 }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 화면 ═══════
  let W = 0, H = 0, DPR = 1, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 };
  let SC = { x: 0, y: 0, w: 300, h: 300 }, CT = 0, CH = 40, AWN = 20, KX = 0, KY = 0, KSZ = 160, CX = 0, R = 40;   // 가게 칸 · 계산대 윗면 y · 높이 · 차양 · 콩이 자리·크기 · 손님 자리 · 머리 반지름
  const bg = $('bg'), fx = $('fx'), ctx = fx.getContext('2d'), stage = $('stage'), panel = $('panel'), bubble = $('bubble');
  const FONT = getComputedStyle(document.body).fontFamily;

  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = J(name, '이/가') + ' 간식가게 문을 열었어요. 강아지 손님들이 찾아와요.';
  $('psText').textContent = '손님들이 ' + J(name, '을/를') + ' 기다리고 있어요.';

  const K = kong(stage, 160);

  // ═══════ 상태 ═══════
  let state = 'ready';            // ready · play · pause · over · result
  let phase = 'idle';             // enter(들어옴) · show(주문 보여 줌) · order(가려지고 기다림) · leave(떠남)
  let score = 0, hearts = 3, n = 0, served = 0, streak = 0, maxStreak = 0, shownScore = -1, kindsNow = 4;
  let phT = 0, showDur = 0, left = 0, maxWait = 1, leaveDur = 1, visible = true, tAnim = 0, overT = 0, endAt = 0;
  let cust = null, lastDog = -1, tray = [];
  let kMood = 'idle', kT = 0, barkT = 0, lastBark = -99, sayText = '', sayT = 0;

  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get score() { return score; }, get hearts() { return hearts; }, get phase() { return phase; }, get n() { return n; },
    get served() { return served; }, get streak() { return streak; }, get diff() { return diffId; }, get D() { return D; }, get kinds() { return kindsNow; },
    get visible() { return visible && !!cust && (phase === 'show' || phase === 'order'); },   // 지금 주문이 눈에 보이는가
    get shown() { return cust ? cust.shown.slice() : []; }, get order() { return cust ? cust.want.slice() : []; }, get not() { return cust ? cust.not : null; },
    get regular() { return !!(cust && cust.regular); }, get tray() { return tray.slice(); }, get wait() { return { left, max: maxWait, show: showDur }; },
    scene: () => ({ SC, CT, CH, KX, KY, KSZ, CX, R, wide, W, H }),
    start, pause, resume, tap, reset: resetTray,
    end: () => { if (state === 'pause') resume(); if (state === 'play') { hearts = 0; paintHearts(); gameOver(); } },
    step: dt => { tAnim += dt; if (state === 'play' || state === 'over') { update(dt); drawKong(); } }   // 시험용: 화면 없이 빨리 돌리기
  };
})();
</script>
