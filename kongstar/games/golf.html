<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 미니골프</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 미니골프: 밤하늘·잔디 코스(bg) → 물결·홀컵·장난감·공(cv) → 콩이(stage) → 조준선·글자·깃발(fx) → 점수판 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .dnote { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 홀별 점수표 (결과 카드) */
.card9 { margin: 12px 0 0; border-radius: 14px; background: var(--soft); padding: 8px 8px 6px; }
.card9 table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
.card9 th, .card9 td { padding: 3px 0; font-size: 12.5px; text-align: center; }
.card9 th { color: var(--sub); font-weight: 600; font-size: 11.5px; }
.card9 th:first-child, .card9 td:first-child { width: 34px; text-align: left; padding-left: 4px; color: var(--sub); font-size: 11.5px; font-weight: 600; }
.card9 tr + tr td { border-top: 1px solid var(--line); }
.card9 td.s { font-weight: 700; color: var(--ink); }
.card9 td.s i { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; font-style: normal; }
.card9 td.s i.under { background: #DCEBFF; color: #1F5FBF; }
.card9 td.s i.ace { background: #FFE7A8; color: #8A5A00; }
.card9 td.s i.over { color: var(--sub); font-weight: 600; }
.card9 td.s i.pick { color: #C0C6D0; font-weight: 600; }
.card9 td.p { color: var(--pri); font-weight: 600; font-size: 11.5px; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } .card9 th, .card9 td { font-size: 11.5px; } .card9 th:first-child, .card9 td:first-child { width: 28px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
/* 낮은 세로 화면(320×568 등): 점수표가 있어 결과 카드가 길다 → 설명 글을 빼서 단추가 첫 화면에 들어오게 */
@media (max-height: 620px) { #edText { display: none; } body .kg-card .card9 { margin-top: 8px; } }
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .dnote { margin-top: 5px; font-size: 12px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  .card9 { margin-top: 8px; padding: 4px 6px 2px; }
  .card9 th, .card9 td { padding: 1px 0; }
  .card9 td.s i { height: 18px; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  body .kg-rbwrap > .kg-card .card9 { display: none; }
  #stDNote { display: none; }
}
/* 순위 카드와 나란히 서는 가로 화면(361~520px 높이): 결과 카드가 위 줄 밑에서 시작하게 (「게임」 단추가 카드 머리를 덮지 않게) */
/*   그만큼 낮아지므로 「다시 하기」가 첫 화면에 들어오게 카드를 아주 낮은 가로 화면(360px 이하) 처리처럼 촘촘하게 (점수표는 남긴다) */
@media (orientation: landscape) and (min-height: 361px) and (max-height: 520px) {
  #cardEnd.kg-rbwrap { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
}
@media (orientation: landscape) and (min-height: 361px) and (max-height: 430px) {
  body #cardEnd.kg-rbwrap > .kg-card { padding-top: 8px; padding-bottom: 8px; }
  body #cardEnd.kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body #cardEnd.kg-rbwrap > .kg-card .big { font-size: 30px; }
  body #cardEnd.kg-rbwrap > .kg-card .rec { margin-top: 6px; }
  body #cardEnd.kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body #cardEnd.kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body #cardEnd.kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body #cardEnd.kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 6px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 9px; font-size: 12px; white-space: nowrap; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="미니골프 코스 — 화면을 끌어 당겼다가 놓으면 공을 쳐요"></canvas>

<div id="hud" aria-hidden="true">
  <div id="hudHole"><span id="hudHoleN">1</span><small>/9홀</small></div>
  <div id="hudStroke"><small>타수</small><span id="hudStrokeN">0</span><small id="hudPar">· 기준 2</small></div>
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 미니골프</h2>
    <p id="stLead"></p>
    <div class="how">
      <p>화면을 <b>끌어 당겼다가 놓으면</b> 반대쪽으로 공을 쳐요.</p>
      <p>많이 당길수록 <b>세게</b> 굴러가요.</p>
      <p id="stKeys" hidden><b>← →</b> 방향, <b>↑ ↓</b> 힘, <b>스페이스</b>로 쳐도 돼요.</p>
    </div>
    <p class="dnote" id="stDNote"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">이어 하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">9홀을 모두 돌았어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="card9" id="edCard"></div>
    <div class="rec"><span>홀인원<b id="edAce"></b></span><span>총 타수<b id="edStrokes"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'golf', TITLE = J(name, '의') + ' 미니골프';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 코스: 위에서 내려다본 판. 단위 = 폭 100 · 길이 160 (세로 화면 그대로, 가로 화면은 시계 반대로 돌려 왼쪽이 출발) ═══════
  const FW = 100, FH = 160, BT = 3;   // 판 크기 · 테두리 두께
  const BR = 2;                       // 공 반지름
  const VMAX = 180;                   // 끝까지 당겼을 때 공 빠르기 (단위/초)
  const HOLES = 9;
  // 홀마다 점수: 홀인원 50 · 그 밖은 20 + (기준 − 타수) × 10 (보기 10 · 더블 보기 0, 0 아래로는 안 내려간다)
  const holePts = (par, s) => s === 1 ? 50 : Math.max(0, 20 + (par - s) * 10);

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   cup 홀컵 반지름 · cap 홀컵에 떨어지는 최대 빠르기 · mu 잔디 구름 저항 · sand 모래 배수 · extra 기준보다 더 칠 수 있는 타수(넘기면 그 홀 0점)
  //   guide 'path'(멈출 때까지 길) 'wall'(첫 벽까지) 'arrow'(화살표) 'short'(짧은 화살표) · ms 장난감 빠르기 배수 · magnet 홀컵 둘레 끌어당김 · bounce 벽 튕김
  const DIFF = {
    easy:   { cup: 4.4, cap: 80, mu: 50, sand: 3.2, extra: 4, guide: 'path',  ms: 0.6,  magnet: 1,   bounce: 0.72 },
    normal: { cup: 3.6, cap: 66, mu: 44, sand: 3.6, extra: 3, guide: 'wall',  ms: 0.85, magnet: 0.4, bounce: 0.75 },
    hard:   { cup: 3.1, cap: 54, mu: 38, sand: 4.2, extra: 3, guide: 'arrow', ms: 1.1,  magnet: 0,   bounce: 0.78 },
    vhard:  { cup: 2.7, cap: 44, mu: 33, sand: 5.0, extra: 2, guide: 'short', ms: 1.45, magnet: 0,   bounce: 0.8 }
  };
  const DNOTE = { easy: '큰 홀컵 · 굴러갈 길이 미리 보여요 · 기준+4타까지', normal: '첫 벽까지 길 안내 · 기준+3타까지', hard: '작은 홀컵 · 방향 화살표만 · 모래·경사·물이 더 많아요', vhard: '아주 작은 홀컵 · 빠른 장난감 · 미끄러운 잔디 · 기준+2타까지' };
  const MASTER = { easy: 250, normal: 220, hard: 200, vhard: 180 };   // 「미니골프 달인」 — 9홀 합계 (모두 기준 타수면 180점)
  let diffId = 'normal', D = DIFF.normal, LV = 1;

  // ═══════ 홀 9개: lv = 난이도 0~3 에 따라 장애물을 더한다 ═══════
  //   blocks 사각 벽 [x,y,w,h] · bumps 둥근 쿠션 [x,y,r] · sand/water {r:[x,y,w,h]} 또는 {c:[x,y,r]} · slopes {r:[...], ax, ay}(굴러갈 때 받는 힘)
  //   movers: bone(뼈다귀 — 미끄러져 오감) {cx,cy,len,ang,r,ax,ay,spd,ph} · toy(장난감 공) {cx,cy,r,ax,ay,spd,ph} · spin(빙글 막대) {cx,cy,len,r,om,ph}
  function makeHole(n, lv) {
    const h = { n, par: 3, tee: [50, 142], cup: [50, 28], blocks: [], bumps: [], sand: [], water: [], slopes: [], movers: [], name: '' };
    const R = (x, y, w, hh) => ({ r: [x, y, w, hh] }), Cc = (x, y, r) => ({ c: [x, y, r] });
    switch (n) {
      case 1:
        h.name = '쭉 곧은 길'; h.par = 2; h.tee = [50, 140]; h.cup = [50, 32];
        if (lv >= 1) h.bumps.push([50, 88, 6]);
        if (lv >= 2) h.sand.push(R(28, 18, 12, 28), R(60, 18, 12, 28));
        if (lv >= 3) h.movers.push({ k: 'bone', cx: 50, cy: 60, len: 22, ang: 0, r: 3, ax: 28, ay: 0, spd: 1.4, ph: 0 });
        break;
      case 2:
        h.name = '가운데 울타리'; h.par = 3; h.tee = [50, 142]; h.cup = [50, 28];
        h.blocks.push(lv >= 2 ? [14, 74, 72, 10] : [19, 74, 62, 10]);
        if (lv >= 1) h.bumps.push([30, 42, 5], [70, 42, 5]);
        if (lv >= 3) { h.water.push(R(BT, 88, 20, 22)); h.movers.push({ k: 'toy', cx: 84, cy: 60, r: 4, ax: 9, ay: 0, spd: 1.6, ph: 1 }); }
        break;
      case 3:
        h.name = '꺾인 길'; h.par = 3; h.tee = [22, 140]; h.cup = [80, 22];
        h.blocks.push([0, 0, 60, 92]);
        if (lv >= 1) h.sand.push(Cc(80, 106, lv >= 3 ? 11 : 9));
        if (lv >= 2) h.slopes.push({ r: [60, 36, 40, 44], ax: 14 + lv * 2, ay: 0 });
        if (lv >= 3) { h.water.push(R(61, 8, 8, 30)); h.bumps.push([92, 62, 4]); }
        break;
      case 4: {
        h.name = '개울 다리'; h.par = 3; h.tee = [50, 140];
        const bw = [30, 24, 18, 14][lv], bx = lv >= 2 ? 38 : 50;
        h.cup = lv >= 2 ? [64, 28] : [50, 28];
        h.water.push(R(BT, 70, bx - bw / 2 - BT, 22), R(bx + bw / 2, 70, FW - BT - bx - bw / 2, 22));
        if (lv >= 1) h.bumps.push([38, 46, 4], [62, 46, 4]);
        if (lv >= 3) h.movers.push({ k: 'bone', cx: bx, cy: 106, len: 20, ang: 0, r: 3, ax: 22, ay: 0, spd: 1.2, ph: 0.5 });
        break;
      }
      case 5:
        h.name = '비탈 언덕'; h.par = 3; h.tee = [78, 140]; h.cup = [22, 28];
        h.slopes.push({ r: [BT, 50, FW - BT * 2, 60], ax: [10, 14, 18, 22][lv], ay: 0 });
        if (lv >= 2) h.sand.push(R(70, 18, 27, 25));
        if (lv >= 3) { h.bumps.push([45, 80, 5]); h.movers.push({ k: 'toy', cx: 30, cy: 70, r: 4, ax: 0, ay: 16, spd: 1.3, ph: 0 }); }
        break;
      case 6:
        h.name = '쿠션 숲'; h.par = 3; h.tee = [50, 142]; h.cup = [50, 24];
        { const r = lv >= 2 ? 6 : 5; h.bumps.push([25, 80, r], [50, 80, r], [75, 80, r]);
          if (lv >= 1) h.bumps.push([37, 60, r], [63, 60, r]);
          if (lv >= 2) h.bumps.push([37, 100, r], [63, 100, r]); }
        if (lv >= 3) { h.movers.push({ k: 'toy', cx: 50, cy: 42, r: 4, ax: 30, ay: 0, spd: 1.8, ph: 0 }); h.sand.push(Cc(36, 22, 6), Cc(64, 22, 6)); }
        break;
      case 7:
        h.name = '지그재그'; h.par = 4; h.tee = [16, 142]; h.cup = [82, 22];
        h.blocks.push([0, 104, 66, 8], [34, 56, 66, 8]);
        if (lv >= 1) h.bumps.push([50, 84, 5]);
        if (lv >= 2) h.water.push(R(BT, 66, 18, 12));
        if (lv >= 3) h.movers.push({ k: 'spin', cx: 62, cy: 32, len: 28, r: 2.6, om: 1.3, ph: 0 });
        break;
      case 8:

    start, end, pause, resume, shoot, go: n => { loadHole(n); phase = 'aim'; }, place: (x, y) => { ball.x = x; ball.y = y; ball.vx = ball.vy = 0; }, best: bestShot, predict, makeHole,
    aim: (dx, dy) => { drag.on = true; drag.x0 = W / 2; drag.y0 = H / 2; drag.x = W / 2 + dx; drag.y = H / 2 + dy; }, unaim: aimReset,
    step: dt => update(dt)
  };
})();
