<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 줄넘기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 줄넘기: 마당에서 제자리 줄넘기 — 배경 캔버스(마당·돌리는 두 사람·뒤쪽 줄) · 콩이(SVG) · 효과 캔버스(앞쪽 줄·글자)를 차례로 겹친다 */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: pointer; background: #BFE3F7; }
#bg, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#dog { position: absolute; inset: 0; pointer-events: none; }
#fx { pointer-events: none; }
/* 점수판: 위 줄 바로 아래, 작고 단정한 반투명 알약 */
#hud { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(var(--sat) + 62px); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.hp { height: 34px; border-radius: 17px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; background: rgba(18,22,52,.46); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; white-space: nowrap; }
.hp svg { width: 17px; height: 17px; display: block; transition: transform .25s, opacity .25s; }
.hp svg.off { opacity: .32; transform: scale(.82); }
.hp svg.off path { fill: #fff; }
.hp .num { font-size: 16px; font-weight: 700; min-width: 1ch; text-align: right; }
.hp .unit { font-size: 12px; font-weight: 500; opacity: .8; margin-left: -3px; }
.hp .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); margin: 0 4px; }
#hudL { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
#hDiff { height: 22px; border-radius: 11px; padding: 0 9px; font-size: 11px; letter-spacing: 0; opacity: .92; }
#hudR { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#hPerf { color: #FFE39A; }
/* 예고 알림(천천히·빠르게·쌩쌩이·반대로) */
#note { position: fixed; z-index: 10; left: 50%; top: calc(var(--sat) + 134px); transform: translate(-50%, -6px); padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.94); color: #191F28; font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#note.show { opacity: 1; transform: translate(-50%, 0); }
/* 세로 화면: 안내 글은 콩이 발밑 아래 잔디에 (위쪽은 하늘의 큰 숫자·말풍선 자리) — top 은 layout() 이 --noteTop 으로 준다 */
@media (orientation: portrait) { #note { top: var(--noteTop, calc(var(--sat) + 134px)); } }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
#cardStart .tip { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; }
#cardStart .tip span { flex: 1; min-width: 0; }
#btnRules { flex: none; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--pri); font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#btnRules:active { filter: brightness(.96); }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); white-space: nowrap; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 세로 화면: 카드를 위로 올려 아래에서 줄넘기하는 콩이가 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim:not(.kg-rules) { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  #note { top: auto; bottom: calc(var(--sab) + 14px); }   /* 가로 화면: 아래 잔디 쪽에 (위는 줄과 글자가 지나간다) */
  body .kg-card { padding: 16px 18px 14px; width: min(100%, 440px); }
  .kg-card .tip { margin-top: 8px; padding: 9px 12px; }
  #cardStart .tip { padding: 5px 6px 5px 12px; }
  body .kg-card .big { font-size: 32px; margin: 2px 0 0; }
  body .kg-card .row { margin-top: 12px; }
  body .kg-card .row .kg-btn { height: 46px; }
  .kg-card .stats { margin-top: 8px; }
  .kg-card .stats div { padding: 7px 4px 6px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면(높이 360px 이하): 결과 카드가 좁아져 설명이 두 줄이 되고, 이 게임 카드는 border-box 가 아니라 패딩만큼 화면 밖으로 넘쳐 「다시 하기」가 잘린다 — 이 게임 결과 카드만 촘촘하게 */
@media (orientation: landscape) and (max-height: 360px) {
  body .kg-rbwrap > .kg-card { box-sizing: border-box; padding: 12px 16px; }
  body .kg-rbwrap > .kg-card #ovSub { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0; }
  body .kg-rbwrap > .kg-card .badge { margin-bottom: 2px; padding: 2px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .big { font-size: 28px; }
  body .kg-rbwrap > .kg-card .stats { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .stats div { padding: 5px 2px 4px; }
  body .kg-rbwrap > .kg-card .stats b { font-size: 15px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .row .kg-btn { height: 40px; }
}
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats div { padding-left: 1px; padding-right: 1px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; }
  #note { font-size: 13.5px; padding: 8px 13px; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dog"></div>
  <canvas id="fx"></canvas>
</div>

<div id="hud" hidden>
  <div id="hudL">
    <div class="hp" id="hearts" role="img" aria-label="하트 3개"></div>
    <div class="hp" id="hDiff"></div>
  </div>
  <div id="hudR">
    <div class="hp"><span class="num" id="hCount">0</span><span class="unit">번</span><span class="sep"></span><span id="hPerf">딱! 0</span></div>
  </div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이의 줄넘기</h2>
    <p id="stSub"></p>
    <div class="tip"><span>줄이 발밑에 오기 <b>조금 전에</b> 눌러요</span><button type="button" id="btnRules">규칙 보기</button></div>
    <div class="key" id="stKey"></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="paTitle">
    <h2 id="paTitle">잠깐 쉬는 중이에요</h2>
    <p id="paSub"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardOver" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="ovTitle">
    <div class="badge" id="ovBadge" hidden>새 기록이에요!</div>
    <h2 id="ovTitle">잘 넘었어요!</h2>
    <p id="ovSub"></p>
    <div class="big"><span id="ovCount">0</span><small>번</small></div>
    <div class="stats">
      <div><b id="ovPerf">0번</b><small>딱! 맞춘 횟수</small></div>
      <div><b id="ovCombo">0번</b><small>이어 넘기</small></div>
      <div><b id="ovBest">0번</b><small id="ovBestL">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  // ── 난이도 (수치는 여기 한 곳)
  //   T0 처음 한 바퀴(초) → T1 가장 빠를 때 한 바퀴, tau 번쯤 넘으면 거의 다 빨라진다
  //   air   폴짝 떠 있는 시간 = 한 바퀴의 air 배 (줄이 빠르면 폴짝도 짧아진다) — 클수록 타이밍이 넉넉하다
  //   body  판정 폭(rad): 줄이 발밑 앞뒤 ±body 를 지나는 동안 발이 줄보다 위에 있어야 넘은 것 — 작을수록 넉넉하다
  //   hearts 하트 · regen 번 이어 넘으면 하트 하나 회복(0 = 없음) · hint 누를 때를 발밑 빛으로 알려 줌
  //   calm 처음 변화 없이 도는 횟수 · gap 변화 사이에 쉬는 횟수[최소, 최대]
  //   ev   변화별 [나오기 시작하는 횟수, 비중] — tempo 천천히→빠르게 · dbl 쌩쌩이(두 번 연달아 빠르게) · rev 반대로 돌리기
  //   slow·fast·dbl 그때의 한 바퀴 배율 · floor 한 바퀴가 이보다 짧아지지는 않는다(초)
  const DIFF = {
    easy:   { T0: 1.30, T1: 0.92, tau: 70, air: 0.46, body: 0.24, hearts: 3, regen: 15, hint: 1, calm: 14, gap: [9, 14], ev: { tempo: [14, 3], dbl: [9999, 0], rev: [40, 1] }, slow: 1.22, fast: 0.86, dbl: 0.60, floor: 0.60 },
    normal: { T0: 1.12, T1: 0.72, tau: 50, air: 0.42, body: 0.34, hearts: 3, regen: 30, hint: 0, calm: 10, gap: [6, 10], ev: { tempo: [10, 3], dbl: [26, 2],   rev: [18, 2] }, slow: 1.30, fast: 0.78, dbl: 0.58, floor: 0.42 },
    hard:   { T0: 0.98, T1: 0.60, tau: 38, air: 0.39, body: 0.42, hearts: 3, regen: 0,  hint: 0, calm: 7,  gap: [4, 7],  ev: { tempo: [7, 3],  dbl: [14, 3],   rev: [10, 2] }, slow: 1.35, fast: 0.74, dbl: 0.55, floor: 0.36 },
    vhard:  { T0: 0.84, T1: 0.50, tau: 28, air: 0.40, body: 0.46, hearts: 2, regen: 0,  hint: 0, calm: 4,  gap: [2, 5],  ev: { tempo: [4, 3],  dbl: [6, 3],    rev: [5, 3] },  slow: 1.40, fast: 0.70, dbl: 0.52, floor: 0.30 }
  };
  let D = DIFF[KG.diff()] || DIFF.normal, roundKey = KG.dkey('rope'), roundDiff = KG.diff();   // 판을 시작할 때 한 번 정해 그 판 동안 그대로

  // ── 놀이 단위: 1 = 콩이 그림 한 변(400). 화면 px = 단위 × SZ
  const HY = 0.62, R = 0.64;          // 줄 잡은 손 높이 · 줄이 도는 반지름 (R 이 조금 커서 맨 아래에서 땅을 쓸고 간다)
  const AIR_MIN = 0.22, AIR_MAX = 0.52, BUF = 0.12, PERFECT = 0.14, ROPE_T = 0.012, DEMO_T = 1.7;
  // 줄 가운데의 땅에서 높이: ph = 맨 아래에서 벗어난 각 (0 = 발밑, ±π = 머리 위). 판정도 그림도 이 값 하나를 쓴다
  const ropeH = ph => Math.max(0, HY - R * Math.cos(ph));
  const airFor = T => clamp(D.air * T, AIR_MIN, AIR_MAX);
  const apexFor = a => 0.15 + 0.42 * a;
  const baseT = n => D.T1 + (D.T0 - D.T1) * Math.exp(-Math.max(0, n) / D.tau);
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };

  // ── 화면
  const stage = $('stage'), bg = $('bg'), fx = $('fx');
  const c = bg.getContext('2d', { alpha: false }), f = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1, SZ = 110, GY = 500, KX = 180, HX = 1.1, YH = 400, FONT = 'sans-serif', back = null, bigNum = false;
  const TITLE = name + '의 줄넘기';
  const bar = topbar({ title: TITLE, back: 'index.html' });
  document.title = TITLE;
  const btnPause = document.createElement('button'); btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  bar.right(btnPause);
  const k = kong($('dog'), 110); k.setPose('stand');

  $('stTitle').textContent = TITLE;
  $('stSub').textContent = '가족이 돌려 주는 줄을 ' + J(name, '이/가') + ' 폴짝폴짝 넘어요';
  const fine = matchMedia('(pointer: fine)').matches;
  const bestTxt = () => { const b = KG.best(KG.dkey('rope')); return b > 0 ? '최고 기록 ' + Math.round(b).toLocaleString() + '번' : ''; };
  const keyTxt = () => [fine ? '스페이스 · ↑ 키로도 뛰어요' : '', bestTxt()].filter(Boolean).join('  ·  ');
  const HEART = '<svg viewBox="0 0 24 24"><path fill="#FF6B81" d="M12 20.6c-.3 0-.6-.1-.8-.3C6.3 16 3 13.100 3 9.300 3 6.600 5.100 4.500 7.700 4.500c1.700 0 3.300.9 4.300 2.300 1-1.400 2.600-2.300 4.300-2.300C18.900 4.500 21 6.600 21 9.300c0 3.800-3.300 6.700-8.200 11-.2.200-.5.300-.8.300z"/></svg>';

  // ── 상태.  q = 줄이 돈 바퀴 수: 정수일 때 발밑(맨 아래), .5 일 때 머리 위. b번째 넘기는 q 가 b-0.5 → b+0.5 인 한 바퀴이고 그 바퀴의 길이가 plan[b].T
  const S = {
    mode: 'ready', t: 0, pt: 0, q: 0.5, side: 1, wait: 0, freeze: 0, tangle: 0, stuckQ: 0, tangleB: 0, judged: -1,
    y: 0, air: false, jt: 0, ja: 0.4, jA: 0.3, buf: 0, landT: 0, lastLand: -9, demoB: -1,
    hearts: 3, count: 0, perfect: 0, combo: 0, maxCombo: 0, pstreak: 0, misses: 0,
    happy: 0, sad: 0, wob: 0, shake: 0, zu: -1, renote: '', plan: [], gen: { q: [], calm: 0, last: '' },
    endT: 0, sat: false, say: 0, bot: null, botAt: null, simulating: false, log: null, parts: []
  };
  const curT = b => { if (S.mode === 'ready') return DEMO_T; extend(b + 3); return S.plan[Math.max(0, b)].T; };

  // ── 줄 돌리기 계획: 한 번에 한 「변화」(천천히→빠르게 · 쌩쌩이 · 반대로)를 넣고, 사이사이 gap 번은 그냥 돈다
  function extend(upto) {
    const g = S.gen;
    while (S.plan.length <= upto) {
      const i = S.plan.length;
      if (!g.q.length) {
        if (g.calm > 0) { g.q.push({ m: 1 }); g.calm--; }
        else {
          let types = Object.keys(D.ev).filter(n => i >= D.ev[n][0] && D.ev[n][1] > 0);
          if (types.length > 1) types = types.filter(n => n !== g.last);
          if (!types.length) g.q.push({ m: 1 });
          else {
            let r = Math.random() * types.reduce((s, n) => s + D.ev[n][1], 0), ty = types[0];
            for (const n of types) { r -= D.ev[n][1]; if (r < 0) { ty = n; break; } }
            g.last = ty;
            if (ty === 'tempo') { const ns = rint(3, 4), nf = rint(4, 6); for (let j = 0; j < ns; j++) g.q.push({ m: D.slow, tag: j ? '' : 'slow' }); for (let j = 0; j < nf; j++) g.q.push({ m: D.fast, tag: j ? '' : 'fast' }); g.q.push({ m: 1, tag: 'norm' }); }
            else if (ty === 'dbl') { g.q.push({ m: D.dbl, tag: 'dbl' }, { m: D.dbl }); }
            else { g.q.push({ m: 1.12, tag: 'rev', ev: 'rev' }); }
            g.calm = rint(D.gap[0], D.gap[1]);
          }
        }
      }
      const e = g.q.shift();
      S.plan.push({ T: Math.max(D.floor, baseT(i) * e.m * (i === 0 ? 1.15 : 1)), m: e.m, tag: e.tag || '', ev: e.ev || '' });
    }
  }

  // ── 조각 효과 (효과 캔버스, 화면 px)
  function emit(o) { if (S.parts.length > 80) S.parts.shift(); S.parts.push(Object.assign({ life: 0, max: 0.6, vx: 0, vy: 0, g: 0 }, o)); }
  const feetY = () => GY - S.y * SZ;
  function say(text, col, dy, size) { emit({ kind: 'text', text, col: col || '#fff', x: KX, y: feetY() - SZ * (dy || 0.98), vy: -SZ * 0.32, max: 0.95, size: size || clamp(SZ * 0.16, 15, 22) }); }
  function dust(n) { for (let i = 0; i < n; i++) emit({ kind: 'dot', x: KX + rand(-1, 1) * SZ * 0.3, y: GY + rand(-2, 3), vx: rand(-30, 30), vy: -rand(8, 30), r: rand(2, 4), col: 'rgba(255,255,255,.7)', max: rand(0.22, 0.4) }); }
  function sparkle(x, y, n, col) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), sp = rand(30, 110); emit({ kind: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, g: 160, r: rand(2.5, 5), col: col || '#FFD25E', max: rand(0.35, 0.6) }); } }
  let noteT = 0;
  function note(msg, ms) { if (S.simulating) return; const n = $('note'); n.textContent = msg; n.classList.add('show'); clearTimeout(noteT); noteT = setTimeout(() => n.classList.remove('show'), ms || 1700); }
  function paintHearts() { const hs = $('hearts').children; for (let i = 0; i < hs.length; i++) hs[i].classList.toggle('off', i >= S.hearts); $('hearts').setAttribute('aria-label', '하트 ' + Math.max(0, S.hearts) + '개'); }

    g.setLineDash([lw * 1.5, lw * 3.2]); g.strokeStyle = '#FFFFFF'; g.lineWidth = lw * 0.9; g.lineCap = 'butt'; g.stroke(); g.setLineDash([]);
  }
  const CLOUDS = [[0.1, 0.16, 1], [0.55, 0.3, 0.75], [0.85, 0.1, 0.9]];
  function draw() {
    if (!back) return;
    const t = S.t, ph = TAU * (S.q - Math.round(S.q)), hd = hands(ph), hyPx = GY - hd.hy * SZ;
    c.drawImage(back, 0, 0, W, H);
    // 구름 (천천히 흐른다)
    c.fillStyle = 'rgba(255,255,255,.85)';
    for (const [fx0, fy, sc] of CLOUDS) { const span = W + SZ * 2, x = ((fx0 * span + (reduceMotion ? 0 : t * 5 * sc)) % span) - SZ, y = Math.max(40, YH * 0.5) * (0.35 + fy * 1.6), kk = SZ * 0.14 * sc; c.beginPath(); circ(c, x, y, kk); circ(c, x - kk * 0.9, y + kk * 0.25, kk * 0.7); circ(c, x + kk * 0.9, y + kk * 0.25, kk * 0.75); c.rect(x - kk * 0.9, y + kk * 0.2, kk * 1.8, kk * 0.75); c.fill(); }
    // 하늘의 큰 숫자 (세로 화면)
    if (bigNum && S.mode !== 'ready') {
      const top = safe().t + 150, bot = GY - (HY + R) * SZ, fs = Math.min(SZ * 0.9, bot - top, 104);
      c.font = '700 ' + fs + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(255,255,255,.62)'; c.fillText(String(S.count), KX, (top + bot) / 2);
    }
    // Easy: 지금 누르면 된다는 발밑 빛
    if (D.hint && S.mode === 'play' && S.tangle <= 0 && S.wait <= 0 && !S.air) {
      const nb = Math.ceil(S.q), T = curT(nb), ja = airFor(T), left = (nb - S.q) * T, tol = 0.5 * (0.42 * ja - D.body / TAU * T);
      if (Math.abs(left - ja / 2) <= tol) { c.fillStyle = 'rgba(255,226,122,.55)'; c.beginPath(); c.ellipse(KX, GY + SZ * 0.02, SZ * 0.46, SZ * 0.085, 0, 0, TAU); c.fill(); }
    }
    c.fillStyle = 'rgba(50,70,40,' + (0.17 - 0.08 * clamp(S.y / 0.3, 0, 1)).toFixed(3) + ')'; c.beginPath(); c.ellipse(KX, GY + SZ * 0.015, SZ * (0.34 - 0.08 * clamp(S.y / 0.3, 0, 1)), SZ * 0.045, 0, 0, TAU); c.fill();
    person(hd.lx - SZ * 0.3, 1, 1, PAL[0], hd.lx, hyPx);
    person(hd.rx + SZ * 0.28, -1, 0.9, PAL[1], hd.rx, hyPx);
    rope(c, ph, hd, false);
    f.clearRect(0, 0, W, H);
    rope(f, ph, hd, true);

    // 콩이
    if (S.sat) {
      k.place(KX, GY + SZ * 0.02);
      k.render({ t, eyes: 'happy', mouth: 'open', blush: true, tailAmp: 24, tailRate: 4.2, breath: 2.6, breathRate: 2.4, earLift: 5 });
    } else {
      k.place(KX, GY + SZ * 0.02);
      const sad = S.sad > 0, z = S.side * Math.sin(ph);
      // 제자리 폴짝: 서 있는 그림 그대로 띄우고 살짝 늘인다 (달리기 점프 그림은 쓰지 않는다 — 발이 그림 맨 아래라 「보이는 발 높이 = 판정 높이」)
      k.render({ t, facing: S.side, hop: S.y * 400, frame: !S.air && S.landT > 0 ? 'land' : undefined, squash: S.air ? -0.5 * Math.sin(Math.PI * clamp(S.jt / S.ja, 0, 1)) : S.landT > 0 ? S.landT * 5 : 0,
        roll: S.wob > 0 ? Math.sin(t * 22) * (reduceMotion ? 2 : 6) * S.wob : 0, rollPivot: [200, 380],
        look: sad ? [0, 0.6] : [clamp(z * 0.5, -1, 1), clamp(-Math.cos(ph) * -0.6, -1, 1)],
        eyes: sad ? 'closed' : S.happy > 0 ? 'happy' : 'open', mouth: S.mode === 'play' && !sad ? 'open' : 'closed', blush: S.happy > 0,
        earLift: S.air ? 12 : 4, tailAmp: sad ? 3 : 14 + Math.min(10, S.combo * 0.5), tailRate: sad ? 1 : 4 + Math.min(3, S.combo * 0.1) });
    }
    stage.style.transform = S.shake > 0 ? 'translate(' + (Math.sin(t * 70) * 4 * S.shake / 0.26).toFixed(1) + 'px,' + (Math.cos(t * 55) * 3 * S.shake / 0.26).toFixed(1) + 'px)' : '';

    // 효과
    for (const p of S.parts) {
      const a = 1 - p.life / p.max;
      if (p.kind === 'dot') { f.globalAlpha = a; f.fillStyle = p.col; f.beginPath(); f.arc(p.x, p.y, p.r * (0.6 + 0.6 * (1 - a)), 0, TAU); f.fill(); }
      else if (p.kind === 'star') { f.globalAlpha = a; f.fillStyle = p.col; const r = p.r * (0.5 + a * 0.7); f.beginPath(); f.moveTo(p.x, p.y - r * 1.5); f.quadraticCurveTo(p.x, p.y, p.x + r * 1.5, p.y); f.quadraticCurveTo(p.x, p.y, p.x, p.y + r * 1.5); f.quadraticCurveTo(p.x, p.y, p.x - r * 1.5, p.y); f.quadraticCurveTo(p.x, p.y, p.x, p.y - r * 1.5); f.fill(); }
      else { f.globalAlpha = Math.min(1, a * 2.2); f.font = '700 ' + p.size + 'px ' + FONT; f.textAlign = 'center'; f.textBaseline = 'middle'; f.lineJoin = 'round'; f.lineWidth = 4; f.strokeStyle = 'rgba(30,36,70,.55)'; const tw = f.measureText(p.text).width / 2 + 6, x = clamp(p.x, tw, W - tw); f.strokeText(p.text, x, p.y); f.fillStyle = p.col; f.fillText(p.text, x, p.y); }
    }
    f.globalAlpha = 1;
    if (S.say > 0 && S.sat && S.mode === 'ending') bubble(S.count > 0 ? S.count + '번 넘었다!' : '다시 해 볼래!', KX, GY - SZ * 0.95, Math.min(1, S.say * 3, (2.0 - S.say) * 6));
    if (S.mode === 'play' && (S.freeze > 0 || S.wait > 0)) bubble('준비…', KX, GY - SZ * 0.9, 1);

    // 점수판
    if (S.mode !== 'ready') {
      if (hudCache.c !== S.count) { hudCache.c = S.count; $('hCount').textContent = S.count.toLocaleString(); }
      if (hudCache.p !== S.perfect) { hudCache.p = S.perfect; $('hPerf').textContent = '딱! ' + S.perfect.toLocaleString(); }
    }
  }
  const hudCache = { c: -1, p: -1 };
  function bubble(text, x, y, a) {
    f.save(); f.globalAlpha = clamp(a, 0, 1); const fs = clamp(SZ * 0.16, 15, 22); f.font = '700 ' + fs + 'px ' + FONT;
    const tw = f.measureText(text).width, bw = tw + fs * 1.5, bh = fs * 2.1; x = clamp(x, bw / 2 + 8, W - bw / 2 - 8);
    f.fillStyle = 'rgba(0,0,0,.12)'; rr(f, x - bw / 2, y - bh + 3, bw, bh, bh / 2); f.fill();
    f.fillStyle = '#fff'; rr(f, x - bw / 2, y - bh, bw, bh, bh / 2); f.fill();
    f.beginPath(); f.moveTo(x - 7, y - 2); f.lineTo(x, y + 8); f.lineTo(x + 7, y - 2); f.closePath(); f.fill();
    f.fillStyle = '#191F28'; f.textAlign = 'center'; f.textBaseline = 'middle'; f.fillText(text, x, y - bh / 2 + 1); f.restore();
  }

  // ── 흐름
  function start() {
    roundDiff = KG.diff(); D = DIFF[roundDiff] || DIFF.normal; roundKey = KG.dkey('rope'); $('hDiff').textContent = KG.diffLabel();
    Object.assign(S, { mode: 'play', pt: 0, q: -0.5 - 1e-7, side: 1, wait: 0.9, freeze: 0, tangle: 0, judged: -1, y: 0, air: false, jt: 0, buf: 0, landT: 0, lastLand: -9,
      hearts: D.hearts, count: 0, perfect: 0, combo: 0, maxCombo: 0, pstreak: 0, misses: 0, happy: 0, sad: 0, wob: 0, shake: 0, zu: -1, minGap: 9, renote: '',
      plan: [], gen: { q: [], calm: D.calm, last: '' }, endT: 0, sat: false, say: 0, botAt: null, parts: [] });
    extend(3);
    $('hearts').innerHTML = HEART.repeat(D.hearts);
    k.setPose('stand'); paintHearts(); hudCache.c = hudCache.p = -1;
    $('cardStart').hidden = true; $('cardOver').hidden = true; $('cardPause').hidden = true; $('hud').hidden = false; btnPause.hidden = false; rbox.hide();
    note('줄이 발밑에 오기 조금 전에 눌러요', 2400);
  }
  function endGame() {
    if (S.mode !== 'play') return;
    S.mode = 'ending'; S.endT = 0; S.buf = 0; S.botAt = null; btnPause.hidden = true; sfx('lose');
  }
  let ovNew = false;   // 이번 판이 새 기록이었나
  let overAt = 0;      // 결과 카드가 뜬 때 — 두드리던 누름에 카드가 바로 넘어가지 않게
  function showOver() {
    if (S.mode === 'over') return; S.mode = 'over'; overAt = performance.now();
    ovNew = S.count > 0 && KG.setBest(roundKey, S.count);
    $('ovTitle').textContent = S.count >= 30 ? '줄넘기 선수예요!' : S.count >= 10 ? '잘 넘었어요!' : '아쉬워요, 한 번 더!';
    if ((S.count >= 30) && KG.master) KG.master('rope');   // 업적 「게임 달인」 (11-27): 한 판에 30번
    $('ovSub').textContent = S.count > 0 ? J(name, '이/가') + ' 폴짝폴짝 ' + S.count.toLocaleString() + '번 넘었어요' : '줄이 발밑에 오기 조금 전에 눌러 보세요';
    $('ovCount').textContent = S.count.toLocaleString(); $('ovPerf').textContent = S.perfect.toLocaleString() + '번'; $('ovCombo').textContent = S.maxCombo.toLocaleString() + '번';
    paintBest();
    $('cardOver').hidden = false; rbox.show(roundDiff);
    try { $('btnAgain').focus({ preventScroll: true }); } catch (e) {}
  }
  // 난이도 고르기: 시작 · 결과 카드에만. 결과 카드의 숫자는 늘 「방금 한 판」의 난이도 것 — 다른 난이도를 골라 두면 라벨에 방금 판의 난이도 이름을 붙인다
  function paintBest() {
    $('stKey').textContent = keyTxt(); $('stKey').hidden = !keyTxt();
    const same = KG.diff() === roundDiff, b = KG.best(roundKey);
    $('ovBest').textContent = Math.round(S.mode === 'over' ? Math.max(b, S.count) : b).toLocaleString() + '번';
    $('ovBestL').textContent = same ? '최고 기록' : KG.diffLabel(roundDiff) + ' 최고';
    $('ovBadge').hidden = !ovNew;
  }
  for (const id of ['cardStart', 'cardOver']) { const card = $(id).querySelector('.kg-card'); card.insertBefore(KG.diffPicker(null, paintBest), card.querySelector('.row')); }
  const rbox = KG.rankBox($('cardOver').querySelector('.kg-card'), 'rope');   // 결과 카드 바로 아래(가로 낮은 화면은 오른쪽) 가족 순위 카드 — 방금 판 난이도
  KG.startRank($('cardStart'), 'rope');   // 시작 카드 아래에 고른 난이도의 가족 순위
  paintBest();
  function pause() {
    if (S.mode !== 'play') return; S.mode = 'pause';
    $('paSub').textContent = '지금까지 ' + S.count.toLocaleString() + '번 넘었어요';
    $('cardPause').hidden = false;
    try { $('btnResume').focus({ preventScroll: true }); } catch (e) {}
  }
  function resume() { if (S.mode !== 'pause') return; S.mode = 'play'; S.freeze = 0.8; $('cardPause').hidden = true; last = 0; }
  function quit() { if (S.mode !== 'pause') return; $('cardPause').hidden = true; S.mode = 'play'; endGame(); last = 0; }

  // ── 입력
  stage.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); press(); });
  $('btnStart').addEventListener('click', () => { sfx('tap'); start(); });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  // 결과 카드의 난이도 단추도 같은 틈을 둔다 (난이도는 게임들이 함께 쓰니 두드리던 손가락에 바뀌면 안 된다)
  $('cardOver').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); quit(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  const JUMP_KEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'KeyX']);
  addEventListener('keydown', e => {
    if (e.repeat) { if (JUMP_KEYS.has(e.code)) e.preventDefault(); return; }
    const onBtn = e.target && e.target.closest && e.target.closest('button, a');
    if (JUMP_KEYS.has(e.code) || e.code === 'Enter') {
      if (S.mode === 'play') { if (JUMP_KEYS.has(e.code)) { e.preventDefault(); KG.unlockAudio(); press(); } }
      else if (onBtn && (e.code === 'Enter' || e.code === 'Space')) return;   // 단추에 초점이 있으면 단추가 알아서
      else if (S.mode === 'ready') { e.preventDefault(); KG.unlockAudio(); start(); }
      else if (S.mode === 'over') { e.preventDefault(); if (performance.now() - overAt >= 900) start(); }
      else if (S.mode === 'pause') { e.preventDefault(); resume(); }
    } else if (e.code === 'KeyP' || e.code === 'Escape') { if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); last = 0; });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  addEventListener('orientationchange', () => setTimeout(layout, 200));

  // ── 돌리기
  // 절전: 카드가 떠 있을 때(놀이 중 아님)는 상태가 바뀐 뒤 1초만 매 프레임 그리고, 그 뒤로는 0.2초에 한 번만 그린다
  const lazy = { k: null, at: 0, dr: 0 };
  function lazySkip(ms, key) {
    if (key == null) { lazy.k = null; return false; }
    if (key !== lazy.k) { lazy.k = key; lazy.at = lazy.dr = ms; return false; }
    if (ms - lazy.at < 1000 || ms - lazy.dr >= 200) { lazy.dr = ms; return false; }
    return true;
  }
  const lazyWake = () => { lazy.k = null; };   // 화면 크기·방향이 바뀌거나 다시 보이면 1초 동안 다시 매 프레임
  addEventListener('resize', lazyWake); addEventListener('orientationchange', lazyWake); document.addEventListener('visibilitychange', lazyWake);
  let last = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    const dt = last ? Math.min(0.05, (ms - last) / 1000) : 0.016; last = ms;
    if (dt <= 0) return;
    if (S.mode === 'pause') return;
    if (S.mode === 'over') { S.t += dt; if (!lazySkip(ms, 'over')) draw(); return; }
    const lz = S.mode === 'ready' ? 'ready' : null;
    if (S.freeze > 0) { S.freeze -= dt; S.t += dt; if (!lazySkip(ms, lz)) draw(); return; }

  }
  layout();
  requestAnimationFrame(frame);

  // ── 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (한 번만 띄우는 것은 공통이 한다). 「규칙 보기」 로 다시 볼 수 있다
  const RULES = { key: 'rope', title: TITLE, lead: '가족이 돌려 주는 줄을 ' + J(name, '이/가') + ' 넘어요', items: [
    ['👆', '줄이 발밑에 오기 조금 전에 화면을 눌러 폴짝 뛰어요'],
    ['🎵', '「틱」은 줄이 머리 위, 「탁」은 땅에 닿는 소리예요. 「탁」 때는 공중에 떠 있어야 해요'],
    ['💗', '줄에 걸리면 하트가 줄어요. 다 없어지면 끝나요'],
    ['🐢', '빠르기가 바뀌거나 반대로 돌 때는 미리 알려 줘요']
  ] };
  // 안내를 닫은 키(Enter·스페이스)를 아직 누르고 있는 동안에는 그 키가 방금 초점을 받은 「시작」 단추를 누르지 못하게 한다
  let closeKey = false;
  addEventListener('keydown', e => { if (!closeKey) return; if (e.repeat) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); } } else closeKey = false; }, true);
  addEventListener('keyup', e => { if (!closeKey) return; closeKey = false; if (e.code === 'Enter' || e.code === 'Space') e.preventDefault(); }, true);
  addEventListener('pointerdown', () => { closeKey = false; }, true);
  function showRules(force) { return KG.rules(RULES, force).then(shown => { if (S.mode !== 'ready') return; if (shown) closeKey = true; try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} }); }
  $('btnRules').addEventListener('click', () => { sfx('tap'); showRules(true); });
  showRules(false);

  // ── 시험용
  window.GAME = {
    S, DIFF, get state() { return S.mode; }, get score() { return S.count; }, get count() { return S.count; }, get hearts() { return S.hearts; }, get perfect() { return S.perfect; },
    get metrics() { return { W, H, SZ, GY, KX, HX, YH, bigNum, diff: KG.diff() }; },
    start, end: endGame, over: showOver, pause, resume, step, press, ropeH, airFor,
    // 지금 줄 가운데와 콩이 발의 화면 높이(px, 땅에서 위로) — 그림과 판정이 같은 값을 쓰는지 볼 때
    get probe() { const b = Math.round(S.q), ph = TAU * (S.q - b); return { q: +S.q.toFixed(4), ph: +ph.toFixed(3), ropePx: +(ropeH(ph) * SZ).toFixed(1), feetPx: +(S.y * SZ).toFixed(1), air: S.air, judged: S.judged, side: S.side, T: +curT(b).toFixed(3) }; },
    // 자동 넘기: 꼭대기에서 넘는 완벽한 때 ± sigma(초) 오차, lag 는 바뀐 빠르기를 덜 따라가는 정도(0~1). bot(null) 로 끈다
    bot(sigma, lag) { S.bot = sigma == null ? null : { sigma: sigma || 0, lag: lag || 0 }; },
    // 화면 없이 한 판을 끝까지(또는 maxSec 초까지) 돌린다 → { count, time, perfect, misses, hearts, T }
    sim(sigma, lag, maxSec, log) {
      const dt = 1 / 120; S.simulating = true; start(); S.wait = 0; S.bot = { sigma: sigma || 0, lag: lag || 0 }; S.log = log ? [] : null;
      let t = 0; maxSec = maxSec || 600; while (S.mode === 'play' && t < maxSec) { step(dt); t += dt; }
      const r = { count: S.count, time: +S.pt.toFixed(1), perfect: S.perfect, misses: S.misses, hearts: S.hearts, T: +S.plan[Math.max(0, S.judged)].T.toFixed(3), log: S.log };
      S.bot = null; S.simulating = false; S.log = null; return r;
    }
  };
})();
</script>
