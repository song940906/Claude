<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 간식쌓기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 간식쌓기: 방·하늘·간식 탑(bg) → 콩이(stage) → 반짝이·글(fx) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: pointer; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 12px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-left: 1px; }
#hud .fl b { font-size: 16px; font-weight: 700; }
#hud .st { color: #FFE9A8; background: rgba(70,52,10,.62); border-color: rgba(255,214,120,.35); }
#hud .st.pop { animation: stPop .35s; }
@keyframes stPop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
#hud .sc { margin-left: auto; }
#banner { position: fixed; z-index: 11; text-align: center; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity .28s, transform .28s; }
#banner.show { opacity: 1; transform: none; }
#banner b { display: inline-block; max-width: 100%; box-sizing: border-box; padding: 8px 16px; border-radius: 18px; background: rgba(18,22,52,.66); border: 1px solid var(--glass-line); font-size: 15px; font-weight: 600; letter-spacing: -.2px; color: #fff; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .row .kg-btn.sub { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: #4E5968; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 9px; font-size: 13px; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } }
/* 낮은 세로 화면(320×568 쯤): 카드가 위 줄 단추에 닿지 않게 조금 촘촘하게 */
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #edText { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .how p + p { margin-top: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 가로 낮은 화면에서 순위 카드와 나란히 설 때(11-23 결과 단추 정리): 「새 기록」 딱지를 점수 옆에 붙여 한 줄을 아끼고, 단추 줄(「다른 게임」 포함)이 카드 안에 들어오게 */
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } #cardEnd.kg-rbwrap .row { margin-top: 8px; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="fl"><b id="hudFloor">0</b><small>층</small></div>
  <div class="st" id="hudStreak" hidden></div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div id="banner" role="status" aria-live="polite"><b></b></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 간식쌓기</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>화면을 누르면</b> <span id="stTap"></span></p>
      <p><b>딱!</b> 맞추면 안 잘리고, 어긋나면 그만큼 잘려요.</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn sub" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart" type="button">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume" type="button">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">간식 탑이 와르르!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edFloor">0</span><small>층</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>점수<b id="edScore"></b></span><span>딱 맞춘 횟수<b id="edPerf"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain" type="button">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'stack');   // 결과 카드 바로 아래(가로 화면은 오른쪽) 별도 카드로 붙는 가족 순위표
  KG.startRank($('cardStart'), 'stack');   // 시작 카드 아래에 고른 난이도의 가족 순위
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const TITLE = J(name, '의') + ' 간식쌓기';

  // ═══════ 놀이판: 가로 360 단위로 고정, 세로(VH)는 화면에 맞춰 늘어난다. 높이(world y)는 바닥이 0, 위로 갈수록 커진다 ═══════
  const FW = 360, CX = 186, KX = 46, KS = 108;   // 놀이판 폭 · 탑 가운데 · 콩이 자리 · 콩이 그림 한 변
  const BH = 24, PLATE = 8, GAP = 38;             // 간식 한 층 높이 · 접시 두께 · 움직이는 간식이 탑 위에 떠 있는 높이
  let W = 0, H = 0, DPR = 1, S = 1, FX = 0, PW = 360, VH = 700, GY = 600, TOPY = 60, TOPT = 300, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 };
  let CEIL = 420, ROOF = 506;                     // 방 천장 높이 · 지붕 꼭대기 높이 (화면 크기에 맞춰 정한다)
  const bg = $('bg'), g = bg.getContext('2d'), fx = $('fx'), ctx = fx.getContext('2d'), stage = $('stage');
  const FONT = getComputedStyle(document.body).fontFamily;

  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.type = 'button'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE;
  $('stTitle').textContent = TITLE;
  $('stLead').textContent = J(name, '이/가') + ' 먹을 간식을 높이높이 쌓아 주세요.';
  $('stTap').textContent = '움직이던 간식이 떨어져요' + (matchMedia('(hover: hover) and (pointer: fine)').matches ? ' (스페이스 키도 돼요).' : '.');
  $('psText').textContent = J(name, '이/가') + ' 간식 탑을 지키고 있어요.';
  const RULES = {
    key: 'stack', title: TITLE, lead: '좌우로 움직이는 간식을 딱 맞춰 높이 쌓아요.',
    items: [
      ['👆', '화면을 누르면 움직이던 간식이 아래로 떨어져요.'],
      ['✂️', '어긋난 만큼 잘려서 다음 간식이 좁아져요.'],
      ['✨', '딱 맞추면 안 잘려요. 계속 딱 맞추면 다시 넓어져요.'],
      ['🥞', '간식이 완전히 빗나가면 끝! 몇 층까지 쌓을까요?']
    ]
  };

  const K = kong(stage, 108);
  const HAS_EAT = K.has('eat');

  // ═══════ 난이도 표 (수치는 모두 여기에) ═══════
  //   w0 시작 간식 폭 · v0 처음 빠르기(1초에 놀이판 단위) · acc 한 층 쌓을 때마다 빨라지는 비율 · vmax 가장 빠를 때
  //   perfect 「딱!」으로 쳐 주는 어긋남(±) · grow 연속으로 딱 맞추면 다시 넓어지는 폭 · growFrom 몇 번째 연속부터 넓어지나
  //   guide 탑 가장자리에서 위로 올라가는 점선(맞출 자리)을 보여 줄지
  const DIFF = {
    easy:   { w0: 190, v0: 135, acc: 0.010, vmax: 300, perfect: 10,  grow: 8, growFrom: 2, guide: true  },
    normal: { w0: 168, v0: 180, acc: 0.015, vmax: 360, perfect: 6.5, grow: 9,  growFrom: 2, guide: false },
    hard:   { w0: 148, v0: 230, acc: 0.022, vmax: 500, perfect: 4.5, grow: 6,  growFrom: 3, guide: false },
    vhard:  { w0: 128, v0: 285, acc: 0.030, vmax: 640, perfect: 3,   grow: 4,  growFrom: 3, guide: false }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 상태 ═══════
  // 절전(11-25): 놀이 중이 아니면(카드가 떠 있을 때) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임 그리고, 그 뒤로는 0.2초에 한 번만 그린다
  let lzKey = '', lzAt = 0, lzLast = 0;
  function lzWake() { lzAt = performance.now(); }
  function lzDraw(now, key) {   // key: 놀이 중이면 '' (늘 그림), 아니면 상태 이름
    if (key !== lzKey) { lzKey = key; lzAt = now; }
    if (!key || now - lzAt < 1000 || now - lzLast >= 200) { lzLast = now; return true; }
    return false;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lzWake(); });
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.kg-diff')) lzWake(); }, true);   // 카드에서 난이도를 바꾸면 카드 뒤 장면도 바로 매 프레임 그린다
  let state = 'ready';            // ready · play · pause · over · result
  let layers = 0, points = 0, streak = 0, perfects = 0, bestStreak = 0, playT = 0;
  let tower = [], piece = null, cuts = [], bodies = [];
  const parts = [], floats = [];
  let cam = 0, shake = 0, tAnim = 0, overT = 0, collapsed = false, munchN = 0, zone = 0, lastBark = -99, endAt = 0;
  let newRec = false, keyAt = 0, blockUntil = 0;   // 이번 판이 새 기록인지 · 마지막 키 누른 때 · 연타가 멎을 때까지 다시 하기를 막는 때
  let mood = 'idle', moodT = 0;   // 콩이 기분: idle · joy · sad · shock · eat
  const topY = () => PLATE + tower.length * BH;          // 탑 꼭대기 높이
  const yS = wy => GY - (wy - cam);                       // 높이 → 화면 y (놀이판 단위)
  const camGoal = () => Math.max(0, topY() - (GY - TOPT));

  // ═══════ 간식 그림 ═══════
  const PAL = [
    { a: '#F9D48F', b: '#EDB762', edge: '#D9A04C', deco: 'syrup', c: '#C8843A' },   // 팬케이크
    { a: '#E2B990', b: '#CB9A70', edge: '#B48259', deco: 'chip',  c: '#7B5236' },   // 쿠키
    { a: '#FFC9D4', b: '#F8A3B6', edge: '#EA8AA0', deco: 'cream', c: '#FFF8F0' },   // 딸기 케이크
    { a: '#D5ECBC', b: '#AED693', edge: '#93C079', deco: 'dot',   c: '#FFFFFF' },   // 말차 떡
    { a: '#FFE594', b: '#F7CB5E', edge: '#E3B344', deco: 'hole',  c: '#E9B13F' },   // 치즈
    { a: '#DCCBF7', b: '#BCA3EC', edge: '#A389DC', deco: 'cream', c: '#FFF8F0' }    // 고구마 케이크
  ];
  function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  // 간식 한 조각: 가운데 x, 윗변 y, 폭, 높이. ox = 무늬 기준 x (잘려도 무늬가 미끄러지지 않게)
  function snack(c, cx, sy, w, h, kind, ox, glow) {
    if (w < 0.5) return;
    const P = PAL[kind % PAL.length], x = cx - w / 2;
    const lg = c.createLinearGradient(0, sy, 0, sy + h); lg.addColorStop(0, P.a); lg.addColorStop(1, P.b);
    rr(c, x, sy, w, h, 8); c.fillStyle = lg; c.fill();
    if (w > 7) {
      c.save(); c.clip();
      c.fillStyle = 'rgba(120,70,20,.09)'; c.fillRect(x, sy + h - 5, w, 5);
      const o = ox == null ? 0 : ox, a0 = x - o, k0 = Math.floor(a0 / 19) - 1, k1 = Math.ceil((a0 + w) / 19) + 1;
      c.fillStyle = P.c;
      if (P.deco === 'syrup' || P.deco === 'cream') {
        c.fillRect(x, sy, w, P.deco === 'syrup' ? 5.5 : 7);
        const base = P.deco === 'syrup' ? 5.5 : 7;
        for (let k = k0; k <= k1; k++) { const px = o + k * 19 + 7, r = 3.2 + ((k * 7) % 3 + 3) % 3 * 0.9; c.beginPath(); c.arc(px, sy + base - 0.5, r, 0, TAU); c.fill(); }
      } else {
        for (let k = k0; k <= k1; k++) {
          const m = ((k * 5) % 3 + 3) % 3, px = o + k * 19 + 6, py = sy + 7 + m * 5.5;
          c.beginPath(); c.arc(px, py, P.deco === 'chip' ? 2.4 : P.deco === 'hole' ? 2.2 + m * 0.6 : 1.6, 0, TAU); c.fill();
        }
        if (w > 18) { c.fillStyle = 'rgba(255,255,255,.4)'; rr(c, x + 6, sy + 2.5, w - 12, 2.6, 1.3); c.fill(); }
      }
      c.restore();
    }
    c.strokeStyle = P.edge; c.lineWidth = 1.2; rr(c, x + 0.6, sy + 0.6, w - 1.2, h - 1.2, 7.4); c.stroke();
    if (glow > 0.02) { c.globalAlpha = Math.min(1, glow) * 0.7; c.fillStyle = '#FFFBE6'; rr(c, x, sy, w, h, 8); c.fill(); c.globalAlpha = 1; }
  }

  // ═══════ 배경: 방 → 지붕 → 하늘 → 별 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SKY = [[0, [206, 236, 255]], [150, [172, 214, 251]], [270, [146, 158, 234]], [380, [72, 70, 160]], [520, [22, 26, 84]], [760, [11, 16, 48]]];
  function skyCol(a) {   // 높이 → 하늘 색 (지붕 위부터 잰다)
    a -= ROOF; if (a <= 0) return SKY[0][1];
    for (let i = 1; i < SKY.length; i++) if (a < SKY[i][0]) { const t = (a - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]), p = SKY[i - 1][1], q = SKY[i][1]; return [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)]; }
    return SKY[SKY.length - 1][1];
  }
  const night = a => clamp((a - ROOF - 190) / 260, 0, 1);
  const rgb = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  const STARS = [], CLOUDS = [];
  (function () {
    const r = mulberry32(7);
    for (let i = 0; i < 80; i++) STARS.push({ fx: r(), fy: r(), r: 0.6 + r() * 1.3, ph: r() * TAU, sp: 0.8 + r() * 2, gold: r() < 0.3 });
    for (let i = 0; i < 14; i++) CLOUDS.push({ fx: r(), dy: 50 + i * 52 + r() * 30, s: 0.7 + r() * 0.7, v: 3 + r() * 5 });
  })();
  function cloud(c, x, y, s, a) {
    c.globalAlpha = a; c.fillStyle = '#FFFFFF'; c.beginPath();
    c.arc(x - 20 * s, y + 2 * s, 13 * s, 0, TAU); c.arc(x - 3 * s, y - 7 * s, 17 * s, 0, TAU); c.arc(x + 17 * s, y - 1 * s, 14 * s, 0, TAU); c.fill();
    rr(c, x - 33 * s, y + 1 * s, 64 * s, 14 * s, 7 * s); c.fill(); c.globalAlpha = 1;
  }
  function drawScene(X0, X1) {
    const XW = X1 - X0, aTop = cam + GY, aBot = cam + GY - VH;
    // 하늘
    if (aTop > ROOF - 4) {
      const lg = g.createLinearGradient(0, 0, 0, VH);
      for (let i = 0; i <= 6; i++) lg.addColorStop(i / 6, rgb(skyCol(lerp(aTop, aBot, i / 6))));
      g.fillStyle = lg; g.fillRect(X0, 0, XW, VH);
      // 별
      if (night(aTop) > 0.02) for (const s of STARS) {

    // 탑
    const i0 = Math.max(0, Math.floor((cam + GY - VH - PLATE) / BH) - 1);
    for (let i = i0; i < tower.length; i++) {
      const L = tower[i], yt = yS(PLATE + (i + 1) * BH); if (yt < -BH - 4) break;
      const sq = L.t < 0.2 && !reduceMotion ? Math.sin(L.t / 0.2 * Math.PI) * 0.16 : 0;
      snack(g, L.x, yt + BH * sq, L.w * (1 + sq * 0.12), BH * (1 - sq), L.kind, L.ox, L.glow);
    }
    // 맞출 자리 점선 (Easy)
    if (D.guide && piece && state !== 'over' && tower.length) {
      const top = tower[tower.length - 1], y0 = yS(topY()), y1 = y0 - GAP - BH - 8;
      g.strokeStyle = 'rgba(96,108,150,.5)'; g.lineWidth = 1.4; g.setLineDash([4, 5]); g.beginPath();
      g.moveTo(top.x - top.w / 2, y0 - 2); g.lineTo(top.x - top.w / 2, y1); g.moveTo(top.x + top.w / 2, y0 - 2); g.lineTo(top.x + top.w / 2, y1); g.stroke(); g.setLineDash([]);
    }
    // 움직이는 간식
    if (piece) {
      const bob = piece.mode === 'move' && !reduceMotion ? Math.sin(tAnim * 5) * 1.5 : 0;
      const yt = yS(topY() + Math.max(0, piece.y) + BH) + bob;
      g.fillStyle = 'rgba(40,40,90,.10)'; rr(g, piece.x - piece.w / 2 + 3, yt + 5, piece.w, BH, 8); g.fill();
      snack(g, piece.x, yt, piece.w, BH, piece.kind, piece.x - piece.w / 2, 0);
    }
    // 잘린 조각 · 무너진 간식
    for (const a of [bodies, cuts]) for (const c of a) {
      const sy = yS(c.y); if (sy < -60 || sy > VH + 60) continue;
      g.save(); g.translate(c.x, sy); g.rotate(c.rot); snack(g, 0, -BH / 2, c.w, BH, c.kind, c.ox == null ? null : c.ox - c.x, 0); g.restore();
    }
    // 위 줄 글이 밝은 방에서도 보이게 살짝 어둡게
    if (!wide) { const hh = (TOPY + 52) / S, tg = g.createLinearGradient(0, 0, 0, hh); tg.addColorStop(0, 'rgba(22,26,70,.42)'); tg.addColorStop(1, 'rgba(22,26,70,0)'); g.fillStyle = tg; g.fillRect(X0 - 12, -8, X1 - X0 + 24, hh + 8); }

    // 앞쪽: 반짝이 · 글 · 콩이가 먹는 간식
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, (FX + shx) * DPR, shy * DPR);
    if (mood === 'eat' && moodT < 1.45) {
      const m = mouthPt(), k = 1 - clamp(moodT / 1.45, 0, 1), w = 12 + 30 * k;
      snack(ctx, m.x + 12 + w * 0.2, m.sy + 4, w, 15, layers % PAL.length, null, 0);
    }
    for (const p of parts) {
      const a = p.life / p.max, sy = yS(p.y); ctx.globalAlpha = a; ctx.fillStyle = p.col;
      if (p.star) { ctx.beginPath(); for (let i = 0; i < 8; i++) { const an = i * TAU / 8 + p.max * 9, r = (i % 2 ? 0.4 : 1) * p.r * (0.6 + a); ctx.lineTo(p.x + Math.cos(an) * r * 1.5, sy + Math.sin(an) * r * 1.5); } ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(p.x, sy, p.r * (0.5 + a * 0.6), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    if (floats.length) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      for (const f of floats) { const a = Math.min(1, f.life / 0.3), sy = yS(f.y); ctx.globalAlpha = a; ctx.font = '700 ' + f.size + 'px ' + FONT; ctx.strokeStyle = 'rgba(30,34,84,.7)'; ctx.lineWidth = 4; ctx.strokeText(f.text, f.x, sy); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, sy); }
      ctx.globalAlpha = 1;
    }
    drawKong();
  }
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    tAnim += dt;
    if (state === 'play' || state === 'over') update(dt);
    else if (state === 'ready') { if (piece) movePiece(dt); moodT += dt; }
    else if (state === 'result') { moodT += dt; stepLoose(dt); }
    if (lzDraw(now, state === 'play' || state === 'over' ? '' : state)) draw();
  }

  // ═══════ 흐름 ═══════
  function reset() {
    layers = points = streak = perfects = bestStreak = 0; playT = 0; zone = 0; shownL = shownP = shownS = -1;
    tower = [{ x: CX, w: D.w0, kind: 0, t: 1, glow: 0 }]; cuts = []; bodies = []; parts.length = floats.length = 0;
    cam = camGoal(); shake = 0; overT = 0; collapsed = false; munchN = 0; setMood('idle');
    newPiece(); paintHud();
  }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    reset(); state = 'play';
    $('cardStart').hidden = $('cardEnd').hidden = $('cardPause').hidden = true; btnPause.hidden = false; rbox.hide();
    KG.unlockAudio(); tone(659, 0.12, 'triangle', 0.05); tone(880, 0.2, 'triangle', 0.05, 0.1);
    banner('화면을 눌러 간식을 떨어뜨려요', 1900);
  }
  function pause() { if (state !== 'play') return; state = 'pause'; $('cardPause').hidden = false; if (document.activeElement === btnPause) btnPause.blur(); focusBtn('btnResume'); }
  function resume() { if (state !== 'pause') return; state = 'play'; $('cardPause').hidden = true; }
  function showResult() {
    if (state !== 'over') return;
    state = 'result';
    const isNew = newRec;
    $('edFloor').textContent = fmt(layers); $('edScore').textContent = fmt(points) + '점'; $('edPerf').textContent = fmt(perfects) + '번'; paintBest();
    $('edNew').hidden = !isNew;
    $('edTitle').textContent = layers >= 30 ? '우와, 정말 높이 쌓았어요!' : '간식 탑이 와르르!';
    if ((layers >= ({ easy: 40, normal: 30, hard: 25, vhard: 20 })[diffId]) && KG.master) KG.master('stack');   // 업적 「게임 달인」 (11-27): 난이도별 40·30·25·20층
    $('edText').textContent = layers > 0 ? J(name, '이/가') + ' 떨어진 간식을 맛있게 먹었어요.' : '괜찮아요, ' + J(name, '이랑/랑') + ' 다시 쌓아 봐요.';
    $('cardEnd').hidden = false; endAt = performance.now(); focusBtn('btnAgain'); rbox.show(diffId);
    if (isNew) { sfx('win'); bark(true); }
  }
  function focusBtn(id) { try { $(id).focus({ preventScroll: true }); } catch (e) {} }
  const endGuard = () => { const n = performance.now(); return n - endAt < 700 || n < blockUntil; };   // 결과 카드가 뜬 직후에는 두드리던 손가락이 단추를 누르지 않게
  $('cardEnd').addEventListener('click', e => { if (endGuard()) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', start);
  $('btnResume').addEventListener('click', resume);
  $('btnQuit').addEventListener('click', () => { resume(); fail(false); });
  $('btnRules').addEventListener('click', () => { sfx('tap'); KG.rules(RULES, true).then(() => focusBtn('btnStart')); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);

  // ═══════ 입력 ═══════
  fx.addEventListener('pointerdown', e => { if (state !== 'play') return; e.preventDefault(); drop(); });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === ' ' || k === 'Enter' || k === 'ArrowDown') {
      const now = performance.now(); if (now - keyAt < 450) blockUntil = now + 450; keyAt = now;   // 연타하던 키가 결과 카드의 「다시 하기」를 누르지 않게
      if (state === 'play' && k !== 'Enter') { e.preventDefault(); if (!e.repeat) drop(); return; }   // 놀이 중에는 단추(소리 등)에 초점이 있어도 떨어뜨린다
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (e.repeat) return;
      if (state === 'play') drop();
      else if (k === 'ArrowDown') return;
      else if (state === 'ready') start(); else if (state === 'result') { if (!endGuard()) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  // 난이도 고르기: 시작 카드·결과 카드에만 (고르면 그 난이도의 최고 기록을 보여 준다, 없으면 숨김)
  function paintBest() {
    const b = best(KG.dkey('stack'));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '층';
    // 결과 카드는 방금 끝난 판(diffId)의 기록으로 고정. 다른 난이도를 골라 두었으면 어느 난이도 기록인지 밝힌다
    const e = best(KG.dkey('stack', diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '층';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
  }
  function previewDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; diffId = KG.diff(); reset(); } }   // 시작 전에는 고른 난이도의 간식 폭을 미리 보여 준다
  $('stRec').parentNode.insertBefore(KG.diffPicker(null, previewDiff), $('stRec'));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
  layout(); reset(); paintBest();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  KG.rules(RULES).then(() => { if (state === 'ready') focusBtn('btnStart'); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get score() { return layers; }, get layers() { return layers; }, get points() { return points; }, get streak() { return streak; }, get perfects() { return perfects; },
    get time() { return playT; }, get diff() { return diffId; }, get D() { return D; }, get cam() { return cam; }, get mood() { return mood; }, get zone() { return zone; },
    get piece() { return piece ? { x: piece.x, w: piece.w, v: piece.v, dir: piece.dir, mode: piece.mode, t: piece.t } : null; },
    get top() { const t = tower[tower.length - 1]; return t ? { x: t.x, w: t.w } : null; },
    field: () => ({ FX, S, PW, VH, GY, W, H, wide, TOPT, CEIL, ROOF }),
    start, pause, resume, drop,
    dropAt: dx => { if (state !== 'play' || !piece || piece.mode !== 'move') return false; piece.x = tower[tower.length - 1].x + dx; piece.t = 1; return drop(); },   // 봇: 탑 가운데에서 dx 만큼 어긋나게 떨어뜨린다
    end: () => { if (state === 'pause') resume(); if (state === 'play') fail(false); },
    step: dt => { tAnim += dt; if (state === 'play' || state === 'over') update(dt); }   // 시험용: 화면 없이 빨리 돌리기
  };
})();
</script>
</body>
</html>
