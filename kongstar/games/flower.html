<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 무궁화꽃</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 무궁화꽃: 마당(bg 캔버스) · 나무 앞의 콩이(kstage) · 곰돌이와 효과(fg 캔버스) · 말풍선 · 점수판 */
#bg, #fg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#bg { z-index: 1; background: #BFE6FF; }
#kstage { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
#fg { z-index: 3; touch-action: none; cursor: pointer; }
#bubble { position: fixed; z-index: 6; left: 0; top: 0; box-sizing: border-box; padding: 8px 14px; border-radius: 18px; background: #fff; color: #191F28; font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.3; white-space: nowrap; text-align: left; box-shadow: 0 6px 18px rgba(30,60,40,.22); pointer-events: none; transition: opacity .2s; }
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; }
#bubble.side::after { left: -8px; top: 50%; bottom: auto; margin: -8px 0 0; border: 8px solid transparent; border-left: 0; border-right-color: #fff; }
#bubble.look { color: #D6336C; }
#bubble.bark { color: #C2410C; }
#bubble.yay { color: #2B8A3E; }
#bubble.off { opacity: 0; }
#bubble.warn { box-shadow: 0 0 0 3px #FFD43B, 0 0 0 5px #2C3577, 0 6px 18px rgba(30,60,40,.22); }
#bubble.pulse { animation: bbPulse .22s; }
@keyframes bbPulse { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
#hud { position: fixed; z-index: 10; pointer-events: none; }
#hud .pills { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
#hud .pills > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .hearts { gap: 1px; letter-spacing: 0; }
#hud .hearts i { font-style: normal; color: #FF7B9C; font-size: 15px; transition: opacity .25s, transform .25s; }
#hud .hearts i.off { opacity: .28; transform: scale(.8); color: #fff; }
#hud .tm { margin-left: auto; }
#hud .tm.low { color: #FFB3B8; }
#tbar { height: 7px; margin-top: 7px; border-radius: 4px; background: rgba(18,22,52,.35); overflow: hidden; }
#tbar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFD36E, #FFB95C); transform-origin: 0 50%; }
#tbar.low i { background: linear-gradient(90deg, #FF9AA2, #FF7B88); }
#hud.low .tm { margin-left: 0; }
#hud.low #tbar { margin-top: 5px; height: 5px; }
#hint { position: fixed; z-index: 7; left: 50%; transform: translate(-50%, 0); padding: 9px 16px; border-radius: 18px; background: rgba(255,255,255,.94); color: #191F28; font-size: 14.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.14); pointer-events: none; transition: opacity .3s; }
#hint.off { opacity: 0; }
#banner { position: fixed; z-index: 7; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); padding: 10px 22px; border-radius: 20px; background: rgba(255,255,255,.95); color: #2C3577; font-size: 22px; font-weight: 800; letter-spacing: -.4px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.18); pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner small { display: block; font-size: 13.5px; font-weight: 600; color: #5F6B78; text-align: center; margin-top: 2px; }
.fl { position: fixed; z-index: 8; transform: translate(-50%, -50%); white-space: nowrap; font-size: 19px; font-weight: 800; letter-spacing: -.3px; color: #fff; text-shadow: 2px 0 0 rgba(40,30,20,.85), -2px 0 0 rgba(40,30,20,.85), 0 2px 0 rgba(40,30,20,.85), 0 -2px 0 rgba(40,30,20,.85), 1.5px 1.5px 0 rgba(40,30,20,.85), -1.5px 1.5px 0 rgba(40,30,20,.85), 1.5px -1.5px 0 rgba(40,30,20,.85), -1.5px -1.5px 0 rgba(40,30,20,.85), 0 3px 8px rgba(20,20,10,.5); pointer-events: none; animation: flUp 1s ease-out forwards; }
.fl small { font-size: 13px; font-weight: 700; margin-left: 4px; }
@keyframes flUp { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -34px; } }
@media (prefers-reduced-motion: reduce) { .fl { animation-duration: 1.2s; } #bubble.pulse { animation: none; } }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
#cardStart .tip { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; }
#cardStart .tip span { flex: 1; min-width: 0; }
#btnRules { flex: none; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--pri); font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#btnRules:active { filter: brightness(.96); }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); white-space: nowrap; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 440px); padding: 14px 18px 12px; }
  body .kg-card h2 { margin-bottom: 2px; }
  .kg-card .tip { margin-top: 8px; padding: 9px 12px; }
  #cardStart .tip { padding: 5px 6px 5px 12px; }
  .kg-card .key { display: none; }
  body .kg-card .big { font-size: 32px; margin: 2px 0 0; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .row .kg-btn { height: 44px; }
  .kg-card .stats { margin-top: 8px; }
  .kg-card .stats div { padding: 6px 4px 5px; }
  .kg-card .rec { margin-top: 6px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
}
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; }
  #hud .pills > div { padding: 0 9px; }
}
/* 낮은 가로 화면: 카드가 위 줄(뒤로 단추) 밑에서 시작하게 하고, 덜 중요한 줄을 빼서 한 화면에 들어오게 */
@media (orientation: landscape) and (max-height: 430px) {
  body .kg-scrim:not(.kg-rules) { padding-top: calc(var(--sat) + 60px); padding-bottom: calc(var(--sab) + 8px); }
  body .kg-card { position: relative; }
  #stLead, #edText { display: none; }
  .kg-card .big .badge { margin: 0 0 0 10px; padding: 3px 8px; font-size: 12px; letter-spacing: 0; vertical-align: middle; }
}
@media (orientation: landscape) and (max-height: 340px) {
  body .kg-scrim.kg-rbwrap > .kg-card { box-sizing: border-box; padding-top: 12px; padding-bottom: 12px; }
  body .kg-rbwrap #edText { display: none; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="kstage"></div>
<canvas id="fg" aria-label="꾹 누르고 있으면 곰돌이가 걸어가요"></canvas>
<div id="bubble" class="off" aria-live="polite"></div>
<div id="hint" class="off">화면을 꾹 누르고 있으면 걸어가요</div>
<div id="banner"></div>

<div id="hud" aria-hidden="true">
  <div class="pills">
    <div class="rd"><span id="hudRound">1</span><small>판</small></div>
    <div class="hearts" id="hudHearts"><i>♥</i><i>♥</i><i>♥</i></div>
    <div class="sc"><span id="hudScore">0</span><small>점</small></div>
    <div class="tm" id="hudTimeBox"><span id="hudTime">30</span><small>초</small></div>
  </div>
  <div id="tbar"><i></i></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이의 무궁화꽃</h2>
    <p id="stLead"></p>
    <div class="tip"><span><b>꾹</b> 누르면 걷고, 떼면 <b>얼음!</b></span><button type="button" id="btnRules">규칙 보기</button></div>
    <div class="key" id="stKey" hidden>키보드는 스페이스(또는 ↑)를 누르고 있으면 걸어요.</div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="psTitle">
    <h2 id="psTitle">잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="edTitle">
    <div class="badge" id="edNew" hidden>새 기록이에요!</div>
    <h2 id="edTitle">잘했어요!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div class="stats">
      <div><b id="edRounds">0판</b><small>성공한 판</small></div>
      <div><b id="edCaught">0번</b><small>걸린 횟수</small></div>
      <div id="edRec"><b id="edBest">0점</b><small id="edBestLbl">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'flower', TITLE = J(name, '의') + ' 무궁화꽃';
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   syl    한 글자마다 걸리는 시간(초) [가장 빠름, 가장 느림] — 외칠 때마다 이 사이에서 뽑는다
  //   fastP  외치는 도중 갑자기 빨라질 확률 · fast 빨라질 때 곱하는 값
  //   slowP  첫 몇 글자를 길게 늘이는 확률 (무~궁~화~ 하다가 나머지는 보통)
  //   fakeP  돌아보는 척하다 마는 속임 동작이 나올 확률 (말 도중에만 — 진짜로 돌아보는 것은 늘 말이 끝난 뒤)
  //   warn   돌아보기 몇 초 전부터 귀가 쫑긋하나 · grace 돌아본 뒤 멈출 여유(초)
  //   look   돌아보고 있는 시간(초) [짧게, 길게] · cross 출발선에서 콩이까지 꾹 누르고 걸어야 하는 시간(초, 1판)
  //   time   1판 제한 시간(초) · back 걸렸을 때 되돌아가는 몫 (1 = 출발선까지)
  const DIFF = {
    easy:   { syl: [0.30, 0.42], fastP: 0.00, fast: 1.00, slowP: 0.30, fakeP: 0.00, warn: 0.90, grace: 0.30, look: [1.0, 1.6], cross: 5.0, time: 28, back: 0.5 },
    normal: { syl: [0.21, 0.34], fastP: 0.30, fast: 0.60, slowP: 0.35, fakeP: 0.00, warn: 0.55, grace: 0.25, look: [1.1, 2.1], cross: 6.0, time: 30, back: 1.0 },
    hard:   { syl: [0.15, 0.30], fastP: 0.45, fast: 0.50, slowP: 0.40, fakeP: 0.35, warn: 0.35, grace: 0.20, look: [1.0, 2.5], cross: 7.0, time: 28, back: 1.0 },
    vhard:  { syl: [0.11, 0.27], fastP: 0.60, fast: 0.42, slowP: 0.45, fakeP: 0.55, warn: 0.22, grace: 0.15, look: [0.9, 3.0], cross: 7.5, time: 27, back: 1.0 }
  };
  const HEARTS = 3;
  const PTS = { win: 100, sec: 10, clean: 50 };   // 성공한 판 · 남은 1초마다 · 한 번도 안 걸린 판 덤
  // 판이 올라갈수록: 거리 +14%(최대 3배), 외치는 빠르기 ×0.95(최대 0.62배), 제한 시간은 10판까지 +0.5초 → 그 뒤로는 판마다 −1초
  // 그리고 판마다 반응 여유·귀 쫑긋 예고가 ×0.97(최소 절반), 갑자기 빨라짐·속임 동작이 늘어난다 (8판부터는 Normal 도 속인다)
  // — 시간이 다 되면 그 판에서 끝이니, 잘하는 사람도 언젠가는 끝난다
  const roundDist = r => Math.min(3, 1 + 0.14 * (r - 1)), roundTempo = r => Math.max(0.62, Math.pow(0.95, r - 1));
  const roundTime = (d, r) => d.time + 0.5 * (Math.min(r, 10) - 1) - Math.max(0, r - 10);
  function roundD(d, r) {   // 이번 판에 쓰는 난이도 수치
    const k = Math.max(0.5, Math.pow(0.97, r - 1));
    return Object.assign({}, d, {
      grace: d.grace * k, warn: d.warn * k,
      fastP: d.fastP > 0 ? Math.min(0.9, d.fastP + 0.03 * (r - 1)) : 0,
      fakeP: Math.min(0.8, d.fakeP + (r >= 8 ? 0.04 * (r - 7) : 0))
    });
  }
  const SYL = ['무', '궁', '화', ' 꽃', '이', ' 피', '었', '습', '니', '다'];
  const FULL = SYL.join('');
  const NOTE = [392, 392, 440, 392, 330, 392, 392, 440, 392, 330];   // 외치는 소리 높이 (솔솔라솔미…)
  let diffId = 'normal', D0 = DIFF.normal, D = DIFF.normal, bestAtStart = 0;   // D0 난이도 기본값 · D 이번 판 값

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = J(name, '이/가') + ' 「무궁화 꽃이 피었습니다」를 외치는 동안 살금살금 다가가 꼬리를 톡!';
  $('psText').textContent = J(name, '이/가') + ' 나무 앞에서 기다리고 있어요.';
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) $('stKey').hidden = false;

  const bg = $('bg'), fg = $('fg'), kstage = $('kstage'), bubble = $('bubble'), hint = $('hint'), banner = $('banner');
  const fgc = fg.getContext('2d');
  const K = kong(kstage, 120);

  // ═══════ 상태 ═══════
  let state = 'ready';            // ready · play · pause · over · result
  let ph = 'intro', phT = 0;      // 판 안의 흐름: intro · pre · chant · fake · turn · look · back · caught · win · timeup
  let round = 1, hearts = HEARTS, score = 0, timeLeft = 30, timeMax = 30, dist = 1, overT = 0, tAnim = 0, endAt = 0;
  let p = 0, walkPh = 0, stepAcc = 0, needRelease = false, walked = false, lookT = 0, lookDur = 1.5, roundCaught = 0;
  let hopFrom = 0, hopTo = 0, lastTick = 99, bannerT = 0, introDur = 1.4, preDur = 0.3;
  let ch = null;                  // 외치기: { iv[], i, t, fakeAt, fakeDur, fakeDone, warn }
  let stats = { rounds: 0, caught: 0, timeups: 0, fakes: 0 };
  let kmood = 'idle', kmoodT = 0;  // 콩이 기분 (happy · bark · sad)
  let tapT = 0;                    // 꼬리 톡 동작

  // ── 누르기 (손가락 여러 개·키보드)
  const pointers = new Set(); let keyHold = false;
  const holding = () => pointers.size > 0 || keyHold;
  fg.addEventListener('pointerdown', e => {
    if (state !== 'play') return; e.preventDefault();
    pointers.add(e.pointerId); try { fg.setPointerCapture(e.pointerId); } catch (er) {}
  });
  const lift = e => { pointers.delete(e.pointerId); };
  fg.addEventListener('pointerup', lift); fg.addEventListener('pointercancel', lift); fg.addEventListener('lostpointercapture', lift);
  window.addEventListener('blur', () => { pointers.clear(); keyHold = false; });

  // ═══════ 화면 맞추기 ═══════
  let W = 0, H = 0, low = false, KS = 120, kx = 0, ky = 0, yStart = 0, yEnd = 0, BN = 80, sFar = 0.5, pathNear = 300, pathFar = 80, hz = 0;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; const sa = safe();
    low = H < 520 && W > H;
    const hud = $('hud');
    if (low) {
      // 낮은 가로 화면: 점수판을 위 줄 가운데(뒤로 단추와 멈춤·소리 단추 사이)에 둔다

  $('stRec').before(KG.diffPicker(null, paintBest));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null, paintBest));
  diffId = KG.diff(); paintBest();
  layout(); paintHud();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get ph() { return ph; }, get p() { return p; }, get round() { return round; }, get hearts() { return hearts; }, get score() { return score; },
    get timeLeft() { return timeLeft; }, get diff() { return diffId; }, get stats() { return Object.assign({}, stats); }, get warn() { return !!(ch && ch.warn); }, get chant() { return ch; },
    DIFF, field: () => ({ W, H, low, KS, kx, ky, yStart, yEnd, BN, bubble: bubble.getBoundingClientRect().toJSON(), hud: $('hud').getBoundingClientRect().toJSON() }),
    hold(on) { keyHold = !!on; }, start, pause, resume, quit,
    step(dt) { tAnim += dt; if (state === 'play' || state === 'over') update(dt); }
  };
})();
</script>
