<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 핀볼</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 핀볼: 밤하늘(bg) → 핀볼 판·범퍼·별(cv) → 콩이(stage) → 날개·공·글자(fx) → 점수판 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .bl i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F2FA9A, #A9C21E 75%); box-shadow: inset 0 0 0 1px rgba(70,90,10,.45); flex: none; transition: opacity .2s, transform .2s; }
#hud .bl i.off { opacity: .22; transform: scale(.8); }
#hud .mu.hot { background: rgba(227,154,99,.78); }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
/* 가로 화면: 점수판은 판 왼쪽 여백에 세로로 (판 쪽으로 붙인다) */
#hud.col { flex-direction: column; align-items: flex-end; transform: translateX(-100%); }
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="왼쪽·오른쪽을 눌러 날개를 치는 핀볼 판"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
  <div class="bl" id="hudBl"><i></i><i></i><i></i></div>
  <div class="mu" id="hudMu"><small>×</small><span id="hudMult">1</span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 핀볼</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>화면 왼쪽·오른쪽을 누르면</b> 그쪽 날개가 공을 쳐요.</p>
      <p>처음엔 <b>오른쪽을 누른 채 아래로 당겼다 놓아</b> 공을 쏘아요.</p>
      <p id="stKeys" hidden><b>← →</b>·<b>Z M</b>·<b>Shift</b> 날개 · <b>스페이스 길게</b> 발사</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">공을 다 썼어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>최대 배수<b id="edMult"></b></span><span>별 줄<b id="edStar"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'pinball', TITLE = J(name, '의') + ' 핀볼';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 판: 공 반지름 0.55 단위. 가로 20 × 세로 36, 놀이 칸은 x 0.4~17.6(가운데 9), 오른쪽 17.6~19.6 은 발사로 ═══════
  const FW = 20, FH = 36, BR = 0.55, CX = 9;
  const LANE_X = 18.6, PLUNGE_Y = 35, REST_Y = PLUNGE_Y - BR, PULL = 1.3;   // 발사로 가운데 · 발사대 윗면 · 공이 쉬는 자리 · 당기면 내려가는 길이
  const PIV_L = [5.4, 31], PIV_R = [12.6, 31], FR0 = 0.48, FR1 = 0.24, F_REST = 0.52, F_UP = -0.42, F_W_UP = 22, F_W_DN = 14;
  const STEP = 1 / 600, VMAX = 58;
  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   g 판 기울기(중력, 단위/초²) · gap 두 날개 끝 사이 가운데 구멍 폭(공 지름 1.1) · lip 옆 배수로 입구 덮개(1.4 = 꽉 막힘, 0 = 없음 — 어중간한 폭은 공이 끼어서 쓰지 않는다)
  //   guard 옆 배수로 보호대: 공 하나마다 옆으로 빠지는 공을 몇 번 튕겨 올려 주는지
  //   save 공 지킴이 시간(초: 공을 쏜 뒤 이 시간 안에 빠지면 콩이가 한 번 물어다 준다)
  const DIFF = {
    easy:   { g: 28, gap: 1.35, lip: 1.4, guard: 0, save: 15 },
    normal: { g: 34, gap: 1.6, lip: 0,   guard: 2, save: 10 },
    hard:   { g: 40, gap: 1.9, lip: 0,   guard: 1, save: 6 },
    vhard:  { g: 46, gap: 2.2, lip: 0,   guard: 0, save: 4 }
  };
  let diffId = 'normal', D = DIFF.normal;
  // 점수 (배수를 곱한다)
  const P = { house: 150, jar: 100, sling: 10, star: 50, starRow: 1000, bowl: 500, orbit: 300 };
  const MULT_MAX = 5;

  // ═══════ 판 조각 ═══════
  //   segs: 벽·레일 {a, b, r(두께 반), e(튕김), k(종류), kick, one(한쪽에서만 막는 문의 법선)}
  //   circs: 범퍼·별·기둥 {x, y, r, e, k, kick}
  let segs = [], circs = [], stars = [], jars = [], house = null, slings = [], flips = [];
  const BOWL = { x: 15.4, y: 19.8, r: 0.75 };
  const RAIL = { a: [2.7, 8.6], b: [2.7, 17.4] };
  function mirror(p) { return [2 * CX - p[0], p[1]]; }
  function buildBoard() {
    segs = []; circs = []; stars = []; jars = []; slings = [];
    const S2 = (a, b, o) => { const s = Object.assign({ a, b, r: 0, e: 0.45, k: 'wall' }, o); segs.push(s); return s; };
    // 바깥 벽: 위는 반원(가운데 10,10 · 반지름 9.6), 왼쪽 벽, 오른쪽 바깥 벽
    const N = 30; let prev = [0.4, 10];
    for (let i = 1; i <= N; i++) { const a = Math.PI + Math.PI * i / N, p = [10 + Math.cos(a) * 9.6, 10 + Math.sin(a) * 9.6]; S2(prev, p, { e: 0.4 }); prev = p; }
    S2([0.4, 10], [0.4, 38]); S2([19.6, 10], [19.6, 36]);
    S2([17.6, 9.0], [17.6, 38], { k: 'lane' });                              // 발사로 벽
    S2([17.6, PLUNGE_Y], [19.6, PLUNGE_Y], { e: 0.15, k: 'plunger' });       // 발사대 윗면
    // 발사로 위 한쪽 문: 아래에서 올라가는 공은 지나가고, 위에서 떨어지는 공은 왼쪽(놀이 칸)으로 굴러간다
    { const a = [17.6, 9.0], b = [19.6, 7.4], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); S2(a, b, { k: 'gate', e: 0.3, one: [dy / l, -dx / l] }); }
    // 뼈다귀 레일 (왼쪽 고리 길) + 아래쪽 받침 — 고리를 돌아 내려온 공을 놀이 칸으로 내보낸다
    S2(RAIL.a, RAIL.b, { r: 0.25, e: 0.5, k: 'bone' });
    S2([0.4, 18.0], [2.5, 20.3], { r: 0.12, e: 0.4, k: 'guide' });
    // 벽에 붙어 내려오는 공을 놀이 칸으로 돌리는 고무 기둥 (오른쪽) — 바깥 끝을 발사로 벽 바로 앞(17.55)까지 붙여, 벽을 타고 온 공이 늘 왼쪽(놀이 칸)으로 굴러 내리게 한다
    circs.push({ x: 17.2, y: 15.5, r: 0.35, e: 0.7, k: 'post' });
    // 아래: 옆 배수로 칸막이(안쪽 길) · 배수로 보호대 · 고무 슬링샷 — 왼쪽을 만들고 오른쪽은 거울로
    for (const side of [1, -1]) {
      const M = side > 0 ? p => p : mirror;
      S2(M([1.8, 24.0]), M([1.8, 27.0]), { r: 0.12, k: 'guide' });
      // 끝을 날개 축 왼쪽 위로 살짝 넘겨, 굴러 온 공이 축 꼭대기 오른쪽(날개 쪽)으로 넘어가게 한다 — 축과 길 사이에 공이 멈출 오목한 자리가 없게
      S2(M([1.8, 27.0]), M([5.2, 30.5]), { r: 0.12, k: 'guide' });
      if (D.lip >= 1.4) S2(M([0.4, 23.4]), M([1.8, 24.0]), { r: 0.1, e: 0.4, k: 'lip' });
      const A = M([3.7, 24.2]), B = M([3.7, 27.0]), C = M([5.6, 28.8]);
      const sl = { A, B, C, flash: 0, side };
      sl.kickSeg = S2(A, C, { r: 0.15, e: 0.6, k: 'sling', kick: 16, sl });
      S2(A, B, { r: 0.15, e: 0.6, k: 'rubber' }); S2(B, C, { r: 0.15, e: 0.6, k: 'rubber' });
      slings.push(sl);
    }
    // 범퍼: 콩이 집(가운데 위) · 간식통 둘
    house = { x: CX, y: 9.2, r: 1.35, e: 0.5, k: 'house', kick: 26, hit: 0 }; circs.push(house);
    for (const x of [5.4, 12.6]) { const j = { x, y: 12.6, r: 1.05, e: 0.5, k: 'jar', kick: 22, hit: 0 }; jars.push(j); circs.push(j); }
    // 별 표적 한 줄 (살짝 웃는 모양)
    for (let i = 0; i < 5; i++) { const x = 4.5 + i * 2.25, s = { x, y: 16 + 0.07 * (x - CX) * (x - CX), r: 0.42, e: 0.55, k: 'star', lit: false, hit: 0 }; stars.push(s); circs.push(s); }
    // 날개: 두 날개 끝(둥근 끝 포함) 사이가 gap 이 되게 길이를 정한다
    const L = (PIV_R[0] - PIV_L[0] - D.gap - 2 * FR1) / 2 / Math.cos(F_REST);
    flips = [{ s: 1, px: PIV_L[0], py: PIV_L[1], L, th: F_REST, w: 0 }, { s: -1, px: PIV_R[0], py: PIV_R[1], L, th: F_REST, w: 0 }];
  }

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '날개로 공을 쳐서 콩이 집·간식통·별을 맞혀요. 공은 세 개!';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 120);

  // ═══════ 상태 ═══════
  let state = 'ready';   // ready · play · pause · over · result
  let ball = { x: LANE_X, y: REST_Y, vx: 0, vy: 0, hold: 0, lost: false };
  let ballsLeft = 3, score = 0, mult = 1, maxMult = 1, starRows = 0, bowls = 0, orbits = 0, isNew = false, quit = false, overT = 0, overAt = 0;
  let slingChain = 0, guards = 0, kbSide = 0, saveT = 0, saveArmed = false, saveUsed = false, launched = false, drainT = 0, bowlCool = 0, starReset = 0, chanFrom = null;
  let stuckT = 0, anchor = { x: 0, y: 0 }, nudges = 0, acc = 0; const nudgeAt = [];
  const plunger = { on: false, p: 0, t0: 0, y0: 0, src: null, show: 0 };
  let parts = [], floats = [], trail = [];
  let mood = 'idle', moodT = 0, tAnim = 0;
  let W = 0, H = 0, DPR = 1, S = 16, ox = 0, oy = 0, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 }, KSZ = 100, kx = 0, ky = 0, kSide = false;
  const sx = x => ox + x * S, sy = y => oy + y * S;

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function buildBg() {
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.55, '#1B2060'); lg.addColorStop(1, '#3F3790');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.2, H * 0.18, Math.max(W, H) * 0.5, 'rgba(130,130,255,.14)'); blob(W * 0.85, H * 0.8, Math.max(W, H) * 0.45, 'rgba(255,170,120,.10)');
    const rnd = mulberry32(59), n = Math.round(clamp(W * H / 2600, 80, 420));
    for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * H, r = rnd() < 0.07 ? 1.1 + rnd() * 0.7 : 0.4 + rnd() * 0.7; c.globalAlpha = 0.3 + rnd() * 0.6; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
  }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H * 1.05;
    if (wide) {   // 가로: 판을 가운데 세로로, 왼쪽 여백에 점수판, 콩이는 여백이 넉넉하면 왼쪽 아래

    state = 'result'; overAt = performance.now();
    isNew = score > 0 && setBest(KG.dkey(KEY, diffId), score);
    $('edScore').textContent = fmt(score); $('edMult').textContent = '×' + maxMult; $('edStar').textContent = starRows + '번';
    $('edTitle').textContent = quit ? '여기까지 했어요' : score >= 20000 ? '핀볼 달인이에요!' : '공을 다 썼어요';
    $('edText').textContent = score > 0 ? (bowls ? '밥그릇에 ' + bowls + '번 쏙 넣었어요. ' : '') + (orbits ? '뼈다귀 길을 ' + orbits + '바퀴 돌았어요.' : starRows ? '' : '별 다섯 개를 모두 맞히면 점수가 몇 배로 올라요.') : '날개로 공을 쳐 범퍼를 맞혀 봐요.';
    paintBest(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { if (state === 'play') { const p = plunger.on; clearInput(); if (p) plunger.p = 0; } });

  // ═══════ 입력: 화면 왼쪽 절반 = 왼쪽 날개, 오른쪽 절반 = 오른쪽 날개 (손가락마다 따로 — 둘을 함께 눌러도 된다) ═══════
  //   공이 발사로에서 기다릴 때 오른쪽을 누르면 날개 대신 발사대: 누른 채 아래로 끌수록(또는 오래 누를수록) 세게, 떼면 쏜다
  const ptrs = new Map();   // pointerId → { role: 'L'|'R'|'P' }
  const keys = { l: false, r: false, shL: false, shR: false };
  const holdL = () => keys.l || keys.shL || [...ptrs.values()].some(p => p.role === 'L');
  const holdR = () => keys.r || keys.shR || [...ptrs.values()].some(p => p.role === 'R');
  const flipSound = () => { tone(150, 0.05, 'square', 0.025); noise(0.04, 0.05, 1400, 700); };
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    const right = e.clientX >= W / 2;
    if (right && ballReady() && !plunger.on) { ptrs.set(e.pointerId, { role: 'P' }); plunger.on = true; plunger.src = e.pointerId; plunger.t0 = performance.now(); plunger.y0 = e.clientY; plunger.drag = 0; plunger.p = 0; tone(300, 0.05, 'sine', 0.03); return; }
    const was = right ? holdR() : holdL();
    ptrs.set(e.pointerId, { role: right ? 'R' : 'L' }); if (!was) flipSound();
  });
  fx.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p || p.role !== 'P' || !plunger.on) return;
    plunger.drag = clamp((e.clientY - plunger.y0) / Math.max(60, Math.min(H * 0.22, 150)), 0, 1);
  });
  function ptrUp(e, cancel) {
    const p = ptrs.get(e.pointerId); if (!p) return; ptrs.delete(e.pointerId);
    if (p.role === 'P' && plunger.on && plunger.src === e.pointerId) { if (cancel) { plunger.on = false; plunger.p = 0; } else launch(); }
  }
  fx.addEventListener('pointerup', e => ptrUp(e, false));
  fx.addEventListener('pointercancel', e => ptrUp(e, true));
  const isL = e => e.key === 'ArrowLeft' || e.key === 'z' || e.key === 'Z', isR = e => e.key === 'ArrowRight' || e.key === 'm' || e.key === 'M';
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (isL(e) || isR(e) || k === 'Shift') {
      if (state !== 'play') { if (state === 'pause' && k !== 'Shift') e.preventDefault(); return; }
      e.preventDefault(); if (KG.rulesOpen) return;
      const left = k === 'Shift' ? e.code !== 'ShiftRight' : isL(e), was = left ? holdL() : holdR();
      if (k === 'Shift') { if (left) keys.shL = true; else keys.shR = true; } else if (left) keys.l = true; else keys.r = true;
      if (!was) flipSound();
    } else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') {
      if (state === 'play') { e.preventDefault(); if (e.repeat || KG.rulesOpen || k === 'Enter') return; if (ballReady() && !plunger.on) { plunger.on = true; plunger.src = 'key'; plunger.t0 = performance.now(); plunger.drag = 0; plunger.p = 0; tone(300, 0.05, 'sine', 0.03); } return; }
      if (k === 'ArrowDown') return;
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'Shift') { if (e.code === 'ShiftRight') keys.shR = false; else keys.shL = false; if (!e.code) keys.shL = keys.shR = false; }
    else if (isL(e)) keys.l = false; else if (isR(e)) keys.r = false;
    else if ((k === ' ' || k === 'ArrowDown') && plunger.on && plunger.src === 'key') launch();
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; buildBoard(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; buildBoard();
  layout(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '날개로 공을 쳐서 오래 살려 두는 놀이예요.', items: [
    ['👆', '화면 왼쪽을 누르면 왼쪽 날개, 오른쪽은 오른쪽 날개. 두 손가락으로 함께 쳐도 돼요' + (KEYS_OK ? ' (← → · Z M · Shift).' : '.')],
    ['🎾', '처음엔 오른쪽을 누른 채 아래로 당겼다 놓아 공을 쏘아요' + (KEYS_OK ? ' (스페이스 길게).' : '.')],
    ['⭐', '별 다섯 개를 다 맞히면 보너스, 점수 배수도 올라가요.'],
    ['🐶', '공은 세 개. 쏜 직후 빠진 공은 ' + J(name, '이/가') + ' 한 번 물어다 줘요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, get state() { return state; }, get score() { return score; }, get mult() { return mult; }, get ballsLeft() { return ballsLeft; }, get diff() { return diffId; },
    get saveT() { return saveT; }, get guards() { return guards; }, get saveUsed() { return saveUsed; }, get starRows() { return starRows; }, get bowls() { return bowls; }, get orbits() { return orbits; }, get nudges() { return nudges; }, nudgeAt: () => nudgeAt.slice(-10),
    ball: () => ({ x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, hold: ball.hold, lost: ball.lost, ready: ballReady(), lane: inLane() }),
    flips: () => flips.map(f => ({ th: f.th, w: f.w, L: f.L })), held: () => [holdL(), holdR()], plunger: () => ({ on: plunger.on, p: plunger.p }),
    stars: () => stars.map(s => s.lit), segs: () => segs.length,
    field: () => ({ W, H, S, ox, oy, wide, KSZ, kx, ky, kSide, board: [ox, oy, FW * S, FH * S], hud: hud.getBoundingClientRect().toJSON() }),
    toScreen: (x, y) => ({ x: sx(x), y: sy(y) }),
    start, end, pause, resume, setBall: (x, y, vx, vy) => { Object.assign(ball, { x, y, vx: vx || 0, vy: vy || 0, hold: 0, lost: false }); launched = true; },
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
</body>
</html>
