<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 슈팅</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 슈팅: 밤하늘(bg) → 콩이(stage) → 날아다니는 것들(fx) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: default; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .hp { padding: 0 9px; gap: 3px; }
#hud .hp svg { width: 17px; height: 17px; display: block; transition: opacity .25s, transform .25s; }
#hud .hp svg.off { opacity: .22; transform: scale(.82); }
#hud .hp svg.pop { animation: hpPop .45s; }
@keyframes hpPop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
#hud .wv { color: #D5DBFF; font-weight: 500; }
#hud .sc { margin-left: auto; }
#hud .sc small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-left: 1px; }
#buffs { position: fixed; z-index: 10; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; pointer-events: none; }
#buffs .chip { position: relative; height: 26px; box-sizing: border-box; border-radius: 13px; padding: 0 10px 3px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #fff; overflow: hidden; }
#buffs .chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#buffs .chip u { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: 0 50%; border-radius: 2px; text-decoration: none; }
#banner { position: fixed; z-index: 11; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .28s, transform .28s; }
#banner.show { opacity: 1; transform: none; }
#banner b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.5px; color: #fff; text-shadow: 0 2px 14px rgba(10,14,50,.7); }
#banner span { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: #D5DBFF; text-shadow: 0 1px 8px rgba(10,14,50,.8); }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
/* 좁은 놀이판(가로 휴대폰): 점수판을 조금 더 촘촘하게 */
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
#hud.tight .hp { padding: 0 7px; gap: 2px; }
#hud.tight .hp svg { width: 15px; height: 15px; }
/* 아주 좁은 화면: 'Very Hard' 가 칸을 넘지 않게 */
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } }
/* 낮은 세로 화면(320×568 쯤): 기록 칸까지 뜨면 카드가 위 줄 단추에 닿으므로 조금 촘촘하게 */
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
/* 낮은 세로 화면: 규칙 안내가 한 화면에 들어오게 조금 촘촘하게 (가로 화면은 공통이 두 줄로 나눈다) */
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .how p + p { margin-top: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="hp" id="hudHp"></div>
  <div class="wv" id="hudWave">1단계</div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div id="buffs" aria-hidden="true"></div>
<div id="banner" role="status" aria-live="polite"><b></b><span></span></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 슈팅</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>좌우로 끌면</b> <span id="stMove"></span></p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2>별나라를 잘 지켰어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>도착한 단계<b id="edWave"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');

  // ═══════ 놀이판: 가로 360 단위로 고정, 세로(VH)는 화면에 맞춰 늘어난다 ═══════
  const FW = 360, RP = 440, KS = 138;        // 놀이판 폭 · 행성 반지름 · 콩이 그림 한 변 (모두 놀이판 단위)
  const KMIN = 46, KMAX = FW - 46;
  let W = 0, H = 0, DPR = 1, S = 1, FX = 0, PW = 360, VH = 700, GY = 600, TOPY = 60, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 };
  const bg = $('bg'), fx = $('fx'), ctx = fx.getContext('2d'), stage = $('stage');
  const FONT = getComputedStyle(document.body).fontFamily;

  const bar = topbar({ title: J(name, '의') + ' 슈팅', back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = J(name, '의') + ' 슈팅';
  $('stTitle').textContent = J(name, '의') + ' 슈팅';
  $('stLead').textContent = J(name, '이/가') + ' 사는 별나라에 무서운 것들이 내려와요.';
  $('stMove').textContent = J(name, '이/가') + ' 따라와요' + (matchMedia('(hover: hover) and (pointer: fine)').matches ? ' (← → 키도 돼요).' : '.');
  $('psText').textContent = J(name, '이/가') + ' 기다리고 있어요.';

  const K = kong(stage, 150);
  const HAS_REAR = K.has('rear');

  // ═══════ 상태 ═══════
  let state = 'ready';            // ready · play · pause · over · result
  let score = 0, wave = 0, hearts = 3, shownScore = -1;
  let kx = FW / 2, target = FW / 2, kv = 0, walkPh = 0;
  let inv = 0, hurtT = 0, barkPulse = 0, fireT = 0, shotN = 0, shake = 0, tAnim = 0, overT = 0;
  let rapid = 0, triple = 0, shield = false, shieldPop = 0;
  let queue = [], spawnT = 0, clearT = 0, bossLv = 0, killsSinceDrop = 0, lastBark = -99, lastSpawnX = 180, kills = 0;
  const enemies = [], bullets = [], shots = [], pows = [], parts = [], floats = [];
  const keys = { l: false, r: false };
  let god = false;   // 시험용: 하트가 줄지 않는다

  // ═══════ 난이도 표 (normal 이 기준 — 곱하는 값은 모두 1) ═══════
  //   hearts 시작 하트 · shield 이불 방패를 덮고 시작 · spd 내려오는 빠르기 · cnt 한 단계 마릿수 · gap 나오는 간격
  //   hp 체력 더하기(1 밑으로는 안 내려감) · tough 이 단계부터 체력 +1 · shot 적 탄 빠르기 · cd 적 탄 쏘는 간격 · puff 드라이어가 바람을 쏘기 시작하는 단계
  //   bossHp 대장 체력 · bossCd 대장이 쏘는 간격 · fan 대장 부채꼴 탄 수(첫 대장, 다음 대장) — 탄 사이 각도는 그대로라 틈은 늘 남는다
  //   drop 간식 확률 · pity 이만큼 쫓아내면 꼭 하나 · heart 하트가 나올 확률 · inv 맞은 뒤 무적 시간
  const DIFF = {
    easy:   { hearts: 3, shield: true,  spd: 0.80, cnt: 0.70, gap: 1.30, hp: -1, tough: 9, shot: 0.85, cd: 1.50, puff: 8, bossHp: 0.60, bossCd: 1.35, fan: [3, 3], drop: 0.20, pity: 6,  heart: 1.5, inv: 1.5 },
    normal: { hearts: 3, shield: false, spd: 1.00, cnt: 1.00, gap: 1.00, hp: 0,  tough: 9, shot: 1.00, cd: 1.00, puff: 6, bossHp: 1.00, bossCd: 1.00, fan: [3, 5], drop: 0.12, pity: 10, heart: 1.0, inv: 1.0 },
    hard:   { hearts: 3, shield: false, spd: 1.12, cnt: 1.20, gap: 0.85, hp: 0,  tough: 5, shot: 1.08, cd: 0.80, puff: 4, bossHp: 1.30, bossCd: 0.88, fan: [3, 5], drop: 0.09, pity: 13, heart: 0.8, inv: 0.9 },
    vhard:  { hearts: 2, shield: false, spd: 1.22, cnt: 1.35, gap: 0.75, hp: 0,  tough: 3, shot: 1.15, cd: 0.68, puff: 3, bossHp: 1.60, bossCd: 0.78, fan: [5, 5], drop: 0.07, pity: 16, heart: 0.7, inv: 0.8 }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // 대장이 머무는 높이: 체력 막대가 점수판 밑으로 들어가지 않게
  const bossHover = () => TOPY / S + Math.max(118, 38 / S + 76);
  const groundY = x => GY + RP - Math.sqrt(Math.max(1, RP * RP - (x - 180) * (x - 180)));
  const slope = x => Math.asin(clamp((x - 180) / RP, -0.9, 0.9));

  // ═══════ 그림 조각 (모두 가운데가 0,0) ═══════
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function heartPath(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.9); g.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.8, y - s * 1.15, x, y - s * 0.35); g.bezierCurveTo(x + s * 0.8, y - s * 1.15, x + s * 1.5, y - s * 0.1, x, y + s * 0.9); g.closePath(); }
  const PAL_VAC = { a: '#FF9A8F', b: '#F26A6A', dark: '#39407A', hose: '#6C74B8', win: '#FFE7E2', hub: '#AEB5EA' };
  const PAL_BOSS = { a: '#B7A6FF', b: '#7C68F0', dark: '#2C2F6B', hose: '#5A5FB0', win: '#EDE8FF', hub: '#B9BEF2' };
  function artVac(g, p) {
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = p.hose; g.lineWidth = 5.5; g.beginPath(); g.moveTo(-16, -6); g.bezierCurveTo(-34, -22, -42, 0, -27, 19); g.stroke();
    g.fillStyle = p.dark; rr(g, -39, 18, 24, 9, 4); g.fill();
    g.strokeStyle = p.dark; g.lineWidth = 4; g.beginPath(); g.moveTo(-6, -15); g.quadraticCurveTo(6, -29, 18, -13); g.stroke();
    const lg = g.createLinearGradient(0, -16, 0, 16); lg.addColorStop(0, p.a); lg.addColorStop(1, p.b);
    g.fillStyle = lg; rr(g, -20, -16, 46, 32, 15); g.fill();
    g.fillStyle = 'rgba(255,255,255,.3)'; rr(g, -11, -12, 26, 6, 3); g.fill();
    g.fillStyle = p.win; g.beginPath(); g.arc(-3, 3, 8, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(-5.5, 0.5, 2.6, 0, TAU); g.fill();
    g.fillStyle = p.dark; g.beginPath(); g.arc(14, 15, 8, 0, TAU); g.fill();
    g.fillStyle = p.hub; g.beginPath(); g.arc(14, 15, 3, 0, TAU); g.fill();
    g.fillStyle = '#FFE27A'; g.beginPath(); g.arc(17, -4, 2.4, 0, TAU); g.fill();
  }
  function artDryer(g) {
    g.lineCap = 'round';
    g.strokeStyle = '#8C93C9'; g.lineWidth = 2.4; g.beginPath(); g.moveTo(31, -22); g.quadraticCurveTo(40, -28, 33, -33); g.stroke();
    g.save(); g.translate(8, -7); g.rotate(-0.55); g.fillStyle = '#F1F3FF'; rr(g, 0, -6, 28, 12, 6); g.fill(); g.fillStyle = '#C5CBF0'; rr(g, 10, -2.5, 8, 5, 2.5); g.fill(); g.restore();
    const lg = g.createLinearGradient(-15, 0, 15, 0); lg.addColorStop(0, '#8BEBD6'); lg.addColorStop(1, '#3FC4AD');
    g.fillStyle = lg; rr(g, -15, -24, 30, 38, 14); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, -10, -17, 5, 18, 2.5); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.6;
    g.beginPath(); g.arc(0, -10, 6, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
    g.beginPath(); g.arc(0, -10, 10, Math.PI * 1.2, Math.PI * 1.8); g.stroke();
    g.fillStyle = '#2B9C90'; g.beginPath(); g.moveTo(-11, 12); g.lineTo(11, 12); g.lineTo(14, 24); g.lineTo(-14, 24); g.closePath(); g.fill();
    g.fillStyle = '#1B6F68'; rr(g, -13, 22, 26, 4.5, 2); g.fill();
  }
  function artCloud(g) {
    const lg = g.createLinearGradient(0, -26, 0, 16); lg.addColorStop(0, '#EEF0FF'); lg.addColorStop(1, '#9BA3E6');
    g.fillStyle = lg; g.beginPath();
    g.arc(-20, 2, 14, 0, TAU); g.arc(-4, -8, 18, 0, TAU); g.arc(16, -3, 15, 0, TAU); g.arc(27, 6, 10, 0, TAU); g.fill();
    rr(g, -33, 2, 69, 14, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(-9, -14, 6, 0, TAU); g.fill();
    g.fillStyle = 'rgba(72,78,160,.22)'; rr(g, -27, 10, 58, 6, 3); g.fill();
  }
  function artShower(g) {
    g.strokeStyle = '#C4D0E8'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(0, -6); g.lineTo(0, -14); g.quadraticCurveTo(0, -26, 14, -26); g.lineTo(29, -26); g.stroke();
    const lg = g.createLinearGradient(0, -10, 0, 10); lg.addColorStop(0, '#F6F9FF'); lg.addColorStop(1, '#B5C4E2');
    g.fillStyle = lg; g.beginPath(); g.moveTo(-25, 9); g.quadraticCurveTo(-23, -10, 0, -10); g.quadraticCurveTo(23, -10, 25, 9); g.closePath(); g.fill();
    g.fillStyle = '#74B4F7'; g.beginPath(); g.ellipse(0, 9, 25, 6.5, 0, 0, TAU); g.fill();
    g.fillStyle = '#E4F3FF'; for (const x of [-16, -8, 0, 8, 16]) { g.beginPath(); g.arc(x, 9 + (Math.abs(x) === 8 ? 1.6 : 0), 1.6, 0, TAU); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.6)'; rr(g, -14, -6, 14, 3.5, 1.7); g.fill();
  }
  const POW = {
    rapid: { col: '#FFC94D', label: '빨리 짖기', dur: 8 },
    triple: { col: '#5FB8FF', label: '세 갈래 짖기', dur: 8 },
    shield: { col: '#FF9DBD', label: '이불 방패', dur: 0 },
    heart: { col: '#FF7B95', label: '하트', dur: 0 }
  };
  function artPow(g, kind) {
    const col = POW[kind].col;
    const gl = g.createRadialGradient(0, 0, 8, 0, 0, 23); gl.addColorStop(0, col); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.globalAlpha = 0.45; g.fillStyle = gl; g.beginPath(); g.arc(0, 0, 23, 0, TAU); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(0, 0, 15, 0, TAU); g.fill();
    g.strokeStyle = col; g.lineWidth = 2.6; g.beginPath(); g.arc(0, 0, 13.7, 0, TAU); g.stroke();
    if (kind === 'rapid') {          // 뼈다귀 간식
      g.save(); g.rotate(-0.6); g.fillStyle = '#F2A93B'; rr(g, -6.5, -2.4, 13, 4.8, 2.4); g.fill();

    drawKong();
  }
  // 절전: 카드(시작·멈춤·결과)가 떠 있으면 상태가 바뀐 뒤 1초까지만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let idleSt = '', idleAt = 0, idleDrawAt = 0;
  function idleSkip(now, playing) {
    if (playing) { idleSt = ''; return false; }
    if (idleSt !== state) { idleSt = state; idleAt = now; }
    if (now - idleAt < 1000 || now - idleDrawAt >= 200) { idleDrawAt = now; return false; }
    return true;
  }
  window.addEventListener('resize', () => { idleSt = ''; });   // 회전·크기 바뀜: 다시 1초 동안 매 프레임
  document.addEventListener('visibilitychange', () => { idleSt = ''; });
  window.addEventListener('orientationchange', () => { idleSt = ''; });   // resize 없이 회전만 오는 기기: 늦게 도는 layout 까지 1초 안에 들게
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    tAnim += dt;
    if (state === 'play' || state === 'over') update(dt);
    if (idleSkip(now, state === 'play' || state === 'over')) return;
    draw();
  }

  // ═══════ 흐름 ═══════
  function reset() {
    score = 0; wave = 0; hearts = D.hearts; shownScore = -1; kx = target = FW / 2; kv = 0; inv = 0; hurtT = 0; fireT = 0.5; shake = 0; overT = 0;
    rapid = 0; triple = 0; shield = D.shield; shieldPop = 0; bossLv = 0; killsSinceDrop = 0; kills = 0; lastSpawnX = 180;
    enemies.length = bullets.length = shots.length = pows.length = parts.length = floats.length = 0;
    paintHearts(); paintScore(); paintBuffs();
  }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    reset(); state = 'play'; rb.hide();
    $('cardStart').hidden = $('cardEnd').hidden = $('cardPause').hidden = true; btnPause.hidden = false;
    KG.unlockAudio(); beginWave(1);
  }
  function pause() { if (state !== 'play') return; state = 'pause'; $('cardPause').hidden = false; keys.l = keys.r = false; drags.clear(); if (document.activeElement === btnPause) btnPause.blur(); }
  function resume() { if (state !== 'pause') return; state = 'play'; $('cardPause').hidden = true; }
  function gameOver() {
    if (state !== 'play') return;
    state = 'over'; overT = 0; hearts = Math.max(0, hearts); paintHearts(); btnPause.hidden = true; rapid = triple = 0; shield = false; paintBuffs(); pows.length = 0;
    banner('별나라를 잘 지켰어요', J(name, '은/는') + ' 이제 쉴게요', 2200);
    [523, 659, 784].forEach((f, i) => tone(f, 0.32, 'triangle', 0.055, 0.25 + i * 0.14));
  }
  function showResult() {
    if (state !== 'over') return;
    state = 'result';
    const isNew = score > 0 && setBest(KG.dkey('shoot', diffId), score);
    $('edScore').textContent = fmt(score); $('edWave').textContent = wave + '단계'; paintBest();
    $('edNew').hidden = !isNew;
    $('edText').textContent = kills > 0 ? '무서운 것들을 ' + fmt(kills) + '번 쫓아냈어요.' : J(name, '이랑/랑') + ' 잘 놀았어요.';
    $('cardEnd').hidden = false; rb.show(diffId); if (isNew) sfx('win');
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) start(); });
  $('btnAgain').addEventListener('click', start);
  $('btnResume').addEventListener('click', resume);
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { keys.l = keys.r = false; });
  window.addEventListener('pagehide', pause);

  // ═══════ 입력 ═══════
  const drags = new Map();   // 닿아 있는 손가락마다 마지막 x (둘째 손가락이 닿아도 먼저 끌던 손가락이 계속 듣게)
  const toField = cx => (cx - FX) / S;
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.pointerType === 'mouse') target = toField(e.clientX); else drags.set(e.pointerId, e.clientX);
    e.preventDefault();
  });
  fx.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse') { target = clamp(toField(e.clientX), KMIN, KMAX); return; }   // 마우스: 가리키는 곳으로
    if (!drags.has(e.pointerId)) return;
    target = clamp(target + (e.clientX - drags.get(e.pointerId)) / S * 1.25, KMIN, KMAX); drags.set(e.pointerId, e.clientX);       // 손가락: 끈 만큼 (손가락이 콩이를 가리지 않아도 됨)
  });
  const up = e => { drags.delete(e.pointerId); };
  fx.addEventListener('pointerup', up); fx.addEventListener('pointercancel', up);
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.l = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.r = true; e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }   // 누르고 있는 동안의 반복은 단추도 누르지 않게 (규칙 안내를 길게 눌러 닫아도 초점이 옮겨 간 「시작」이 눌리지 않는다)
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault();
      if (KG.rulesOpen) return;
      if (state === 'ready' || state === 'result') start(); else if (state === 'pause') resume(); else if (state === 'play' && k === ' ') pause();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => { const k = e.key; if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false; else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false; });

  // ═══════ 시작 ═══════
  layout(); paintHearts(); paintScore();
  // 난이도 고르기: 시작 카드·결과 카드에만 (고르면 그 난이도의 최고 기록을 보여 준다, 없으면 숨김)
  function paintBest() {
    const b = best(KG.dkey('shoot'));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    // 결과 카드는 방금 끝난 판(diffId)의 기록으로 고정 — 다음 판 난이도를 바꿔도 그 판 점수·'새 기록' 딱지와 어긋나지 않게. 다른 난이도를 골라 두었으면 어느 난이도 기록인지 밝힌다
    const e = best(KG.dkey('shoot', diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
  }
  $('stRec').parentNode.insertBefore(KG.diffPicker(null, paintBest), $('stRec'));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  // 결과 카드 바로 아래(가로 화면은 오른쪽)에 방금 판 난이도의 가족 순위 카드 (새 판·처음 화면에서 숨김)
  const rb = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'shoot');
  KG.startRank($('cardStart'), 'shoot');   // 시작 카드 아래에 고른 난이도의 가족 순위
  paintBest();
  // 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (공통이 sessionStorage 로 기억), 시작 카드의 「규칙 보기」 로 다시
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const RULES = { key: 'shoot', title: J(name, '의') + ' 슈팅', lead: J(name, '이/가') + ' 사는 별나라에 무서운 것들이 내려와요.', items: [
    ['👆', '화면을 좌우로 끌면 ' + J(name, '이/가') + ' 따라와요' + (KEYS_OK ? '(← → 키도 돼요).' : '.') + ' 짖는 건 알아서 해요.'],
    ['⭐', '무서운 것들을 쫓아내면 점수를 얻고, 떨어지는 간식을 받으면 힘이 세져요.'],
    ['💗', '무서운 것에 맞거나 별에 내려앉게 두면 하트가 줄고, 하트가 다 없어지면 끝나요.'],
    ['🎯', '시작하기 전에 난이도를 고를 수 있어요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get score() { return score; }, get wave() { return wave; }, get hearts() { return hearts; }, get kx() { return kx; },
    get buffs() { return { rapid, triple, shield }; }, get kills() { return kills; }, get diff() { return diffId; }, get D() { return D; },
    enemies, shots, pows, bullets,
    field: () => ({ FX, S, PW, VH, GY, W, H, wide, kongY: groundY(kx) }),
    start, pause, resume, end: () => { if (state === 'pause') resume(); if (state === 'play') { hearts = 0; paintHearts(); gameOver(); } },
    setWave: n => { enemies.length = shots.length = 0; beginWave(n); }, give: kind => take({ kind, x: kx, y: groundY(kx) - 40 }),
    moveTo: x => { target = clamp(x, KMIN, KMAX); }, set god(v) { god = !!v; }, get god() { return god; }, spawn, hurt,
    step: dt => { tAnim += dt; if (state === 'play' || state === 'over') { update(dt); drawKong(); } }   // 시험용: 화면 없이 빨리 돌리기
  };
})();
</script>
</body>
</html>
