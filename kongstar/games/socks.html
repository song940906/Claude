<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이는 양말도둑</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이는 양말도둑: 밤 거실·러그·방석·바구니·양말(cv, 누름을 받는다) → 콩이(stage) → 끄는 양말·말린 양말·문 양말·글자(fx) → 점수판 순서로 겹친다 */
#cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; touch-action: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; pointer-events: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud svg { width: 16px; height: 16px; display: block; }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .tm.warn { background: rgba(229,72,77,.72); }
#hud .tm.warn.blink { animation: tmBlink .8s infinite; }
#hud .tm.hit { animation: tmHit .45s; }
@keyframes tmBlink { 50% { background: rgba(18,22,52,.62); } }
@keyframes tmHit { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="cv" aria-label="양말이 흩어진 거실 러그"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="tm" id="hudTm"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8.8" r="5.6"/><path d="M8 5.8v3.2l2 1.3M6.3 1.8h3.4"/></svg><span id="hudTime">1:00</span></div>
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>켤레</small></div>
  <div class="lv"><small>더미</small><span id="hudDump">1</span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이는 양말도둑</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>같은 양말 두 짝</b>을 차례로 누르면 돌돌 말아 바구니로!</p>
      <p id="stThief"></p>
      <p id="stKeys" hidden><b>방향키</b> 고르기 · <b>스페이스</b> 집기 · <b>K</b> 콩이 · <b>B</b> 방석</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">시간이 다 됐어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>켤레</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>치운 더미<b id="edDump"></b></span><span>되찾은 양말<b id="edSave"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const KEY = 'socks', TITLE = J(name, '은/는') + ' 양말도둑';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   t0 처음 시간(초) · p0 첫 더미 켤레 수(더미마다 +1, pMax 까지) · pen 틀린 짝 벌칙(초) · bonus 더미를 다 치웠을 때 늘어나는 시간(더미마다 bdec 씩 줄어 bmin 까지 — 빨리 치워도 판은 언젠가 끝난다)
  //   sim 비슷한 양말(점 3개↔4개·비슷한 색)이 섞일 확률 · ov 겹쳐 놓이는 비율(켤레 수에 곱함) · rot 양말이 돌아가 놓이는 정도(rad)
  //   th 콩이가 다음에 훔치러 오기까지(초, 범위) · th0 판 시작 뒤 첫 도둑질까지 · spd 콩이 빠르기(양말 크기/초) · roam 물고 돌아다니는 시간 · back 방석 밑 양말이 저절로 나오기까지
  const DIFF = {
    easy:   { t0: 100, p0: 4, pMax: 6,  pen: 0, bonus: 10, bdec: 1, bmin: 3, sim: 0,    ov: 0,    rot: 0.35, th: [24, 32], th0: 20, spd: 1.4, roam: 8, back: 5, praise: [60, 25] },
    normal: { t0: 80,  p0: 5, pMax: 8,  pen: 2, bonus: 7,  bdec: 1, bmin: 2,  sim: 0.25, ov: 0,    rot: 0.7,  th: [14, 20], th0: 12, spd: 2.2, roam: 6, back: 7, praise: [40, 15] },
    hard:   { t0: 75,  p0: 6, pMax: 10, pen: 2, bonus: 6,  bdec: 1, bmin: 2,  sim: 0.5,  ov: 0.25, rot: 0.8,  th: [10, 14], th0: 9,  spd: 3.0, roam: 5, back: 8, praise: [32, 12] },
    vhard:  { t0: 70,  p0: 8, pMax: 12, pen: 2, bonus: 5,  bdec: 1, bmin: 1,  sim: 0.75, ov: 0.4,  rot: 0.9,  th: [7, 10],  th0: 6,  spd: 3.8, roam: 4, back: 9, praise: [26, 10] }
  };
  let diffId = 'normal', D = DIFF.normal;
  const dumpPairs = d => Math.min(D.pMax, D.p0 + d - 1);
  const dumpBonus = d => Math.max(D.bmin, D.bonus - (d - 1) * D.bdec);

  // ═══════ 양말 무늬: 색이 비슷해도 무늬(종류·개수·뒤꿈치 덧댐)로 늘 구분된다 ═══════
  const COLS = {
    pink:  { f: '#FFB9CB', d: '#E2557C' }, coral: { f: '#FFB4A2', d: '#DB5A38' }, rose: { f: '#F6B0DD', d: '#C24A98' },
    peach: { f: '#FFCFA3', d: '#E07D25' }, lemon: { f: '#FFEB9E', d: '#C79400' }, mint: { f: '#B8EDD2', d: '#26975E' },
    aqua:  { f: '#AEEAEA', d: '#17969C' }, sky:   { f: '#B9DAFF', d: '#3A7FD4' }, lilac: { f: '#D8CBFF', d: '#7957D6' },
    cream: { f: '#F3EDE3', d: '#86735C' }
  };
  const COLK = Object.keys(COLS);
  const SIMC = { pink: ['coral', 'rose'], coral: ['pink', 'peach'], rose: ['pink', 'lilac'], peach: ['coral', 'lemon'], lemon: ['peach', 'cream'], mint: ['aqua'], aqua: ['mint', 'sky'], sky: ['aqua', 'lilac'], lilac: ['sky', 'rose'], cream: ['lemon'] };
  const PATS = { plain: [0], stripe: [2, 3, 4], dots: [3, 4, 5], heart: [1, 2, 3], star: [1, 2, 3], paw: [1, 2], check: [0], zig: [1, 2] };
  const PATK = Object.keys(PATS);
  const sigOf = k => k.pat + k.n + (k.heel ? 'h' : '');   // 색을 뺀 생김새 — 한 더미 안에서 겹치지 않는다

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '거실에 흩어진 양말을 짝 맞춰 정리해요. 양말도둑 ' + J(name, '을/를') + ' 조심!';
  { const p = $('stThief'), b = document.createElement('b'); b.textContent = '톡'; p.append('양말 문 ' + J(name, '을/를') + ' ', b, ' 누르면 떨어뜨려요.'); }
  if (KEYS_OK) $('stKeys').hidden = false;
  const cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 100);

  // ═══════ 상태 ═══════
  let state = 'ready', phase = 'play';      // state: ready · play · pause · over · result   phase: play · clear(더미를 다 치우고 다음 더미를 기다림)
  let socks = [], kinds = [], grid = { c: 3, r: 3 }, hidden = [], balls = [], floats = [], parts = [], recent = [];
  let score = 0, dump = 1, timeLeft = 60, rescued = 0, mistakes = 0, cleared = 0, clearT = 0, overT = 0, overAt = 0, isNew = false, quit = false, zTop = 0, nid = 1, lastTick = 99;
  let sel = null, drag = null, cursor = null, kbMode = false, hintOn = true, basketBump = 0, cushBump = 0, tAnim = 0, lastCall = -99, lastGrowl = -99, lastLick = -99;
  let W = 0, H = 0, DPR = 1, SAF = { t: 0, b: 0, l: 0, r: 0 }, wide = false, F = { x: 0, y: 0, w: 1, h: 1 }, S = 60, CELL = 70, KSZ = 100;
  let gridN = 0, hintY = 0;
  const HUD_H = 32, HINT_GAP = 32;   // 점수판 높이, 점수판과 러그 사이 틈(안내 말풍선 자리)
  let cush = { x: 0, y: 0, rx: 40, ry: 16 },bask = { x: 0, y: 0, w: 90, h: 60 }, home = { x: 0, y: 0 };
  // 콩이: st = home(방석 위) · come(양말로 감) · grab(물기) · roam(물고 돌아다님) · stash(방석으로) · hide(방석 밑에 숨기는 중) · scold(혼남) · back(빈입으로 돌아감)
  const th = { st: 'home', t: 10, target: null, sock: null, x: 0, y: 0, wx: 0, wy: 0, facing: 1, roamT: 0, stT: 0, ph: 0, mood: 'idle', moodT: 0 };
  const sprites = {};
  let bgCache = null;

  const FALL = 0.45;
  const px = s => F.x + s.u * F.w, py = s => F.y + s.v * F.h;
  const byId = id => socks.find(s => s.id === id) || null;
  const covered = s => s.under != null && socks.some(t => t.id === s.under);
  const landed = s => s.appear >= FALL && !s.fly;
  const selectable = s => landed(s) && !covered(s) && !(drag && drag.id === s.id && drag.moved);

  // ═══════ 화면 맞추기 ═══════
  function chooseGrid(n) {
    let b = null;
    for (let c = 1; c <= 10; c++) { const r = Math.ceil(n / c), cell = Math.min(F.w / c, F.h / r), sc = cell - (c * r - n) * 0.8; if (!b || sc > b.sc) b = { c, r, sc }; }
    return { c: b.c, r: b.r };
  }
  function sizeSocks() { CELL = Math.min(F.w / grid.c, F.h / grid.r); S = Math.min(CELL * 0.86, 132); buildSprites(); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function buildBg() {
    const cn = bgCache || (bgCache = document.createElement('canvas')); cn.width = Math.round(W * DPR); cn.height = Math.round(H * DPR);
    const c = cn.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.6, '#1B2060'); lg.addColorStop(1, '#2F2C78');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.8, H * 0.1, Math.max(W, H) * 0.45, 'rgba(255,214,150,.10)'); blob(W * 0.15, H * 0.9, Math.max(W, H) * 0.5, 'rgba(140,140,255,.12)');
    const rnd = mulberry32(53), n = Math.round(clamp(W * H / 5000, 40, 200));
    for (let i = 0; i < n; i++) { c.globalAlpha = 0.25 + rnd() * 0.5; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(rnd() * W, rnd() * H, 0.4 + rnd() * 0.8, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
    // 러그: 양말이 놓이는 곳. 둥근 모서리 + 바느질 선 + 옅은 하트 무늬
    const m = 8, x = F.x - m, y = F.y - m, w = F.w + m * 2, h = F.h + m * 2, rad = Math.min(26, w * 0.08);
    c.save(); c.shadowColor = 'rgba(4,6,24,.45)'; c.shadowBlur = 18; c.shadowOffsetY = 6; c.fillStyle = '#353C86'; rr(c, x, y, w, h, rad); c.fill(); c.restore();
    const rg2 = c.createLinearGradient(0, y, 0, y + h); rg2.addColorStop(0, '#3D4594'); rg2.addColorStop(1, '#333A83'); c.fillStyle = rg2; rr(c, x, y, w, h, rad); c.fill();
    c.save(); rr(c, x, y, w, h, rad); c.clip();
    c.fillStyle = 'rgba(255,255,255,.045)'; const st = 34;
    for (let yy = y + 14; yy < y + h; yy += st) for (let xx = x + 14 + ((yy - y) / st % 2 ? st / 2 : 0); xx < x + w; xx += st) heartAt(c, xx, yy, 5);
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1.5; c.setLineDash([5, 5]); rr(c, x + 6, y + 6, w - 12, h - 12, Math.max(4, rad - 6)); c.stroke(); c.setLineDash([]);
  }
  function heartAt(c, x, y, s) { c.beginPath(); c.moveTo(x, y + s * 0.9); c.bezierCurveTo(x - s * 1.4, y, x - s * 0.9, y - s * 1.1, x, y - s * 0.35); c.bezierCurveTo(x + s * 0.9, y - s * 1.1, x + s * 1.4, y, x, y + s * 0.9); c.fill(); }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H * 1.1;
    if (wide) {   // 가로: 가운데 러그, 왼쪽 방석(콩이), 오른쪽 바구니
      const titled = W >= 760, side = clamp(W * 0.19, 96, 230), top = SAF.t + (titled ? 62 : 16) + HUD_H + HINT_GAP;

    } else if (st === 'scold') {
      setPose('sit'); K.render({ t, eyes: 'closed', mouth: 'closed', earLift: -16, tailAmp: 0, nod: 0.8, squash: 0.2, tilt: rm ? -6 : Math.sin(th.stT * 10) * 5 - 4, look: [0, 0.6] });
    } else if (st === 'hide') {
      setPose('lie'); K.render({ t, eyes: 'happy', mouth: 'closed', blush: 1, tailAmp: 26, tailRate: 6, earLift: 4 });
    } else {   // 방석 위
      const won = state === 'result' && score > 0, m = th.mood, sad = state === 'over' && !quit;
      let look = [0, -0.2];
      const tgt = sel != null ? byId(sel) : kbMode && cursor != null ? byId(cursor) : null;
      if (tgt) { const hd = K.head(); look = [clamp((px(tgt) - hd.x) / 160, -1, 1), clamp((py(tgt) - hd.y) / 160, -1, 1)]; }
      if ((m === 'cheer' || won) && K.has('wave')) setPose('wave'); else setPose('sit');
      const hop = rm ? 0 : m === 'happy' ? Math.sin(clamp(th.moodT / 0.9, 0, 1) * Math.PI) * 26 : m === 'cheer' ? Math.abs(Math.sin(th.moodT * 7)) * 30 : 0;
      K.render({ t, hop, look: m === 'oops' || sad ? [0, 0.6] : look,
        eyes: m === 'oops' || sad ? 'closed' : m === 'happy' || m === 'cheer' || m === 'smug' || won ? 'happy' : 'open',
        mouth: m === 'oops' || sad ? 'closed' : 'open', blush: m === 'happy' || m === 'cheer' || m === 'smug' || won ? 1 : 0,
        earLift: m === 'oops' || sad ? -12 : m === 'happy' || m === 'cheer' ? 7 : 0, nod: m === 'oops' ? 0.6 : 0,
        tilt: m === 'tilt' ? 12 : m === 'smug' ? -6 : Math.sin(t * 1.2) * 3,
        tailAmp: m === 'oops' || sad ? 3 : m === 'happy' || m === 'cheer' || m === 'smug' || won ? 26 : 10, tailRate: m === 'happy' || m === 'cheer' || won ? 4.5 : 2 });
    }
    K.place(th.x, th.y, 1);
  }
  let last = 0;
  // 절전: 놀이 중이 아니면(시작·멈춤·결과 카드) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let calmKey = '', calmAt = 0, drawnAt = -1e9;
  function calmSkip(now) {
    const key = state + '|' + W + 'x' + H;
    if (key !== calmKey) { calmKey = key; calmAt = now; }
    if ((state !== 'ready' && state !== 'pause' && state !== 'result') || now - calmAt < 1000 || now - drawnAt >= 200) { drawnAt = now; return false; }
    return true;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (calmSkip(now)) return;
    draw();
  }

  // ═══════ 점수판 ═══════
  const fmtT = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function paintTime() {
    $('hudTime').textContent = fmtT(timeLeft);
    const e = $('hudTm'), w = state !== 'ready' && timeLeft <= 10; e.classList.toggle('warn', w); e.classList.toggle('blink', w && !reduceMotion);
  }
  function paintHud() { $('hudScore').textContent = score; $('hudDump').textContent = dump; paintTime(); }

  // ═══════ 시작·멈춤·끝 ═══════
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd']) $(k).hidden = k !== id; if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  function resetThief() { th.st = 'home'; th.t = D.th0; th.sock = null; th.target = null; th.x = home.x; th.y = home.y; th.mood = 'idle'; th.moodT = 0; th.facing = 1; }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    score = 0; dump = 1; rescued = 0; mistakes = 0; cleared = 0; timeLeft = D.t0; quit = false; isNew = false; lastTick = 99; hintOn = true;
    hidden = []; balls = []; floats = []; parts = []; recent = []; sel = null; drag = null; cursor = null;
    resetThief(); newDump(true); state = 'play'; phase = 'play'; paintHud();
    showCard(null); btnPause.hidden = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    KG.unlockAudio(); tone(659, 0.1, 'triangle', 0.05); tone(880, 0.18, 'triangle', 0.05, 0.1);
  }
  function pause() {
    if (state !== 'play') return; state = 'pause'; drag = null;
    $('psText').textContent = score + '켤레 정리했어요. 남은 시간 ' + fmtT(timeLeft) + '. ' + J(name, '이/가') + ' 기다리고 있어요.';
    showCard('cardPause', 'btnResume'); if (document.activeElement === btnPause) btnPause.blur();
  }
  function resume() { if (state !== 'pause') return; state = 'play'; showCard(null); last = performance.now(); }
  function timeUp() {
    if (state !== 'play') return;
    state = 'over'; overT = 1.3; btnPause.hidden = true; drag = null; sel = null;
    addFloat(F.x + F.w / 2, F.y + F.h * 0.45, '시간 끝!', '#FFE08A', true); sfx('lose');
    if (th.sock) { th.st = 'stash'; }
  }
  function end() {
    if (state === 'pause') { state = 'play'; showCard(null); }
    if (state !== 'play') return;
    quit = true; state = 'over'; overT = 0.3; btnPause.hidden = true; drag = null; sel = null;
  }
  function showResult() {
    if (state !== 'over') return;
    state = 'result'; overAt = performance.now();
    if (th.sock) { hidden.push({ sock: th.sock, t: 0 }); th.sock = null; }
    th.st = 'home'; th.x = home.x; th.y = home.y; th.mood = 'idle';
    isNew = score > 0 && setBest(KG.dkey(KEY, diffId), score);
    $('edScore').textContent = score; $('edDump').textContent = cleared + '개'; $('edSave').textContent = rescued + '짝';
    $('edTitle').textContent = quit ? '여기까지 했어요' : score >= D.praise[0] ? '빨래 정리 달인이에요!' : score >= D.praise[1] ? '뽀송하게 정리했어요!' : '시간이 다 됐어요';
    if (!quit && score >= D.praise[0] && KG.master) KG.master('socks');   // 업적 「게임 달인」 (11-27)
    $('edText').textContent = score > 0 ? '양말 ' + score + '켤레를 바구니에 담았어요.' + (rescued ? ' ' + name + '에게서 ' + rescued + '짝을 되찾았어요.' : '') : '같은 양말 두 짝을 차례로 눌러 보세요.';
    paintBest(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
    if (!quit && score > 0) { const at = overAt; setTimeout(() => { if (state === 'result' && overAt === at) KG.lick(0.9, 0); }, isNew ? 2400 : 400); }   // 11-28 결과 기쁨에 할짝 (신기록이면 공통이 짖는 소리 뒤로 미룬다). 그 사이 다시 하기를 누르면 내지 않는다
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { drag = null; });

  // ═══════ 입력: 누르기(두 짝 차례로) · 끌어 놓기(한 짝을 다른 짝 위로) · 콩이·방석 누르기 ═══════
  function pressAt(x, y) {   // 손가락이 닿은 순간: 무엇을 눌렀는지
    if (thiefActive() && kongHit(x, y)) return { type: 'kong' };
    const s = topAt(x, y); if (s) return { type: 'sock', s };
    if (cushHit(x, y) || (th.st === 'home' && kongHit(x, y)) || th.st === 'hide' && kongHit(x, y)) return { type: 'cush' };
    return { type: 'none' };
  }
  function tapAt(x, y) {   // 시험용: 한 번 톡
    if (state !== 'play') return null;
    const p = pressAt(x, y);
    if (p.type === 'kong') tapKong(); else if (p.type === 'sock') tapSock(p.s); else if (p.type === 'cush') tapCushion(); else if (sel != null) sel = null;
    return p.type;
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    let p = null;
    if (drag) {   // 두 번째 손가락
      if (e.pointerId === drag.pid) return;
      e.preventDefault();
      if (drag.moved) {   // 끄는 중에는 콩이·방석 누르기만 받는다
        p = pressAt(e.clientX, e.clientY);
        if (p.type === 'kong') tapKong(); else if (p.type === 'cush') tapCushion();
        return;
      }
      // 아직 끌지 않은 첫 손가락은 '톡'으로 처리하고, 두 번째 손가락을 평소처럼 받는다 (두 짝을 두 손가락으로 함께 눌러도 짝이 맞는다)
      const d = drag; drag = null; try { cv.releasePointerCapture(d.pid); } catch (err) {}
      const s0 = byId(d.id); if (s0) tapSock(s0);
      if (state !== 'play') return;
    }
    e.preventDefault(); kbMode = false;
    p = pressAt(e.clientX, e.clientY);
    if (p.type === 'kong') { tapKong(); return; }
    if (p.type === 'cush') { tapCushion(); return; }
    if (p.type === 'none') { if (sel != null) { sel = null; tone(440, 0.05, 'sine', 0.03); } return; }
    if (covered(p.s)) { tapSock(p.s); return; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { id: p.s.id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false, ox: px(p.s) - e.clientX, oy: py(p.s) - e.clientY };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (state !== 'play') { drag = null; return; }
    // 손가락 바로 위쪽에 양말이 보이게 (손가락이 양말을 가리지 않게)
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 10) { drag.moved = true; const s = byId(drag.id); if (s && sel === s.id) sel = null; sfx('flip'); }
    drag.x = e.clientX; drag.y = e.clientY - (e.pointerType === 'touch' ? S * 0.45 : 0);
  });
  cv.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    const s = byId(d.id); if (!s || state !== 'play') return;
    if (!d.moved) { tapSock(s); return; }
    if (!landed(s)) return;
    const tgt = topAt(d.x, d.y, s.id) || topAt(e.clientX, e.clientY, s.id);
    if (tgt && !covered(tgt)) { sel = null; tryPair(s, tgt); return; }
    if (tgt && covered(tgt)) { tgt.shake = 0.3; addFloat(px(tgt), py(tgt) - S * 0.5, '위의 양말부터!', '#FFE6A8'); }
    for (const t of socks) if (t.under === s.id) t.under = null;   // 옮긴 양말 밑에 깔려 있던 양말은 이제 자유
    moveTo(s, d.x, d.y); s.z = ++zTop; tone(380, 0.05, 'sine', 0.04);
  });
  cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) drag = null; });
  // 키보드: 방향키로 양말 고르기(흰 점선 고리), 스페이스·Enter 로 집기, K 콩이, B 방석
  function moveCursor(dx, dy) {
    const list = socks.filter(landed); if (!list.length) return;
    const cur = cursor != null ? byId(cursor) : null;
    if (!cur) { list.sort((a, b) => (py(a) + px(a) * 0.5) - (py(b) + px(b) * 0.5)); cursor = list[0].id; return; }
    let bestS = null, bc = 1e9;
    for (const s of list) {
      if (s === cur) continue; const vx = px(s) - px(cur), vy = py(s) - py(cur), along = vx * dx + vy * dy; if (along <= 4) continue;
      const cost = along + Math.abs(vx * dy - vy * dx) * 2.2; if (cost < bc) { bc = cost; bestS = s; }
    }
    if (bestS) { cursor = bestS.id; tone(820, 0.03, 'sine', 0.025); }
  }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); return; }
    if (state === 'play') {
      if (k.startsWith('Arrow')) { e.preventDefault(); kbMode = true; moveCursor(k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0); return; }
      if (k === ' ' || k === 'Enter') { e.preventDefault(); if (e.repeat || KG.rulesOpen) return; kbMode = true; if (cursor == null) { moveCursor(0, 0); return; } const s = byId(cursor); if (s && landed(s)) tapSock(s); else cursor = null; return; }
      if (k === 'k' || k === 'K') { e.preventDefault(); if (!e.repeat && !tapKong()) tapCushion(); return; }
      if (k === 'b' || k === 'B') { e.preventDefault(); if (!e.repeat) tapCushion(); return; }
      return;
    }
    if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = b + '켤레';
    const e2 = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e2 > 0); $('edBest').textContent = e2 + '켤레';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; diffId = KG.diff(); timeLeft = D.t0; newDump(true); paintHud(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; timeLeft = D.t0;
  layout(); resetThief(); newDump(true); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '거실에 흩어진 양말을 짝 맞춰 바구니에 담는 놀이예요.', items: [
    ['🧦', '같은 양말 두 짝을 차례로 누르거나, 한 짝을 끌어 다른 짝 위에 놓으면 한 켤레 정리!' + (KEYS_OK ? ' (방향키·스페이스)' : '')],
    ['⏱️', '시간 안에 많이 정리해요. 틀린 짝을 고르면 2초가 줄어요(Easy 는 그대로). 겹친 양말은 위의 것부터.'],
    ['🐶', J(name, '이/가') + ' 양말을 물고 도망가면 톡 눌러 되찾아요. 방석 밑에 숨기면 방석을 눌러요.'],
    ['🧺', '바닥을 다 치우면 새 빨래 더미가 쏟아지고 시간이 조금 늘어요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get dump() { return dump; }, get timeLeft() { return timeLeft; },
    get rescued() { return rescued; }, get mistakes() { return mistakes; }, get cleared() { return cleared; }, get diff() { return diffId; }, get sel() { return sel; },
    get thief() { return { st: th.st, has: !!th.sock, x: th.x, y: th.y - KSZ * 0.3, t: th.t }; }, get hidden() { return hidden.length; },
    socks: () => socks.map(s => ({ id: s.id, k: s.k, x: px(s), y: py(s), free: selectable(s), covered: covered(s), landed: landed(s), z: s.z })),
    kinds: () => kinds.map(k => Object.assign({}, k)), sigOf,
    field: () => ({ W, H, S, CELL, KSZ, F: Object.assign({}, F), grid: Object.assign({}, grid), cush: Object.assign({}, cush), bask: Object.assign({}, bask), home: Object.assign({}, home), hud: hud.getBoundingClientRect().toJSON() }),
    tapAt, tapKong, tapCushion, tapSock: id => { const s = byId(id); if (s && state === 'play') tapSock(s); },
    setTime: v => { timeLeft = v; }, forceThief: () => { th.t = 0; if (th.st === 'scold' || th.st === 'back') th.st = 'home'; },
    start, end, pause, resume,
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
