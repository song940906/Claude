<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이는 계량천재</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이는 계량천재: 밤하늘·탁자(bg) → 콩이(stage) → 발판·그릇·우유(cv) → 병·우유 줄기·눈금·글자(fx) 순서로 겹친다.
   그릇은 유리라 콩이 앞에 서도 비쳐 보인다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
#cv { z-index: 2; pointer-events: none; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .hp { gap: 3px; }
#hud .hp i { font-style: normal; font-size: 15px; line-height: 1; color: #FF8FA3; transition: opacity .2s, transform .2s; }
#hud .hp i.off { opacity: .22; transform: scale(.8); }
#hud .sc.bump, #hud .hp.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#goal { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 24px - var(--sal) - var(--sar)); box-sizing: border-box; height: 34px; border-radius: 17px; padding: 0 14px; background: rgba(255,255,255,.94); color: var(--ink); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.22); font-variant-numeric: tabular-nums; }
#goal b { font-weight: 800; color: #1F8F5F; }
#goal .now b { color: var(--pri); }
#goal .bt { color: var(--sub); font-weight: 500; font-size: 13px; }
#goal .sep { width: 1px; height: 14px; background: var(--line); flex: none; }
#goal.res b { color: var(--ink); }
#goal.res.ok b.v { color: #1F8F5F; }
#goal.res.bad b.v { color: #D9480F; }
#goal span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } #goal { padding: 0 11px; gap: 6px; font-size: 13px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys, #stDiffNote { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="cv"></canvas>
<canvas id="fx" aria-label="누르고 있으면 우유가 따라지는 그릇"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>잔</small></div>
  <div class="hp" id="hudHp"><i>♥</i><i>♥</i><i>♥</i></div>
  <div class="lv"><span id="hudLv">1</span><small>단계</small></div>
</div>
<div id="goal" aria-live="polite" hidden></div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이는 계량천재</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>화면을 꾹 누르고 있으면</b> 우유가 나오고, <b>떼면</b> 멈춰요.</p>
      <p id="stDiffNote">Hard 는 목표선이 잠깐만, Very Hard 는 눈금 숫자로만 보여요.</p>
      <p id="stKeys" hidden><b>스페이스</b>를 누르고 있어도 돼요.</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">우유를 다 따랐어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>잔</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>계량천재<b id="edPerf"></b></span><span>최고 콤보<b id="edCombo"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'pour', TITLE = J(name, '은/는') + ' 계량천재';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 흐름 상수 ═══════
  const HEARTS = 3, LV_EVERY = 4, PERF = 0.3;             // 하트 수 · 몇 잔마다 한 단계 · 허용 띠의 몇 % 안이면 「계량천재!」
  const RAMP = 0.28, TAIL_T = 0.28, TAP_MIN = 0.08;       // 병을 다 기울이는 시간 · 뗀 뒤 흘러내린 우유가 다 떨어지는 시간 · 이보다 짧게 누르면 없던 일
  const ENTER_T = 0.55, JUDGE_OK = 1.25, JUDGE_BAD = 1.75; // 그릇이 들어오는 시간 · 판정 보여 주는 시간(성공·실패)
  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   q 1단계 흐름(ml/초) · tol 허용 띠 반폭(그릇 용량의 비율) · tolMin 단계가 올라도 이 아래로는 안 좁아짐 · win 띠를 지나는 데 걸리는 시간이 이보다 짧아지지 않게(초, 가장 빠른 흐름 기준)
  //   tail 뗀 뒤 흘러내리는 양(뗄 때 흐름 × 초, 병마다 배율이 붙는다) · wob0/wobL/wobMax 흐름 출렁임(1단계·단계마다 더함·최대, 흐름의 비율)
  //   band 목표선: 'on' 늘 보임 · 'flash' 잔마다 flash 초만 보였다 사라짐 · 'none' 눈금 숫자로만 · live 따르는 동안 지금 양(ml)을 보여 줌 · step Very Hard 목표는 눈금 칸 단위
  //   qUp/qMax 단계마다 흐름이 빨라지는 비율·최대 배율 · late 12단계 뒤로도 아주 천천히 계속 좁아짐(언젠가는 끝나는 판, 이 배율까지 — Normal 은 Hard·Very Hard 보다 빡빡해지지 않게)
  const DIFF = {
    easy:   { q: 55,  tol: 0.075, tolMin: 0.042, win: 0.4,  tail: 0.012, wob0: 0,    wobL: 0,    wobMax: 0,    band: 'on',    live: true,  qUp: 0.04, qMax: 1.4, late: 0.6 },
    normal: { q: 80,  tol: 0.05,  tolMin: 0.024, win: 0.15, tail: 0.055, wob0: 0,    wobL: 0.03, wobMax: 0.15, band: 'on',    live: true,  qUp: 0.05, qMax: 1.7, late: 0.85 },
    hard:   { q: 100, tol: 0.038, tolMin: 0.024, win: 0.15, tail: 0.085, wob0: 0.06, wobL: 0.03, wobMax: 0.22, band: 'flash', live: false, qUp: 0.05, qMax: 1.4, flash: 1.8 },
    vhard:  { q: 115, tol: 0.03,  tolMin: 0.02,  win: 0.11, tail: 0.10,  wob0: 0.1,  wobL: 0.03, wobMax: 0.28, band: 'none',  live: false, qUp: 0.05, qMax: 1.4, step: true }
  };
  const TOL_PX = 5;   // 그릇이 작은 화면(가로 휴대폰)에서도 허용 띠가 위아래 이 px 보다 얇아지지 않게
  let diffId = 'normal', D = DIFF.normal;
  const lvLate = L => D.late && L > 12 ? Math.max(D.late, Math.pow(0.97, L - 12)) : 1;
  const lvTol = L => Math.max(D.tolMin * lvLate(L), D.tol * Math.pow(0.93, L - 1));
  const lvQ = L => D.q * Math.min(D.qMax, 1 + D.qUp * (L - 1));
  const lvWob = L => L === 1 && !D.wob0 ? 0 : Math.min(D.wobMax, D.wob0 + D.wobL * (L - 1));
  const lvFlash = L => Math.max(0.8, (D.flash || 0) - 0.1 * (L - 1));

  // ═══════ 병: rate 흐름 배율 · tail 흘러내림 배율 · size 그림 크기 ═══════
  const BOTTLES = [
    { id: 'baby', name: '아기 젖병', rate: 0.85, tail: 0.7,  size: 0.9,  col: '#FFB8C6', drops: 1 },
    { id: 'milk', name: '우유병',    rate: 1.0,  tail: 1.0,  size: 1.0,  col: '#A9D8FF', drops: 2 },
    { id: 'big',  name: '큰 우유병', rate: 1.15, tail: 1.35, size: 1.08, col: '#FFD98A', drops: 3 }
  ];
  // ═══════ 그릇: 옆에서 본 모양. 단위 u — 폭은 -1~1, 높이는 0(바닥)~Hs(입구). 수위는 높이마다 단면적을 쌓은 실제 부피로 계산한다
  //   round: 돌려 만든 그릇(단면 = 원, 넓이 π·(폭/2)²) · 아니면 납작한 그릇(넓이 = 폭 × 깊이) · pour 우유 줄기가 떨어지는 x
  const SHAPES = {
    cup:  { name: '원통 컵',     Hs: 2.25, cap: 300, col: '#9CC9F5', round: true, pour: -0.3,
            hw: Y => { const r = 0.2, w = 0.78; return Y < r ? w - r + Math.sqrt(Math.max(0, r * r - (r - Y) * (r - Y))) : w; } },
    wide: { name: '넓은 대접',   Hs: 1.15, cap: 450, col: '#F7B7C8', round: true, pour: -0.35,
            hw: Y => 0.42 + 0.58 * Math.sqrt(Math.max(0, 1 - Math.pow((1.15 - Y) / 1.15, 2))) },
    flare:{ name: '나팔 잔',     Hs: 2.2,  cap: 350, col: '#9EE2C6', round: true, pour: -0.15,
            hw: Y => 0.2 + 0.8 * Math.pow(Y / 2.2, 1.1) },
    pot:  { name: '배불뚝 단지', Hs: 2.1,  cap: 400, col: '#C9B8F5', round: true, pour: -0.15,
            hw: Y => 0.45 + 0.5 * Math.sin(Math.PI * (0.12 + 0.8 * Y / 2.1)) },
    bone: { name: '뼈다귀 그릇', Hs: 2.55, cap: 380, col: '#F6C38E', round: false, pour: -0.22,
            inside: (x, Y) => { if (Y < 0 || Y > 2.55) return false; const r = 0.47, ax = Math.abs(x);
              if ((ax - 0.5) * (ax - 0.5) + (Y - 0.47) * (Y - 0.47) <= r * r) return true;
              if ((ax - 0.5) * (ax - 0.5) + (Y - 2.25) * (Y - 2.25) <= r * r) return true;
              return ax <= 0.3 && Y >= 0.47 && Y <= 2.25; } }
  };
  const SHAPE_IDS = Object.keys(SHAPES);
  const TBL = 300;
  const STOOL_R = 0.31, KONG_HW = 0.4;   // 발판 반폭 · 앉은 콩이 반폭 (콩이 크기의 비율)
  function prepShape(sh) {
    const inside = sh.inside || ((x, Y) => Y >= 0 && Y <= sh.Hs && Math.abs(x) <= sh.hw(Y));
    sh.inside = inside;
    const width = Y => { if (sh.hw) return 2 * sh.hw(Y); let n = 0; for (let i = 0; i < 200; i++) if (inside(-1 + (i + 0.5) / 100, Y)) n++; return n / 100; };
    sh.right = Y => { if (sh.hw) return sh.hw(Y); for (let x = 1; x >= -1; x -= 0.01) if (inside(x, Y)) return x; return 0; };
    sh.left = Y => { if (sh.hw) return -sh.hw(Y); for (let x = -1; x <= 1; x += 0.01) if (inside(x, Y)) return x; return 0; };
    sh.width = width;
    const area = Y => { const w = width(Y); return sh.round ? Math.PI * w * w / 4 : w * 0.85; };
    sh.V = new Float64Array(TBL + 1); let v = 0, a0 = area(0);
    for (let i = 1; i <= TBL; i++) { const a1 = area(i / TBL * sh.Hs); v += (a0 + a1) / 2 * sh.Hs / TBL; sh.V[i] = v; a0 = a1; }
    sh.vTop = v;
    sh.floor = 0; for (let Y = 0; Y < sh.Hs; Y += 0.01) if (inside(sh.pour, Y)) { sh.floor = Y; break; }   // 줄기가 처음 닿는 바닥
    let m = 0; for (let i = 0; i <= 40; i++) m = Math.max(m, sh.right(i / 40 * sh.Hs)); sh.maxR = m;
    // 입구: 맨 위 높이에서 열린 구간 (뼈다귀는 둘)
    sh.mouths = []; let on = false, s0 = 0; const yt = sh.Hs - 0.002;
    for (let i = 0; i <= 400; i++) { const x = -1.02 + i / 400 * 2.04, inn = inside(x, yt); if (inn && !on) { on = true; s0 = x; } else if (!inn && on) { on = false; sh.mouths.push([s0, x]); } }
    if (on) sh.mouths.push([s0, 1.02]);
  }
  for (const k of SHAPE_IDS) prepShape(SHAPES[k]);
  const mlAt = (sh, Y) => { const f = clamp(Y / sh.Hs, 0, 1) * TBL, i = Math.min(TBL - 1, Math.floor(f)); return sh.cap * lerp(sh.V[i], sh.V[i + 1], f - i) / sh.vTop; };
  function levelOf(sh, ml) {
    const v = clamp(ml / sh.cap, 0, 1) * sh.vTop; let lo = 0, hi = TBL;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (sh.V[m] < v) lo = m; else hi = m; }
    const d = sh.V[hi] - sh.V[lo]; return (lo + (d > 0 ? (v - sh.V[lo]) / d : 0)) / TBL * sh.Hs;
  }

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = J(name, '이/가') + ' 우유를 따라요. 목표선에 딱 맞춰 멈춰 주세요!';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud'), goal = $('goal');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 140);
  const bimg = document.createElement('canvas'), bgc = bimg.getContext('2d');   // 지금 그릇 (잔마다 한 번 그려 둔다)

  // ═══════ 상태 ═══════
  let state = 'ready', phase = 'enter';   // state: ready · play · pause · over · result   phase: enter · aim · pour · tail · judge

    const qn = phase === 'pour' ? clamp(cc.qNow / 110, 0.1, 1.4) : clamp((cc.tailV / Math.max(0.001, cc.tail)) / 110, 0.1, 1.4);
    const w = clamp(S * 0.05, 2, 5) * (0.5 + 0.7 * qn);
    let y0 = p.tip.y;
    if (phase === 'tail') y0 = lerp(p.tip.y, surf, Math.min(1, phaseT / TAIL_T));   // 뗀 뒤: 줄기 꼬리가 떨어진다
    if (phase === 'pour' && cc.tilt < 1) y0 = p.tip.y;
    if (surf - y0 < 2) return;
    const sx = phase === 'tail' ? x : p.tip.x;
    c.strokeStyle = '#FFFDF5'; c.lineCap = 'round'; c.lineWidth = w;
    c.beginPath(); c.moveTo(sx, y0); c.quadraticCurveTo(lerp(sx, x, 0.9), lerp(y0, surf, 0.25), x, surf); c.stroke();
    c.strokeStyle = 'rgba(210,200,180,.5)'; c.lineWidth = 1; c.stroke();
    for (let k = 0; k < frameN; k++)   // 솎아 건너뛴 프레임만큼 물방울 시도도 몰아서 한다(원래 빈도 유지)
      if (!reduceMotion && Math.random() < 0.35 && drops.length < 30) drops.push({ x, y: surf - 2, vx: rand(-60, 60), vy: rand(-140, -60), r: rand(1, 2.2), t: 0, life: 0.35 });
  }
  // 안내 알약·손가락 원은 목표 띠(초록 띠·점선·딱지)를 가리지 않는 곳에 둔다
  //   1) 그릇 오른쪽(눈금 숫자·딱지 너머)에 자리가 있으면 거기 2) 아니면 그릇 안에서 띠 위·아래 중 넓은 쪽 3) 그것도 좁으면 그릇 아래 탁자 위
  function bandSpan() {   // 띠가 차지하는 화면 y 범위 (띠가 안 보이는 단계라도 비워 둔다: 눈금으로 목표를 찾는 자리)
    const sh = cup.sh, a = floorY - levelOf(sh, cup.target - cup.tol) * S, b = floorY - levelOf(sh, cup.target + cup.tol) * S;
    return [b - 12, a + 12];
  }
  function hintSpot(lines, wMax) {   // lines: 알약 줄 수 → 알약 첫 줄 가운데 (x, y)
    const h = 27 * lines + 6 * (lines - 1), sh = cup.sh, top = floorY - sh.Hs * S, [b0, b1] = bandSpan();
    const rx = BX + sh.maxR * S + 58;
    if (W - SAF.r - 8 - rx >= wMax) return { x: rx + wMax / 2, y: clamp((b0 + b1) / 2 - h / 2 + 13, contentTop + 14, floorY - h) };
    const upR = b0 - top, dnR = floorY - b1;
    if (Math.max(upR, dnR) >= h + 8) return upR >= dnR ? { x: BX, y: top + (upR - h) / 2 + 13 } : { x: BX, y: b1 + (dnR - h) / 2 + 13 };
    return { x: BX, y: Math.min(floorY + 18, H - SAF.b - h + 6) };
  }
  function drawHint(c) {
    const sub = D.band === 'flash' ? '목표선은 잠깐만 보여요' : D.band === 'none' ? '목표 숫자를 눈금에서 찾아요' : '';
    const w = Math.max(pillW(c, '화면을 꾹 누르고 있어요', 14), sub ? pillW(c, sub, 13) : 0);
    const p = hintSpot(sub ? 2 : 1, w);
    pill(c, '화면을 꾹 누르고 있어요', p.x, p.y, 14);
    if (sub) pill(c, sub, p.x, p.y + 33, 13);
    // 손가락 원: 띠와 겹치지 않는 그릇 안 빈 곳 (알약이 쓴 쪽 말고). 자리가 없으면 그리지 않는다
    const sh = cup.sh, top = floorY - sh.Hs * S, [b0, b1] = bandSpan(), R = 19, u = reduceMotion ? 0.5 : (tAnim % 1.4) / 1.4;
    const pTop = p.y - 14, pBot = p.y + (sub ? 33 : 0) + 14, inBowl = p.x === BX;
    const free = [[top + 4, b0], [b1, floorY - 4]].filter(([a, b]) => b - a >= 2 * R + 6 && !(inBowl && pBot > a && pTop < b));
    if (!free.length) return;
    const [a, b] = free[0], cy = (a + b) / 2, r = 10 + 8 * (u < 0.5 ? u * 2 : 1);
    c.globalAlpha = 0.9; c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.arc(BX, cy, r, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(BX, cy, 7, 0, TAU); c.fill(); c.globalAlpha = 1;
  }
  function pillW(c, txt, size) { c.font = '600 ' + (size || 13) + 'px ' + FONT; return c.measureText(txt).width + 22; }
  function pill(c, txt, x, y, size) {
    const tw = pillW(c, txt, size), h = (size || 13) + 13;
    x = clamp(x, tw / 2 + 6 + SAF.l, W - tw / 2 - 6 - SAF.r); y = clamp(y, h / 2 + 4, H - h / 2 - 4 - SAF.b);
    c.fillStyle = 'rgba(18,22,52,.78)'; rr(c, x - tw / 2, y - h / 2, tw, h, h / 2); c.fill(); c.fillStyle = '#fff'; c.fillText(txt, x, y + 0.5);
  }
  function drawKong() {
    const e = 1 - Math.exp(-dtFrame * 9); kc.x += (kT.x - kc.x) * e; kc.y += (kT.y - kc.y) * e;
    const won = state === 'result' && cups > 0, lick = mood === 'lick', happy = mood === 'happy' || mood === 'perfect', sad = mood === 'sad';
    const pose = lick && K.has('eat') ? 'eat' : won && K.has('wave') ? 'wave' : 'sit';
    if (K.rig.pose !== pose) K.setPose(pose);
    // 보는 곳: 수면(따르는 중) → 그릇
    let lx = 0.5, ly = 0.4;
    if (cup) { const hd = K.head(), sy = floorY - (cup.vol > 0 ? liquidY() : cup.sh.Hs * 0.5) * S; lx = clamp((bowlX() - hd.x) / 120, -1, 1); ly = clamp((sy - hd.y) / 120, -1, 1); }
    const pouring = phase === 'pour' && state === 'play', hopT = mood === 'perfect' ? clamp(moodT / 1.2, 0, 1) : mood === 'happy' ? clamp(moodT / 0.9, 0, 1) : 0;
    K.render({ t: tAnim, eyes: sad ? 'closed' : happy || won ? 'happy' : 'open', mouth: lick ? 'open' : 'closed', look: sad ? [0, 0.6] : [lx, ly],
      tilt: sad ? -8 : pouring ? 4 : happy ? Math.sin(tAnim * 8) * 4 : Math.sin(tAnim * 1.2) * 2,
      hop: reduceMotion ? 0 : Math.sin(hopT * Math.PI) * (mood === 'perfect' ? 30 : 18), earLift: sad ? -8 : happy ? 7 : pouring ? 4 : 0,
      nod: lick && !reduceMotion ? Math.sin(tAnim * 14) * 3 : 0,
      tailAmp: sad ? 3 : happy || won || lick ? 22 : pouring ? 6 : 12, tailRate: happy || won ? 3.6 : 2.2, blush: happy || won || lick ? 1 : 0 });
    K.place(kc.x, kc.y, 1);
    if (lick && !reduceMotion && Math.random() < dtFrame * 2.2) { const m = K.mouth(); addFloat(m.x + rand(-10, 10), m.y - 12, '할짝', '#FFE9F0'); if (!drinkOn) noise(0.05, 0.05, 2400, 1600); }
  }
  let last = 0, dtFrame = 0, dtSum = 0, frameN = 1, skipN = 0;
  // 절전: 놀이 중이 아니면(시작·멈춤·결과 카드) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let calmKey = '', calmAt = 0, drawnAt = -1e9;
  function calmSkip(now) {
    const key = state + '|' + W + 'x' + H;
    if (key !== calmKey) { calmKey = key; calmAt = now; }
    if ((state !== 'ready' && state !== 'pause' && state !== 'result') || now - calmAt < 1000 || now - drawnAt >= 200) { drawnAt = now; return false; }
    return true;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; dtSum += dt; skipN++;
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (calmSkip(now)) return;
    dtFrame = dtSum; dtSum = 0; frameN = skipN; skipN = 0;   // 건너뛴 프레임의 시간은 다음 그리기에 몰아 준다
    draw();
  }

  // ═══════ 점수판 · 목표 줄 ═══════
  function paintHud() {
    $('hudScore').textContent = fmt(cups); $('hudLv').textContent = lv;
    [...$('hudHp').children].forEach((e, i) => e.classList.toggle('off', i >= hearts));
  }
  function paintGoal(force) {
    if (!cup || state === 'ready' || state === 'result') { goal.hidden = true; lastGoal = ''; return; }
    const c = cup, narrow = W < 380;
    let html, cls = '';
    if (phase === 'judge') {
      const ok = c.res === 'perfect' || c.res === 'good', d = Math.round(c.vol) - c.target;
      cls = 'res ' + (ok ? 'ok' : 'bad');
      html = c.res === 'spill' ? '<span>목표 <b>' + c.target + '</b>ml</span><i class="sep"></i><span><b class="v">넘쳤어요</b></span>'
        : '<span>목표 <b>' + c.target + '</b>ml</span><i class="sep"></i><span>따른 양 <b class="v">' + fmt(c.vol) + '</b>ml' + (narrow ? '' : ' (' + (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) + ')') + '</span>';
    } else {
      const live = D.live && (phase === 'pour' || phase === 'tail' || c.vol > 0);
      html = '<span>목표 <b>' + c.target + '</b>ml</span>' + (live ? '<i class="sep"></i><span class="now">지금 <b>' + fmt(c.vol) + '</b>ml</span>' : '')
        + '<i class="sep"></i><span class="bt">' + (narrow && live ? '' : c.bt.name + ' ') + '💧'.repeat(c.bt.drops) + '</span>';
    }
    const key = cls + html; if (!force && key === lastGoal) return; lastGoal = key;
    goal.className = cls; goal.innerHTML = html; goal.hidden = false;
  }

  // ═══════ 흐름 ═══════
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd']) $(k).hidden = k !== id; if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    clearTimeout(wcTimer); drinkOff();
    cups = 0; hearts = HEARTS; lv = 1; combo = 0; bestCombo = 0; perfects = 0; pstreak = 0; poured = 0; misses = 0; quit = false; isNew = false;
    floats = []; drops = []; mood = 'idle'; moodT = 0; held = false; holdId = null; holdKey = false; lastShape = '';
    state = 'play'; newCup();
    showCard(null); btnPause.hidden = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    KG.unlockAudio(); tone(659, 0.1, 'triangle', 0.05); tone(880, 0.18, 'triangle', 0.05, 0.1);
  }
  function pause() {
    if (state !== 'play') return;
    cancelPour();   // 따르던 중이면 그 잔은 없던 일로 (멈춤으로 이어 따르기는 안 된다)
    state = 'pause'; drinkOff();
    $('psText').textContent = '지금 ' + cups + '잔 성공했어요. ' + J(name, '이/가') + ' 우유병을 물고 기다려요.';
    showCard('cardPause', 'btnResume'); if (document.activeElement === btnPause) btnPause.blur();
  }
  function resume() { if (state !== 'pause') return; state = 'play'; showCard(null); last = performance.now(); }
  function finish() {
    if (state !== 'play') return;
    state = 'over'; overT = 1.0; btnPause.hidden = true; held = false; goal.hidden = true;
    sfx('lose');
  }
  function end() {   // 「그만하기」: 지금까지 성공한 잔으로 끝낸다
    if (state === 'pause') { state = 'play'; showCard(null); }
    if (state !== 'play') return;
    quit = true; finish(); overT = 0.3;
  }
  function showResult() {
    if (state !== 'over') return;
    state = 'result'; overAt = performance.now(); paintGoal(true);
    isNew = cups > 0 && setBest(KG.dkey(KEY, diffId), cups);
    $('edScore').textContent = fmt(cups); $('edPerf').textContent = perfects + '번'; $('edCombo').textContent = bestCombo + '잔';
    $('edTitle').textContent = cups >= 20 ? '진짜 계량천재예요!' : quit ? '여기까지 따랐어요' : cups > 0 ? '우유를 다 따랐어요' : '다음엔 꼭 맞춰 봐요';
    if ((cups >= 20) && KG.master) KG.master('pour');   // 업적 「게임 달인」 (11-27): 한 판에 20잔
    $('edText').textContent = cups > 0 ? J(name, '이/가') + ' 우유 ' + cups + '잔을 맛있게 마셨어요.' + (perfects ? ' 계량천재 ' + perfects + '번!' : '') : '초록 띠 안에서 손을 떼 보세요.';
    paintBest(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
    drinkOff(); clearTimeout(wcTimer);
    if (cups > 0) { const at = overAt; wcTimer = setTimeout(() => { if (state === 'result' && overAt === at && !document.hidden) KG.voice('watercall', 0, 0.9); }, isNew ? 2300 : 350); }   // 11-28: 다 마신 뒤 「콩이 물 마실까」 — 신기록이면 공통이 0.2초 뒤 짖으니(약 1.9초) 그 뒤에
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); drinkOff(); } });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { if (held) cancelPour(); });

  // ═══════ 입력: 화면 어디든 누르고 있기 · 스페이스 누르고 있기 ═══════
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    if (held) return;
    try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    holdId = e.pointerId; press();
    if (held) holdId = e.pointerId;
  });
  const up = e => { if (holdId !== null && e.pointerId === holdId) release(); };
  fx.addEventListener('pointerup', up); fx.addEventListener('pointercancel', up); fx.addEventListener('lostpointercapture', up);
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === ' ' || k === 'Enter') {
      if (state === 'play') {
        if (k === 'Enter' && e.target && e.target.closest && e.target.closest('.kg-top a, .kg-top button')) return;   // 위 줄 단추(게임·소리·멈춤)는 Enter 로 쓸 수 있게
        e.preventDefault(); if (KG.rulesOpen) return;
        if (k === ' ' && !e.repeat && !held) { press(); if (held) holdKey = true; }
        return;
      }
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => { if (e.key === ' ' && holdKey) { e.preventDefault(); release(); } });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '잔';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '잔';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') D = DIFF[KG.diff()] || DIFF.normal; }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
  layout(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '목표선에 딱 맞춰 우유를 따르는 놀이예요.', items: [
    ['👆', '화면을 꾹 누르고 있으면 우유가 나오고, 떼면 멈춰요' + (KEYS_OK ? ' (스페이스도 돼요).' : '.')],
    ['🎯', '초록 띠 안에서 멈추면 한 잔 성공! 한가운데면 「계량천재!」예요.'],
    ['💧', '떼고 나서도 조금 더 흘러요. 물방울 표시가 많은 병일수록 많이 흘러요.'],
    ['💔', '넘치거나 모자라면 하트가 하나 줄어요. 계량천재를 3번 연속하면 하트 하나가 돌아와요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, SHAPES, get state() { return state; }, get phase() { return phase; }, get score() { return cups; }, get hearts() { return hearts; }, get lv() { return lv; },
    get combo() { return combo; }, get perfects() { return perfects; }, get diff() { return diffId; }, get D() { return D; }, get held() { return held; },
    cup: () => cup && { id: cup.id, bottle: cup.bt.id, cap: cup.cap, target: cup.target, tol: +cup.tol.toFixed(2), vol: +cup.vol.toFixed(2), q: +cup.q.toFixed(2), qNow: +cup.qNow.toFixed(2), wob: cup.wob, tail: cup.tail, res: cup.res, err: +cup.err.toFixed(2), flash: cup.flash },
    // 지금 떼면 최종 양 (흘러내림 포함)
    predict: () => cup ? cup.vol + cup.qNow * cup.tail : 0,
    field: () => ({ W, H, S, BX, floorY, contentTop, KSZ, kong: { x: kc.x, y: kc.y }, kongT: { x: kT.x, y: kT.y }, L: cup && cup.L, sdx: cup && cup.stoolDx, tip: cup && cup.tip, hud: hud.getBoundingClientRect().toJSON(), goal: goal.getBoundingClientRect().toJSON() }),
    levelOf: (id, ml) => levelOf(SHAPES[id], ml), mlAt: (id, Y) => mlAt(SHAPES[id], Y),
    start, end, pause, resume, press, release, over: showResult, bowlImg: () => bimg,
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
