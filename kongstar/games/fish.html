<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 어부체험</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 어부체험: 노을 바다(bg) → 콩이(stage) → 낚싯대·찌·물고기·게이지(fx) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: default; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc { margin-left: auto; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
#hud.land .sc { margin-left: 0; }
#hint { position: fixed; z-index: 10; transform: translateX(-50%); width: max-content; max-width: min(86vw, 340px); box-sizing: border-box; padding: 7px 14px; border-radius: 16px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; text-align: center; pointer-events: none; transition: opacity .2s; }
#hint.warn { background: rgba(214,72,84,.86); }
#hint.go { background: rgba(255,200,97,.95); color: #3A2A00; }
#hint:empty { opacity: 0; }
#got { position: fixed; z-index: 12; transform: translate(-50%,-50%); width: 196px; box-sizing: border-box; padding: 12px 14px 14px; border-radius: 22px; background: #fff; color: var(--ink); box-shadow: 0 10px 34px rgba(8,10,40,.35); text-align: center; pointer-events: none; animation: gotIn .28s; }
@keyframes gotIn { from { opacity: 0; transform: translate(-50%,-44%) scale(.92); } to { opacity: 1; transform: translate(-50%,-50%); } }
#got canvas { display: block; width: 150px; height: 100px; margin: 0 auto; background: linear-gradient(#EAF6FF,#D3ECFB); border-radius: 16px; }
#got .tag { display: inline-block; margin-bottom: 6px; background: #FFF4D6; color: #B07A00; font-size: 12.5px; font-weight: 700; border-radius: 10px; padding: 3px 10px; }
#got b { display: block; margin-top: 8px; font-size: 19px; letter-spacing: -.3px; }
#got span { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); }
#got em { display: block; margin-top: 6px; font-style: normal; font-size: 17px; font-weight: 700; color: var(--pri); font-variant-numeric: tabular-nums; }
#got em small { display: block; font-size: 12px; font-weight: 600; color: #1F9D6B; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row .mini { flex: 0 0 auto; padding: 0 13px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
/* 도감 */
#cardDex { z-index: 28; }
#cardDex .kg-card { width: min(100%, 420px); box-sizing: border-box; padding: 18px 14px 14px; display: flex; flex-direction: column; overflow: hidden; }
#cardDex h2 { margin-bottom: 2px; }
#dexList { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
#dexList h3 { margin: 10px 2px 6px; font-size: 13px; font-weight: 700; color: var(--pri); text-align: left; }
#dexList .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#dexList .cell { background: var(--soft); border-radius: 14px; padding: 6px 4px 8px; min-width: 0; }
#dexList .cell canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
#dexList .cell b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dexList .cell span { display: block; font-size: 11.5px; line-height: 1.35; min-height: 2.7em; white-space: pre-line; color: var(--sub); font-variant-numeric: tabular-nums; }
#dexList .cell.no b { color: #9AA3AF; }
#dexList .cell i { display: inline-block; font-style: normal; font-size: 10.5px; font-weight: 700; border-radius: 7px; padding: 1px 6px; margin-top: 2px; }
#dexList .r0 { background: #E9EDF3; color: #5F6B78; } #dexList .r1 { background: #DFF3E8; color: #1F8A5B; } #dexList .r2 { background: #E3E8FF; color: #3B49B8; } #dexList .r3 { background: #FFEFC9; color: #A26B00; }
#cardDex .kg-btn { width: 100%; margin-top: 10px; flex: none; }
.kg-card .row .kg-btn { white-space: nowrap; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } body .kg-card .row { gap: 6px; } body .kg-card .row .kg-btn { font-size: 14.5px; padding: 0 6px; } body .kg-card .row .mini { padding: 0 9px; font-size: 14px; } body .kg-card { padding-left: 16px; padding-right: 16px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  #cardDex .kg-card { width: min(100%, 700px); padding: 12px 14px; }
  #dexList .grid { grid-template-columns: repeat(6, 1fr); }
  #got { width: 180px; padding: 10px 12px 12px; }
  #got canvas { width: 126px; height: 84px; }
}
/* 가로 낮은 화면(나란히): 이 게임은 원래 결과 겉상자에 위 줄 여백이 없어(quiz 는 있음) 결과 카드가 왼쪽으로 밀리면 「게임」 단추가 카드 머리를 덮는다 — 위 줄 아래부터 놓는다 */
/*   그만큼 낮아진 데다 순위 카드 몫으로 폭도 좁아져 글이 두 줄이 되므로, 「다시 하기」가 첫 화면에 들어오게 카드 위아래 여백을 줄이고 「새 기록」 딱지를 점수 옆에 붙인다 (quiz 의 낮은 화면 처리와 같은 방식) */
@media (orientation: landscape) and (max-height: 520px) {
  #cardEnd.kg-rbwrap { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }
  #cardEnd.kg-rbwrap > .kg-card { padding-top: 8px; padding-bottom: 8px; }
  #cardEnd.kg-rbwrap #edText { display: none; }   /* 좁아진 카드에서 두 줄이 되는 안내글은 뺀다 (dig 가 낮은 화면에서 #edText 를 감추는 것과 같게) — 잡은 물고기 칩이 두 줄이 돼도 「다시 하기」가 보이게 */
  #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { vertical-align: middle; margin: 0 0 0 8px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div><small>미끼</small><span id="hudBait">0</span></div>
  <div><small>잡은 것</small><span id="hudCnt">0</span></div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div id="hint" role="status" aria-live="polite"></div>
<div id="got" hidden><div class="tag" id="gotNew">새로 잡았어요!</div><canvas id="gotCv" width="300" height="200"></canvas><b id="gotName"></b><span id="gotInfo"></span><em id="gotPts"></em></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 어부체험</h2>
    <p id="stLead"></p>
    <div class="how"><p><b>꾹 눌러</b> 던지고, 찌가 <b>쑥 들어가면</b> 눌러요.</p></div>
    <div class="rec" id="stRec"><span id="stBestBox" hidden>최고 기록<b id="stBest"></b></span><span>도감<b id="stDex"></b></span></div>
    <div class="row"><button class="kg-btn mini" id="btnRules" type="button">규칙 보기</button><button class="kg-btn mini" id="btnDex" type="button">도감</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><a class="kg-btn" href="index.html">그만하기</a><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2>오늘 낚시 끝!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span id="edBigBox">가장 큰 물고기<b id="edBig"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn mini" id="btnDex2" type="button">도감</button><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardDex" hidden>
  <div class="kg-card" role="dialog" aria-modal="true" aria-label="물고기 도감">
    <h2>물고기 도감</h2>
    <p id="dexLead"></p>
    <div id="dexList"></div>
    <button class="kg-btn pri" id="btnDexClose" type="button">닫기</button>
  </div>
</div>

<script src="common.js"></script>

      const ly = by + bh + 7; ctx.fillStyle = 'rgba(255,255,255,.16)'; rr(ctx, bx, ly, bw, 4, 2); ctx.fill();
      const rf = redT / D.red, sf = slackT / D.slack;
      if (rf > 0.04 && rf >= sf) { ctx.fillStyle = '#FF6B6B'; rr(ctx, bx, ly, Math.max(4, bw * Math.min(1, rf)), 4, 2); ctx.fill(); }

    }
  }
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    const t = tAnim, playing = state === 'play' || state === 'pause';
    if (shake > 0 && !reduceMotion) ctx.translate(Math.sin(t * 70) * shake * 8, Math.cos(t * 83) * shake * 5);
    // 물속 그림자
    for (const s of shadows) { const top = waterY + 26, bot = bedY(clamp(s.x, 0, W)) - 14, y = lerp(top, Math.max(top + 6, bot), s.fy) + Math.sin(s.t * 1.3) * 4; drawSp(ctx, s.sp, s.x, y, s.len, { shadow: true, alpha: 0.2, flip: s.v > 0 }); }
    // 물결
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.strokeStyle = 'rgba(255,236,214,' + (0.5 - i * 0.14) + ')'; ctx.lineWidth = 1.6 - i * 0.3; ctx.beginPath(); const y0 = waterY + i * 5; for (let x = pierEnd - 4; x <= W; x += 10) { const y = y0 + Math.sin(x * 0.05 + t * (1.4 + i * 0.5) + i) * (1.6 - i * 0.3); if (x === pierEnd - 4) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); }
    // 깊이 표시 (던지기 전)
    if (playing && (phase === 'aim' || phase === 'charge')) {
      ctx.font = '600 11.5px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const cuts = [0, ZCUT[0], ZCUT[1], 1];
      for (let z = 0; z < 3; z++) {
        const xa = castX(cuts[z]), xb = castX(cuts[z + 1]), on = phase === 'charge' && zoneOf(Math.max(0.06, power)) === z;
        ctx.fillStyle = on ? 'rgba(255,226,163,.95)' : 'rgba(255,255,255,.6)'; ctx.fillText(ZONE[z], (xa + xb) / 2, waterY + 22);
        if (z > 0) { ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(xa, waterY + 8); ctx.lineTo(xa, waterY + 58); ctx.stroke(); ctx.setLineDash([]); }
      }
      if (phase === 'charge') { const x = castX(Math.max(0.06, power)); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, waterY + 1, 13, 4, 0, 0, TAU); ctx.stroke(); ctx.fillStyle = '#FFE2A3'; ctx.beginPath(); ctx.moveTo(x, waterY - 8); ctx.lineTo(x - 5, waterY - 17); ctx.lineTo(x + 5, waterY - 17); ctx.closePath(); ctx.fill(); }
    }
    // 물결 고리
    for (const r of rings) { const p = r.t / 0.9; ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * (1 - p)) + ')'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(r.x, waterY + 1, r.r * (0.3 + p), r.r * 0.26 * (0.3 + p), 0, 0, TAU); ctx.stroke(); }
    // 낚싯대 · 줄 · 찌 · 물고기
    const b = rodBase(), tip = rodTip();
    let lx = null, ly = null;
    if (playing) {
      if (phase === 'fly') { lx = bobX; ly = bobY; }
      else if (phase === 'wait' || phase === 'bite') { lx = bobX; ly = waterY + dip + Math.sin(t * 2.2) * 1.2; }
      else if (phase === 'reel') { lx = fishX - cur.len * 0.46; ly = fishY; }
      else if (phase === 'aim' || phase === 'charge' || phase === 'got' || phase === 'miss') { lx = tip.x + Math.sin(t * 1.8) * 2; ly = tip.y + KS * 0.42; }
    } else { lx = tip.x; ly = tip.y + KS * 0.42; }
    // 끌려오는 물고기 그림자 (무엇인지는 올라와 봐야 안다)
    if (playing && phase === 'reel') {
      const st = burstT > 0;
      drawSp(ctx, cur.sp, fishX, fishY, cur.len, { shadow: true, alpha: 0.62, rot: st && !reduceMotion ? Math.sin(t * 30) * 0.22 : Math.sin(t * 6) * 0.06 });
      if (st || (cur.sp.kind === 'fish' && calmT < warnT)) {
        const bxx = clamp(fishX, 24, W - 24), byy = waterY - 26; ctx.fillStyle = st ? '#FF6B6B' : '#FFC861'; ctx.beginPath(); ctx.arc(bxx, byy, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = st ? '#fff' : '#3A2A00'; ctx.font = '800 17px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', bxx, byy + 1);
      }
    }
    // 줄
    const tight = phase === 'reel' && playing ? tension : phase === 'bite' ? 0.6 : 0.15;
    ctx.strokeStyle = 'rgba(255,255,255,.82)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
    ctx.quadraticCurveTo((tip.x + lx) / 2, Math.max(tip.y, ly) * (1 - tight) * 0.5 + (tip.y + ly) / 2 * (0.5 + tight * 0.5) + (1 - tight) * 10, lx, ly); ctx.stroke();
    // 낚싯대
    const bend = phase === 'reel' && playing ? tension * KS * 0.16 : phase === 'bite' ? KS * 0.08 : 0;
    const mx = (b.x + tip.x) / 2 - bend * 0.6, my = (b.y + tip.y) / 2 - bend;
    ctx.strokeStyle = '#3B2A22'; ctx.lineWidth = 4.2; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(mx, my, tip.x, tip.y); ctx.stroke();
    ctx.strokeStyle = '#E8B96A'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(mx, my, tip.x, tip.y); ctx.stroke();
    ctx.strokeStyle = '#3B2A22'; ctx.lineWidth = 5.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(lerp(b.x, mx, 0.3), lerp(b.y, my, 0.3)); ctx.stroke();
    const rx = lerp(b.x, mx, 0.36), ry = lerp(b.y, my, 0.36); ctx.fillStyle = '#C9D1F2'; ctx.beginPath(); ctx.arc(rx + 4, ry + 2, 5, 0, TAU); ctx.fill(); ctx.fillStyle = '#5F6B9A'; ctx.beginPath(); ctx.arc(rx + 4, ry + 2, 2, 0, TAU); ctx.fill();
    // 찌 (또는 줄 끝의 바늘)
    if (phase === 'reel' && playing) { /* 물속 */ }
    else if (playing && (phase === 'fly' || phase === 'wait' || phase === 'bite')) {
      ctx.save(); if (phase !== 'fly') { ctx.beginPath(); ctx.rect(0, 0, W, waterY + 2); ctx.clip(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(lx, ly - 1, 5.5, 7.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#FF5C6C'; ctx.beginPath(); ctx.ellipse(lx, ly - 1, 5.5, 7.5, 0, Math.PI, TAU); ctx.fill();
      ctx.strokeStyle = '#FF5C6C'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, ly - 8); ctx.lineTo(lx, ly - 15); ctx.stroke();
      ctx.restore();
      if (phase === 'bite') {
        const yy = waterY - 34, p = clamp(biteT / D.react, 0, 1);
        ctx.fillStyle = '#FFC861'; ctx.beginPath(); ctx.arc(bobX, yy, 15, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bobX, yy, 19, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
        ctx.fillStyle = '#3A2A00'; ctx.font = '800 20px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', bobX, yy + 1);
      }
    } else { ctx.fillStyle = '#FF5C6C'; ctx.beginPath(); ctx.ellipse(lx, ly, 3.4, 4.6, 0, 0, TAU); ctx.fill(); }
    // 물보라
    ctx.fillStyle = 'rgba(235,246,255,.9)'; for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2.5); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
    // 떠오르는 글
    if (floats.length) { ctx.font = '700 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life / 0.35); ctx.strokeStyle = 'rgba(12,16,48,.6)'; ctx.lineWidth = 3.5; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); } ctx.globalAlpha = 1; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    drawKong();
  }
  // 절전: 카드가 떠 있을 때(놀이 중 아님)는 상태가 바뀐 뒤 1초만 매 프레임 그리고, 그 뒤로는 0.2초에 한 번만 그린다
  const lazy = { k: null, at: 0, dr: 0 };
  function lazySkip(ms, key) {
    if (key == null) { lazy.k = null; return false; }

  addEventListener('resize', lazyWake); addEventListener('orientationchange', lazyWake); document.addEventListener('visibilitychange', lazyWake);

  }

  // ═══════ 흐름 ═══════

    parts.length = rings.length = floats.length = 0; shown = { s: -1, b: -1, c: -1 }; paintHud();
    state = 'play'; phase = 'aim'; phT = 0; hold = false; cur = null; power = 0; hintTxt = '\u0000'; setHint('화면을 꾹 눌러 힘을 모아요');
    $('cardStart').hidden = $('cardEnd').hidden = $('cardPause').hidden = $('got').hidden = true; rbox.hide(); btnPause.hidden = false; paintTitle(); $('hud').style.visibility = '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  }

    if (state !== 'play') return;
    state = 'over'; overT = 0; hold = false; btnPause.hidden = true; paintTitle(); $('got').hidden = true; setHint('');
    [523, 659, 784].forEach((f, i) => tone(f, 0.32, 'triangle', 0.055, 0.1 + i * 0.14));
  }

    $('edScore').textContent = fmt(score); $('edNew').hidden = !isNew;
    $('edText').textContent = caught > 0 ? '미끼 ' + casts + '개로 ' + caught + '번 잡았어요.' : '오늘은 물고기가 잘 숨었네요. 다음엔 꼭 잡아요.';
    $('edBigBox').hidden = !biggest; if (biggest) $('edBig').textContent = biggest.name + ' ' + biggest.cm + 'cm';
    paintBest(); $('cardEnd').hidden = false; rbox.show(diffId); if (isNew) sfx('win');

  }
  const guardOk = () => performance.now() - resultAt > 450;   // 결과 카드가 뜬 직후의 누름은 넘긴다 (두드리던 손가락)
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen && state === 'ready') start(); });
  $('btnAgain').addEventListener('click', () => { if (state === 'result' && guardOk()) start(); });

  $('btnDex').addEventListener('click', () => { if (KG.rulesOpen) return; sfx('tap'); openDex($('btnStart')); });
  $('btnDex2').addEventListener('click', () => { if (!guardOk()) return; sfx('tap'); openDex($('btnAgain')); });

  window.addEventListener('blur', () => { if (keyDown || downId != null) { keyDown = false; downId = null; cancelPress(); } });
  window.addEventListener('pagehide', pause);

  // ═══════ 입력: 한 손가락(누르기 · 누르고 있기), 키보드는 스페이스 ═══════

  });

    // 결과 카드는 방금 끝난 판(diffId)의 기록으로 고정. 다른 난이도를 골라 두었으면 어느 난이도 기록인지 밝힌다

    ['🎣', '화면을 꾹 누르면 힘이 모이고, 떼면 던져요' + (KEYS_OK ? '(스페이스 키도 돼요)' : '') + '. 멀리 던질수록 큰 물고기가 살아요.'],
    ['❗', '찌가 쑥 들어가고 느낌표가 뜨면 얼른 눌러요. 살짝 흔들리기만 할 때 누르면 달아나요.'],

    force: (id, sizeT) => { if (state !== 'play' || !byId[id]) return false; if (phase === 'aim' || phase === 'charge') { power = byId[id].kind === 'fish' ? [0.2, 0.55, 0.9][byId[id].z] : 0.5; phase = 'charge'; cast(); phT = 1; landBob(); } if (phase !== 'wait') return false; phase = 'bite'; phT = 0; biteT = D.react; const s = sizeT == null ? 0.5 : sizeT; cur = mkCatch(byId[id], byId[id].kind === 'fish' ? Math.round(lerp(byId[id].cm[0], byId[id].cm[1], s)) : 0, s); return true; },

  };
