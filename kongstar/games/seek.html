<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 숨바꼭질</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 숨바꼭질: 벽·바닥(bg) → 숨은 콩이(stage) → 가구·숨은 물건·반짝이(fx) → 점수판·찾을 목록 순서로 겹친다.
   콩이를 찾으면 stage 가 가구 위로 올라온다(.out) */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
#stage.out { z-index: 12; }
#fx { z-index: 2; touch-action: none; cursor: pointer; }
body.paused #bg, body.paused #fx, body.paused #stage { filter: blur(14px); }
#hud { position: fixed; z-index: 21; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.66); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .rm { color: #D5DBFF; font-weight: 500; }
#hud .tm { flex: 1; min-width: 0; padding: 0 10px 0 9px; gap: 7px; }
#hud .tm svg { width: 15px; height: 15px; flex: none; }
#hud .tm i { flex: 1; min-width: 0; height: 7px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
#hud .tm i u { display: block; height: 100%; width: 100%; border-radius: 4px; background: #8FE3B4; transform-origin: 0 50%; text-decoration: none; }
#hud .tm.low i u { background: #FF8D8D; }
#hud .tm.low #hudTime { color: #FFC9C9; }
#hud .tm.hit { animation: tmHit .4s; }
@keyframes tmHit { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
#hudTime { min-width: 22px; text-align: right; }
#hud .sc small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
/* 찾을 목록: 아래에 붙은 흰 판 */
#tray { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; box-sizing: border-box; height: calc(64px + var(--sab)); padding: 9px calc(var(--sar) + 10px) calc(var(--sab) + 9px) calc(var(--sal) + 10px); background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -6px 22px rgba(20,24,60,.16); display: flex; align-items: center; gap: 8px; color: var(--ink); }
#list { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; height: 46px; }
#list .it { position: relative; flex: 0 1 44px; min-width: 26px; max-width: 46px; aspect-ratio: 1; border-radius: 12px; background: var(--soft); }
#list .it canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .25s; }
#list .it b { position: absolute; right: -3px; bottom: -3px; width: 17px; height: 17px; border-radius: 50%; background: #34C38F; display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; }
#list .it b svg { width: 11px; height: 11px; }
#list .it.found canvas { opacity: .3; }
#list .it.found b { display: flex; }
#list .it.pop { animation: itPop .45s; }
@keyframes itPop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
#list .it.kong { background: #FFF1DE; }
#list .it.kong.found canvas { opacity: 0; }
#list .it.kong.found.away canvas { opacity: .3; }   /* 결과 화면: 콩이가 칸을 떠나면 그림을 다시 흐리게 보여 준다 */
#list .ph { font-size: 14px; color: var(--sub); }
#btnHint { flex: none; height: 46px; border: 0; border-radius: 14px; padding: 0 13px 0 10px; background: #FFF4D6; color: #9A6A00; font-size: 14px; font-weight: 700; letter-spacing: -.2px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: opacity .2s; }
#btnHint svg { width: 18px; height: 18px; }
#btnHint:disabled { opacity: .42; cursor: default; }
#btnHint.ready { animation: hintGlow 1.6s infinite; }
@keyframes hintGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,200,97,.0); } 50% { box-shadow: 0 0 0 5px rgba(255,200,97,.45); } }
#banner { position: fixed; z-index: 11; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .28s, transform .28s; }
#banner.show { opacity: 1; transform: none; }
#banner div { display: inline-block; padding: 12px 22px; border-radius: 20px; background: rgba(255,255,255,.95); box-shadow: 0 8px 26px rgba(20,24,60,.2); }
#banner b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.4px; color: var(--ink); }
#banner span { display: block; margin-top: 2px; font-size: 14px; font-weight: 500; color: var(--sub); }
#banner span:empty { display: none; }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 8px 8px 8px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.5; color: #3A4552; text-align: left; display: flex; align-items: center; gap: 10px; }
.kg-card .tip span { flex: 1; min-width: 0; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
#btnRules { flex: none; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--pri); font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#btnRules:active { filter: brightness(.96); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-bottom: 6px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; border-radius: 12px; padding: 5px 11px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
/* 세로 화면: 알림이 시간·점수판(위 줄 바로 아래)을 덮지 않게 그 밑에 띄운다 */
body.tall .kg-toast { top: calc(var(--sat) + 102px); }
/* 세로 화면: 카드를 조금 위로 올려 아래에서 기다리는 콩이가 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim:not(.kg-rules) { align-items: flex-start; padding-top: calc(var(--sat) + 96px); } }
@media (max-width: 340px) {
  body .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  body .kg-card .rec span { padding: 7px 9px; font-size: 12.5px; letter-spacing: -.3px; }
  #btnHint { padding: 0 10px 0 8px; font-size: 13px; }
  #list { gap: 4px; }
}
/* 낮은 화면(가로 휴대폰): 목록 판을 낮추고 카드를 촘촘하게 */
@media (max-height: 430px) {
  #tray { height: calc(54px + var(--sab)); padding-top: 6px; padding-bottom: calc(var(--sab) + 6px); }
  #list { height: 42px; }
  #list .it { max-width: 42px; }
  #btnHint { height: 42px; }
  body .kg-card { box-sizing: border-box; width: min(100%, 420px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; font-size: 19px; }
  #stLead, #edText { display: none; }
  body .kg-card .tip { margin-top: 6px; padding: 4px 6px 4px 12px; }
  #btnRules { height: 40px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 34px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .rec span { padding: 5px 10px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 32px; margin: 0; }
  body .kg-card .new { margin-bottom: 2px; padding: 3px 10px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="rm" id="hudRoom">첫째 방</div>
  <div class="tm" id="hudTm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><i><u id="hudBar"></u></i><span id="hudTime">0</span></div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div id="tray">
  <div id="list" role="list" aria-label="찾을 것들"><span class="ph">찾을 것들이 여기에 나와요</span></div>
  <button type="button" id="btnHint" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.300 1 2.100h5c0-.8.4-1.600 1-2.100A6 6 0 0 0 12 3z"/></svg>힌트</button>
</div>
<div id="banner" role="status" aria-live="polite"><div><b></b><span></span></div></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이의 숨바꼭질</h2>
    <p id="stLead"></p>
    <div class="tip"><span><b>목록의 그림</b>을 방에서 찾아 눌러요</span><button type="button" id="btnRules">규칙 보기</button></div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="psTitle">
    <h2 id="psTitle">잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><a class="kg-btn" href="index.html">그만하기</a><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="edTitle">
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <h2 id="edTitle">모두 찾았어요!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div class="rec"><span>찾은 것<b id="edFound"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'seek');   // 결과 카드 바로 아래(가로 화면은 오른쪽) 별도 카드로 붙는 가족 순위표
  KG.startRank($('cardStart'), 'seek');   // 시작 카드 아래에 고른 난이도의 가족 순위
  const fmt = n => Math.round(n).toLocaleString('ko-KR');

  // ═══════ 난이도 표 (수치는 모두 여기) ═══════
  //   rooms 한 판의 방 수 · items 방마다 찾을 물건 수(콩이는 따로 하나 더) · decoys 색만 다른 가짜 물건 수
  //   time 방마다 주는 시간(초) · miss 엉뚱한 곳을 누르면 깎이는 시간(초) · size 숨은 물건 크기 배율
  //   minVis 물건이 적어도 이만큼은 보여야 한다(0~1) · bias 덜 보이는 자리를 고르는 정도(0 고루 ~ 1 많이 가린 자리 위주)
  //   kongHide 콩이가 가구 뒤로 들어가는 정도(0~1) · kongMin 콩이가 적어도 이만큼은 보여야 한다 · peek 콩이가 이 초마다 빼꼼 움직인다(0 이면 가만히)
  //   hintAfter 못 찾고 이 초가 지나면 힌트 단추가 켜진다 · hintCost 힌트 한 번에 깎이는 점수 · hintJit 힌트 원이 실제 자리에서 벗어나는 정도
  const DIFF = {
    easy:   { rooms: 3, items: 3, decoys: 0, time: 90, miss: 2, size: 1.25, minVis: 0.70, bias: 0,    kongHide: 0,    kongMin: 0.22, peek: 5,  hintAfter: 5,  hintCost: 20, hintJit: 6 },
    normal: { rooms: 3, items: 4, decoys: 2, time: 70, miss: 3, size: 1.10, minVis: 0.50, bias: 0.4,  kongHide: 0.4,  kongMin: 0.15, peek: 9,  hintAfter: 9,  hintCost: 40, hintJit: 14 },
    hard:   { rooms: 3, items: 5, decoys: 4, time: 55, miss: 5, size: 1.00, minVis: 0.38, bias: 0.75, kongHide: 0.75, kongMin: 0.10, peek: 15, hintAfter: 13, hintCost: 60, hintJit: 22 },
    vhard:  { rooms: 3, items: 6, decoys: 6, time: 45, miss: 7, size: 0.90, minVis: 0.30, bias: 1,    kongHide: 1,    kongMin: 0.07, peek: 0,  hintAfter: 17, hintCost: 80, hintJit: 30 }
  };
  const PTS = { item: 100, kong: 200, sec: 10, perfect: 100 };   // 물건 · 콩이 · 남은 1초 · 틀림·힌트 없이 방을 끝냄
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 그림 도구 ═══════
  function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const R = (g, c, x, y, w, h, r) => { g.fillStyle = c; rr(g, x, y, w, h, r || 0); g.fill(); };
  const C = (g, c, x, y, r) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); };
  const E = (g, c, x, y, rx, ry, rot) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fill(); };
  const PG = (g, c, pts) => { g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); };
  const LN = (g, c, w, pts) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.stroke(); };
  const SH = 'rgba(40,30,60,.10)', DK = 'rgba(40,30,60,.14)', LT = 'rgba(255,255,255,.35)';
  const shadow = (g, w) => E(g, SH, 0, 1, w / 2, 5);
  function heartPath(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.9); g.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.8, y - s * 1.15, x, y - s * 0.35); g.bezierCurveTo(x + s * 0.8, y - s * 1.15, x + s * 1.5, y - s * 0.1, x, y + s * 0.9); g.closePath(); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ═══════ 숨은 물건 (가운데가 0,0 · 반지름 13 안에 그린다) — 종류마다 색 세 가지: 하나는 찾을 것, 나머지는 가짜로 쓴다 ═══════
  const EYE = '#4A3728';
  const ITEMS = {
    ball: { cols: [['#FF8A80', '#FFFFFF'], ['#64B5F6', '#FFFFFF'], ['#FFD54F', '#FFFFFF']], d(g, c) {
      C(g, c[0], 0, 0, 12); g.save(); g.beginPath(); g.arc(0, 0, 12, 0, TAU); g.clip();
      g.strokeStyle = c[1]; g.lineWidth = 3.4; g.beginPath(); g.moveTo(-13, -2); g.quadraticCurveTo(0, 7, 13, -2); g.stroke(); g.beginPath(); g.moveTo(-10, -11); g.quadraticCurveTo(0, -5, 10, -11); g.stroke(); g.restore();
      C(g, 'rgba(255,255,255,.55)', -4.5, -5.5, 2.6); } },
    bone: { cols: [['#FFF1D0', '#E3C083'], ['#F9B9A6', '#DC8F78'], ['#BFE3F5', '#84B9D8']], d(g, c) {
      g.rotate(-0.5); g.fillStyle = c[0]; g.strokeStyle = c[1]; g.lineWidth = 1.3;
      for (const [x, y] of [[-8.5, -3.2], [-8.5, 3.2], [8.5, -3.2], [8.5, 3.2]]) { g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); g.stroke(); }
      rr(g, -9, -3.1, 18, 6.2, 2); g.fill(); LN(g, c[1], 1.3, [-5, -3.1, 5, -3.1]); LN(g, c[1], 1.3, [-5, 3.1, 5, 3.1]); } },
    sock: { cols: [['#FF9DB0', '#FFFFFF'], ['#7FD0C3', '#FFFFFF'], ['#B9A4E6', '#FFFFFF']], d(g, c) {
      g.fillStyle = c[0]; g.beginPath(); g.moveTo(-6, -9); g.lineTo(5, -9); g.lineTo(5, 1); g.quadraticCurveTo(13, 2, 12.5, 8); g.quadraticCurveTo(12, 13, 4, 12.5); g.lineTo(-1, 12); g.quadraticCurveTo(-7, 11, -6, 4); g.closePath(); g.fill();
      R(g, c[1], -7, -13, 13, 5.5, 2); LN(g, c[1], 2, [-5.5, -3.5, 4.5, -3.5]); LN(g, c[1], 2, [-5.5, 0.8, 4.5, 0.8]); g.strokeStyle = c[0]; g.lineWidth = 1; rr(g, -7, -13, 13, 5.5, 2); g.stroke(); } },
    duck: { cols: [['#FFD54F', '#FF9A3C'], ['#FF9DB0', '#FF9A3C'], ['#8FC9F2', '#FF9A3C']], d(g, c) {
      PG(g, c[1], [10.5, -8, 16.5, -5.5, 10.5, -3.5]); E(g, c[0], -1.5, 4.5, 11, 8); C(g, c[0], 6, -6, 6.4); PG(g, c[0], [-12, 2, -15, -4, -8, -1]);
      E(g, DK, -3, 5, 5.5, 3.6, -0.2); C(g, EYE, 7.6, -7.6, 1.15); } },
    rope: { cols: [['#FF8A80', '#FFFFFF'], ['#7FC8A9', '#FFFFFF'], ['#7FB7E6', '#FFFFFF']], d(g, c) {
      LN(g, c[0], 1.6, [-10, 7, -14, 11]); LN(g, c[0], 1.6, [-10, 7, -13, 5]); LN(g, c[0], 1.6, [10, -7, 14, -11]); LN(g, c[0], 1.6, [10, -7, 13, -5]);

      else { const s = 9 + Math.min(1, e * 3) * 3; ctx.strokeStyle = 'rgba(255,255,255,' + (1 - e).toFixed(2) + ')'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(r.x - s, r.y - s); ctx.lineTo(r.x + s, r.y + s); ctx.moveTo(r.x + s, r.y - s); ctx.lineTo(r.x - s, r.y + s); ctx.stroke(); ctx.strokeStyle = 'rgba(255,107,107,' + (1 - e).toFixed(2) + ')'; ctx.lineWidth = 4; ctx.stroke(); } }
    for (const f of flies) { const e = f.t * f.t * (3 - 2 * f.t), x = lerp(f.x0, f.x1, e), y = lerp(f.y0, f.y1, e) - Math.sin(e * Math.PI) * 50; ctx.save(); ctx.globalAlpha = f.t > 0.85 ? (1 - f.t) / 0.15 : 1; drawItem(ctx, f.o.type, f.o.col, x, y, lerp(D.size * S * 1.25, 1.1, e)); ctx.restore(); }
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); ctx.fillStyle = p.c; star(p.x, p.y, p.r, p.rot); } ctx.globalAlpha = 1;
    if (floats.length) { ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 15px ' + FONT; ctx.lineJoin = 'round';
      for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life / 0.35); ctx.strokeStyle = 'rgba(25,31,40,.7)'; ctx.lineWidth = 4; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); } ctx.globalAlpha = 1; }
    if (cursor.on && state === 'play') { const x = cursor.x * S, y = cursor.y * S; ctx.strokeStyle = 'rgba(25,31,40,.55)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.stroke(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.stroke(); C(ctx, '#FFFFFF', x, y, 3); }
    placeKong();
  }
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now;
    if (state === 'pause') return;
    tAnim += dt; update(dt); fxStep(dt); draw();
  }

  // ═══════ 입력 ═══════
  fx.addEventListener('pointerdown', e => { if (e.button > 0 || state !== 'play') return; e.preventDefault(); cursor.on = false; tapAt(e.clientX / S, e.clientY / S); });
  $('btnHint').addEventListener('click', () => { useHint(); });
  $('btnStart').addEventListener('click', () => { sfx('tap'); start(); });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - endAt < 450) return; sfx('tap'); start(); });
  // 결과 카드가 뜬 직후에는 난이도 단추도 잠깐 안 눌린다 (화면을 두드리던 손가락에 바뀌지 않게)
  $('cardEnd').addEventListener('click', e => { if (performance.now() - endAt < 450 && e.target.closest && e.target.closest('.kg-diff')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); last = 0; });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = 0; });
  const ARROW = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', KeyA: 'l', KeyD: 'r', KeyW: 'u', KeyS: 'd' };
  document.addEventListener('keydown', e => {
    const onBtn = e.target && e.target.closest && e.target.closest('button, a');
    if (ARROW[e.code]) { if (state === 'play') { e.preventDefault(); if (!cursor.on) { cursor.on = true; cursor.x = LW / 2; cursor.y = (G.A.y + G.B.y) / 2 - 40; } keys[ARROW[e.code]] = 1; } return; }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (state === 'play') { e.preventDefault(); if (onBtn) onBtn.blur(); if (cursor.on) tapAt(cursor.x, cursor.y); return; }
      if (onBtn) return;   // 단추에 초점이 있으면 단추가 알아서
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'pause') resume(); else if (state === 'result' && performance.now() - endAt >= 900) start();
    } else if (e.code === 'KeyH') { if (state === 'play') useHint(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => { if (ARROW[e.code]) keys[ARROW[e.code]] = 0; });

  // ═══════ 시작 ═══════
  // 난이도 고르기: 시작 카드·결과 카드에만. 결과 카드의 기록은 방금 끝난 판(diffId)의 것으로 고정하고, 다른 난이도를 골라 두었으면 어느 난이도 기록인지 밝힌다
  function paintBest() {
    const b = best(KG.dkey('seek'));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = Math.max(best(KG.dkey('seek', diffId)), state === 'result' ? score : 0);
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !endNew;
    if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; paintRoom(); timeLeft = D.time; shownTime = -1; paintHud(); }
  }
  for (const id of ['cardStart', 'cardEnd']) { const card = $(id).querySelector('.kg-card'); card.insertBefore(KG.diffPicker(null, paintBest), card.querySelector('.row')); }
  cur = null; D = DIFF[KG.diff()] || DIFF.normal; timeLeft = D.time;
  // 시작 전 배경: 아무 방이나 하나 (물건 없이) 보여 주고 콩이가 앞에서 기다린다
  const backdrop = pick(SCENES); cur = { sc: backdrop, objs: [], kong: { found: true, vis: { pts: [], rep: [0, 0] }, grp: 'A', sp: backdrop.A.kong[0], hide: 0 } };
  stage.classList.add('out'); layout(); cur.objs = []; paintBest(); paintRoom(); paintHud();
  { const list = $('list'); list.textContent = ''; const s = document.createElement('span'); s.className = 'ph'; s.textContent = '찾을 것들이 여기에 나와요'; list.appendChild(s); }
  requestAnimationFrame(frame);

  // 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (한 번만 띄우는 것은 공통이 한다). 「규칙 보기」 로 다시 볼 수 있다
  const RULES = { key: 'seek', title: TITLE, lead: '방 안에 숨은 ' + J(name, '과/와') + ' 장난감을 찾는 놀이예요', items: [
    ['🔍', '아래 목록에 있는 그림을 방에서 찾아 눌러요'],
    ['🐶', '가구 뒤에 숨은 ' + name + '도 찾아요. 귀나 꼬리만 살짝 보여요'],
    ['⏱️', '시간 안에 다 찾으면 다음 방으로 가요. 엉뚱한 곳을 누르면 시간이 줄어요'],
    ['💡', '못 찾겠으면 힌트를 눌러요. 대신 점수가 조금 깎여요']
  ] };
  // 안내를 닫은 키(Enter·스페이스)를 아직 누르고 있는 동안에는 그 키가 방금 초점을 받은 「시작」 단추를 누르지 못하게 한다
  let closeKey = false;
  addEventListener('keydown', e => { if (!closeKey) return; if (e.repeat) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); } } else closeKey = false; }, true);
  addEventListener('keyup', e => { if (!closeKey) return; closeKey = false; if (e.code === 'Enter' || e.code === 'Space') e.preventDefault(); }, true);
  addEventListener('pointerdown', () => { closeKey = false; }, true);
  const focusStart = () => { if (state === 'ready' && !KG.rulesOpen) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  function showRules(force) { return KG.rules(RULES, force).then(shown => { if (shown) closeKey = true; focusStart(); }); }
  $('btnRules').addEventListener('click', () => { sfx('tap'); showRules(true); });
  showRules(false);

  // ═══════ 시험·디버그용 ═══════
  //   targets(): 찾을 것들의 화면 좌표 [{ kind:'kong'|'item', type, col, found, x, y(px), r(누를 수 있는 반지름 px), vis(보이는 비율) }] · decoys(): 가짜들
  //   tap(x, y): 화면 px 를 누른다 → 'item'|'kong'|'decoy'|'miss'|'ignored' · hint() · verify() · step(dt): 화면 없이 빨리 돌리기
  const pubObj = o => { const p = toPx(o.grp, o.x, o.y); return { kind: 'item', type: o.type, col: o.col, found: o.found, x: p.x, y: p.y, r: hitR(o) * S, vis: o.f, grp: o.grp }; };
  window.GAME = {
    get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get debt() { return debt; }, get diff() { return diffId; }, get D() { return D; }, get timeLeft() { return timeLeft; },
    get room() { return roomIdx; }, get roomsDone() { return roomsDone; }, get found() { return foundN; }, get total() { return totalN; }, get wrong() { return wrongN; }, get hints() { return hintN; }, get scene() { return cur && cur.sc.id; }, get kMode() { return kMode; },
    DIFF, SCENES,
    targets() { if (!cur || state === 'ready') return []; const k = cur.kong, p = toPx(k.grp, k.vis.rep[0], k.vis.rep[1]); return [{ kind: 'kong', found: k.found, x: p.x, y: p.y, r: kongPad() * S, vis: k.vis.f, area: k.vis.area, grp: k.grp }].concat(cur.objs.filter(o => o.target).map(pubObj)); },
    decoys() { return cur ? cur.objs.filter(o => !o.target).map(pubObj) : []; },
    field: () => ({ W, H, S, LW, LH, wide, A: { x: G.A.x, y: G.A.y }, B: { x: G.B.x, y: G.B.y }, floorY }),
    tap: (x, y) => tapAt(x / S, y / S), hint: useHint, verify, start, pause, resume,
    end: () => { if (state === 'pause') resume(); if (state === 'play') finish(false); },
    step: dt => { if (state === 'pause') return; tAnim += dt; update(dt); fxStep(dt); },
    // 모든 방·난이도에서 방을 n 번씩 꾸며 보고 가장 덜 보인 값을 돌려준다 (숨은 것이 늘 보이는지 확인)
    audit(n) { const out = {}; for (const id of Object.keys(DIFF)) { const d = DIFF[id], r = { builds: 0, fail: 0, minItem: 1, minItemArea: 1e9, minKong: 1, minKongArea: 1e9, items: 0, decoys: 0 }; for (const sc of SCENES) for (let i = 0; i < n; i++) { const b = buildScene(sc, d); r.builds++; if (!b) { r.fail++; continue; }
      for (const o of b.objs) { const v = itemVis(sc, o.grp, o.x, o.y, o.z, o.type, d.size); r.minItem = Math.min(r.minItem, v.f); r.minItemArea = Math.min(r.minItemArea, v.area); if (o.target) r.items++; else r.decoys++; }
      r.minKong = Math.min(r.minKong, b.kong.vis.f); r.minKongArea = Math.min(r.minKongArea, b.kong.vis.area); } r.items /= r.builds; r.decoys /= r.builds; out[id] = r; } return out; },
    // 지금 화면에 실제로 그려진 그림으로 다시 잰다: 찾을 물건마다 「그 물건을 뺀 그림」과 달라지는 화면 넓이(px²), 콩이는 가구 그림이 비어 있는 점의 수 · 화면 안(점수판 아래 ~ 목록 위)에 있는지
    pixelCheck() {
      if (!cur || state === 'ready') return null; const w = cache.width, h = cache.height, out = { minItemPx: 1e9, kongPts: 0, kongAll: 0, inView: true, n: 0 };
      const top = $('hud').getBoundingClientRect().bottom, bot = $('tray').getBoundingClientRect().top;
      for (const o of cur.objs) { if (!o.target || o.found) continue; const p = toPx(o.grp, o.x, o.y), r = Math.ceil((IR * D.size + 3) * S * DPR), x0 = Math.max(0, Math.round(p.x * DPR) - r), y0 = Math.max(0, Math.round(p.y * DPR) - r), ww = Math.min(w - x0, r * 2), hh = Math.min(h - y0, r * 2);
        if (ww <= 0 || hh <= 0) { out.minItemPx = 0; out.inView = false; continue; }
        const a = cg.getImageData(x0, y0, ww, hh).data; o.found = true; drawCache(); const b = cg.getImageData(x0, y0, ww, hh).data; o.found = false; drawCache();
        let n = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) + Math.abs(a[i + 3] - b[i + 3]) > 40) n++;
        out.minItemPx = Math.min(out.minItemPx, n / (DPR * DPR)); out.n++; if (p.y - 8 < top || p.y + 8 > bot || p.x < 8 || p.x > W - 8) out.inView = false; }
      const k = cur.kong; if (!k.found) { out.kongAll = k.vis.pts.length / 2; for (let i = 0; i < k.vis.pts.length; i += 2) { const p = toPx(k.grp, k.vis.pts[i], k.vis.pts[i + 1]), x = Math.round(p.x * DPR), y = Math.round(p.y * DPR); if (x >= 0 && y >= 0 && x < w && y < h && p.y > top && p.y < bot && cg.getImageData(x, y, 1, 1).data[3] < 128) out.kongPts++; }
        const q = toPx(k.grp, k.vis.rep[0], k.vis.rep[1]); if (q.y < top || q.y > bot || q.x < 0 || q.x > W) out.inView = false; }
      return out; },
    // 자리마다 보이는 비율 (자리를 다듬을 때 본다)
    spots(size) { const out = {}; for (const sc of SCENES) for (const grp of ['A', 'B']) { out[sc.id + grp] = sc[grp].spots.map(s => +itemVis(sc, grp, s[0], s[1], s[2], 'ball', size || 1).f.toFixed(2)); out[sc.id + grp + 'k'] = sc[grp].kong.map(sp => [0, 0.5, 1].map(h => +kongVis(sc, grp, sp, h).f.toFixed(2))); } return out; },
    show(id, opts) { const sc = SCENES.find(s => s.id === id); opts = opts || {}; cur = { sc, objs: opts.all ? ['A', 'B'].flatMap(grp => sc[grp].spots.map((s, i) => ({ grp, x: s[0], y: s[1], z: s[2], type: TYPES[i % TYPES.length], col: i % 3, target: false, found: false }))) : [], kong: { grp: opts.grp || 'A', sp: sc[opts.grp || 'A'].kong[opts.k || 0], hide: opts.hide || 0, vis: { pts: [], rep: [0, 0] }, found: false } }; kMode = 'hide'; stage.classList.remove('out'); drawBg(); drawCache(); }
  };
})();
</script>
