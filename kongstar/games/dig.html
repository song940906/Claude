<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이는 도굴단</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이는 도굴단: 밤하늘(bg) → 발굴판(bd) → 콩이(stage) → 반짝이·힌트 고리(fx) → 점수판·도구 순서로 겹친다 */
#bg, #bd, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#bd { z-index: 1; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: pointer; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud svg { width: 17px; height: 17px; display: block; flex: none; }
#hud .hp.pop svg { animation: hpPop .45s; }
#hud .hp.low { border-color: rgba(255,138,128,.7); }
@keyframes hpPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
#hud .st { color: #D5DBFF; font-weight: 500; }
#hud .sc { margin-left: auto; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud.col { flex-wrap: wrap; align-content: flex-start; gap: 5px; }
#hud.col .sc { margin-left: 0; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
#tools { position: fixed; z-index: 10; display: flex; gap: 8px; }
#tools.col { flex-direction: column; }
.tool { position: relative; flex: 1 1 0; min-width: 0; height: 56px; box-sizing: border-box; border: 2px solid transparent; border-radius: 16px; background: rgba(255,255,255,.9); color: #4E5968; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 4px; font-size: 12.5px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; transition: transform .12s, box-shadow .12s; }
.tool svg { width: 24px; height: 24px; display: block; }
.tool.on { background: #fff; color: var(--pri); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,97,.35), 0 4px 12px rgba(0,0,0,.25); transform: translateY(-3px); font-weight: 700; }
.tool.on::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: var(--pri); }
.tool:active { filter: brightness(.95); }
.tool em { position: absolute; right: 5px; top: 4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: var(--pri); color: #fff; font-style: normal; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.tool.none { color: #7B8490; background: rgba(255,255,255,.74); }
.tool.none em { background: #9AA3AF; }
#tools.col .tool { flex: 0 0 auto; height: 52px; }
#say { position: fixed; z-index: 12; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 7px 14px; border-radius: 18px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: -.3px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); pointer-events: none; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; }
#say.show { opacity: 1; transform: none; }
#banner { position: fixed; z-index: 11; text-align: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .28s, transform .28s; }
#banner.show { opacity: 1; transform: none; }
#banner b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.5px; color: #fff; text-shadow: 0 2px 14px rgba(10,14,50,.8); }
#banner span { display: block; margin-top: 4px; white-space: nowrap; font-size: 14px; font-weight: 600; color: #FFE7A6; text-shadow: 0 1px 8px rgba(10,14,50,.9); }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .info { margin-top: 10px; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .tool { font-size: 12px; } .tool em { right: 2px; top: 2px; min-width: 18px; height: 18px; line-height: 18px; font-size: 11px; padding: 0 4px; } }
/* 낮은 세로 화면(320×568 쯤): 카드를 조금 촘촘하게 */
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
  body .kg-card .info { margin-top: 8px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 420px); padding: 12px 20px; }
  body .kg-card h2 { margin-bottom: 2px; font-size: 19px; }
  #stLead, #edText { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 7px 14px; }
  body .kg-card .how p { font-size: 13px; }
  body .kg-card .how p + p { margin-top: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .info { margin-top: 6px; }
  body .kg-card .rec { margin-top: 6px; }
  body .kg-card .rec span { padding: 5px 10px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 32px; margin: 0; }
  #banner b { font-size: 20px; }
}
/* 가로 낮은 화면(나란히): 이 게임은 원래 결과 겉상자에 위 줄 여백이 없어(quiz 는 있음) 결과 카드가 왼쪽으로 밀리면 「게임」 단추가 카드 머리를 덮는다 — 위 줄 아래부터 놓는다 */
/*   그만큼 낮아진 데다 순위 카드 몫으로 폭도 좁아져 글이 두 줄이 되므로, 「다시 하기」가 첫 화면에 들어오게 카드 위아래 여백을 줄이고 「새 기록」 딱지를 점수 옆에 붙인다 (quiz 의 낮은 화면 처리와 같은 방식) */
@media (orientation: landscape) and (max-height: 520px) {
  #cardEnd.kg-rbwrap { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }
  #cardEnd.kg-rbwrap > .kg-card { padding-top: 8px; padding-bottom: 8px; }
  #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { vertical-align: middle; margin: 0 0 0 8px; }
}
</style>

<div id="hud" aria-hidden="true">
  <div class="hp" id="hudHp"><svg viewBox="0 0 24 24"><path fill="#FF8A80" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" d="M12 20.3c-4.9-3.6-8-6.6-8-10.2A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.5c0 3.6-3.1 6.6-8 10.2z"/></svg><span id="hudHearts">0</span></div>

  <button class="tool" id="tNose" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.8C6 6.9 8.7 5.5 12 5.5s6 1.400 6 3.300c0 2.700-3 5.400-6 5.400S6 11.500 6 8.800z" fill="currentColor"/><path d="M7.800 17.600c1.400 1.300 3.200 1.100 4.200-.7 1 1.800 2.800 2 4.200.7"/></svg><span id="noseLb">콩이 코</span><em id="noseN">0</em></button>

    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain" type="button">다시 하기</button></div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const TITLE = J(name, '은/는') + ' 도굴단';

  // ═══════ 난이도: 수치는 여기 한 곳에만 ═══════
  //   sizes: 유적마다의 판 크기 [가로, 세로] (목록이 끝나면 마지막 크기 그대로) · dens: [첫 유적의 묻힌 비율, 유적마다 더하기, 위 한계]
  //   hearts/maxHearts: 시작 하트·가질 수 있는 최대 · heal: 유적 몇 곳을 끝낼 때마다 하트 +1 (0 = 없음) · healTo: 이 유적까지만 회복(없으면 끝까지 — 판이 다 커진 뒤에도 회복하면 쉬운 난이도가 끝나지 않는다) · hints: 유적마다 「콩이 코」 횟수
  //   mult: 점수 배율 · logic: 풀이에 필요한 추리 ('basic' = 숫자 하나만 보면 됨, 'pair' = 이웃한 두 숫자를 견주는 추리까지)
  //   dinoFrom: 큰 유물(공룡 뼈)이 나오기 시작하는 유적 · par: 칸마다 주는 「빨리」 기준 시간(초)
  const DIFF = {
    easy:   { sizes: [[6, 6], [6, 7], [7, 7], [7, 8], [7, 9]],    dens: [0.11, 0.008, 0.15], hearts: 5, maxHearts: 6, heal: 1, healTo: 5, hints: 5, mult: 1,   logic: 'basic', dinoFrom: 4, par: 3.2 },
    normal: { sizes: [[7, 8], [7, 9], [8, 9], [8, 10], [9, 10]],  dens: [0.14, 0.008, 0.18], hearts: 4, maxHearts: 5, heal: 1, healTo: 5, hints: 3, mult: 1.5, logic: 'pair',  dinoFrom: 3, par: 2.8 },
    hard:   { sizes: [[8, 9], [8, 10], [9, 10], [9, 11], [10, 11]], dens: [0.16, 0.008, 0.20], hearts: 3, maxHearts: 4, heal: 2, hints: 2, mult: 2.2, logic: 'pair',  dinoFrom: 2, par: 2.5 },
    vhard:  { sizes: [[9, 10], [9, 11], [10, 11], [10, 12]],      dens: [0.18, 0.008, 0.22], hearts: 2, maxHearts: 3, heal: 3, hints: 1, mult: 3,   logic: 'pair',  dinoFrom: 2, par: 2.2 }
  };
  // 점수(배율 전): 뼈 · 금화 · 옛 항아리 · 공룡 뼈를 온전히 · 유적 완료(+유적마다) · 빨리(최대) · 실수 없이
  const PTS = { bone: 10, coin: 40, jar: 60, dino: 120, clear: 50, clearStep: 10, fast: 100, clean: 50 };
  const KIND = { BONE: 1, COIN: 2, JAR: 3, DINO: 4 };
  const KNAME = ['', '뼈', '금화', '옛 항아리', '공룡 뼈'];
  let diffId = 'normal', D = DIFF.normal;        // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 판과 풀이기 (화면과 무관한 순수 함수) ═══════
  //   B = { w, h, n, nb[i] = 둘레 칸들, bur[i] 묻힘 0/1, num[i] 둘레에 묻힌 수, kind[i], dino: [칸…]|null, gen: 만들어졌는지 }
  //   st[i]: 0 닫힘 · 1 열림(빈 칸) · 2 찾음(붓) · 3 부서짐(삽)
  function mkNB(w, h) {
    const nb = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const a = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < w && yy < h) a.push(yy * w + xx); } nb.push(a); }
    return nb;
  }
  function blank(w, h) { const n = w * h; return { w, h, n, nb: mkNB(w, h), bur: new Uint8Array(n), num: new Uint8Array(n), kind: new Uint8Array(n), dino: null, gen: false, total: 0 }; }
  function openFlood(B, st, i, out) {
    if (st[i] !== 0 || B.bur[i]) return; const stack = [i]; st[i] = 1; if (out) out.push(i);
    while (stack.length) { const c = stack.pop(); if (B.num[c]) continue; for (const j of B.nb[c]) if (st[j] === 0 && !B.bur[j]) { st[j] = 1; if (out) out.push(j); stack.push(j); } }
  }
  // 지금 논리로 확정되는 칸들 → [{ i, bury(묻힌 칸인지), rule: 'basic'|'pair', from: [근거가 된 숫자 칸] }]
  //   basic: 숫자 하나 — 남은 수가 0 이면 둘레의 닫힌 칸은 모두 빈 칸, 남은 수 = 닫힌 칸 수면 모두 묻힌 칸
  //   pair : 이웃한 두 숫자 A·B — (A 남은 수 − B 남은 수) = A 에만 닿는 닫힌 칸 수면, A 에만 닿는 칸은 모두 묻혔고 B 에만 닿는 칸은 모두 비었다 (부분집합 추리를 품는다)
  function deduce(B, st, level) {
    const cs = [], out = [], seen = new Set();
    for (let i = 0; i < B.n; i++) { if (st[i] !== 1 || !B.num[i]) continue; let r = B.num[i]; const U = []; for (const j of B.nb[i]) { if (st[j] === 0) U.push(j); else if (st[j] >= 2) r--; } if (U.length) cs.push({ c: i, U, r }); }
    const add = (i, bury, rule, from) => { if (!seen.has(i)) { seen.add(i); out.push({ i, bury, rule, from }); } };
    for (const c of cs) { if (c.r === 0) for (const j of c.U) add(j, false, 'basic', [c.c]); else if (c.r === c.U.length) for (const j of c.U) add(j, true, 'basic', [c.c]); }
    if (out.length || level === 'basic') return out;
    const w = B.w;
    for (const a of cs) {
      const ax = a.c % w, ay = (a.c / w) | 0;
      for (const b of cs) {
        if (a === b) continue; const bx = b.c % w, by = (b.c / w) | 0; if (Math.abs(ax - bx) > 2 || Math.abs(ay - by) > 2) continue;
        const aOnly = a.U.filter(j => !b.U.includes(j)); if (aOnly.length === a.U.length) continue;     // 겹치는 칸이 없다
        if (a.r - b.r !== aOnly.length) continue;
        const bOnly = b.U.filter(j => !a.U.includes(j));
        for (const j of aOnly) add(j, true, 'pair', [a.c, b.c]); for (const j of bOnly) add(j, false, 'pair', [a.c, b.c]);
      }
    }

  }
  for (const ev of ['resize', 'pointerdown', 'keydown']) addEventListener(ev, () => { lzK = null; }, true);
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (drawNow(now, state === 'ready' || state === 'pause' || state === 'result' ? state : null)) {
      if (dirty || tAnim < animUntil + 0.05) { dirty = false; drawBoard(); }
      drawKong(); drawFx();
    }
    requestAnimationFrame(frame);
  }

  // ═══════ 입력 ═══════
  //   짧게 누르면 고른 도구로, 길게(0.42초) 누르면 「뼈일지도?」 표시. 마우스 오른쪽 단추도 표시.
  let press = null;
  const LONG = 420;
  fxc.addEventListener('pointerdown', e => {
    if (state !== 'play' || KG.rulesOpen) return;
    const i = cellAt(e.clientX, e.clientY); kbd = false; if (i < 0) return;
    e.preventDefault(); cur = i;
    if (e.button === 2) { toggleFlag(i); return; }
    if (press) clearTimeout(press.tm);
    const p = { id: e.pointerId, i, x: e.clientX, y: e.clientY, long: false, tm: 0 }; press = p;
    p.tm = setTimeout(() => { if (press === p && state === 'play') { p.long = true; toggleFlag(i); } }, LONG);
  });
  fxc.addEventListener('pointermove', e => { if (press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) { clearTimeout(press.tm); press = null; } });
  fxc.addEventListener('pointerup', e => {
    const p = press; if (!p || p.id !== e.pointerId) return; clearTimeout(p.tm); press = null;
    if (p.long || state !== 'play') return;
    if (cellAt(e.clientX, e.clientY) !== p.i) return;
    if (tool === 'brush') brush(p.i); else dig(p.i);
  });
  fxc.addEventListener('pointercancel', () => { if (press) { clearTimeout(press.tm); press = null; } });
  const toolBtn = (id, fn) => $(id).addEventListener('click', e => { if (state !== 'play' || KG.rulesOpen) return; fn(); e.currentTarget.blur(); });
  toolBtn('tDig', () => { sfx('tap'); setTool('dig'); });
  toolBtn('tBrush', () => { sfx('tap'); setTool('brush'); });
  toolBtn('tNose', useHint);
  function moveCur(ddx, ddy) {     // 화면에서 본 방향 → 판 좌표 (눕힌 판이면 바꿔서)
    let x = cur % B.w, y = (cur / B.w) | 0; if (T) { x += ddy; y += ddx; } else { x += ddx; y += ddy; }
    cur = clamp(y, 0, B.h - 1) * B.w + clamp(x, 0, B.w - 1); kbd = true;
  }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (KG.rulesOpen) return;
    if (state === 'play' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (k === 'ArrowLeft') { moveCur(-1, 0); e.preventDefault(); return; }
      if (k === 'ArrowRight') { moveCur(1, 0); e.preventDefault(); return; }
      if (k === 'ArrowUp') { moveCur(0, -1); e.preventDefault(); return; }
      if (k === 'ArrowDown') { moveCur(0, 1); e.preventDefault(); return; }
      if (k === ' ') { if (e.target && e.target.closest && e.target.closest('.kg-top')) return; e.preventDefault(); if (!e.repeat) { kbd = true; setTool('dig'); dig(cur); } return; }
      if (k === 'b' || k === 'B' || k === 'ㅠ') { e.preventDefault(); if (!e.repeat) { kbd = true; setTool('brush'); brush(cur); } return; }
      if (k === 'f' || k === 'F' || k === 'ㄹ') { e.preventDefault(); if (!e.repeat) { kbd = true; toggleFlag(cur); } return; }
      if (k === 'h' || k === 'H' || k === 'ㅗ') { e.preventDefault(); if (!e.repeat) useHint(); return; }
    }
    if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'result') again(); else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P' || k === 'ㅔ') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  // 결과 카드가 뜬 직후 0.45초는 누름을 넘긴다 (판을 두드리던 손가락이 「다시 하기」 를 누르지 않게)
  function again() { if (state !== 'result' || performance.now() - endAt < 450) return; start(); }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen && state === 'ready') start(); });
  $('btnAgain').addEventListener('click', again);
  $('cardEnd').addEventListener('click', e => { if (performance.now() - endAt < 450) { e.preventDefault(); e.stopPropagation(); } }, true);
  $('btnResume').addEventListener('click', resume);
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));

  // ═══════ 시작 ═══════
  $('stTitle').textContent = TITLE; $('stLead').textContent = '마당에 묻힌 뼈와 보물을 숫자를 보고 찾아내요.';
  $('noseLb').textContent = name.length <= 3 ? name + ' 코' : '코 힌트';
  function paintStart() { const d = DIFF[KG.diff()] || DIFF.normal, a = d.sizes[0]; $('stInfo').textContent = a[0] + '×' + a[1] + ' 판부터 · 하트 ' + d.hearts + '개 · ' + J(name, '') + ' 코 ' + d.hints + '번'; }
  // 난이도 고르기: 시작 카드·결과 카드에만 (고르면 그 난이도의 최고 기록을 보여 준다, 없으면 숨김)
  function paintBest() {
    const b = best(KG.dkey('dig'));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    // 결과 카드는 방금 끝난 판(diffId)의 기록으로 고정 — 다음 판 난이도를 바꿔도 그 판 점수·'새 기록' 딱지와 어긋나지 않게. 다른 난이도를 골라 두었으면 어느 난이도 기록인지 밝힌다
    const e = best(KG.dkey('dig', diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
  }
  $('stInfo').before(KG.diffPicker(null, () => { if (state === 'ready') preview(); paintBest(); }));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'dig');   // 결과 카드 아래(가로 화면은 오른쪽) 가족 순위 카드
  KG.startRank($('cardStart'), 'dig');   // 시작 카드 아래에 고른 난이도의 가족 순위
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; hearts = D.hearts; newSite(); paintStart(); paintBest();
  // 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (공통이 sessionStorage 로 기억), 시작 카드의 「규칙 보기」 로 다시
  const RULES = { key: 'dig', title: TITLE, lead: J(name, '이/가') + ' 마당에서 옛 뼈와 보물을 찾아요.', items: [
    ['⛏️', '「삽」으로 칸을 파면 숫자가 나와요. 숫자는 그 칸 둘레 8칸에 묻힌 뼈·보물의 수예요.'],
    ['🖌️', '묻혀 있다고 확신한 칸은 「붓」으로 살살 꺼내요. 모두 꺼내면 다음 유적으로 가요.'],
    ['💗', '묻힌 칸을 삽으로 파거나 빈 칸을 붓질하면 하트가 줄고, 하트가 다 없어지면 끝나요.'],
    ['👃', '막히면 「' + J(name, '') + ' 코」를 눌러요. 칸을 길게 누르면 「뼈일지도?」 표시를 남겨요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용 (좌표는 판 좌표: x 0~w-1, y 0~h-1 — 가로 화면에서 판을 눕혀 그려도 같다)
  window.GAME = {
    get state() { return state; }, get score() { return score; }, get hearts() { return hearts; }, get site() { return site; }, get sitesDone() { return sitesDone; }, get found() { return found; },
    get diff() { return diffId; }, get D() { return D; }, get tool() { return tool; }, get hintsLeft() { return hintsLeft; }, get hint() { return hint; }, get left() { return leftCount(); }, get siteTime() { return siteTime; },
    // 판 상태: cells[y][x] = 닫힘 '#' · 깃발 'F' · 열림 숫자 0~8 · 찾음 'B' · 부서짐 'X'
    board: () => ({ w: B.w, h: B.h, gen: B.gen, total: B.total, tries: B.tries, pairs: B.pairs, ok: B.ok, dino: B.dino ? B.dino.slice() : null,
      cells: Array.from({ length: B.h }, (_, y) => Array.from({ length: B.w }, (_, x) => { const i = y * B.w + x, v = st[i]; return v === 0 ? (flag[i] ? 'F' : '#') : v === 1 ? B.num[i] : v === 2 ? 'B' : 'X'; })),
      truth: Array.from({ length: B.h }, (_, y) => Array.from({ length: B.w }, (_, x) => B.kind[y * B.w + x])) }),
    field: () => ({ W, H, BX, BY, BW, BH, CS, DC, DR, land, T, KSZ, KH }),
    cellRect: (x, y) => { const p = cellPos(y * B.w + x); return { x: p.x, y: p.y, w: CS, h: CS }; },
    start, end, pause, resume, setTool, useHint, solveStep,
    dig: (x, y) => dig(y * B.w + x), brush: (x, y) => brush(y * B.w + x), flag: (x, y) => toggleFlag(y * B.w + x),
    // 논리로 확정되는 수만으로 이 유적을 끝까지 → { ok, steps, pair, stuck } (찍어야 하면 stuck)
    autoSolve: () => {
      let steps = 0, pair = 0; if (state !== 'play') return { ok: false, steps, pair, stuck: false };
      const s0 = site;
      while (state === 'play' && site === s0 && steps < 2000) { const s = solveStep(); if (!s) break; if (s.rule === 'nose') return { ok: false, steps, pair, stuck: true }; if (s.rule === 'pair') pair++; if (s.bury) brush(s.i); else dig(s.i); steps++; }
      return { ok: state === 'clear' || site !== s0, steps, pair, stuck: false };
    },
    step: dt => { tAnim += dt; if (state !== 'pause') update(dt); drawKong(); },   // 시험용: 화면 없이 빨리 돌리기
    lib: { DIFF, PTS, blank, generate, deduce, solvable, openFlood, sizeAt, densAt, planCount }
  };
})();
</script>
</body>
</html>
