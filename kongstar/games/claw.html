<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 인형뽑기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 인형뽑기: 밤하늘(bg) → 뽑기 상자·인형·집게(cv) → 콩이(stage) → 안긴 인형·글자(fx, 누르는 판) → 점수판·「멈춰!」 단추 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .ic { font-size: 14px; line-height: 1; }
#hud .bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .cn.warn { background: rgba(229,72,77,.66); }
#hud.col { flex-direction: column; align-items: stretch; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
/* 「멈춰!」 큰 단추 */
#btnStop { position: fixed; z-index: 11; height: 60px; border: 0; border-radius: 20px; padding: 0 16px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, #FFD98A, #FFC14F); color: #3B2A05; font-size: 20px; font-weight: 800; letter-spacing: -.4px; box-shadow: 0 6px 18px rgba(0,0,0,.28), inset 0 -3px 0 rgba(160,100,10,.25); transition: opacity .15s, transform .08s; touch-action: manipulation; }
#btnStop svg { width: 26px; height: 26px; flex: none; }
#btnStop:active, #btnStop.press { transform: translateY(2px) scale(.98); box-shadow: 0 3px 10px rgba(0,0,0,.25), inset 0 -1px 0 rgba(160,100,10,.25); }
#btnStop.wait { opacity: .42; }
#btnStop.low { height: 52px; font-size: 18px; border-radius: 18px; }
/* 빈 제목 칸이 상자 위쪽 누름을 가로채지 않게 */
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row .kg-btn { white-space: nowrap; }
.kg-card .row .mini { flex: 0 0 auto; padding: 0 14px; font-size: 15px; color: var(--sub); }
.kg-card .got { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 8px; }
.kg-card .got span { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--sub); background: #F7F2FF; border-radius: 10px; padding: 3px 8px; }
.kg-card .got canvas { width: 22px; height: 22px; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
/* 인형 도감 */
#cardDex { z-index: 28; }
#cardDex .kg-card { width: min(100%, 420px); box-sizing: border-box; padding: 18px 14px 14px; display: flex; flex-direction: column; overflow: hidden; }
#cardDex h2 { margin-bottom: 2px; }
#dexList { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-content: start; }
#dexList .cell { background: var(--soft); border-radius: 14px; padding: 6px 3px 8px; min-width: 0; }
#dexList .cell canvas { display: block; width: 100%; aspect-ratio: 1 / 1; }
#dexList .cell b { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dexList .cell span { display: block; font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dexList .cell.no b { color: #9AA3AF; }
#dexList .cell em.pt { display: block; font-style: normal; font-size: 11.5px; font-weight: 700; color: #6B4FD8; margin-top: 2px; font-variant-numeric: tabular-nums; }
#dexList .cell i { display: inline-block; white-space: nowrap; font-style: normal; font-size: 10.5px; font-weight: 700; border-radius: 7px; padding: 1px 6px; margin-top: 3px; }
#dexList .r0 { background: #E9EDF3; color: #5F6B78; } #dexList .r1 { background: #DFF3E8; color: #1F8A5B; } #dexList .r2 { background: #E3E8FF; color: #3B49B8; } #dexList .r3 { background: #FFEFC9; color: #A26B00; }
#cardDex .kg-btn { width: 100%; margin-top: 10px; flex: none; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } body .kg-card .row { gap: 6px; } body .kg-card .row .kg-btn { font-size: 14.5px; padding: 0 6px; } body .kg-card .row .mini { padding: 0 9px; font-size: 14px; } body .kg-card { padding-left: 16px; padding-right: 16px; } #dexList { grid-template-columns: repeat(3, 1fr); } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  #cardDex .kg-card { width: min(100%, 640px); padding: 12px 14px; }
  #dexList { grid-template-columns: repeat(4, 1fr); margin-top: 6px; }
  #dexList .cell { display: flex; align-items: center; gap: 4px; padding: 4px 6px; text-align: left; }
  #dexList .cell canvas { width: 36px; flex: none; }
  #dexList .cell > div { min-width: 0; flex: 1; }
  #dexList .cell b { font-size: 12px; letter-spacing: -.5px; white-space: normal; word-break: keep-all; line-height: 1.15; }
  #dexList .cell i { margin-top: 1px; }
  #dexList .cell { position: relative; }
  #dexList .cell em.pt { position: absolute; left: 3px; bottom: 3px; margin: 0; font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 7px; background: rgba(255,255,255,.9); }   /* 가로 화면은 칸이 좁아 점수를 그림 모서리 딱지로 */
  #cardDex .kg-btn { height: 42px; margin-top: 8px; }
}
/* 순위 카드와 나란히 서는 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 520px) {
  #cardEnd.kg-rbwrap, #cardStart.kg-rbwrap { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  /* 점수 내역은 남긴다: 한 줄로 줄이고, 넘치면 옆으로 밀어 보게 */
  body .kg-rbwrap > .kg-card .got { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; gap: 4px; margin-top: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  body .kg-rbwrap > .kg-card .got::-webkit-scrollbar { display: none; }
  body .kg-rbwrap > .kg-card .got span { flex: none; font-size: 11.5px; padding: 1px 6px; white-space: nowrap; }
  body .kg-rbwrap > .kg-card .got canvas { width: 16px; height: 16px; }
  body .kg-rbwrap > .kg-card .got > :first-child { margin-left: auto; }   /* 적을 땐 가운데, 넘치면 왼쪽부터 */
  body .kg-rbwrap > .kg-card .got > :last-child { margin-right: auto; }
}
@media (orientation: landscape) and (max-height: 360px) {
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; display: inline-block; vertical-align: middle; }
  body .kg-rbwrap > .kg-card .new { margin: 0 0 0 8px; padding: 2px 8px; font-size: 12px; vertical-align: middle; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .how { display: none; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="인형뽑기 상자 — 누르면 집게가 멈춰요"></canvas>

<div id="hud" aria-hidden="true">
  <div class="cn" id="hudCn"><span class="ic">🪙</span><span id="hudCoin">0</span><small>동전</small></div>
  <div class="sc" id="hudSc"><span class="ic">⭐</span><span id="hudScore">0</span><small>점</small></div>
  <div class="gt" id="hudGt"><span class="ic">🧸</span><span id="hudGot">0</span><small>개</small></div>
</div>
<button id="btnStop" type="button" class="wait" hidden aria-label="집게 멈추기"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2v6"/><rect x="8.5" y="8" width="9" height="4.5" rx="2"/><path d="M10 12.5L6.5 18.5l2.5 4"/><path d="M16 12.5l3.5 6-2.5 4"/></svg><span>멈춰!</span></button>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 인형뽑기</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>집게가 오가다 누르면 멈추고 내려가요.</b></p>
      <p>인형 <b>몸통 가운데</b>를 노릴수록 잘 잡혀요.</p>
      <p id="stKeys" hidden><b>스페이스</b> 멈추기 · <b>Esc</b> 쉬기</p>
    </div>
    <div class="rec" id="stRec"><span id="stBestBox" hidden>최고 기록<b id="stBest"></b></span><span>도감<b id="stDex"></b></span></div>
    <div class="row"><button class="kg-btn mini" id="btnRules" type="button">규칙 보기</button><button class="kg-btn mini" id="btnDex" type="button">인형 도감</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">동전을 다 썼어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="got" id="edGot"></div>
    <div class="rec"><span id="edGoldBox" hidden>황금 콩이<b id="edGold"></b></span><span id="edDexBox" hidden>새 도감<b id="edDex"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn mini" id="btnDex2" type="button">도감</button><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardDex" hidden>
  <div class="kg-card" role="dialog" aria-modal="true" aria-label="인형 도감">
    <h2>인형 도감</h2>
    <p id="dexLead"></p>
    <div id="dexList"></div>
    <button class="kg-btn pri" id="btnDexClose" type="button">닫기</button>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'claw', TITLE = J(name, '의') + ' 인형뽑기';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 뽑기 상자 (그림 단위: 유리 안 폭 16, 높이 12. y 는 아래로) ═══════
  const FW = 16, FLOOR = 12, EX = 3.2, GT = 10.45, GW = 0.13;    // 유리 안 폭 · 바닥 · 출구 구멍 오른쪽 끝(칸막이) · 칸막이 꼭대기 · 칸막이 두께(반)
  const YT = -1.35, YB = 15.4, FM = 0.55;                         // 위 간판 꼭대기 · 받침 바닥 · 옆 기둥 폭
  const WW = FW + FM * 2, WH = YB - YT;                            // 상자 전체 폭·높이
  const RAIL = 0.42, CY0 = 2.3, X0 = 1.6, AX0 = 3.75, AX1 = 15.25; // 레일 · 집게 머리 아래 끝의 쉬는 높이 · 출구 위 · 오가는 범위
  const ARM = 1.15, HEADH = 0.78;                                  // 집게 팔 길이 · 머리 높이
  const G = 30;                                                    // 중력 (단위/초²)
  const OUT = { x0: 0.35, x1: 3.05, y0: 12.95, y1: 14.85 };        // 받침 앞 「받는 곳」 창

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   coins 한 판 동전 · spd 집게 빠르기(단위/초) · win 잡히는 폭(가운데에서 반지름 몇 배까지) · pmax 딱 가운데일 때 잡힐 확률(인형 무게를 곱함)
  //   sway 옮길 때 흔들림 · guide 'glow'(내려갈 선 + 닿을 인형·가운데 표시) 'line'(선 + 닿을 인형) 'tick'(선만) 'none'
  //   bonus 동전 딱지 붙은 인형이 나올 확률 · gold 황금 콩이 인형이 나올 확률 · n 상자 속 인형 수(줄면 위에서 채움)
  //   잡힐 확률 = pmax × (1 − (빗나간 정도 ÷ win)²) × 무게 — 가운데 근처는 넉넉하고(정확히 멈추면 거의 잡힌다) 벗어날수록 가파르게 떨어진다.
  //   아무 데나 누를 때의 확률은 win 에 비례하고, 사람의 타이밍 오차(약 80ms)로 빗나가는 거리는 spd 에 비례한다.
  //   그래서 Hard·Very Hard 는 win 을 좁히되 spd 를 너무 올리지 않는다 (빠르기만 하면 정확히 누르려 해도 운에 가까워진다)
  const DIFF = {
    easy:   { coins: 12, spd: 2.6, win: 1.20, pmax: 0.97, sway: 0.5, guide: 'glow', bonus: 0.12, gold: 0.035, n: 10, edge: 0.35, master: 250 },
    normal: { coins: 11, spd: 3.8, win: 0.80, pmax: 0.93, sway: 0.8, guide: 'line', bonus: 0.10, gold: 0.03, n: 10, edge: 0.25, master: 230 },
    hard:   { coins: 10, spd: 4.2, win: 0.58, pmax: 0.90, sway: 1.1, guide: 'tick', bonus: 0.08, gold: 0.028, n: 10, edge: 0.15, master: 170 },
    vhard:  { coins: 8,  spd: 4.6, win: 0.45, pmax: 0.88, sway: 1.4, guide: 'none', bonus: 0.07, gold: 0.025, n: 10, edge: 0.08, master: 130 }
  };
  //   edge 옮기다 놓친 인형이 칸막이 바로 위에서 떨어질 확률(굴러 들어가는 「덤」이 가끔 보이게) · master 「인형뽑기 달인」 제목이 붙는 점수
  //   master 근거: 예전 개수 기준(Easy 13 · Normal 12 · Hard 9 · Very Hard 7개) × 인형 한 개 평균 약 19점(뽑기 확률로 낸 값).
  //   시뮬레이션(난이도×솜씨 3종×12판)에서는 덤 포함 한 개 평균 17.5~24.3점(정확히 누를수록 높음)이었고, 달인 도달률은 옛 개수 기준과 비슷했다.
  //     보통 인형 평균 15.5점(흔함 60% × 10 + 보통 35% × 20 + 드묾 5% × 50) × 97% + 황금 콩이 약 3% × 100 ≈ 18점, 딱 가운데 덤(+5)이 가끔 붙어 ≈ 19점.
  //     Easy 13 × 19 ≈ 250 · Normal 12 × 19 ≈ 230 · Hard 9 × 19 ≈ 170 · Very Hard 7 × 19 ≈ 130

    if (exPts) { const s = document.createElement('span'); s.textContent = '🎯 가운데 덤 +' + exPts + '점'; box.appendChild(s); }
    box.hidden = !box.childNodes.length;
    $('edGoldBox').hidden = !golds; $('edGold').textContent = golds + '개';
    $('edDexBox').hidden = !newDex; $('edDex').textContent = newDex + '종';
    paintBest(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
  }
  const guardOk = () => performance.now() - overAt >= 450;
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (state !== 'result' || !guardOk()) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (!guardOk() && e.target.closest && e.target.closest('.kg-diff, a, #btnDex2')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);

  // ═══════ 도감 ═══════
  let dexBack = null;
  function openDex(from) {
    dexBack = from || null;
    $('dexLead').textContent = KINDS.length + '종 가운데 ' + dexCount() + '종을 뽑았어요.';
    const box = $('dexList'); box.textContent = '';
    for (const k of KINDS) {
      const n = dex[k.id] || 0, cell = document.createElement('div'); cell.className = 'cell' + (n ? '' : ' no');
      const cn = toyCanvas(k.id, 120, !n); cn.setAttribute('role', 'img'); cn.setAttribute('aria-label', n ? k.name : '아직 못 뽑은 인형');
      const b = document.createElement('b'); b.textContent = n ? k.name : '???';
      const s = document.createElement('span'); s.textContent = n ? n + '번 뽑음' : '아직 없어요';
      const r = document.createElement('i'); r.className = 'r' + k.rar; r.textContent = RAR[k.rar];
      const pt = document.createElement('em'); pt.className = 'pt'; pt.textContent = k.pt + '점';
      const tx = document.createElement('div'); tx.appendChild(b); tx.appendChild(s); tx.appendChild(r); tx.appendChild(pt); cell.appendChild(cn); cell.appendChild(tx); box.appendChild(cell);
    }
    $('cardDex').hidden = false; box.scrollTop = 0;
    try { $('btnDexClose').focus({ preventScroll: true }); } catch (e) {}
  }
  function closeDex() { if ($('cardDex').hidden) return; $('cardDex').hidden = true; paintBest(); if (dexBack) { try { dexBack.focus({ preventScroll: true }); } catch (e) {} } }
  $('btnDex').addEventListener('click', () => { if (KG.rulesOpen) return; sfx('tap'); openDex($('btnStart')); });
  $('btnDex2').addEventListener('click', () => { if (!guardOk()) return; sfx('tap'); openDex($('btnAgain')); });
  $('btnDexClose').addEventListener('click', () => { sfx('tap'); closeDex(); });
  $('cardDex').addEventListener('click', e => { if (e.target === $('cardDex')) closeDex(); });

  // ═══════ 입력: 화면 어디든(상자 위) 누르거나 「멈춰!」 단추 · 스페이스 ═══════
  fx.addEventListener('pointerdown', e => { if (state !== 'play' || e.button > 0) return; e.preventDefault(); press(); });
  btnStop.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); press(); });
  btnStop.addEventListener('click', e => { if (e.detail === 0) press(); });   // 키보드로 누른 경우만 (손가락·마우스는 pointerdown 에서 이미)
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (!$('cardDex').hidden) { if (k === 'Escape') { e.preventDefault(); closeDex(); } return; }
    if (k === ' ' || k === 'Enter' || k === 'ArrowDown') {
      if (state === 'play') { e.preventDefault(); if (e.repeat || KG.rulesOpen) return; press(); return; }
      if (k === 'ArrowDown') return;
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (guardOk()) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stBestBox').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점'; $('stDex').textContent = dexCount() + ' / ' + KINDS.length;
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; coins = D.coins; paintHud(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);   // 결과 카드 바로 아래(가로 낮은 화면은 오른쪽) 가족 순위 — 방금 판 난이도
  KG.startRank($('cardStart'), KEY);   // 시작 카드 아래에 고른 난이도의 가족 순위
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; coins = D.coins;
  layout(); fillBox(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '유리 상자 속 인형을 집게로 뽑아 ' + J(name, '에게') + ' 안겨 주는 놀이예요.', items: [
    ['🕹️', '집게가 좌우로 오가요. 화면이나 「멈춰!」 단추를 누르면' + (KEYS_OK ? '(스페이스) ' : ' ') + '멈추고 내려가요.'],
    ['🎯', '인형 몸통 가운데를 집을수록 잘 잡혀요. 가장자리를 집으면 옮기다 떨어뜨리기 쉬워요.'],
    ['🕳️', '왼쪽 출구 구멍에 떨어지면 내 인형! 밀려 굴러 들어가도 내 것이에요.'],
    ['⭐', '드문 인형일수록 점수가 커요(10~100점). 딱 가운데로 집어 뽑으면 +' + EXACT_PT + '점 덤.'],
    ['🪙', '동전을 다 쓰면 끝나요. 동전 딱지가 붙은 인형과 황금 콩이 인형은 동전을 더 줘요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, KINDS, get D() { return D; }, get diff() { return diffId; }, get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get got() { return got; }, get exPts() { return exPts; }, get gotKinds() { return Object.assign({}, gotKinds); }, EXACT_PT,
    get coins() { return coins; }, get tries() { return tries; }, get exact() { return exact; }, get golds() { return golds; }, get dex() { return Object.assign({}, dex); }, get cx() { return cx; }, get stat() { return Object.assign({}, stat); }, get dir() { return dir; },
    toys: () => toys.map(t => ({ id: t.id, kind: t.kind, x: +t.x.toFixed(2), y: +t.y.toFixed(2), r: +t.r.toFixed(2), held: t.held, coin: t.coin, asleep: t.asleep, vx: +t.vx.toFixed(3), vy: +t.vy.toFixed(3) })),
    probe, contact: x => { const c = contact(x); return { toy: c.toy ? c.toy.id : null, y: c.y }; },
    field: () => ({ W, H, S, ox, oy, wide, low, KSZ, kx, ky, box: [sx(-FM), sy(YT), WW * S, WH * S], stop: btnStop.getBoundingClientRect().toJSON(), hud: hud.getBoundingClientRect().toJSON() }),
    start, end, pause, resume, press, step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
</body>
</html>
