<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이랑 줄다리기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이랑 줄다리기: 밤 풀밭(bg) 위에 콩이(kstage) · 줄과 손(fg) · 누르는 판(pad) · 점수판(hud)
   세로 화면은 콩이가 위에서 앞을 보고 줄을 아래로, 가로 화면은 콩이가 오른쪽에서 왼쪽을 보고 당긴다 */
#bg, #fg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#bg { z-index: 0; }
#kstage { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
#fg { z-index: 2; }
#stage.shake #kstage, #stage.shake #fg { animation: stShake .3s; }
@keyframes stShake { 0%,100% { transform: none; } 20% { transform: translate(-6px,2px); } 45% { transform: translate(6px,-2px); } 70% { transform: translate(-3px,1px); } }
#vig { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: inset 0 0 90px 30px rgba(229,72,77,.55); }
#vig.warn { opacity: .45; box-shadow: inset 0 0 70px 18px rgba(255,200,97,.45); }
#vig.on { opacity: 1; }
#pad { position: fixed; inset: 0; z-index: 5; touch-action: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
#say { position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%,-100%); pointer-events: none; white-space: nowrap; padding: 7px 14px; border-radius: 18px; background: #fff; color: var(--ink); font-size: 16px; font-weight: 800; letter-spacing: -.3px; box-shadow: 0 6px 18px rgba(6,8,30,.35); opacity: 0; transition: opacity .1s; }
#say::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: inherit; border-top-color: #fff; }
#say.show { opacity: 1; }
#say.growl { background: var(--danger); color: #fff; font-size: 19px; padding: 8px 16px; }
#say.growl::after { border-top-color: var(--danger); }
#say.pulse { animation: sayPulse .32s ease-in-out infinite alternate; }
@keyframes sayPulse { 0% { transform: translate(-50%,-100%) scale(1); } 100% { transform: translate(-50%,-100%) scale(1.08); } }
#stop { position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%,-50%); pointer-events: none; white-space: nowrap; padding: 6px 12px; border-radius: 14px; background: rgba(229,72,77,.92); color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -.2px; box-shadow: 0 4px 14px rgba(6,8,30,.35); opacity: 0; transition: opacity .1s; }
#stop.show { opacity: 1; }
.fl { position: fixed; z-index: 6; transform: translate(-50%,-50%); white-space: nowrap; font-size: 18px; font-weight: 800; letter-spacing: -.3px; color: #fff; text-shadow: 0 1px 0 rgba(40,30,90,.55), 0 2px 8px rgba(20,16,60,.6); pointer-events: none; animation: flUp .8s ease-out forwards; }
.fl small { font-size: 12px; font-weight: 600; margin-left: 4px; }
@keyframes flUp { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -34px; } }
.rip { position: fixed; z-index: 4; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); pointer-events: none; animation: rip .38s ease-out forwards; }
@keyframes rip { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
#banner { position: fixed; z-index: 7; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .18s, transform .18s; width: max-content; max-width: calc(100% - 32px); }
#banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
#banner b { display: block; font-size: 40px; font-weight: 900; letter-spacing: -1px; color: #fff; text-shadow: 0 2px 0 rgba(30,24,80,.6), 0 4px 18px rgba(10,8,40,.6); }
#banner span { display: inline-block; margin-top: 6px; padding: 6px 14px; border-radius: 16px; background: rgba(18,22,52,.66); border: 1px solid var(--glass-line); font-size: 15px; font-weight: 600; color: #fff; }
#hud { position: fixed; z-index: 10; pointer-events: none; }
#hud .pills { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; justify-content: center; }
#hud .pills > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 12px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .tm.low { color: #FFB3B8; }
#hud .rd { background: #FFE9A8 !important; border-color: transparent !important; color: #7A5200 !important; }
#hud .rd small { color: #8A5A00; }
#tbar { height: 6px; margin-top: 7px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
#tbar i { display: block; height: 100%; width: 100%; border-radius: 3px; background: linear-gradient(90deg, #FFD36E, #FFB95C); transform-origin: 0 50%; }
#tbar.low i { background: linear-gradient(90deg, #FF9AA2, #FF7B88); }
#hud.wide #tbar { margin-top: 5px; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .row .kg-btn.sub { flex: 0 0 auto; padding: 0 16px; }
.kg-card .keys { font-size: 13px; margin-top: 8px; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } #hud .pills > div { padding: 0 9px; } }
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 420px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  body .kg-card .keys { display: none; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .rec span { padding: 5px 10px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  #banner b { font-size: 30px; }
  #cardStart, #cardPause, #cardEnd { padding-top: calc(var(--sat) + 58px); }
  #edText { display: none; }
  #cardEnd .rec { gap: 6px; }
  #cardEnd .rec { flex-wrap: nowrap; }
  #cardEnd .rec span { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
  #edSlipBox, #cardEnd #edRec { display: none; }
  #cardEnd .new { margin-top: 0; padding: 2px 10px; font-size: 12px; }
  body #cardEnd .kg-diff button { height: 32px; }
  body #cardEnd .kg-btn { height: 40px; }
  body #cardEnd .rec, body #cardEnd .row { margin-top: 6px; }
  body #cardEnd h2 { font-size: 18px; }
  body #cardEnd .big { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { #say.pulse { animation: none; } .fl { animation-duration: 1s; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="kstage"></div>
  <canvas id="fg"></canvas>
</div>
<div id="vig"></div>
<div id="pad" aria-label="화면을 빠르게 눌러 줄을 당겨요"></div>
<div id="say" aria-hidden="true"></div>
<div id="stop" aria-hidden="true">손 멈춰!</div>
<div id="banner" aria-live="polite"><b id="bnBig"></b><span id="bnSub" hidden></span></div>

<div id="hud" aria-hidden="true">
  <div class="pills">
    <div class="rd"><span id="hudRound">1</span><small>판</small></div>
    <div class="sc"><span id="hudScore">0</span><small>점</small></div>
    <div class="tm" id="hudTimeBox"><span id="hudTime">20</span><small>초</small></div>
  </div>
  <div id="tbar"><i></i></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이랑 줄다리기</h2>
    <p id="stLead"></p>
    <p class="keys" id="stKeys" hidden>키보드는 스페이스·엔터로 당기고, Esc 로 멈춰요.</p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn sub" id="btnRules">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">줄을 놓쳤어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>이긴 판<b id="edWins"></b></span><span>최단 승리<b id="edFast"></b></span><span id="edSlipBox">미끄러짐<b id="edSlip"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'tug', TITLE = J(name, '이랑/랑') + ' 줄다리기';
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   줄 위치 p: 0 = 가운데, -1 = 내 선(판 승리), +1 = 콩이 선(끝)
  //   tap   한 번 누를 때 내 쪽으로 오는 양
  //   pull  콩이가 1초에 당기는 양(1판) · step 판마다 더해지는 양 · step2 판 수의 제곱에 곱해 더하는 양(뒤로 갈수록 가파르게)
  //   gap   으르렁과 으르렁 사이(초) [최소, 최대] · warn 부르르 떠는 예고(초) · dur 으르렁 길이(초) [최소, 최대]
  //   gpull 으르렁 동안 1초에 당기는 양(1판, 판마다 step×1.5 씩 더 셈) · slip 으르렁 때 누르면 확 밀리는 양
  //   grace 으르렁이 시작된 뒤 이 시간 안의 누름은 봐준다(반응할 틈) · fake 떨기만 하고 안 으르렁거리는 속임수 비율
  //   dbl   으르렁이 끝나자마자 한 번 더 할 확률 · first 판 시작 뒤 첫 예고까지(초) [최소, 최대] — 첫 예고는 늘 진짜 으르렁
  const DIFF = {
    easy:   { tap: 0.035, pull: 0.050, step: 0.022, step2: 0.0020, gap: [3.6, 5.4], warn: 1.00, dur: [0.9, 1.3], gpull: 0.14, slip: 0.10, grace: 0.35, fake: 0.00, dbl: 0.00, first: [1.6, 2.6] },
    normal: { tap: 0.034, pull: 0.070, step: 0.026, step2: 0.0025, gap: [3.0, 4.6], warn: 0.70, dur: [1.0, 1.5], gpull: 0.20, slip: 0.15, grace: 0.25, fake: 0.12, dbl: 0.00, first: [1.0, 1.8] },
    hard:   { tap: 0.035, pull: 0.088, step: 0.030, step2: 0.0030, gap: [2.5, 3.9], warn: 0.45, dur: [1.0, 1.6], gpull: 0.24, slip: 0.20, grace: 0.18, fake: 0.25, dbl: 0.12, first: [0.9, 1.6] },
    vhard:  { tap: 0.036, pull: 0.100, step: 0.034, step2: 0.0035, gap: [2.1, 3.3], warn: 0.30, dur: [0.9, 1.6], gpull: 0.27, slip: 0.25, grace: 0.13, fake: 0.35, dbl: 0.22, first: [0.8, 1.4] }
  };
  const ROUND_T = 20;              // 한 판 길이(초) — 시간이 끝나면 리본이 있는 쪽이 이긴다
  const WIN_PTS = 100, FAST_PTS = 5, FAST_MAX = 50;   // 이긴 판마다 100점 + 남은 시간 1초마다 5점(끌어와서 이겼을 때만, 50점까지)
  const TAP_CAP = 30;              // 1초에 이보다 많이 누르면 넘친 것은 무시 (자동 누르기 막기)
  const SOFT_N = 7, SOFT_X = 0.2; // 최근 1초에 SOFT_N 번을 넘게 누르면 넘친 몫은 SOFT_X 만큼만 친다 (빨리 눌러도 판이 너무 짧아지지 않게)
  const SLIP_COOL = 0.12;          // 미끄러진 뒤 이 시간 동안 누른 것은 한 번으로 친다 (여러 손가락이 동시에 눌려도)
  const SLIP_UP = 0.5, SLIP_MAXK = 4;   // 같은 으르렁 안에서 또 미끄러질수록 slip×(1+SLIP_UP×앞선 횟수) — 앞선 횟수는 SLIP_MAXK 까지
  const HOLD_P = 0.75;             // 그 판 첫 으르렁이 끝나기 전에는 리본이 이보다 내 쪽으로 못 온다 (으르렁을 꼭 한 번 겪게)
  const TIE = 0.03;                // 시간이 끝났을 때 리본이 가운데에서 이만큼 안이면 비김 → 같은 판을 다시
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '화면을 톡톡 연타해 줄을 당겨요. ' + J(name, '이/가') + ' 으르렁거리면 손을 멈춰요!';
  $('psText').textContent = J(name, '이/가') + ' 줄을 물고 기다리고 있어요.';
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) $('stKeys').hidden = false;

  const bg = $('bg'), fg = $('fg'), fgx = fg.getContext('2d'), kstage = $('kstage'), pad = $('pad'), say = $('say'), stopEl = $('stop'), vig = $('vig');
  const K = kong(kstage, 180);

  // ═══════ 상태 ═══════
  let state = 'ready';             // ready · intro · play · won(판 승리 연출) · draw(비김 연출) · over(진 연출) · result · pause
  let prevState = 'play';
  let round = 1, wins = 0, score = 0, p = 0, pv = 0, roundT = 0, phaseT = 0, tAnim = 0, endAt = 0;
  let growl = { ph: 'idle', t: 0, next: 3, dur: 1, fake: false, real: false, slips: 0 };   // real: 이 판에서 진짜 으르렁이 한 번 끝났는가 · slips: 이번 으르렁 안에서 미끄러진 횟수
  let taps = [], slipCool = 0, tapPulse = 0, slipFx = 0, lastWin = null, tapN = 0;
  let stats = { taps: 0, slips: 0, fastest: 0, judged: 0, ignored: 0, bonus: 0 };
  let clk = 0;
  let W = 0, H = 0, wide = false, dpr = 1, KSZ = 180;
  // 줄 기하: C 가운데 선 점, u 내 쪽→콩이 쪽 단위 벡터, S 선까지 거리, Lm 리본→콩이 입, Lh 리본→앞손
  const G = { C: { x: 0, y: 0 }, u: { x: 0, y: -1 }, S: 100, Lm: 80, Lh: 90, gapH: 40, rw: 12, hs: 30, mouthOff: { x: 0, y: 0 }, ground: 0 };

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function measureMouth() {
    K.setPose(wide ? 'stand' : 'sit'); K.render({ t: 0, facing: -1 }); K.place(0, 0, 1);
    const m = K.mouth(); G.mouthOff = { x: m.x, y: m.y };
  }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; const sa = safe();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    fg.width = Math.round(W * dpr); fg.height = Math.round(H * dpr);
    wide = W > H * 1.05;
    const hud = $('hud');
    hud.classList.toggle('wide', wide);
    if (wide) {
      const l = sa.l + 112, r = sa.r + (btnPause.hidden ? 70 : 122);
      hud.style.left = l + 'px'; hud.style.width = Math.max(120, W - l - r) + 'px'; hud.style.top = (sa.t + 12) + 'px';
      const top = sa.t + 64, L = W - sa.l - sa.r - 16;
      const groundY = Math.min(H - sa.b - clamp(H * 0.13, 22, 90), top + (H - top) * 0.8);
      KSZ = clamp(Math.min((groundY - top) / 0.95, L * 0.3), 90, 320);
      K.setSize(KSZ); measureMouth();
      G.u = { x: 1, y: 0 };
      G.S = Math.min(L * 0.17, 230); G.Lm = Math.max(L * 0.11, KSZ * 0.3); G.Lh = Math.max(L * 0.12, 70); G.hs = clamp(KSZ * 0.17, 20, 40); G.gapH = G.hs * 1.7;
      const body = KSZ * 0.75;       // 서기 그림은 입 뒤(오른쪽)로 몸이 이만큼
      const need = 2 * G.S + G.Lm + G.Lh + G.gapH + G.hs + body;
      const x0 = sa.l + 8 + G.Lh + G.gapH + G.hs * 0.8 + G.S + Math.max(0, L - need) * 0.5;
      G.C = { x: x0, y: groundY + G.mouthOff.y };   // 줄 높이 = 입 높이
      G.ground = groundY;
    } else {
      hud.style.left = (sa.l + 12) + 'px'; hud.style.width = (W - sa.l - sa.r - 24) + 'px'; hud.style.top = (sa.t + 62) + 'px';
      const top = sa.t + 116, bot = H - sa.b - 6, L = bot - top;
      KSZ = clamp(Math.min(W * 0.52, L * 0.3), 100, 240);
      K.setSize(KSZ); measureMouth();
      G.u = { x: 0, y: -1 };
      G.S = L * 0.19; G.Lm = Math.max(L * 0.13, 40); G.Lh = Math.max(L * 0.15, 70); G.hs = clamp(KSZ * 0.17, 20, 38); G.gapH = G.hs * 1.7;

    }
    if (showRope || state === 'won' || state === 'over') {
      const tense = growl.ph === 'growl' && (state === 'play' || state === 'pause') ? 1 : 0;
      const wob = (state === 'play' ? tapPulse * 3 : 0) + (slipFx * 6);
      const ropeEnd = state === 'over' ? { x: hA.x + u.x * G.gapH * 0.5, y: hA.y + u.y * G.gapH * 0.5 } : end;
      const mid = { x: (ropeEnd.x + mouth.x) / 2, y: (ropeEnd.y + mouth.y) / 2 };
      const down = wide ? { x: 0, y: 1 } : { x: 1, y: 0 };
      const ctl = { x: mid.x + down.x * sag + n.x * Math.sin(tAnim * 40) * wob, y: mid.y + down.y * sag + n.y * Math.sin(tAnim * 40) * wob };
      const path = () => { g.beginPath(); g.moveTo(ropeEnd.x, ropeEnd.y); g.quadraticCurveTo(ctl.x, ctl.y, mouth.x, mouth.y); };
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(6,10,30,.35)'; g.lineWidth = G.rw + 4; g.save(); g.translate(2, 4); path(); g.stroke(); g.restore();
      g.strokeStyle = tense ? '#F3D3C2' : '#EADCB9'; g.lineWidth = G.rw; path(); g.stroke();
      // 꼰 줄무늬 (줄과 함께 움직인다)
      g.setLineDash([G.rw * 0.55, G.rw * 0.75]); g.lineDashOffset = -pv * G.S * (u.x + -u.y) ;
      g.strokeStyle = tense ? '#E5484D' : '#E2626F'; g.lineWidth = G.rw * 0.8; path(); g.stroke();
      g.setLineDash([G.rw * 0.3, G.rw * 1.0]); g.lineDashOffset = -pv * G.S * (u.x + -u.y) - G.rw * 0.6;
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = G.rw * 0.35; path(); g.stroke(); g.setLineDash([]);
      // 콩이 쪽 매듭
      g.fillStyle = '#E2626F'; g.beginPath(); g.arc(mouth.x + u.x * G.rw * 0.2, mouth.y + u.y * G.rw * 0.2, G.rw * 0.8, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(mouth.x + u.x * G.rw * 0.2 - G.rw * 0.3, mouth.y + u.y * G.rw * 0.2 - G.rw * 0.3, G.rw * 0.3, 0, TAU); g.fill();
      // 가운데 리본 (줄 위의 점)
      const qt = 0.5;   // 2차 곡선에서 리본 자리: 리본은 mk 근처라 곡선 위로 투영
      const rb = state === 'won' || state === 'over' ? quadAt(ropeEnd, ctl, mouth, nearestT(ropeEnd, ctl, mouth, mk)) : { x: mk.x + n.x * Math.sin(tAnim * 40) * wob * 0.5, y: mk.y + n.y * Math.sin(tAnim * 40) * wob * 0.5 };
      drawBow(g, rb.x, rb.y, G.rw * 1.5, n);
      void qt;
    }
    if (state !== 'ready' && state !== 'result') drawHands(g, hA, hB, u, n, handsOn);
    if (slipFx > 0) { g.globalAlpha = slipFx * 0.6; g.strokeStyle = '#FFB3B8'; g.lineWidth = 3; for (let i = -1; i <= 1; i += 2) { g.beginPath(); g.moveTo(hA.x + n.x * i * G.hs * 1.3, hA.y + n.y * i * G.hs * 1.3); g.lineTo(hA.x + n.x * i * G.hs * 1.3 + u.x * 40, hA.y + n.y * i * G.hs * 1.3 + u.y * 40); g.stroke(); } g.globalAlpha = 1; }
    // 「손 멈춰!」 표시는 손 옆에
    //   세로 화면은 손 왼쪽 — 오른쪽 끝에는 「내 선」 이름표가 있다
    if (stopOn) {
      if (wide) { stopEl.style.left = clamp(hA.x + n.x * G.hs * 3.2, 60, W - 60) + 'px'; stopEl.style.top = clamp(hA.y + n.y * G.hs * 3.2 - G.hs * 2.4, 90, H - 24) + 'px'; }
      else { stopEl.style.left = clamp(hA.x - G.hs * 3.2, 60, W - 60) + 'px'; stopEl.style.top = clamp(hA.y, 90, H - 24) + 'px'; }
    }
  }
  function quadAt(a, c, b, t) { const s = 1 - t; return { x: s * s * a.x + 2 * s * t * c.x + t * t * b.x, y: s * s * a.y + 2 * s * t * c.y + t * t * b.y }; }
  function nearestT(a, c, b, q) { let bt = 0.5, bd = 1e18; for (let i = 0; i <= 40; i++) { const t = i / 40, pt = quadAt(a, c, b, t), d = (pt.x - q.x) ** 2 + (pt.y - q.y) ** 2; if (d < bd) { bd = d; bt = t; } } return bt; }
  function drawBow(g, x, y, s, n) {
    g.save(); g.translate(x, y); void n;   // 리본은 늘 고리가 옆으로, 끈이 아래로
    g.fillStyle = 'rgba(6,10,30,.16)'; g.beginPath(); g.ellipse(1, 3, s * 1.4, s * 0.7, 0, 0, TAU); g.fill();
    g.fillStyle = '#FF5A7A';
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-s * 1.7, -s * 1.3, -s * 1.6, 0); g.quadraticCurveTo(-s * 1.7, s * 1.3, 0, 0); g.fill();
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(s * 1.7, -s * 1.3, s * 1.6, 0); g.quadraticCurveTo(s * 1.7, s * 1.3, 0, 0); g.fill();
    g.fillStyle = '#E23E62'; g.beginPath(); g.moveTo(-s * 0.2, s * 0.2); g.lineTo(-s * 0.7, s * 1.6); g.lineTo(-s * 0.2, s * 1.4); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(s * 0.2, s * 0.2); g.lineTo(s * 0.7, s * 1.6); g.lineTo(s * 0.2, s * 1.4); g.closePath(); g.fill();
    g.fillStyle = '#FF8FA6'; g.beginPath(); g.arc(0, 0, s * 0.42, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(-s * 0.9, -s * 0.35, s * 0.35, s * 0.16, -0.4, 0, TAU); g.fill();
    g.restore();
  }
  function drawHands(g, hA, hB, u, n, on) {
    const hs = G.hs;
    // 팔: 손에서 화면 밖(내 쪽)으로, 앞손은 한쪽·뒷손은 반대쪽으로 비스듬히
    const arm = (h, side) => {
      const far = Math.max(W, H);
      // 가로 화면: 두 팔 모두 왼쪽 아래(나)에서 / 세로 화면: 아래에서 양쪽으로 벌려
      const ex = wide ? h.x - far * 0.55 : h.x - u.x * far * 0.6 + n.x * side * far * 0.35, ey = wide ? h.y + far * (side > 0 ? 0.42 : 0.3) : h.y - u.y * far * 0.6 + n.y * side * far * 0.35;
      g.lineCap = 'round';
      g.strokeStyle = '#4F5FC9'; g.lineWidth = hs * 1.25; g.beginPath(); g.moveTo(h.x, h.y); g.lineTo(ex, ey); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = hs * 0.25; g.beginPath(); g.moveTo(h.x - u.x * hs * 0.9 + n.x * side * hs * 0.1, h.y - u.y * hs * 0.9 + n.y * side * hs * 0.1); g.lineTo(ex, ey); g.stroke();
      g.strokeStyle = '#FFFFFF'; g.globalAlpha = 0.85; g.lineWidth = hs * 1.3; g.lineCap = 'butt';   // 소매 끝
      g.beginPath(); const cx = h.x - u.x * hs * 0.75 + n.x * side * hs * 0.12, cy = h.y - u.y * hs * 0.75 + n.y * side * hs * 0.12; const dx = (ex - h.x), dy = (ey - h.y), dl = Math.hypot(dx, dy) || 1;
      g.moveTo(cx, cy); g.lineTo(cx + dx / dl * hs * 0.32, cy + dy / dl * hs * 0.32); g.stroke(); g.globalAlpha = 1;
    };
    const fist = (h) => {
      g.save(); g.translate(h.x, h.y); g.rotate(Math.atan2(u.y, u.x));
      // 주먹: 줄을 감싼 둥근 손 (x 축 = 콩이 쪽)
      g.fillStyle = '#F4C6A2'; g.strokeStyle = '#C98F6C'; g.lineWidth = 2;
      rr(g, -hs * 0.5, -hs * 0.68, hs * 1.0, hs * 1.36, hs * 0.42); g.fill(); g.stroke();
      g.strokeStyle = 'rgba(170,110,80,.7)'; g.lineWidth = 1.6; g.lineCap = 'round';
      for (const k of [-0.34, 0, 0.34]) { g.beginPath(); g.moveTo(hs * 0.1, k * hs * 1.0 + hs * 0.17); g.lineTo(hs * 0.42, k * hs * 1.0 + hs * 0.17); g.stroke(); }
      g.fillStyle = '#F7D2B4'; rr(g, -hs * 0.36, -hs * 0.86, hs * 0.62, hs * 0.38, hs * 0.19); g.fill(); g.strokeStyle = '#C98F6C'; g.lineWidth = 1.6; g.stroke();   // 엄지
      g.restore();
    };
    arm(hB, -1); arm(hA, 1);
    if (on) { fist(hB); fist(hA); }
    else { // 빈손: 펼친 손바닥
      for (const h of [hA, hB]) { g.save(); g.translate(h.x, h.y); g.rotate(Math.atan2(u.y, u.x)); g.fillStyle = '#F4C6A2'; g.strokeStyle = '#C98F6C'; g.lineWidth = 2; g.beginPath(); g.ellipse(0, 0, hs * 0.55, hs * 0.6, 0, 0, TAU); g.fill(); g.stroke();
        for (let i = -1.5; i <= 1.5; i++) { g.beginPath(); g.ellipse(hs * 0.6, i * hs * 0.27, hs * 0.3, hs * 0.11, 0, 0, TAU); g.fill(); g.stroke(); } g.restore(); }
    }
  }

  // 절전: 카드(시작·멈춤·결과)가 떠 있으면 상태가 바뀐 뒤 1초까지만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let idleSt = '', idleAt = 0, idleDrawAt = 0;
  function idleSkip(now, playing) {
    if (playing) { idleSt = ''; return false; }
    if (idleSt !== state) { idleSt = state; idleAt = now; }
    if (now - idleAt < 1000 || now - idleDrawAt >= 200) { idleDrawAt = now; return false; }
    return true;
  }
  window.addEventListener('resize', () => { idleSt = ''; });   // 회전·크기 바뀜: 다시 1초 동안 매 프레임
  document.addEventListener('visibilitychange', () => { idleSt = ''; });
  window.addEventListener('orientationchange', () => { idleSt = ''; });   // resize 없이 회전만 오는 기기: 늦게 도는 layout 까지 1초 안에 들게
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    tAnim += dt; clk += dt;
    if (state !== 'pause') {
      update(dt);
      tapPulse = Math.max(0, tapPulse - dt * 9); slipFx = Math.max(0, slipFx - dt * 2.5);
    }
    pv += (p - pv) * (1 - Math.exp(-(state === 'intro' ? 5 : 16) * dt));
    if (idleSkip(now, state !== 'ready' && state !== 'pause' && state !== 'result')) return;
    paintHud();
    const showRope = drawKong(dt);
    drawFg(showRope);
  }

  // ═══════ 흐름 ═══════
  function layoutHudOnly() { layout(); }
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd']) $(k).hidden = k !== id; if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    round = 1; wins = 0; score = 0; p = 0; pv = 0; pendingNew = false;
    stats = { taps: 0, slips: 0, fastest: 0, judged: 0, ignored: 0, bonus: 0 };
    rbox.hide(); showCard(null); btnPause.hidden = false; layout();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    KG.unlockAudio(); startIntro();
  }
  function pause() { if (state !== 'play' && state !== 'intro' && state !== 'won' && state !== 'draw') return; prevState = state; state = 'pause'; taps.length = 0; hideBanner(); showCard('cardPause', 'btnResume'); }
  function resume() { if (state !== 'pause') return; state = prevState; showCard(null); last = performance.now(); }
  function quit() { if (state !== 'pause') return; state = 'ready'; btnPause.hidden = true; p = pv = 0; score = 0; round = 1; layout(); paintBest(); showCard('cardStart', 'btnStart'); }
  function showResult() {
    if (state !== 'over') return;
    state = 'result'; hideBanner(); p = 0;
    const isNew = (score > 0 && setBest(KG.dkey(KEY, diffId), score)) || (score > 0 && pendingNew && best(KG.dkey(KEY, diffId)) === score);
    if (isNew && pendingNew) KG.markNew(false);   // 짖기 여부는 판 도중 setBest 가 이미 정해 두었다(이전 기록을 넘었을 때만)
    $('edScore').textContent = fmt(score); $('edWins').textContent = wins + '판'; $('edFast').textContent = stats.fastest ? stats.fastest.toFixed(1) + '초' : '없음'; $('edSlip').textContent = stats.slips + '번';
    $('edNew').hidden = !isNew; paintBest();
    $('edTitle').textContent = wins >= 5 ? '줄다리기 왕이에요!' : wins >= 2 ? wins + '판이나 이겼어요' : wins === 1 ? '1판 이겼어요' : '줄을 빼앗겼어요';
    if ((wins >= 5) && KG.master) KG.master('tug');   // 업적 「게임 달인」 (11-27): 한 판에 5판 연속 이기기
    $('edText').textContent = lastLose ? '시간이 끝났을 때 리본이 ' + J(name, '의') + ' 쪽이었어요.' : stats.slips >= 3 ? '으르렁거릴 때 손을 멈추면 덜 밀려요.' : J(name, '이/가') + ' 줄을 물고 꼬리를 흔들어요.';
    endAt = performance.now(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
  }
  const RULES = { key: KEY, title: TITLE, lead: J(name, '과/와') + ' 터그 장난감을 서로 당기는 놀이예요.', items: [
    ['👆', '화면을 빠르게 톡톡! 여러 손가락도 돼요.'],
    ['😠', '「부르르…」 다음 으르렁! 그때 누르면 확 밀려요.'],
    ['🎀', '리본을 내 선까지 끌어오면 승리, ' + J(name, '의') + ' 선까지 가면 끝.'],
    ['⏱️', '한 판 20초 · 빨리 이기면 덤 · 판마다 더 세져요.']
  ] };
  const guard = () => performance.now() - endAt < 600;   // 결과 카드가 뜬 직후에는 누름을 넘긴다 (연타하던 손가락)
  $('btnStart').addEventListener('click', () => { sfx('tap'); start(); });
  $('btnAgain').addEventListener('click', () => { if (guard()) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (guard()) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); quit(); });
  $('btnRules').addEventListener('click', () => { sfx('tap'); KG.rules(RULES, true).then(() => { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} }); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); btnPause.blur(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  // 누르기: 손가락마다 한 번 (포인터 이벤트)
  pad.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') tap(e.clientX, e.clientY, e.timeStamp || undefined); });

  // ═══════ 키보드 ═══════
  document.addEventListener('keydown', e => {
    if (KG.rulesOpen || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (state === 'play' && (k === ' ' || k === 'Enter' || k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ArrowDown')) { e.preventDefault(); if (!e.repeat) tap(); return; }
    if (k === ' ' || k === 'Enter') {
      if (e.repeat) return;
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'result') { if (!guard()) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play' || state === 'intro' || state === 'won' || state === 'draw') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
  }
  $('stRec').before(KG.diffPicker(null, paintBest));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  diffId = KG.diff(); paintBest();
  layout(); paintHud();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get score() { return score; }, get round() { return round; }, get wins() { return wins; }, get p() { return p; }, get roundT() { return roundT; },
    get growl() { return Object.assign({}, growl); }, get diff() { return diffId; }, get D() { return D; }, get stats() { return Object.assign({}, stats); }, DIFF, ROUND_T,
    geo: () => ({ W, H, wide, KSZ, C: G.C, S: G.S, Lm: G.Lm, Lh: G.Lh, hand: handPoint(), kong: K.el.getBoundingClientRect().toJSON(), mouth: K.mouth(), hud: $('hud').getBoundingClientRect().toJSON() }),
    tap, start, pause, resume, quit, set p(v) { p = v; },
    step: dt => { tAnim += dt; clk += dt; update(dt); tapPulse = Math.max(0, tapPulse - dt * 9); }
  };
})();
</script>
</body>
</html>
