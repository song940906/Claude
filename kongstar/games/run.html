<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이런</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이런: 공원 산책길 달리기 — 배경 캔버스 · 콩이(SVG) · 효과 캔버스를 차례로 겹친다 */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: pointer; background: #6FB6F0; }
#bg, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#dog { position: absolute; inset: 0; pointer-events: none; }
#fx { pointer-events: none; }
/* 점수판: 위 줄 바로 아래, 작고 단정한 반투명 알약 */
#hud { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(var(--sat) + 62px); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.hp { height: 34px; border-radius: 17px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; background: rgba(18,22,52,.46); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; white-space: nowrap; }
.hp svg { width: 17px; height: 17px; display: block; transition: transform .25s, opacity .25s; }
.hp svg.off { opacity: .32; transform: scale(.82); }
.hp svg.off path { fill: #fff; }
.hp .num { font-size: 16px; font-weight: 700; min-width: 1ch; text-align: right; }
.hp .unit { font-size: 12px; font-weight: 500; opacity: .8; margin-left: -3px; }
.hp .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); margin: 0 4px; }
.hp .bone { width: 16px; height: 16px; }
#hudL { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
#hDiff { height: 22px; border-radius: 11px; padding: 0 9px; font-size: 11px; letter-spacing: 0; opacity: .92; }
#hudR { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#pow { padding: 0 10px; gap: 7px; font-size: 13px; background: rgba(255,200,97,.92); color: #4A3200; border-color: rgba(255,255,255,.5); }
#pow i { display: block; width: 54px; height: 6px; border-radius: 3px; background: rgba(74,50,0,.18); overflow: hidden; }
#pow i b { display: block; height: 100%; width: 100%; background: #fff; border-radius: 3px; transform-origin: 0 50%; }
#note { position: fixed; z-index: 10; left: 50%; top: calc(var(--sat) + 146px); transform: translate(-50%, -6px); padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.92); color: #191F28; font-size: 14px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#note.show { opacity: 1; transform: translate(-50%, 0); }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
/* 시작 카드의 짧은 설명 + 「규칙 보기」 단추 (자세한 규칙은 KG.rules 안내로) */
#cardStart .tip { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; }
#cardStart .tip span { flex: 1; min-width: 0; }
#btnRules { flex: none; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--pri); font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#btnRules:active { filter: brightness(.96); }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 세로 화면: 카드를 위로 올려 아래에서 걷는 콩이가 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  body .kg-card { padding: 16px 18px 14px; width: min(100%, 440px); }
  .kg-card .tip { margin-top: 8px; padding: 9px 12px; }
  #cardStart .tip { padding: 5px 6px 5px 12px; }
  body .kg-card .big { font-size: 32px; margin: 2px 0 0; }
  body .kg-card .row { margin-top: 12px; }
  body .kg-card .row .kg-btn { height: 46px; }
  .kg-card .stats { margin-top: 8px; }
  .kg-card .stats div { padding: 7px 4px 6px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
}
/* 아주 좁은 화면(320px): 「Very Hard」 단추 글자와 「Very Hard 최고」 라벨이 칸 안에 한 줄로 들어가게 */
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats div { padding-left: 1px; padding-right: 1px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; white-space: nowrap; }
}
/* 아주 낮은 가로 화면(568×320)에서 가족 순위 카드와 나란히 설 때만: 결과 카드가 좁아져(약 300px) 「다시 하기」가 카드 안 스크롤 아래로 밀리므로, 카드 높이에 여백을 넣고(border-box) 부제 한 줄을 빼고 사이를 줄여 처음 화면에 들어오게 한다 (이 카드는 통계·난이도 줄이 있어 공통 CSS 로는 안 들어간다) */
@media (orientation: landscape) and (max-height: 340px) {
  body .kg-scrim.kg-rbwrap > .kg-card { box-sizing: border-box; padding-top: 12px; padding-bottom: 12px; }
  body .kg-rbwrap #ovSub { display: none; }
  body .kg-rbwrap .kg-card #ovBadge { margin-bottom: 2px; padding: 2px 9px; font-size: 12px; }
  body .kg-rbwrap .kg-card h2 { font-size: 19px; margin-bottom: 0; }
  body .kg-rbwrap .kg-card .stats { margin-top: 6px; }
  body .kg-rbwrap .kg-card .stats small { white-space: nowrap; font-size: 11px; letter-spacing: -.5px; }
  body .kg-rbwrap .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap .kg-card .row { margin-top: 8px; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dog"></div>
  <canvas id="fx"></canvas>
</div>

<div id="hud" hidden>
  <div id="hudL">
    <div class="hp" id="hearts" role="img" aria-label="하트 3개"></div>
    <div class="hp" id="hDiff"></div>
  </div>
  <div id="hudR">
    <div class="hp"><span class="num" id="hScore">0</span><span class="unit">점</span><span class="sep"></span><span id="hDist">0m</span></div>
    <div class="hp" id="pow" hidden><span>신나는 질주</span><i><b id="powBar"></b></i></div>
  </div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이런</h2>
    <p id="stSub"></p>
    <div class="tip"><span>누르면 <b>폴짝!</b> 한 번 더 누르면 <b>2단 점프</b></span><button type="button" id="btnRules">규칙 보기</button></div>
    <div class="key" id="stKey"></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="paTitle">
    <h2 id="paTitle">잠깐 쉬는 중이에요</h2>
    <p id="paSub"></p>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnResume">계속 달리기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardOver" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="ovTitle">
    <div class="badge" id="ovBadge" hidden>새 기록이에요!</div>
    <h2 id="ovTitle">잘 달렸어요!</h2>
    <p id="ovSub"></p>
    <div class="big"><span id="ovScore">0</span><small>점</small></div>
    <div class="stats">
      <div><b id="ovDist">0m</b><small>달린 거리</small></div>
      <div><b id="ovTreat">0개</b><small>먹은 간식</small></div>
      <div><b id="ovBest">0점</b><small id="ovBestL">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  // 난이도: 빠르기(v0 → v0+dv, tau m 마다 빨라짐, 가장 빠를 때 cap) · react 보고 뛸 틈(초) · lv 어려운 묶음이 나오기 시작하는 거리 · lmax 가장 어려운 묶음 단계
  //   gadd·gmul 묶음 사이 덧붙는 틈 · rest 길게 쉬는 틈 · rhythm 연달아 뛰기 · hearts 처음 하트 · h0·hgap 하트 간식 · mul 점수 배율. normal 은 예전 그대로
  const DIFF = {
    easy:   { v0: 1.8, dv: 1.2, tau: 400, cap: 3.1, react: 0.75, lv: [120, 320, 700], lmax: 2, gadd: 0.35, gmul: 1.5, rest: 0.28, rhythm: 0.06, hearts: 3, h0: 70,  hgap: [90, 140],  mul: 0.8 },
    normal: { v0: 2.0, dv: 1.8, tau: 260, cap: 3.9, react: 0.6,  lv: [50, 150, 300],  lmax: 3, gadd: 0,    gmul: 1,   rest: 0.16, rhythm: 0.16, hearts: 3, h0: 120, hgap: [170, 240], mul: 1 },
    hard:   { v0: 2.3, dv: 2.1, tau: 200, cap: 4.5, react: 0.54, lv: [35, 100, 200],  lmax: 3, gadd: 0,    gmul: 0.7, rest: 0.11, rhythm: 0.22, hearts: 3, h0: 170, hgap: [240, 330], mul: 1.25 },
    vhard:  { v0: 2.8, dv: 2.2, tau: 150, cap: 5.1, react: 0.48, lv: [15, 50, 110],   lmax: 3, gadd: 0,    gmul: 0.5, rest: 0.07, rhythm: 0.28, hearts: 2, h0: 200, hgap: [300, 400], mul: 1.5 }
  };
  let D = DIFF[KG.diff()] || DIFF.normal, runKey = KG.dkey('run'), runDiff = KG.diff();   // 판을 시작할 때 한 번 정해 그 판 동안 그대로

  // ── 놀이 단위: 1 = 콩이 그림 한 변(400). 화면 px = 단위 × SZ. 달린 거리 1 단위 = 1m
  const G = 9, G_CUT = 16;            // 내려오는 힘 · 오르는 중에 손을 떼면 더 빨리 꺾인다(짧게 누르면 낮게)
  const V1 = 3.5, V2 = 3.1;           // 첫 점프 · 2단 점프 올라가는 빠르기
  const APEX1 = V1 * V1 / (2 * G);    // 길게 누른 첫 점프 높이 ≈ 0.68
  const APEX2 = APEX1 + V2 * V2 / (2 * G);
  const DOG_L = -0.13, DOG_R = 0.15, DW = DOG_R - DOG_L;   // 부딪힘 상자(몸통 가운데만 — 너그럽게)
  // 머리 위 장애물은 몸통 대신 머리로 판정: 공중 그림의 머리 위 끝 ≈ 발 높이 + 0.69~0.75, 앞쪽 0.05~0.38 (그림 실측) — 조금 너그럽게.
  //   아래 끝 높이(top) 1.26 이면 발 높이 0.58 넘게 떠야 닿는다: 그냥 달리기 0 · 짧게 톡 꼭대기 0.47 은 지나가고, 길게 누른 한 번 점프 0.68 · 2단 1.21 은 머리 쿵
  const HEAD_H = 0.68, HEAD_L = 0.02, HEAD_R = 0.32;
  const POWER_SEC = 5.5;

  // 넘을 것: w·h 보이는 크기, hw(반 너비)·hh 부딪힘 상자
  const OB = {
    cone:      { w: 0.24, h: 0.32, hw: 0.065, hh: 0.24 },
    pot:       { w: 0.24, h: 0.36, hw: 0.07,  hh: 0.20 },
    ball:      { w: 0.20, h: 0.20, hw: 0.065, hh: 0.15 },
    log:       { w: 0.52, h: 0.17, hw: 0.21,  hh: 0.13 },
    puddle:    { w: 0.62, h: 0,    hw: 0.21,  hh: 0.03 },
    bigpuddle: { w: 1.00, h: 0,    hw: 0.40,  hh: 0.03 },
    // Very Hard 전용 — 높은 울타리: 부딪힘 높이 0.80 (한 번 점프 꼭대기 APEX1≈0.68 보다 0.12 높고 2단 APEX2≈1.21 보다 0.41 낮다 → 2단 점프로만)
    //   머리 위 나뭇가지·깃발 줄: hang — 화면 위에서 내려와 아래 끝이 top 높이 (머리 상자로 판정)
    fence:     { w: 0.30, h: 0.88, hw: 0.07,  hh: 0.80 },
    branch:    { w: 0.86, h: 0,    hw: 0.36,  hh: 0, top: 1.26, hang: true },
    flags:     { w: 1.70, h: 0,    hw: 0.85,  hh: 0, top: 1.26, hang: true }
  };
  const PATTERNS = [
    [['cone'], ['ball'], ['pot'], ['puddle']],
    [['log'], ['cone', 'cone'], ['ball', 'pot'], ['pot', 'ball'], ['cone'], ['puddle']],
    [['cone', 'cone', 'cone'], ['log', 'ball'], ['bigpuddle'], ['puddle', 'cone'], ['pot', 'cone'], ['log']],
    [['pot', 'cone', 'pot', 'ball'], ['log', 'cone', 'log'], ['bigpuddle', 'ball'], ['cone', 'ball', 'cone', 'ball', 'cone'], ['log', 'log']]
  ];
  // 높이 h 인 것 위에 떠 있는 시간: 한 번 점프(길게) · 2단 점프(꼭대기에서 한 번 더)
  const tSingle = h => 2 * Math.sqrt(2 * Math.max(0.02, APEX1 - h - 0.05) / G);
  const tDouble = h => tSingle(h) / 2 + V2 / G + Math.sqrt(2 * Math.max(0.02, APEX2 - h - 0.05) / G);
  // 짧게 톡(0.06초) 누른 점프로 높이 h 위에 떠 있는 시간 — 그냥 놓인 묶음은 이것만으로 넘을 수 있어야 한다
  const tapMemo = {};
  function tTap(h) {
    if (tapMemo[h] != null) return tapMemo[h];
    let y = 0, vy = V1, t = 0, n = 0; const dt = 1 / 480, lim = h + 0.05;
    do { vy -= (vy > 0 && t >= 0.06 ? G_CUT : G) * dt; y += vy * dt; t += dt; if (y > lim) n++; } while (y > 0);
    return (tapMemo[h] = n * dt);
  }

  // ── 화면
  const stage = $('stage'), bg = $('bg'), fx = $('fx');
  const c = bg.getContext('2d', { alpha: false }), f = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1, SZ = 110, GY = 500, KX = 90, VCAP = 3.9, AHEAD = 3, FONT = 'sans-serif', SR = 0;
  let geo = null, layers = [], glow = null, starPts = [];
  const bar = topbar({ title: name + '런', back: 'index.html' });
  document.title = name + '런';
  const btnPause = document.createElement('button'); btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  bar.right(btnPause);
  const k = kong($('dog'), 110); k.setPose('stand');

  $('stTitle').textContent = name + '런';
  $('stSub').textContent = J(name, '이랑/랑') + ' 공원 산책길을 달려요';
  const fine = matchMedia('(pointer: fine)').matches;
  const bestTxt = () => { const b = KG.best(KG.dkey('run')); return b > 0 ? '최고 기록 ' + Math.round(b).toLocaleString() + '점' : ''; };
  const keyTxt = () => [fine ? '스페이스 · ↑ 키로도 뛰어요' : '', bestTxt()].filter(Boolean).join('  ·  ');
  $('stKey').textContent = keyTxt(); $('stKey').hidden = !keyTxt();
  const HEART = '<svg viewBox="0 0 24 24"><path fill="#FF6B81" d="M12 20.6c-.3 0-.6-.1-.8-.3C6.3 16 3 13.100 3 9.300 3 6.600 5.100 4.500 7.700 4.500c1.700 0 3.300.9 4.300 2.300 1-1.400 2.600-2.300 4.300-2.300C18.900 4.500 21 6.600 21 9.300c0 3.800-3.300 6.700-8.200 11-.2.200-.5.300-.8.300z"/></svg>';
  $('hearts').innerHTML = HEART + HEART + HEART;

  // ── 상태
  const S = {
    mode: 'ready', t: 0, x: 0, x0: 0, v: 0.8, y: 0, vy: 0, air: false, jumps: 0, hold: false, buffer: 0, landT: 0, phase: 0,
    hearts: 3, inv: 0, dip: 0, wob: 0, shake: 0, power: 0, pts: 0, treats: 0, hits: 0, score: 0, dist: 0,
    obs: [], items: [], clusters: [], nextX: 0, lastWide: false, rhythm: 0, nextStar: 0, nextHeart: 0,
    endT: 0, sat: false, say: 0, freeze: 0, skyIdx: 0, bot: false, god: false, parts: []
  };
  const baseSpeed = d => Math.min(VCAP, D.v0 + D.dv * (1 - Math.exp(-Math.max(0, d) / D.tau)));
  const setCap = () => { VCAP = clamp((AHEAD - 0.2) / D.react, 2.6, D.cap); };   // 좁은 화면에서는 보고 뛸 틈이 남도록 빠르기를 덜 올린다

  // ── 하늘: 달릴수록 낮 → 노을 → 밤 → 새벽으로 (한 구간 150m)
  const SKY = [
    { top: [111, 182, 240], bot: [221, 241, 251], tint: [255, 255, 255, 0],    night: 0, sun: 1,    note: '아침이 밝았어요' },
    { top: [124, 127, 208], bot: [255, 199, 160], tint: [255, 128, 72, 0.13],  night: 0, sun: 0.12, note: '노을이 지고 있어요' },
    { top: [16, 23, 66],    bot: [59, 67, 145],   tint: [12, 16, 60, 0.38],    night: 1, sun: -0.6, note: '밤 산책이에요, 별이 떴어요' },
    { top: [143, 177, 234], bot: [255, 220, 203], tint: [255, 176, 150, 0.08], night: 0, sun: 0.2,  note: '새벽이 밝아와요' }
  ];
  const SKY_LEN = 150;
  function skyAt(d) {
    const p = Math.max(0, d) / SKY_LEN, i = Math.floor(p), fr = p - i, a = SKY[i % 4], b = SKY[(i + 1) % 4];
    let u = clamp((fr - 0.62) / 0.38, 0, 1); u = u * u * (3 - 2 * u);
    const mix = (A, B) => A.map((v, j) => lerp(v, B[j], u));

  // ── 길 만들기: 한 묶음(붙어 있는 것들)씩. 묶음 너비는 그때 빠르기로 넘을 수 있는 만큼만, 묶음 사이는 내려와서 다시 뛸 만큼 띄운다

  // ── 조작

  }
  // 지금 눌려 있는 손가락·키. 하나라도 남아 있으면 '길게 누르기'가 이어진다(두 손가락 번갈아 누르기, 멈췄다 계속하기)

      else if (S.mode === 'over') { e.preventDefault(); if (performance.now() - overAt >= 900) start(); }
      else if (S.mode === 'pause') { e.preventDefault(); resume(); }
    } else if (e.code === 'KeyP' || e.code === 'Escape') { if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); }
  });
  addEventListener('keyup', e => { if (JUMP_KEYS.has(e.code)) release(e.code); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); last = 0; });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  addEventListener('orientationchange', () => setTimeout(layout, 200));

  // ── 돌리기
  let last = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    const dt = last ? Math.min(0.05, (ms - last) / 1000) : 0.016; last = ms;
    if (dt <= 0) return;
    if (S.mode === 'pause') return;
    if (S.mode === 'over') { S.t += dt; draw(); return; }
    if (S.freeze > 0) { S.freeze -= dt; S.t += dt; draw(); return; }
    step(dt); draw();
  }
  layout(); paintHearts();
  requestAnimationFrame(frame);

  // ── 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (한 번만 띄우는 것은 공통이 한다). 「규칙 보기」 로 다시 볼 수 있다
  //    떠 있는 동안 키·누름은 공통이 capture 에서 막는다. 닫으면 초점을 「시작」 으로 옮긴다
  const RULES = { key: 'run', title: name + '런', lead: J(name, '이랑/랑') + ' 공원 산책길을 달려요', items: [
    ['👆', '화면을 누르면 폴짝! 공중에서 또 누르면 2단 점프, 길게 누르면 더 높이'],
    ['🦴', '멀리 달리고 간식을 먹을수록 점수가 올라요. 별을 먹으면 신나는 질주!'],
    ['💗', '장애물·물웅덩이에 걸리면 하트가 줄고, 다 없어지면 끝나요'],
    ['⭐', '난이도는 시작 카드에서 골라요. 어려울수록 점수가 커요'],
    ['🌿', 'Very Hard 에서는 높은 울타리는 2단 점프로 넘고, 나뭇가지 밑은 그냥 달리고, 깃발 줄 밑은 짧게 톡 뛰어요']
  ] };
  // 안내를 닫은 키(Enter·스페이스)를 아직 누르고 있는 동안에는 그 키가 방금 초점을 받은 「시작」 단추를 누르지 못하게 한다 (길게 누른 Enter 의 되풀이, 스페이스를 뗄 때)
  let closeKey = false;
  addEventListener('keydown', e => { if (!closeKey) return; if (e.repeat) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); } } else closeKey = false; }, true);
  addEventListener('keyup', e => { if (!closeKey) return; closeKey = false; if (e.code === 'Enter' || e.code === 'Space') e.preventDefault(); }, true);
  addEventListener('pointerdown', () => { closeKey = false; }, true);
  function showRules(force) { return KG.rules(RULES, force).then(shown => { if (!shown || S.mode !== 'ready') return; closeKey = true; try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} }); }
  $('btnRules').addEventListener('click', () => { sfx('tap'); showRules(true); });
  showRules(false);

  // ── 시험용
  window.GAME = {
    S, get state() { return S.mode; }, get score() { return S.score; }, get dist() { return S.dist; }, get hearts() { return S.hearts; }, get treats() { return S.treats; }, get speed() { return S.v; }, get stage() { return skyAt(S.dist).idx; },
    get metrics() { return { W, H, SZ, GY, KX, VCAP, AHEAD, diff: KG.diff() }; },
    start, end: endRun, over: showOver, pause, resume, press() { pressBy('api'); }, release() { release('api'); }, baseSpeed, skyAt,
    // 자동 달리기로 sec 초를 빨리 돌려 본다 (하트는 줄지 않고 부딪힌 횟수만 센다)
    sim(sec, dt) { dt = dt || 1 / 60; const bot = S.bot, god = S.god; S.bot = true; S.god = true; S.simulating = true; if (S.mode !== 'play') start(); const h0 = S.hits; for (let t = 0; t < sec; t += dt) step(dt); S.bot = bot; S.god = god; S.simulating = false; S.hold = false; return { hits: S.hits - h0, dist: Math.floor(S.dist), score: S.score, treats: S.treats, v: +S.v.toFixed(2) }; }
  };
})();
</script>
</body>
</html>
