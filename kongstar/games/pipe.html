<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이는 정비공</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이는 정비공: 밤하늘(bg) → 판·파이프·수도꼭지·물그릇(map) → 콩이(stage) → 공구 벨트·물방울(fx) → 점수판·단추 순서로 겹친다 */
#bg, #map, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#map { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: pointer; }
#hud { position: fixed; z-index: 10; display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .df { color: #D5DBFF; font-weight: 500; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-right: 2px; }
#hud .rt { margin-left: auto; }
#hud .lk { border-color: rgba(143,216,255,.7); color: #D8F1FF; }
/* 점수판이 폭에 안 들어가면(실측) 단계별로 줄인다: 1 난이도 알약 숨김 → 2 물샘은 💧만 → 3 「돌림 N · 목표 M」을 「돌림 N / M」으로 → 4 「N / M」 */
#hud .w3 { display: none; }
#hud.t1 .df { display: none; }
#hud.t2 .lt { display: none; }
#hud.t3 .w2 { display: none; }
#hud.t3 .w3 { display: inline; }
#hud.t4 .w1 { display: none; }
#say { position: fixed; z-index: 27; pointer-events: none; text-align: center; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
#say.show { opacity: 1; transform: none; }
body.saying .kg-top .kg-title { visibility: hidden; }
#say.land span { font-size: 13px; line-height: 1.25; padding: 5px 12px; }
#say span { display: inline-block; max-width: 100%; box-sizing: border-box; background: rgba(255,255,255,.95); color: var(--ink); font-size: 13.5px; font-weight: 600; letter-spacing: -.3px; line-height: 1.35; padding: 6px 12px; border-radius: 13px; box-shadow: 0 3px 10px rgba(0,0,0,.22); }
#ctl { position: fixed; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; }
#ctl button { flex: 1 1 0; min-width: 0; height: 46px; box-sizing: border-box; border-radius: 16px; border: 1px solid var(--glass-line); background: rgba(18,22,52,.62); color: #fff; font-size: 14px; font-weight: 600; letter-spacing: -.3px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; white-space: nowrap; }
#ctl button:active { background: rgba(60,68,130,.7); }
#ctl button:disabled { opacity: .38; }
#ctl button b { min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
#ctl #btnGo { flex: 1 0 100%; height: 52px; font-size: 16px; background: #fff; color: var(--pri); border-color: #fff; }
#ctl #btnGo:active { background: #EEF0FA; }
#ctl #btnGo:disabled { opacity: .45; }
#ctl #btnGo.ready { background: #7FD8FF; border-color: #7FD8FF; color: #06324A; animation: goNudge 1.1s ease-in-out infinite; }
@keyframes goNudge { 0%,100% { box-shadow: 0 0 0 2px rgba(127,216,255,.45); } 50% { box-shadow: 0 0 0 8px rgba(127,216,255,.12); } }
#ctl.one { flex-wrap: nowrap; gap: 6px; }
#ctl.one #btnGo { flex: 1.45 1 0; height: 46px; font-size: 15px; }
#ctl.col { flex-direction: column; flex-wrap: nowrap; gap: 6px; }
#ctl.col button, #ctl.col #btnGo { flex: 0 0 44px; height: 44px; width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .info { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 0; }
.kg-card .stars svg { width: 38px; height: 38px; display: block; }
.kg-card .stars svg path { fill: #E6E9EF; }
.kg-card .stars svg.on path { fill: #FFC23D; }
.kg-card .stars svg.on { animation: starIn .45s both; }
.kg-card .stars svg.on:nth-child(2) { animation-delay: .12s; }
.kg-card .stars svg.on:nth-child(3) { animation-delay: .24s; }
@keyframes starIn { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: none; opacity: 1; } }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
.kg-card .row #btnStart { white-space: nowrap; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-top .kg-title { font-size: 15px; letter-spacing: -.5px; } body .kg-card .kg-diff button { font-size: 12px; } #ctl { gap: 6px; } #ctl button { font-size: 13px; letter-spacing: -.6px; padding: 0 3px; gap: 3px; } #hud { gap: 4px; } #hud > div { padding: 0 9px; font-size: 13px; } .kg-card .row #btnRules { padding: 0 12px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .kg-diff { margin-top: 10px; }
  body .kg-card .stars { margin-top: 6px; }
  body .kg-card .stars svg { width: 32px; height: 32px; }
  body .kg-card .big { font-size: 34px; margin: 4px 0 0; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 430px); padding: 12px 20px; }
  body .kg-card h2 { margin-bottom: 2px; font-size: 19px; }
  #stLead, #edText, #stInfo { display: none; }
  body .kg-card .row #btnStart { padding: 0 12px; }
  body .kg-card .how { margin-top: 6px; padding: 7px 14px; }
  body .kg-card .info { margin-top: 5px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .stars { margin-top: 2px; }
  body .kg-card .stars svg { width: 28px; height: 28px; }
  body .kg-card .big { font-size: 28px; margin: 0; }
  body .kg-card .new { margin-top: 0; }
}
@media (orientation: landscape) and (max-height: 430px) { body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 6px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 9px; font-size: 12px; white-space: nowrap; } }
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } }
@media (prefers-reduced-motion: reduce) { #ctl #btnGo.ready, .kg-card .stars svg.on { animation: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="map" aria-hidden="true"></canvas>
<div id="stage"></div>
<canvas id="fx" role="img" aria-label="파이프 판"></canvas>
<div id="say" role="status" aria-live="polite"><span></span></div>

<div id="hud" aria-hidden="true">
  <div class="st" id="hudStage">1단계</div>
  <div class="df" id="hudDiff">Normal</div>
  <div class="lk" id="hudLeak" hidden>💧<span class="lt">&nbsp;물샘 주의</span></div>
  <div class="rt"><small class="w1">돌림</small><span id="hudRot">0</span><small id="hudGoalBox"><span class="w2">&nbsp;· 목표 </span><span class="w3">&nbsp;/ </span><span id="hudGoal">0</span></small></div>
</div>
<div id="ctl" hidden>
  <button type="button" id="btnUndo">되돌리기</button>
  <button type="button" id="btnRestart">처음부터</button>
  <button type="button" id="btnHint">힌트<b id="hintN"></b></button>
  <button type="button" id="btnGo">물 틀기</button>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이는 정비공</h2>
    <p id="stLead"></p>
    <div class="how"><p><b>칸을 눌러</b> 파이프를 돌려요. 수도꼭지에서 물그릇까지 이어지면 <b>물 틀기</b>!</p></div>
    <p class="info" id="stInfo"></p>
    <div class="rec" id="stRec"><span>이번에 할 단계<b id="stStage"></b></span><span id="stBestBox">최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">단계 완료!</h2>
    <p id="edText"></p>
    <div class="stars" id="edStars" role="img"></div>
    <div class="big"><span id="edRot">0</span><small>번 돌림</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>별 3개 기준<b id="edOpt"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnStop" type="button">그만하기</button><button class="kg-btn pri" id="btnNext">다음 단계</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const TITLE = J(name, '은/는') + ' 정비공';

  // ═══════ 난이도 표 ═══════
  //   size(n) 판 크기 [가로, 세로] (가로는 6칸까지 — 가로 휴대폰(568×320)은 판을 돌려 그려 가로 칸 수가 세로 줄 수가 되는데, 7줄이면 칸이 44px 아래로 내려간다. 세로 320px 화면은 7칸도 44px 이 되지만, 단계 배치는 화면 방향과 상관없이 같아야 하므로 6칸으로 묶는다) · hints 단계당 힌트 횟수
  //   intro 새 요소가 처음 나오는 단계 (fixed 나사 고정 칸 · twin 물그릇 두 개 · leak 물샘 금지 — Hard 이상만) · twinP/leakP 그 뒤로 나올 확률
  //   fixedN 고정 칸 수 범위 · len(cols, rows) 물길(칸 수) 범위 · turns 꺾이는 횟수 하한 · optMin(L) 별 3개 기준(가장 적게 돌리는 횟수) 하한
  //   keep 물길 칸을 처음부터 맞는 방향으로 둘 확률 · empty/cross 가짜 조각 중 빈칸·십자 비율 · glow 이어진 파이프에 물빛을 비춰 주나
  const DIFF = {
    easy:   { size: n => n <= 3 ? [4, 4] : n <= 6 ? [4, 5] : n <= 10 ? [5, 5] : [5, 6], hints: 5, intro: { fixed: 5, twin: 8, leak: 1e9 }, twinP: 0.35, leakP: 0,
              fixedN: [1, 2], len: (c, r, n) => [r, n <= 3 ? r + 2 : Math.round(c * r * 0.55)], turns: 1, optMin: L => Math.max(2, Math.ceil(L * 0.35)), keep: 0.25, earlyKeep: 0.15, empty: 0.22, cross: 0.03, glow: true },
    normal: { size: n => n <= 2 ? [4, 5] : n <= 5 ? [5, 5] : n <= 9 ? [5, 6] : n <= 14 ? [6, 6] : [6, 7], hints: 3, intro: { fixed: 3, twin: 5, leak: 1e9 }, twinP: 0.5, leakP: 0,
              fixedN: [1, 2], len: (c, r) => [r + Math.round(c * 0.4), Math.round(c * r * 0.6)], turns: 2, optMin: L => Math.ceil(L * 0.55), keep: 0.12, empty: 0.12, cross: 0.05, glow: true },
    hard:   { size: n => n <= 1 ? [5, 5] : n <= 4 ? [5, 6] : n <= 8 ? [6, 6] : n <= 13 ? [6, 7] : [6, 8], hints: 2, intro: { fixed: 2, twin: 3, leak: 4 }, twinP: 0.55, leakP: 0.5,
              fixedN: [2, 3], len: (c, r) => [r + Math.round(c * 0.8), Math.round(c * r * 0.62)], turns: 3, optMin: L => Math.ceil(L * 0.7), keep: 0.05, empty: 0.06, cross: 0.08, glow: true },
    vhard:  { size: n => n <= 1 ? [5, 6] : n <= 3 ? [6, 6] : n <= 6 ? [6, 7] : [6, 8], hints: 1, intro: { fixed: 3, twin: 4, leak: 2 }, twinP: 0.7, leakP: 0.8,
              fixedN: [2, 4], len: (c, r) => [r + Math.round(c * 1.1), Math.round(c * r * 0.68)], turns: 4, optMin: L => Math.ceil(L * 0.85), keep: 0, empty: 0.03, cross: 0.1, glow: false }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 파이프 규칙 ═══════
  //   칸마다 열린 쪽을 비트로 (위 1 · 오른쪽 2 · 아래 4 · 왼쪽 8). 누르면 시계 방향으로 90° — 위→오른쪽→아래→왼쪽.
  //   수도꼭지는 맨 윗줄 한 칸의 위쪽에, 물그릇은 맨 아랫줄 칸의 아래쪽에 붙어 있다.
  //   물은 수도꼭지에서 서로 마주 열린 칸을 따라 흐른다. 물그릇(들)에 닿으면 성공.
  //   물샘 금지 단계(Hard 이상): 물이 흐르는 파이프에 막히지 않은 끝(빈칸·벽·안 맞는 칸 쪽)이 하나라도 있으면 실패.
  const U = 1, R = 2, Dn = 4, L = 8;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const rot1 = m => ((m << 1) | (m >> 3)) & 15;
  const rotN = (m, k) => { for (let i = 0; i < (k & 3); i++) m = rot1(m); return m; };
  const opp = d => (d + 2) & 3;
  const pop = m => (m & 1) + (m >> 1 & 1) + (m >> 2 & 1) + (m >> 3 & 1);
  // m 을 몇 번 돌려야 need 쪽이 모두 열리나 (0~3, 안 되면 9)
  const cost = (m, need) => { for (let k = 0; k < 4; k++) if ((rotN(m, k) & need) === need) return k; return 9; };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const nbrOf = (cols, rows, c, d) => { const x = c % cols + DX[d], y = (c / cols | 0) + DY[d]; return x < 0 || y < 0 || x >= cols || y >= rows ? -1 : y * cols + x; };

  // 물 흐름 보기: 수도꼭지에서 너비 우선으로 → { ok, dist[칸] (-1 = 물 없음), from[칸] (물이 들어온 쪽), leaks [[칸, 쪽]], reached [물그릇마다], maxd }
  function flowOf(S, m) {
    const N = S.n, dist = new Int16Array(N).fill(-1), from = new Int8Array(N).fill(-1), q = [];
    const res = { ok: false, dist, from, leaks: [], reached: S.bowls.map(() => false), maxd: 0, count: 0 };
    if (!(m[S.src] & U)) return res;
    dist[S.src] = 0; from[S.src] = 0; q.push(S.src);
    for (let h = 0; h < q.length; h++) {
      const c = q[h];
      for (let d = 0; d < 4; d++) {
        if (!(m[c] & (1 << d))) continue;
        const n = nbrOf(S.cols, S.rows, c, d);
        if (n >= 0 && (m[n] & (1 << opp(d)))) { if (dist[n] < 0) { dist[n] = dist[c] + 1; from[n] = opp(d); q.push(n); } continue; }
        if (c === S.src && d === 0) continue;
        if (d === 2 && S.bowls.some(b => b.cell === c)) continue;
        res.leaks.push([c, d]);
      }
    }
    res.count = q.length; for (const c of q) res.maxd = Math.max(res.maxd, dist[c]);
    res.reached = S.bowls.map(b => dist[b.cell] >= 0 && !!(m[b.cell] & Dn));
    res.ok = res.reached.every(Boolean) && (!S.leak || res.leaks.length === 0);
    return res;
  }

  // ═══════ 단계 만들기: 씨앗으로 길을 먼저 내고(반드시 풀린다), 가짜 조각으로 채운 뒤 돌려 섞는다 ═══════
  //   길은 판 전체의 무작위 신장 나무(Wilson)에서 수도꼭지 칸 → 물그릇 칸 사이의 하나뿐인 길. 물그릇이 둘이면 둘째 그릇에서 첫 길까지의 나무 길이 갈림(T자)이 된다.
  function wilson(cols, rows, rng) {
    const N = cols * rows, inT = new Uint8Array(N), nxt = new Int8Array(N), adj = new Uint8Array(N);
    inT[Math.floor(rng() * N)] = 1;
    for (const s of shuffle([...Array(N).keys()], rng)) {
      if (inT[s]) continue;
      let c = s;
      while (!inT[c]) { const ds = [0, 1, 2, 3].filter(d => nbrOf(cols, rows, c, d) >= 0), d = ds[Math.floor(rng() * ds.length)]; nxt[c] = d; c = nbrOf(cols, rows, c, d); }
      c = s;
      while (!inT[c]) { inT[c] = 1; const d = nxt[c], n = nbrOf(cols, rows, c, d); adj[c] |= 1 << d; adj[n] |= 1 << opp(d); c = n; }
    }
