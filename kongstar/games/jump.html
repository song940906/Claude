<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 점프 점프</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 점프 점프: 구름·쿠션을 밟고 위로 — 배경 캔버스 · 콩이(SVG) · 효과 캔버스를 차례로 겹친다 */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: #8CC4F4; }
#bg, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#dog { position: absolute; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }   /* 놀이 칸(가운데 기둥) — 좌우 끝에서 콩이가 잘려 반대쪽으로 이어진다 */
#fx { pointer-events: none; }
#dog.air #kong-shadow { opacity: 0; }   /* 공중에서는 발밑 그림자를 감춘다 */
/* 점수판 */
#hud { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(var(--sat) + 62px); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.hp { height: 34px; border-radius: 17px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; background: rgba(18,22,52,.46); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; white-space: nowrap; }
.hp .num { font-size: 16px; font-weight: 700; min-width: 1ch; text-align: right; }
.hp .unit { font-size: 12px; font-weight: 500; opacity: .8; margin-left: -3px; }
.hp .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); margin: 0 4px; }
.hp svg { width: 18px; height: 18px; display: block; }
#hDiff { height: 26px; border-radius: 13px; padding: 0 10px; font-size: 12px; letter-spacing: 0; opacity: .92; }
#note { position: fixed; z-index: 10; left: 50%; top: calc(var(--sat) + 106px); transform: translate(-50%, -6px); padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.92); color: #191F28; font-size: 14px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; max-width: 92vw; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#note.show { opacity: 1; transform: translate(-50%, 0); }
/* 좌우 이동 단추: 엄지가 닿는 좌하단 · 우하단, 누르고 있는 동안 움직인다 */
.ctl { position: fixed; z-index: 12; bottom: calc(var(--sab) + 14px); width: 84px; height: 84px; border-radius: 50%; padding: 0; border: 1.5px solid rgba(255,255,255,.5); background: rgba(255,255,255,.3); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; display: flex; align-items: center; justify-content: center; touch-action: none; box-shadow: 0 6px 18px rgba(20,30,80,.2); transition: transform .08s, background .08s; }
.ctl::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; }   /* 눌리는 자리는 보이는 것보다 넓게 */
.ctl svg { width: 38px; height: 38px; display: block; filter: drop-shadow(0 1px 3px rgba(20,30,80,.35)); pointer-events: none; }
.ctl.on { background: rgba(255,255,255,.62); color: #2C3577; transform: scale(.94); }
#btnL { left: calc(var(--sal) + 14px); }
#btnR { right: calc(var(--sar) + 14px); }
@media (max-height: 430px) { .ctl { width: 78px; height: 78px; bottom: calc(var(--sab) + 18px); } #btnL { left: calc(var(--sal) + 22px); } #btnR { right: calc(var(--sar) + 22px); } }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 세로 화면: 카드를 위로 올려 아래에 있는 콩이가 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim:not(.kg-rules) { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  body .kg-scrim:not(.kg-rules) .kg-card { padding: 14px 18px 12px; width: min(100%, 440px); }
  .kg-card .tip { margin-top: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.45; }
  .kg-card .key { margin-top: 5px; }
  body .kg-card .big { font-size: 30px; margin: 0; }
  body .kg-scrim:not(.kg-rules) .kg-card .row { margin-top: 10px; }
  body .kg-scrim:not(.kg-rules) .kg-card .row .kg-btn { height: 44px; }
  .kg-card .stats { margin-top: 6px; }
  .kg-card .stats div { padding: 6px 4px 5px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
  .badge { margin-bottom: 2px; padding: 3px 10px; }
  body .kg-scrim:not(.kg-rules) .kg-card h2 { font-size: 18px; margin-bottom: 2px; }
}
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats div { padding-left: 1px; padding-right: 1px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; white-space: nowrap; }
  .ctl { width: 76px; height: 76px; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dog"></div>
  <canvas id="fx"></canvas>
</div>

<div id="hud" hidden>
  <div class="hp" id="hDiff"></div>
  <div class="hp"><span class="num" id="hScore">0</span><span class="unit">점</span><span class="sep"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-35 12 12)" fill="#FFF6E0"><rect x="6" y="9.6" width="12" height="4.8" rx="2"/><circle cx="6" cy="9.4" r="3"/><circle cx="6" cy="14.6" r="3"/><circle cx="18" cy="9.4" r="3"/><circle cx="18" cy="14.6" r="3"/></g></svg>
    <span id="hBone">0</span></div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<button class="ctl" id="btnL" aria-label="왼쪽으로" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 4.6c.9-.6 2.100 0 2.100 1.100v12.600c0 1.100-1.200 1.700-2.100 1.100l-9.200-6.300a1.300 1.300 0 0 1 0-2.200z"/></svg></button>
<button class="ctl" id="btnR" aria-label="오른쪽으로" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.4 4.6c-.9-.6-2.100 0-2.100 1.100v12.600c0 1.100 1.200 1.700 2.100 1.100l9.200-6.300a1.300 1.300 0 0 0 0-2.200z"/></svg></button>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이의 점프 점프</h2>
    <p id="stSub"></p>
    <div class="tip">구름을 밟으면 <b>저절로 폴짝!</b> 아래의 <b>◀ ▶ 단추</b>를 누르고 있으면 그쪽으로 움직여요.</div>
    <div class="key" id="stKey"></div>
    <div class="row"><button class="kg-btn" id="btnRules">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="paTitle">
    <h2 id="paTitle">잠깐 쉬는 중이에요</h2>
    <p id="paSub"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardOver" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="ovTitle">
    <div class="badge" id="ovBadge" hidden>새 기록이에요!</div>
    <h2 id="ovTitle">높이 올라갔어요!</h2>
    <p id="ovSub"></p>
    <div class="big"><span id="ovScore">0</span><small>점</small></div>
    <div class="stats">
      <div><b id="ovHigh">0m</b><small>올라간 높이</small></div>
      <div><b id="ovBone">0개</b><small>뼈다귀</small></div>
      <div><b id="ovBest">0점</b><small id="ovBestL">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const KEY = 'jump';

  // ── 놀이 단위: 놀이 칸 너비 = FW(9) 단위, 높이 1 단위 = 1m = 1점. 화면 px = 단위 × U
  const FW = 9;
  const G = 26, VJ = 12.5, VS = 19;       // 내려오는 힘 · 보통 발판에서 튀는 빠르기(높이 3.0) · 쿠션에서 튀는 빠르기(높이 6.9)
  const VX = 7, AX = 120, FR = 80;        // 좌우 빠르기 · 단추를 눌렀을 때 붙는 힘 · 뗐을 때 멈추는 힘
  const VFALL = 22, FOOT = 0.42;          // 떨어지는 빠르기 한도 · 발 반 너비(발판 끝에서 이만큼은 걸쳐도 밟힌다)
  const GAP_MAX = 2.55;                   // 발판 사이 높이 한도 (점프 높이 3.0 보다 늘 낮게)
  const BONE_PT = 5;
  // 난이도: pw 발판 너비 · g0→g1 발판 사이 높이(ramp m 에 걸쳐 벌어짐) · h0 시작 높이(처음부터 이만큼 올라온 것처럼 어렵게)
  //   reach 다음 발판을 얼마나 멀리 놓나(닿을 수 있는 거리의 몇 할까지) · mv0→mv1 움직이는 발판 비율 · va0→va1 사라지는 발판 비율
  //   spring 쿠션 비율 · extra 덤 발판(쉬어 갈 곳) · mvSp 움직이는 빠르기 · amp 움직이는 폭 · bone 뼈다귀
  const DIFF = {
    easy:   { pw: 2.4,  g0: 1.0, g1: 1.7,  ramp: 500, h0: 0,   reach: 0.42, mv0: 0.05, mv1: 0.15, va0: 0,    va1: 0.08, spring: 0.12, extra: 0.6,  mvSp: 1.2, amp: 1.0, bone: 0.12 },
    normal: { pw: 1.9,  g0: 1.3, g1: 2.05, ramp: 400, h0: 0,   reach: 0.58, mv0: 0.12, mv1: 0.28, va0: 0.06, va1: 0.18, spring: 0.09, extra: 0.3,  mvSp: 1.8, amp: 1.4, bone: 0.10 },
    hard:   { pw: 1.55, g0: 1.6, g1: 2.3,  ramp: 300, h0: 60,  reach: 0.74, mv0: 0.22, mv1: 0.40, va0: 0.14, va1: 0.28, spring: 0.07, extra: 0.12, mvSp: 2.4, amp: 1.8, bone: 0.09 },
    vhard:  { pw: 1.25, g0: 1.9, g1: 2.5,  ramp: 200, h0: 100, reach: 0.90, mv0: 0.30, mv1: 0.50, va0: 0.22, va1: 0.38, spring: 0.05, extra: 0,    mvSp: 3.0, amp: 2.2, bone: 0.08 }
  };
  let D = DIFF[KG.diff()] || DIFF.normal, runKey = KG.dkey(KEY);   // 판을 시작할 때 한 번 정해 그 판 동안 그대로

  const mod = (a, n) => ((a % n) + n) % n;
  const wd = d => mod(d + FW / 2, FW) - FW / 2;   // 좌우가 이어진 칸에서 가장 가까운 쪽 거리(부호 있음)
  // 높이 y, 위로 vy 인 콩이가 내려오면서 높이 py 를 지나는 때까지 걸리는 시간 (못 올라가면 null)
  function tFall(y, vy, py) { const disc = vy * vy - 2 * G * (py - y); return disc < 0 ? null : (vy + Math.sqrt(disc)) / G; }
  // t 초 동안 옆으로 갈 수 있는 거리 — 가장 나쁜 경우(반대쪽으로 한껏 가던 중)로 센다
  const reachWorst = t => Math.max(0, VX * t - 2 * VX * VX / AX);
  const pxAt = (p, t) => p.type === 'm' ? p.x + p.A * Math.sin(p.ph + p.om * t) : p.x;

  // ── 발판 만들기: 「사슬」 발판은 바로 앞 사슬 발판에서 꼭 닿을 수 있는 자리에만 놓는다
  //   가장 나쁜 경우 옆 거리 = 가운데끼리 거리 + 두 발판이 움직이는 폭 + (앞 발판 반 너비 − 새 발판 반 너비)  ≤  닿는 거리 × reach
  function needDist(top, x, w, A) { return Math.abs(wd(x - top.x)) + (top.type === 'm' ? top.A : 0) + A + Math.max(0, top.w / 2 - w / 2); }
  function nextPlat(top, d) {
    const p = clamp((top.y + d.h0) / d.ramp, 0, 1);
    let dy = Math.min(GAP_MAX, lerp(d.g0, d.g1, p) * rand(0.82, 1));
    const r = Math.random(), pm = lerp(d.mv0, d.mv1, p), pv = lerp(d.va0, d.va1, p);
    let type = r < d.spring ? 's' : r < d.spring + pm ? 'm' : (r < d.spring + pm + pv && top.type !== 'v') ? 'v' : 'n';
    // 사라지는 발판 V 는 밟으면 없어진다 → 그 앞 발판 A0 에서 V 다음 발판으로도 바로 닿아야 한다(다음 발판을 놓쳐 A0 로 떨어져도 길이 남게).
    //   V 는 반 칸 높이까지만, V 다음 발판은 A0 에서 GAP_MAX 안에 · 옆 거리도 A0 기준으로 한 번 더 본다
    const A0 = top.type === 'v' ? top.from : null;
    if (type === 'v') dy = Math.min(dy, GAP_MAX / 2);
    if (A0) dy = Math.min(dy, GAP_MAX - (top.y - A0.y));
    const bud = h => reachWorst(tFall(0, VJ, h)) * d.reach;
    const budget = bud(type === 'v' ? GAP_MAX : dy), budget0 = A0 ? bud(top.y + dy - A0.y) : 0, aTop = top.type === 'm' ? top.A : 0;
    const okA0 = (x, w, A) => !A0 || A0.type === 'g' || needDist(A0, x, w, A) <= budget0;
    const done = q => { if (q.type === 'v') q.from = Object.assign({}, top, { from: null }); return q; };
    for (let i = 0; i < 14; i++) {
      if (i >= 10 && type === 'm') type = 'n';
      const w = type === 's' ? Math.max(1.2, d.pw * 0.85) : d.pw, A = type === 'm' ? rand(0.6, 1) * d.amp : 0;
      const lo = w / 2 + A + 0.1, hi = FW - w / 2 - A - 0.1;
      let x;
      if (top.type === 'g') x = rand(lo, hi);
      else { const maxd = budget - aTop - A - Math.max(0, top.w / 2 - w / 2); if (maxd < 0.15) continue; const off = rand(-1, 1) * maxd; x = top.x + off; if (x < lo || x > hi) x = Math.random() < 0.5 ? clamp(mod(x, FW), lo, hi) : clamp(top.x - off, lo, hi); }   // 끝에 닿으면 반대쪽으로 이어 놓거나 안쪽으로 되돌린다
      if ((top.type === 'g' || needDist(top, x, w, A) <= budget) && okA0(x, w, A)) return done(mkPlat(type, x, top.y + dy, w, A, d));
    }
    const w = d.pw; return mkPlat('n', clamp(top.x, w / 2 + 0.1, FW - w / 2 - 0.1), top.y + dy, w, 0, d);   // 마지막 수: 바로 위에 멈춘 발판 (앞이 사라지는 발판이어도 그 바로 위는 A0 에서 닿는다)
  }
  function mkPlat(type, x, y, w, A, d) { return { type, x, y, w, A, ph: rand(0, TAU), om: A > 0 ? d.mvSp / A : 0, gone: false, fade: 0, sq: 0, chain: true, seed: Math.floor(rand(0, 1000)) }; }

  // ── 화면
  const stage = $('stage'), bg = $('bg'), fx = $('fx'), dogBox = $('dog');
  const c = bg.getContext('2d', { alpha: false }), f = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1, U = 40, FX0 = 0, FWPX = 360, VH = 19, FOLLOW = 9, GROUND = 3, KS = 88, FONT = 'sans-serif', PORT = true, SAFE = { t: 0, b: 0, l: 0, r: 0 };
  const TITLE = J(name, '의') + ' 점프 점프';
  const bar = topbar({ title: TITLE, back: 'index.html' });
  document.title = TITLE;
  const btnPause = document.createElement('button'); btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  bar.right(btnPause);
  const k = kong(dogBox, 88), k2 = kong(dogBox, 88);   // k2: 좌우 끝을 넘어갈 때 반대쪽에 함께 보이는 그림
  k.setPose('stand'); k2.setPose('stand'); k2.el.style.display = 'none';

  $('stTitle').textContent = TITLE;
  $('stSub').textContent = J(name, '이랑/랑') + ' 구름을 밟고 하늘 높이 올라가요';
  const fine = matchMedia('(pointer: fine)').matches;
  const bestTxt = () => { const b = KG.best(KG.dkey(KEY)); return b > 0 ? '최고 기록 ' + Math.round(b).toLocaleString() + '점' : ''; };
  const keyTxt = () => [fine ? '← → 키로도 움직여요' : '', bestTxt()].filter(Boolean).join('  ·  ');
  const RULES = { key: KEY, title: TITLE, lead: '구름을 밟고 하늘 높이 올라가요', items: [
    ['☁️', '구름을 밟으면 ' + J(name, '이/가') + ' 저절로 폴짝 뛰어올라요.'],
    ['👆', '아래 ◀ ▶ 단추를 누르고 있으면 그쪽으로 움직여요. 화면 끝은 반대쪽과 이어져요.'],
    ['🌸', '분홍 솜구름은 한 번 밟으면 사라지고, 푹신한 쿠션은 아주 높이 튕겨 줘요.'],
    ['🦴', '뼈다귀를 먹으면 ' + BONE_PT + '점 보너스! 화면 아래로 떨어지면 끝나요.']
  ] };

  // ── 상태
  const S = {
    mode: 'ready', t: 0, x: FW / 2, y: 0, vx: 0, vy: 0, face: 1, dir: 0, jumpY: 0, cam: 0, high: 0, bones: 0, score: 0, bounces: 0,

      const r = { score: S.score, high: Math.floor(S.high), bones: S.bones, time: +S.t.toFixed(1), alive: S.mode === 'play', bounces: S.bounces };
      S.simulating = false; BOT.on = was; toReady(); return r;
    }
  };
})();
