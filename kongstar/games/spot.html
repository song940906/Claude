<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 틀린그림찾기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 틀린그림찾기: 밤하늘(bg) 위에 같은 크기의 그림 두 장(.pic) · 점수판(hud) · 아래 줄(foot: 콩이 · 안내 · 힌트) */
#bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.pic { position: fixed; z-index: 3; overflow: hidden; border-radius: 16px; background: #FFF8EE; box-shadow: 0 0 0 3px #FFF8EE, 0 12px 32px rgba(6,8,30,.45); touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: filter .2s; }
.pic canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.pic .kg-kong { z-index: 2; }
.pic .marks { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pic.shake { animation: pcShake .3s; }
@keyframes pcShake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 55% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
body.paused .pic { filter: blur(14px) saturate(.6); }
.mk { position: absolute; transform: translate(-50%,-50%); pointer-events: none; }
.mk.ring { aspect-ratio: 1; border-radius: 50%; border: 3px solid #FF4D63; box-shadow: 0 0 0 2px rgba(255,255,255,.85), inset 0 0 0 2px rgba(255,255,255,.85); box-sizing: border-box; animation: ringIn .35s cubic-bezier(.2,1.5,.5,1) both; }
.mk.ring.miss { border: 3px dashed #FFB020; box-shadow: 0 0 0 2px rgba(40,30,0,.35); animation: ringIn .35s ease-out both, missBlink 1s .35s infinite alternate; }
.mk.hint { aspect-ratio: 1; border-radius: 50%; border: 3px dashed #fff; box-shadow: 0 0 0 3px rgba(44,53,119,.55); box-sizing: border-box; animation: hintPulse .7s ease-in-out infinite alternate; }
@keyframes ringIn { 0% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
@keyframes missBlink { 0% { opacity: 1; } 100% { opacity: .45; } }
@keyframes hintPulse { 0% { transform: translate(-50%,-50%) scale(.92); opacity: .65; } 100% { transform: translate(-50%,-50%) scale(1.06); opacity: 1; } }
.mk.x { width: 30px; height: 30px; animation: xFade .8s ease-out forwards; }
.mk.x svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes xFade { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
.fl { position: absolute; z-index: 5; transform: translate(-50%,-50%); white-space: nowrap; font-size: 17px; font-weight: 800; letter-spacing: -.3px; color: #fff; text-shadow: 0 1px 0 rgba(40,30,90,.65), 0 2px 8px rgba(20,16,60,.7); pointer-events: none; animation: flUp .9s ease-out forwards; }
@keyframes flUp { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -28px; } }
@media (prefers-reduced-motion: reduce) { .mk.ring, .mk.ring.miss, .mk.hint, .mk.x, .fl, .pic.shake { animation: none !important; } .mk.x { opacity: .9; } }
#hud { position: fixed; z-index: 10; pointer-events: none; }
#hud .pills { display: flex; align-items: center; gap: 6px; }
#hud .pills > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .fd b { color: #FFD36E; font-weight: 700; }
#hud .tm { margin-left: auto; }
#hud .tm.low { color: #FFB3B8; }
#hud .tm.pen { animation: penBump .35s; }
@keyframes penBump { 0% { transform: scale(1); } 40% { transform: scale(1.2); background: rgba(229,72,77,.75); } 100% { transform: scale(1); } }
#tbar { height: 7px; margin-top: 7px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
#tbar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFD36E, #FFB95C); transform-origin: 0 50%; }
#tbar.low i { background: linear-gradient(90deg, #FF9AA2, #FF7B88); }
#hud.inbar #tbar { height: 4px; margin-top: 4px; }
#hud.inbar .pills > div { height: 30px; padding: 0 9px; font-size: 13.5px; }
#hud.inbar .pills { justify-content: center; }
#hud.inbar .tm { margin-left: 0; }
#hud.narrow .pills { gap: 4px; }
#hud.narrow .pills > div { padding: 0 8px; font-size: 13px; }
#foot { position: fixed; z-index: 10; height: 56px; display: flex; align-items: center; gap: 10px; }
#kbox { position: relative; flex: none; width: 64px; height: 56px; pointer-events: none; }
#msg { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; letter-spacing: -.3px; color: #EEF0FA; line-height: 1.3; text-shadow: 0 1px 6px rgba(0,0,0,.35); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#btnHint { flex: none; height: 44px; }
#btnHint[disabled] { opacity: .45; cursor: default; }
#btnHint svg { width: 19px; height: 19px; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .row .kg-btn.sub { flex: 0 0 auto; padding: 0 16px; }
.kg-card .info { font-size: 13px; margin-top: 10px; color: var(--sub); }
.kg-card .info b { color: var(--pri); font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } #msg { font-size: 14px; } }
/* 낮은 화면(가로 휴대폰): 카드가 한 화면에 들어오게 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 420px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec, body .kg-card .info { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  #stLead, #edText { display: none; }
  body .kg-card .info { font-size: 12.5px; margin-top: 4px; }
  body .kg-card .rec { flex-wrap: nowrap; gap: 6px; }
  body .kg-card .rec span { padding: 5px 9px; white-space: nowrap; }
}
/* 낮은 가로 화면: 카드를 위 줄(「게임」 단추) 아래로 내려 제목이 가리지 않게. 옆에 가족 순위표가 붙어 왼쪽으로는 비킬 자리가 없다 → 카드를 조금 더 촘촘히 */
@media (max-height: 430px) and (min-width: 540px) {
  #cardStart, #cardEnd, #cardPause { padding-bottom: calc(var(--sab) + 6px); }
  #cardStart > .kg-card, #cardEnd > .kg-card, #cardPause > .kg-card { align-self: flex-end; }   /* 순위표는 가운데 그대로, 카드만 아래로 */
  body #cardStart.kg-rbwrap > .kg-card, body #cardEnd.kg-rbwrap > .kg-card { margin-top: auto !important; margin-bottom: 0 !important; }
  body .kg-card { padding-top: 8px; padding-bottom: 10px; }
  body .kg-card .big { font-size: 30px; line-height: 1.1; }
  body .kg-card .kg-diff { margin-top: 6px; }
  body .kg-card .row { margin-top: 8px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="pic" id="picA" aria-label="첫째 그림"><canvas></canvas><div class="marks"></div></div>
<div class="pic" id="picB" aria-label="둘째 그림"><canvas></canvas><div class="marks"></div></div>

<div id="hud" aria-hidden="true">
  <div class="pills">
    <div class="sc"><span id="hudScore">0</span><small>점</small></div>
    <div class="rd"><span id="hudRound">1</span><small>판</small></div>
    <div class="fd"><small>찾음</small><b id="hudFound">0</b><small id="hudTotal">/5</small></div>
    <div class="tm" id="hudTimeBox"><span id="hudTime">60</span><small>초</small></div>
  </div>
  <div id="tbar"><i></i></div>
</div>

<div id="foot">
  <div id="kbox"></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <button class="kg-pill" id="btnHint" type="button" aria-label="힌트 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span>힌트</span></button>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 틀린그림찾기</h2>
    <p id="stLead"></p>
    <p class="info" id="stInfo"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn sub" id="btnRules">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">시간이 다 됐어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>깬 판<b id="edRounds"></b></span><span>찾은 곳<b id="edFound"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'spot', TITLE = J(name, '의') + ' 틀린그림찾기';
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   n 차이 개수 · time 첫 판 제한 시간(초) · dec 판마다 줄어드는 시간(초, 첫 판의 60% 까지) · pen 틀린 곳을 누르면 깎이는 시간(초)
  //   items 그림 속 소품 수 · size 소품 크기 배율 · kongP 콩이 자신이 바뀔 확률 · kong 콩이가 바뀌는 방식
  //   col 색 바꾸기 세기 [최소 거리, 최대 거리] (RGB) · c2p 둘째 색(줄무늬·꽃 등 작은 부분)을 바꿀 확률
  //   move 옮기는 거리 [최소, 소품 반지름 배율] · grow 크기 배율 [키움, 줄임] · rot 돌리는 각(rad)
  //   (콩이 tilt = 고개를 살짝 갸웃)
  //   small 「빼기·더하기·크기」를 이 반지름 이하의 작은 소품에만 · subtleV 그림 속 작은 무늬 차이만(별 꼭짓점·시계 바늘·꽃잎·무늬)
  //   minPix 차이마다 실제로 바뀐 점이 이만큼은 있어야 한다(400×300 기준) · w 차이 종류 비율
  const DIFF = {
    easy:   { n: 4, time: 70, dec: 3, pen: 2, items: 8,  size: 1.15, kongP: 0.45, kong: ['outfit'],          col: [190, 999], c2p: 0,    move: [0, 0],     grow: [1.6, 0.6],   rot: 0,    small: 0,  subtleV: false, minPix: 220, w: { color: 3, remove: 3, add: 3, size: 1, variant: 1 } },
    normal: { n: 5, time: 65, dec: 3, pen: 3, items: 11, size: 1.0,  kongP: 0.45, kong: ['outfit', 'ribbon'], col: [150, 999], c2p: 0.2,  move: [26, 1.0],  grow: [1.45, 0.66], rot: 1.0,  small: 0,  subtleV: false, minPix: 140, w: { color: 3, remove: 2, add: 2, size: 1, move: 1, flip: 1, rot: 1, variant: 2 } },
    hard:   { n: 6, time: 55, dec: 3, pen: 4, items: 13, size: 0.9,  kongP: 0.45, kong: ['ribbon', 'face'],   col: [95, 200],  c2p: 0.35, move: [16, 0.6],  grow: [1.3, 0.76],  rot: 0.6,  small: 22, subtleV: false, minPix: 70,  w: { color: 3, remove: 1, add: 1, size: 1, move: 2, flip: 1, rot: 1, variant: 2 } },
    vhard:  { n: 7, time: 45, dec: 2, pen: 5, items: 16, size: 0.78, kongP: 0.4,  kong: ['tilt'],             col: [55, 120],  c2p: 0.45, move: [10, 0.38], grow: [1.22, 0.8],  rot: 0.42, small: 16, subtleV: true,  minPix: 34,  w: { color: 4, remove: 1, add: 1, size: 1, move: 2, rot: 1, variant: 3 } }
  };
  const PTS = { find: 100, hinted: 50, sec: 10 };
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '똑같아 보이는 두 그림에서 다른 곳을 찾아 눌러요.';
  $('psText').textContent = J(name, '이/가') + ' 그림을 가리고 기다리고 있어요.';

  const bg = $('bg'), hud = $('hud'), foot = $('foot');
  const PICS = [$('picA'), $('picB')].map(el => ({ el, cv: el.querySelector('canvas'), marks: el.querySelector('.marks'), k: null }));
  const LW = 400, LH = 300, FLOOR = 196, GROUND = 286, KL = 200;   // 그림 좌표: 400×300, 벽과 바닥 경계 · 콩이 발밑 · 콩이 크기(그림 단위)

  // ═══════ 색 ═══════
  const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const toHex = a => '#' + a.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase();
  const cdist = (a, b) => { const p = hex2(a), q = hex2(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
  const shade = (h, k) => { const c = hex2(h); return toHex(c.map(v => k >= 0 ? v + (255 - v) * k : v * (1 + k))); };
  function rgb2hsl(h) { let [r, g, b] = hex2(h).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let H = 0, S = 0; if (mx !== mn) { const d = mx - mn; S = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); H = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; H /= 6; } return [H, S, l]; }
  function hsl2hex(H, S, L) { H = ((H % 1) + 1) % 1; const f = n => { const k = (n + H * 12) % 12, a = S * Math.min(L, 1 - L); return L - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return toHex([f(0) * 255, f(8) * 255, f(4) * 255]); }
  const PAL = { red: '#E5484D', orange: '#F28C38', yellow: '#F5C431', lime: '#9BD045', green: '#3FA35B', teal: '#22A6A0', sky: '#4BA3F0', blue: '#3D6FD8', navy: '#2F3E8F', purple: '#8E5BD8', pink: '#EE6FA4', brown: '#9A6235', cream: '#FFF1CF', white: '#FFFFFF', gray: '#8A94A3', black: '#33384A' };
  const MAIN = ['red', 'orange', 'yellow', 'lime', 'green', 'teal', 'sky', 'blue', 'navy', 'purple', 'pink', 'brown', 'white', 'gray'].map(k => PAL[k]);
  const WALLS = ['#F6D9C4', '#CFE4F2', '#D9EBCF', '#E7DAF2', '#F7E6AE', '#F4D3DC'];
  const FLOORS = ['#C99A6B', '#B5835A', '#D9B48A', '#A9B7C6'];

  // ═══════ 소품 그림 (가운데 0,0 · 반지름 40 쯤 안에 그린다) ═══════
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const ol = (g, c) => { g.lineWidth = 2.4; g.strokeStyle = shade(c, -0.38); g.stroke(); };
  function star(g, n, R, r) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; g.lineTo(Math.cos(a) * q, Math.sin(a) * q); } g.closePath(); }
  function heartPath(g, s) { g.beginPath(); g.moveTo(0, 12 * s); g.bezierCurveTo(-30 * s, -6 * s, -16 * s, -30 * s, 0, -16 * s); g.bezierCurveTo(16 * s, -30 * s, 30 * s, -6 * s, 0, 12 * s); g.closePath(); }
  function bonePath(g, s) { g.beginPath(); rr(g, -22 * s, -8 * s, 44 * s, 16 * s, 6 * s); for (const [x, y] of [[-24, -9], [-24, 9], [24, -9], [24, 9]]) { g.moveTo(x * s + 11 * s, y * s); g.arc(x * s, y * s, 11 * s, 0, TAU); } }
  const TYPES = {
    ball: { zone: 'floor', r: [14, 24], pal: ['red', 'orange', 'yellow', 'lime', 'sky', 'blue', 'purple', 'pink'], pal2: ['white', 'yellow', 'navy'], nv: 2, subtleV: true,
      draw(g, it) {
        g.beginPath(); g.arc(0, 0, 38, 0, TAU); g.fillStyle = it.c1; g.fill();
        g.save(); g.beginPath(); g.arc(0, 0, 38, 0, TAU); g.clip(); g.strokeStyle = it.c2; g.fillStyle = it.c2;

    f.style.left = clamp(x / LW * PW, 30, PW - 30) + 'px'; f.style.top = clamp(y / LH * PH - 18, 14, PH - 14) + 'px'; P.marks.appendChild(f); setTimeout(() => f.remove(), 950);
  }
  function clearMarks() { for (const P of PICS) P.marks.textContent = ''; }

  // ═══════ 놀이 ═══════
  function hitR() { const tol = clamp(20 / (PW / LW), 8, 24); return d => d.r + tol; }
  function tapAt(pi, x, y) {
    if (state !== 'play' || lockT > 0) return 'no';
    const f = hitR(); let bestD = null, bd = 1e9;
    for (const d of S.diffs) { if (d.found) continue; const q = Math.hypot(d.x - x, d.y - y); if (q <= f(d) && q - d.r < bd) { bd = q - d.r; bestD = d; } }
    if (bestD) { found(bestD, pi); return 'hit'; }
    if (S.diffs.some(d => d.found && Math.hypot(d.x - x, d.y - y) <= f(d))) return 'again';   // 이미 찾은 곳은 그냥 넘긴다
    wrong(pi, x, y); return 'miss';
  }
  function found(d, pi) {
    d.found = true; const pts = d.hinted ? PTS.hinted : PTS.find; score += pts; stats.found++;
    mark(d); floatText(PICS[pi], d.x, d.y, '+' + pts, '#FFE08A');
    removeHint();
    sfx('match'); setMood('happy', 0.8);
    const left = S.diffs.filter(x => !x.found).length; paintFound();
    if (!left) return clearRound();
    say(left === 1 ? '하나 남았어요!' : ['찾았어요!', '맞아요!', '눈이 좋아요!'][stats.found % 3] + ' ' + left + '군데 남았어요', 1600);
    if (Math.random() < 0.18) voice('bark', 0, 0.8);
  }
  function wrong(pi, x, y) {
    stats.wrong++; tLeft = Math.max(0, tLeft - D.pen); lockT = 0.4;
    const now = tAnim; wrongTimes = wrongTimes.filter(t => now - t < 2).concat(now);
    if (wrongTimes.length >= 3) { lockT = 1.2; wrongTimes = []; say('천천히 잘 살펴봐요', 1800); } else say('여기는 똑같아요 (−' + D.pen + '초)', 1400);
    cross(PICS[pi], x, y); sfx('wrong'); setMood('sad', 0.7);
    const tb = $('hudTimeBox'); tb.classList.remove('pen'); void tb.offsetWidth; if (!reduceMotion) tb.classList.add('pen');
    if (!reduceMotion) { const el = PICS[pi].el; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} } }
    paintHud(); if (tLeft <= 0) timeUp();
  }
  let hintEls = [], hintT = 0;
  function removeHint() { hintEls.forEach(e => e.remove()); hintEls = []; hintT = 0; }
  function hint() {
    if (state !== 'play' || hintUsed) return;
    const rest = S.diffs.filter(d => !d.found); if (!rest.length) return;
    const d = rest[Math.floor(Math.random() * rest.length)]; d.hinted = true; hintUsed = true; stats.hints++;
    const a = Math.random() * TAU, off = 12, R = d.r + 34, cx = clamp(d.x + Math.cos(a) * off, R * 0.6, LW - R * 0.6), cy = clamp(d.y + Math.sin(a) * off, R * 0.6, LH - R * 0.6);
    removeHint();
    for (const P of PICS) { const m = document.createElement('div'); m.className = 'mk hint'; m.style.left = pct(cx, LW); m.style.top = pct(cy, LH); m.style.width = pct(R * 2, LW); P.marks.appendChild(m); hintEls.push(m); }
    hintT = 2.6; paintHint(); say('동그라미 안을 잘 보세요', 2400); tone(660, 0.12, 'triangle', 0.05); tone(990, 0.16, 'triangle', 0.05, 0.1);
  }
  function paintHint() { const b = $('btnHint'); b.disabled = hintUsed || state !== 'play'; b.querySelector('span').textContent = hintUsed ? '힌트 씀' : '힌트'; }
  function setMood(m, t) { mood = m; moodT = t; }

  function startRound() {
    round++; S = newRound((Math.random() * 2147483647) >>> 0, D);
    tMax = Math.max(Math.round(D.time * 0.6), D.time - (round - 1) * D.dec); tLeft = tMax; hintUsed = false; lockT = 0; wrongTimes = []; lastTick = 99;
    clearMarks(); removeHint(); paintPics(); paintFound(); paintHint(); shownSec = -1;
    say(round === 1 ? '다른 곳이 ' + S.diffs.length + '군데 있어요. 찾아 보세요!' : round + '판째! ' + S.diffs.length + '군데를 ' + tMax + '초 안에', 2600);
  }
  function clearRound() {
    state = 'clear'; phaseT = 0; stats.rounds++;
    const sec = Math.ceil(tLeft), bonus = sec * PTS.sec; score += bonus; paintHint();
    say('다 찾았어요! 남은 시간 보너스 +' + fmt(bonus) + '점', 0);
    floatText(PICS[1], LW / 2, LH / 2, '+' + fmt(bonus) + ' 시간 보너스', '#BFF3D2');
    sfx('power'); setMood('cheer', 1.6); voice('bark', 0.25, 0.9);
    saveProgress();   // 판을 거듭하는 게임이라 판을 깰 때마다 기록해 둔다 (도중에 나가도 남게)
  }
  function saveProgress() { if (score > 0 && setBest(KG.dkey(KEY, diffId), score)) newRec = true; }
  function timeUp() {
    if (state !== 'play') return;
    state = 'reveal'; phaseT = 0; tLeft = 0; btnPause.hidden = true; removeHint(); paintHint();
    for (const d of S.diffs) if (!d.found) mark(d, 'miss');
    say('시간이 다 됐어요. 남은 곳은 여기였어요', 0); sfx('lose'); setMood('sad', 2.2);
  }
  function update(dt) {
    if (lockT > 0) lockT -= dt;
    if (msgT > 0) { msgT -= dt; if (msgT <= 0 && state === 'play') say(S.diffs.filter(d => !d.found).length + '군데 남았어요'); }
    if (hintT > 0) { hintT -= dt; if (hintT <= 0) removeHint(); }
    if (state === 'play') {
      tLeft -= dt;
      if (tLeft <= 5 && tLeft > 0 && Math.ceil(tLeft) !== lastTick) { lastTick = Math.ceil(tLeft); tone(880, 0.06, 'sine', 0.045); }
      if (tLeft <= 0) timeUp();
    } else if (state === 'clear') { phaseT += dt; if (phaseT > 1.8) { state = 'play'; startRound(); } }
    else if (state === 'reveal') { phaseT += dt; if (phaseT > 2.6) showResult(); }
  }
  function drawKong(dt) {
    if (moodT > 0) { moodT -= dt; if (moodT <= 0 && state !== 'result') mood = 'idle'; }
    const happy = mood === 'happy' || mood === 'cheer', sad = mood === 'sad', won = state === 'result' && score > 0;
    const pose = (mood === 'cheer' || won) && K.has('wave') ? 'wave' : 'sit'; if (K.rig.pose !== pose) K.setPose(pose);
    const hopT = happy ? clamp(moodT / 0.8, 0, 1) : 0;
    const lx = horiz ? Math.sin(tAnim * 0.6) * 0.8 : 0.4, ly = horiz ? -0.6 : -0.9;
    K.render({ t: tAnim, eyes: sad ? 'closed' : happy || won ? 'happy' : 'open', mouth: sad ? 'closed' : 'open', look: sad ? [0, 0.6] : [lx, ly], tilt: sad ? -9 : Math.sin(tAnim * 1.1) * 4,
      hop: reduceMotion ? 0 : Math.sin(hopT * Math.PI) * 30, earLift: sad ? -8 : happy ? 6 : 0, tailAmp: sad ? 3 : happy || won ? 22 : 10, tailRate: happy ? 3.4 : 2, blush: happy || won ? 1 : 0, nod: sad ? 0.5 : 0 });
  }
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    tAnim += dt;
    if (state === 'play' || state === 'clear' || state === 'reveal') update(dt);
    paintHud(); drawKong(dt);
  }
  for (const [i, P] of PICS.entries()) P.el.addEventListener('pointerdown', e => {
    if (state !== 'play') return; e.preventDefault();
    const r = P.el.getBoundingClientRect(); tapAt(i, (e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH);
  });

  // ═══════ 흐름 ═══════
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd']) $(k).hidden = k !== id; document.body.classList.toggle('paused', id === 'cardPause'); if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
    round = 0; score = 0; stats = { rounds: 0, found: 0, wrong: 0, hints: 0 }; mood = 'idle'; moodT = 0; newRec = false; pausedFrom = 'play';
    state = 'play'; showCard(null); btnPause.hidden = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    startRound();
    KG.unlockAudio(); tone(659, 0.1, 'triangle', 0.05); tone(880, 0.18, 'triangle', 0.05, 0.1);
  }
  function pause() { if (state !== 'play' && state !== 'clear') return; pausedFrom = state; state = 'pause'; showCard('cardPause', 'btnResume'); paintHint(); }
  function resume() { if (state !== 'pause') return; state = pausedFrom; showCard(null); paintHint(); }
  function quit() {
    if (state !== 'pause' && state !== 'play' && state !== 'clear') return;
    if (score > 0) return showResult(true);   // 모은 점수는 결과로 남긴다
    state = 'ready'; btnPause.hidden = true; S = null; round = 0; score = 0; tLeft = 0; clearMarks(); removeHint(); paintPics(); paintFound(); paintHint(); paintBest(); say(''); showCard('cardStart', 'btnStart'); }
  function showResult(quitting) {
    state = 'result'; btnPause.hidden = true; removeHint();
    const isNew = (score > 0 && setBest(KG.dkey(KEY, diffId), score)) || (score > 0 && newRec);
    $('edScore').textContent = fmt(score); $('edRounds').textContent = stats.rounds + '판'; $('edFound').textContent = stats.found + '곳';
    $('edNew').hidden = !isNew; paintBest();
    $('edTitle').textContent = quitting ? '여기까지 했어요' : stats.rounds >= 1 ? stats.rounds + '판을 깼어요' : '시간이 다 됐어요';
    $('edText').textContent = stats.found === 0 ? '다음엔 천천히 구석구석 살펴봐요.' : stats.wrong === 0 ? '한 번도 안 틀렸어요. ' + J(name, '이/가') + ' 깜짝 놀랐어요!' : J(name, '이랑/랑') + ' 함께 다른 곳을 ' + stats.found + '군데 찾았어요.';
    endAt = performance.now(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win'); if (score > 0) voice('bark', 0.2, 1.0);
  }
  const RULES = { key: KEY, title: TITLE, lead: '똑같아 보이는 그림 두 장에서 다른 곳을 찾는 놀이예요.', items: [
    ['🔎', '다른 곳을 누르면 동그라미가 생겨요.'],
    ['⏱️', '다 찾으면 남은 시간만큼 보너스!'],
    ['❌', '틀린 곳을 누르면 시간이 줄어요.'],
    ['💡', '힌트는 판마다 한 번, 그곳은 점수 절반.'],
    ['🐶', J(name, '의') + ' 옷·리본·표정·고개도 잘 봐요.']
  ] };
  const guard = () => performance.now() - endAt < 450;
  $('btnStart').addEventListener('click', () => { sfx('tap'); start(); });
  $('btnAgain').addEventListener('click', () => { if (guard()) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (guard()) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); quit(); });
  $('btnRules').addEventListener('click', () => { sfx('tap'); KG.rules(RULES, true).then(() => { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} }); });
  $('btnHint').addEventListener('click', () => { sfx('tap'); hint(); $('btnHint').blur(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); btnPause.blur(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', () => { pause(); if (state === 'pause' || state === 'reveal') saveProgress(); });   // 위 줄 「게임」 으로 나가도 점수는 남긴다
  document.addEventListener('keydown', e => {
    if (KG.rulesOpen || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'h' && state === 'play') { hint(); return; }
    if (k === ' ' || k === 'Enter') {
      if (e.repeat) return;
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'result') { if (!guard()) start(); } else if (state === 'pause') resume(); else if ((state === 'play' || state === 'clear') && k === ' ') pause();
    } else if (k === 'Escape' || k === 'p') { if (state === 'play' || state === 'clear') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY)), d = DIFF[KG.diff()] || DIFF.normal;
    paintFound(); shownSec = -1; $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    $('stInfo').innerHTML = '판마다 다른 곳 <b>' + d.n + '군데</b> · 첫 판 <b>' + d.time + '초</b> · 틀리면 −' + d.pen + '초';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
  }
  $('stRec').before(KG.diffPicker(null, paintBest));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null, paintBest));
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; paintBest();
  layout(); measureKong(); paintFound(); paintHint(); paintHud();
  buildKongPix();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get score() { return score; }, get round() { return round; }, get timeLeft() { return tLeft; }, get diff() { return diffId; }, get stats() { return Object.assign({}, stats); },
    get scene() { return S; }, get kbox() { return KBOX; }, get head() { return HEAD; }, DIFF, LW, LH,
    diffs: () => S ? S.diffs.map(d => ({ kind: d.kind, x: d.x, y: d.y, r: d.r, found: !!d.found })) : [],
    // 그림 좌표 → 화면 좌표 (시험에서 실제로 누를 자리)
    toScreen: (pi, x, y) => { const r = PICS[pi].el.getBoundingClientRect(); return [r.left + x / LW * r.width, r.top + y / LH * r.height]; },
    gen: (seed, id) => newRound(seed, DIFF[id || 'normal']), verify: (s, id) => verify(s, DIFF[id || 'normal']),
    field: () => ({ W, H, PW, PH, horiz, low, a: PICS[0].el.getBoundingClientRect().toJSON(), b: PICS[1].el.getBoundingClientRect().toJSON(), hud: hud.getBoundingClientRect().toJSON(), foot: foot.getBoundingClientRect().toJSON() }),
    tapAt, hint, start, pause, resume, quit, timeUp: () => { if (state === 'pause') resume(); timeUp(); }, get kpix() { return kpixReady ? Object.fromEntries(KPIX) : null; }, kongVisible
  };
})();
