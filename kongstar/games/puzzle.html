<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 퍼즐</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 퍼즐: 고르는 화면 → 간식 3개 맞추기 / 카드 짝 맞추기 */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; }
button { border: 0; background: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

/* ── 고르는 화면 */
#menu { position: fixed; inset: 0; z-index: 1; display: flex; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: calc(var(--sat) + 66px) calc(var(--sar) + 16px) calc(var(--sab) + 20px) calc(var(--sal) + 16px); box-sizing: border-box; }
.minner { margin: auto; width: 100%; max-width: 440px; }
.hero { position: relative; height: 158px; margin-bottom: 4px; overflow-x: clip; }
.hero h1 { position: absolute; left: 4px; top: 30px; margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.4px; text-shadow: 0 2px 10px rgba(0,0,0,.35); max-width: 60%; }
.hero p { position: absolute; left: 4px; top: 102px; margin: 0; font-size: 14px; color: #C9D1F2; max-width: 60%; }
.hero .kspot { position: absolute; right: 78px; bottom: 6px; width: 0; height: 0; }
.pick { display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; background: var(--card); color: var(--ink); border-radius: 20px; padding: 16px; margin-top: 10px; text-align: left; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.pick:active { transform: scale(.985); filter: brightness(.97); }
.pick .ico { flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.pick .txt { flex: 1; min-width: 0; }
.pick b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.pick small { display: block; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--sub); }
.pick .rec { flex: none; text-align: right; font-size: 12px; color: var(--sub); line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pick .rec strong { display: block; font-size: 15px; color: var(--pri); }
.picks .kg-diff { margin-top: 6px; }
body.land .picks .kg-diff { margin-top: 0; }
body.land .minner { max-width: 760px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; align-items: center; }
body.land .hero { height: auto; margin: 0; padding-top: 140px; text-align: center; }
body.land .hero h1, body.land .hero p { position: static; max-width: none; }
body.land .hero h1 { font-size: 22px; }
body.land .hero p { margin-top: 6px; }
body.land .hero .kspot { right: auto; left: 50%; bottom: auto; top: 136px; }

/* ── 놀이 화면 (자리는 layout() 이 잡는다) */
#play { position: fixed; inset: 0; z-index: 1; }
#play .kspot { position: absolute; width: 0; height: 0; z-index: 3; }
.stat { position: absolute; z-index: 4; padding: 0 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .lb { font-size: 12px; font-weight: 500; color: #C9D1F2; }
.stat b { font-size: 17px; font-weight: 700; letter-spacing: -.2px; min-width: 1.2em; text-align: right; }
.stat.warn b { color: var(--gold); }
#statB.goal { padding: 0 11px; gap: 0; }
#statC b { font-size: 14px; font-weight: 600; text-align: left; }
.gi { display: inline-flex; align-items: center; gap: 3px; }
.gi + .gi { margin-left: 8px; }
.gi.ok b { color: #9BE7A8; }
.gico { flex: none; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
.gico svg { width: 100%; height: 100%; display: block; }
#btnOther { position: absolute; z-index: 4; font-size: 14px; white-space: nowrap; }
#combo { position: absolute; z-index: 5; transform: translate(-50%, 0) scale(.6); opacity: 0; pointer-events: none; white-space: nowrap; background: var(--gold); color: #4A3200; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1); }
#combo.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* 간식 3개 맞추기 */
#board { position: absolute; z-index: 2; background: #fff; border-radius: 22px; box-shadow: 0 12px 34px rgba(0,0,0,.3); }
#grid { position: absolute; left: 8px; top: 8px; overflow: hidden; border-radius: 14px; touch-action: none; cursor: pointer; }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); transition: transform var(--d, .16s) cubic-bezier(.3, .2, .35, 1.12); will-change: transform; }
.tile.now { transition: none; }
.tile .in { position: absolute; inset: 3px; border-radius: 30%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .54); line-height: 1; transition: transform .16s, opacity .16s, box-shadow .16s; }
.tile.t0 .in { background: #F3E6FA; } .tile.t1 .in { background: #FFEAD6; } .tile.t2 .in { background: #FFE1E4; }
.tile.t3 .in { background: #FFF3C4; } .tile.t4 .in { background: #E2ECFC; } .tile.t5 .in { background: #DFF3E1; }
.tile.t6 .in { background: #D5F2F4; }
.tile.sel .in { transform: scale(1.08); box-shadow: 0 0 0 3px var(--pri); }
.tile.pop .in { transform: scale(.25); opacity: 0; transition-duration: .22s; }
.tile.hint .in { animation: wig .7s ease-in-out infinite; }
.tile.sp .in { background: #FFF6DC; box-shadow: inset 0 0 0 2.5px var(--gold), 0 0 0 1px rgba(255,200,97,.5); }
.tile.sp::after { position: absolute; right: 1px; bottom: 1px; width: calc(var(--cell) * .4); height: calc(var(--cell) * .4); border-radius: 50%; background: var(--pri); color: #fff; font-size: calc(var(--cell) * .25); font-weight: 800; line-height: calc(var(--cell) * .4); text-align: center; box-shadow: 0 0 0 2px #fff; }
.tile[data-sp=h]::after { content: '↔'; } .tile[data-sp=v]::after { content: '↕'; } .tile[data-sp=b]::after { content: '✦'; }
.tile.born .in { animation: born .4s cubic-bezier(.3,1.6,.5,1); }
/* 무지개 간식 · 방해 요소 (색만이 아니라 무늬·모양으로도 구분된다) */
.tile.spc .in { background: conic-gradient(from 20deg, #FFB3BA, #FFDFA8, #FFF7A8, #B8F0C0, #B3D9FF, #D9C2FF, #FFB3BA); box-shadow: inset 0 0 0 2.5px #fff, 0 0 0 1.5px var(--gold); }
.tile .ov { position: absolute; inset: 1px; pointer-events: none; }
.tile .ov svg, .tile .in svg { width: 100%; height: 100%; display: block; }
.tile.k-box .in, .tile.k-stone .in, .tile.k-honey .in { inset: 2px; border-radius: 0; background: none; }
.tile.k-ing .in { background: #FFF7EC; box-shadow: inset 0 0 0 2px #fff; border: 2px dashed var(--apricot); box-sizing: border-box; }
.tile.hitfx .in, .tile.hitfx .ov { animation: hitfx .32s ease-out; }
.tile.deny .in, .tile.deny .ov { animation: deny .3s ease-in-out; }
.cb { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); pointer-events: none; }
.cb.hole::before { content: ''; position: absolute; inset: 1.5px; border-radius: 24%; background: #2A3178; box-shadow: inset 0 2px 5px rgba(5,8,30,.55); }
.cb.f1 { background: repeating-linear-gradient(118deg, #A5DB8A 0 5px, #C4ECAC 5px 10px); box-shadow: inset 0 0 0 1.5px #7FC063; }
.cb.f2 { background: radial-gradient(circle at 30% 30%, #8A5B36 0 1.6px, transparent 2.2px) 0 0 / 9px 9px, #BC9068; box-shadow: inset 0 0 0 2.5px #8A5B36; }
.exitmk { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); pointer-events: none; z-index: 2; }
.exitmk::after { content: ''; position: absolute; left: 50%; bottom: 0; margin-left: -7px; border: 7px solid transparent; border-bottom-width: 0; border-top-color: var(--apricot); filter: drop-shadow(0 0 1px #fff); }
.burst { position: absolute; z-index: 3; pointer-events: none; border-radius: 50%; border: 4px solid #FFD98A; background: rgba(255,255,255,.55); animation: burst .42s ease-out forwards; }
@keyframes hitfx { 0% { transform: scale(1.2); filter: brightness(1.5); } 100% { transform: none; filter: none; } }
@keyframes deny { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@keyframes burst { 0% { transform: scale(.25); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.cur { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); box-sizing: border-box; border: 3px solid #7C8CF0; border-radius: 30%; transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); pointer-events: none; z-index: 2; }
.beam { position: absolute; z-index: 3; pointer-events: none; border-radius: 99px; background: linear-gradient(90deg, rgba(255,200,97,0), #FFD98A 20%, #fff 50%, #FFD98A 80%, rgba(255,200,97,0)); animation: beam .38s ease-out forwards; }
.beam.v { background: linear-gradient(180deg, rgba(255,200,97,0), #FFD98A 20%, #fff 50%, #FFD98A 80%, rgba(255,200,97,0)); }
@keyframes wig { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.06); } 75% { transform: rotate(7deg) scale(1.06); } }
@keyframes born { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes beam { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

/* 카드 짝 맞추기 */
#pboard { position: absolute; z-index: 2; touch-action: none; }
.pcard { position: absolute; left: 0; top: 0; perspective: 700px; cursor: pointer; transition: transform .25s, left .45s cubic-bezier(.4,.1,.3,1), top .45s cubic-bezier(.4,.1,.3,1); animation: deal .34s cubic-bezier(.3,1.3,.5,1) backwards; }
.pcard.icy .front { background: #E3F3FF; box-shadow: inset 0 0 0 3px #7EC8F2, 0 5px 14px rgba(0,0,0,.22); }
.pcard .frost { position: absolute; right: 8%; top: 6%; font-size: 42%; color: #2F86CF; display: none; }
.pcard.icy .frost { display: block; }
.pcard.crack .flip { animation: yay .45s ease-out; }
.pcard.prank .back { animation: prank .5s ease-in-out; }
@keyframes prank { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.pcard .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .36s cubic-bezier(.4,.1,.3,1); }
.pcard.up .flip { transform: rotateY(180deg); }
.pcard .face { position: absolute; inset: 0; border-radius: 14px; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 14px rgba(0,0,0,.22); }
.pcard .back { background: linear-gradient(155deg, #5562CC, #2C3577); border: 2.5px solid rgba(255,255,255,.9); box-sizing: border-box; }
.pcard .back svg { width: 46%; height: 46%; opacity: .92; }
.pcard .front { background: #fff; transform: rotateY(180deg); line-height: 1; transition: background .25s, box-shadow .25s; }
.pcard.done .front { background: #FFF8E6; box-shadow: inset 0 0 0 2.5px var(--gold), 0 5px 14px rgba(0,0,0,.18); }
.pcard.done { cursor: default; }
.pcard.yay .flip { animation: yay .45s ease-out; }
.pcard.nope .flip { animation: nope .36s ease-in-out; }
.pcard.kcur .face { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.pcard:active:not(.up) { transform: scale(.96); }
@keyframes deal { 0% { opacity: 0; transform: translateY(18px) scale(.8); } 100% { opacity: 1; transform: none; } }
@keyframes yay { 0% { transform: rotateY(180deg) scale(1); } 45% { transform: rotateY(180deg) scale(1.1); } 100% { transform: rotateY(180deg) scale(1); } }
@keyframes nope { 0%,100% { transform: rotateY(180deg) translateX(0); } 30% { transform: rotateY(180deg) translateX(4px); } 70% { transform: rotateY(180deg) translateX(-4px); } }

/* 날아가는 간식·하트·점수 */
#fx { position: fixed; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
#fx > * { position: absolute; left: 0; top: 0; }
.plus { font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(20,24,70,.75), 0 0 2px rgba(20,24,70,.9); font-variant-numeric: tabular-nums; white-space: nowrap; }
.heart { color: #FF7FA2; text-shadow: 0 2px 6px rgba(0,0,0,.2); }

/* 카드(시작·결과·멈춤) 덧붙임 */
.kg-card .ico-lg { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.kg-card .big small { font-size: 18px; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.kg-card .newrec { display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 14px; background: #FFF1CF; color: #8A5A00; font-size: 13px; font-weight: 700; }
.kg-card .paws { display: flex; justify-content: center; gap: 10px; margin: 10px 0 2px; }
.kg-card .paws span { width: 30px; height: 30px; }
.kg-card .paws svg { width: 100%; height: 100%; fill: #FFB938; }
.kg-card .paws .off svg { fill: #E8EBF0; }
.kg-card .tip { font-size: 13px; background: var(--soft); border-radius: 12px; padding: 9px 12px; margin-top: 10px; color: var(--sub); }
.kg-card .link { display: block; margin: 10px auto 0; height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--sub); border-radius: 12px; }
.kg-card a.kg-btn, .kg-card a.link { text-decoration: none; }
.kg-card .links { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.kg-card .links .link { margin: 0; height: 44px; flex: 0 1 auto; min-width: 0; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
.kg-card .links .link:active { background: var(--soft); }
/* 단계: 시작 카드의 목표 줄·단계 고르기, 결과 카드의 별, 새 방해 요소 안내 */
.kg-card .tip b { color: var(--ink); }
.kg-card .tip small { display: block; margin-top: 3px; font-size: 12px; }
.kg-card .tip .gico { display: inline-flex; vertical-align: -4px; width: 18px; height: 18px; font-size: 15px; }
.kg-card .note { font-size: 12px; color: #8A94A0; }
.stages { position: relative; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; margin: 12px -6px 0; padding: 2px 6px 8px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: none; }
.stages::-webkit-scrollbar { display: none; }
.stg { flex: none; width: 46px; height: 50px; border-radius: 13px; background: var(--soft); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: center; }
.stg b { font-size: 15px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stg i { font-style: normal; font-size: 9px; line-height: 1; color: #CDD2DB; white-space: nowrap; }
.stg i em { font-style: normal; color: #F5A623; }
.stg.on { background: var(--pri); color: #fff; }
.stg.on i { color: rgba(255,255,255,.3); }
.stg.on i em { color: var(--gold); }
.kg-card .stars { display: flex; justify-content: center; gap: 8px; margin: 10px 0 2px; }
.kg-card .stars span { width: 34px; height: 34px; }
.kg-card .stars svg { width: 100%; height: 100%; fill: #FFB938; }
.kg-card .stars .off svg { fill: #E8EBF0; }
.kg-card .goalrow { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 10px; margin: 6px 0 2px; font-size: 15px; font-weight: 700; color: var(--ink); }
.kg-card .newtag { display: inline-block; margin-bottom: 6px; padding: 4px 10px; border-radius: 999px; background: #E9ECFB; color: var(--pri); font-size: 12px; font-weight: 700; }
.kg-card .pic { position: relative; width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 22px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 40px; line-height: 1; }
.kg-card .pic svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
@media (max-height: 420px) { .kg-card .lead { display: none; } .stages { margin-top: 8px; padding-bottom: 4px; } .kg-card .stars { margin: 4px 0 0; } .kg-card .stars span { width: 26px; height: 26px; } .kg-card .pic { width: 56px; height: 56px; font-size: 30px; margin-bottom: 6px; } .kg-card .newrec { margin-bottom: 4px; } }
@media (max-height: 420px) { .kg-card { padding: 16px 18px 12px; } .kg-card .ico-lg { display: none; } .kg-card .row { margin-top: 12px; } .kg-card .big { font-size: 34px; margin: 4px 0 0; } .kg-card .kg-diff { margin-top: 8px; } .kg-card .dslot.res { display: none; } .kg-card .link { margin-top: 6px; height: 34px; } .kg-card .links { margin-top: 4px; } .kg-card .tip { margin-top: 6px; padding: 6px 10px; } }
/* 아주 낮은 가로 화면(568×320): 난이도 단추가 든 시작 카드가 화면 안에 들어오게 조금 더 줄인다 (공통 CSS 가 뒤에 붙으므로 겹치는 규칙은 .kg-scrim 을 앞에 붙여야 먹는다) */
@media (max-height: 340px) { .kg-scrim .kg-card { padding: 16px 18px 12px; } .kg-scrim .kg-card h2 { margin-bottom: 4px; } .kg-scrim .kg-card .row { margin-top: 8px; } .kg-card .kg-diff { margin-top: 6px; } .kg-card .link { margin-top: 4px; } .kg-card .tip { margin-top: 4px; } .kg-card .tip small { display: none; } .stages { margin-top: 6px; padding-bottom: 2px; } }
/* 좁은 화면(320): 카드 안 난이도 단추 가운데 글자가 긴 'Very Hard' 칸만 조금 넓혀 넘치지 않게 */
@media (max-width: 340px) { .kg-card .kg-diff [data-d=vhard] { flex: 1.25 1 0; } }
/* 가로 낮은 화면에서 가족 순위 카드와 나란히 설 때: 공통 CSS 의 max-height:100% 는 안쪽 여백을 빼고 재므로 결과 카드가 여백만큼 화면 밖으로 넘친다 → 이 경우만 border-box (넓은 화면 카드 폭은 원본 그대로) */
@media (orientation: landscape) and (max-height: 520px) { .kg-scrim.kg-rbwrap > .kg-card { box-sizing: border-box; } }
@media (max-height: 420px) { .kg-scrim.kg-rbwrap > .kg-card { padding-top: 12px; padding-bottom: 10px; } }
/* 가로 화면 높이 421~520(예: 760×440): 순위 카드와 나란히 선 결과 카드 아래 글 단추 줄(「다시 하기」·「다른 게임」)이 카드 밖으로 잘리던 것 → ≤420 과 같이 결과 카드의 난이도 줄을 숨기고 글 단추를 낮춘다 */
@media (orientation: landscape) and (min-height: 421px) and (max-height: 520px) { .kg-scrim.kg-rbwrap > .kg-card .dslot.res { display: none; } .kg-scrim.kg-rbwrap > .kg-card .links { margin-top: 4px; } .kg-scrim.kg-rbwrap > .kg-card .links .link { height: 36px; } }   /* 가로 낮은 화면: 결과 카드가 몇 px 넘쳐 카드 안 스크롤바가 생기던 것을 위아래 여백으로 줄인다 */
/* 아주 낮은 가로 화면(568×320)에서 순위 카드와 나란히 서면 결과 카드가 약 300px 로 좁아져, 목표 줄·안내 글이 있는 단계 실패 카드는 「다시 하기」가 카드 아래 끝에 잘린다 → 글자와 사이를 조금 줄여 주 단추가 처음 화면에 들어오게 (이 게임 카드 내용 때문이라 여기서만) */
@media (orientation: landscape) and (max-height: 340px) {
  .kg-scrim.kg-rbwrap > .kg-card h2 { font-size: 19px; margin-bottom: 2px; }
  .kg-scrim.kg-rbwrap > .kg-card p { font-size: 13.5px; line-height: 1.4; margin-bottom: 2px; }

  // ── 41단계부터: 단계 번호를 씨앗으로 늘 같은 구성이 나온다 (ease 가 작을수록 방해 요소가 적다)

      comboEl.style.left = kx + 'px'; comboEl.style.top = Math.max(s.t + 8, ky - ksize * VIS - 36) + 'px';   // 가로 화면: 머리 위
    }
    const spot = $('spotPlay'); spot.style.left = kx + 'px'; spot.style.top = ky + 'px'; kongTo(spot, ksize);
    K.hopMax = Math.max(12, (ky - ksize * VIS - (s.t + 16)) * 400 / ksize);   // 폴짝 뛰어도 화면 위로 나가지 않게
    if (mode === 'm3') {
      cell = cw; boardEl.style.cssText = 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + bh + 'px';
      gridEl.style.width = cols * cw + 'px'; gridEl.style.height = rows * cw + 'px'; gridEl.style.setProperty('--cell', cw + 'px');
    } else {
      pboardEl.style.cssText = 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + bh + 'px';
      pCw = cw; pGap = gap; placeCards();
      if (cur.on) { cur.r = clamp(cur.r, 0, rows - 1); cur.c = clamp(cur.c, 0, cols - 1); paintCur(); }
    }
  }
  let rzT = 0; addEventListener('resize', () => { layout(); clearTimeout(rzT); rzT = setTimeout(layout, 250); });
  addEventListener('orientationchange', () => setTimeout(layout, 300));

  // ── 매 프레임: 콩이 표정, 시간, 점수 올라가기, 귀띔
  let last = 0, acc = 0, tiltNow = 0, shownC = '';
  function frame(ms) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000)); last = ms; if (document.hidden) return; T += dt;
    if (mode === 'pairs' && P && P.peeking) {   // 처음에 보여 주는 시간: 멈춘 동안(멈춤 단추·앱이 가려짐)은 흐르지 않고, 그동안은 카드를 덮어 둔다
      if (S.paused !== P.peekHid) { P.peekHid = S.paused; for (const cd of P.cards) cd.el.classList.toggle('up', !S.paused); }
      if (!S.paused && (P.peekLeft -= dt) <= 0) { for (const cd of P.cards) if (!cd.up && !cd.done) cd.el.classList.remove('up'); P.peeking = false; sfx('flip'); }
    }
    if (mode === 'pairs' && P && P.started && !P.over && !S.paused) { P.time += dt; const s = Math.floor(P.time); if (s !== P.shownS) { P.shownS = s; valB.textContent = mmss(s); } }
    if (mode === 'm3' && M) {
      const sc0 = M.B.score; if (M.shown !== sc0) { M.shown += (sc0 - M.shown) * Math.min(1, dt * 9); if (Math.abs(sc0 - M.shown) < 1) M.shown = sc0; }
      const txt = M.n + '단계 · ' + fmt(M.shown) + '점'; if (txt !== shownC) { shownC = txt; valC.textContent = txt; }
      if (canM3() && !M.hinted && M.hint && T - lastInput > M.hint) { const mv = E.validMoves(M.B)[0]; if (mv) { M.hinted = true; for (const i of mv) { const el = elOf(M.B.cells[i].p); if (el) el.classList.add('hint'); } } }
    } else shownC = '';
    K.happy = Math.max(0, K.happy - dt); K.wrong = Math.max(0, K.wrong - dt); K.munch = Math.max(0, K.munch - dt); K.lookT = Math.max(0, K.lookT - dt);
    let hop = 0, squash = 0;
    if (K.hop >= 0) { K.hop += dt / 0.48; if (K.hop >= 1) K.hop = -1; else { hop = Math.sin(K.hop * Math.PI) * K.hopH; squash = K.hop < 0.12 ? -0.3 : K.hop > 0.9 ? -0.25 : 0.15; } }
    const tiltTo = K.wrong > 0.25 ? 15 : K.happy > 0 ? Math.sin(T * 9) * 4 : Math.sin(T * 0.7) * 4;
    tiltNow += (tiltTo - tiltNow) * Math.min(1, dt * 11);
    acc += dt; if (K.hop < 0 && acc < 1 / 31) return;
    if (!lzDraw(ms, scrim.hidden ? '' : 'card:' + cardKind)) return;   // 카드(단계 시작·안내·멈춤·결과)가 떠 있으면 솎는다
    acc = 0;
    let look;
    if (K.lookT > 0 && K.lookAt) { const h = headPt(); look = [clamp((K.lookAt.x - h.x) / 160, -1, 1), clamp((K.lookAt.y - h.y) / 160, -1, 1)]; }
    else look = mode === 'menu' ? [Math.sin(T * 0.5) * 0.4, 0.1] : land ? [0.7, 0.15] : [Math.sin(T * 0.4) * 0.3, 0.7];
    const happy = K.happy > 0, idleSmile = mode === 'menu' && Math.sin(T * 0.35) > 0.7;
    kong.render({ t: T, hop, squash, tilt: tiltNow, look, eyes: happy || idleSmile ? 'happy' : 'open', mouth: K.munch > 0 ? (Math.sin(T * 26) > 0 ? 'open' : 'closed') : happy || idleSmile ? 'open' : 'closed', blush: happy, earLift: K.wrong > 0 ? 6 : 0, tailAmp: happy ? 28 : mode === 'menu' ? 18 : 10, tailRate: happy ? 5.2 : 2.6 });
  }

  // ── 시험·바깥에서 쓰기
  const rc = i => [Math.floor(i / M.cols), i % M.cols];
  const settle = async () => { for (let k = 0; k < 4000 && M && M.busy && !M.over; k++) await new Promise(r => setTimeout(r, 5)); };
  window.GAME = {
    get mode() { return mode; }, get playing() { return S.playing; }, get paused() { return S.paused; },
    get state() {
      const B = M && M.B;
      return { mode, playing: S.playing, paused: S.paused, land, card: scrim.hidden ? '' : cardKind || 'card',
        match3: M && { diff: M.diff, key: M.key, stage: M.n, nt: B.nt, max: B.max, hint: M.hint, score: B.score, moves: B.moves, chain: B.chain, bestChain: B.bestChain, eaten: B.eaten, busy: M.busy, over: M.over, win: M.win, stars: M.stars || 0, cheer: M.cheer, cols: M.cols, rows: M.rows, shape: M.st.shape, intro: M.st.intro, auto: !!M.st.auto },
        pairs: P && { diff: P.diff, stage: P.n, tries: P.tries, miss: P.miss, found: P.found, pairs: P.sets, set: P.set, cards: P.cnt, limit: P.st.limit, peek: P.st.peek, prank: P.st.prank, frozen: P.st.frozen, peeking: P.peeking, time: P.time, over: P.over, win: P.win, cols: P.cols, rows: P.rows } };
    },
    menu: goMenu, openMatch3: openM3, startMatch3: startM3, openPairs, startPairs, pause, resume,
    // 단계: goStage(n, 'm3'|'pairs') 는 잠겨 있어도 그 단계를 바로 시작한다 (which 를 주지 않으면 지금 하는 퍼즐)
    goStage(n, which) { which = which || (mode === 'pairs' ? 'pairs' : 'm3'); if (which === 'pairs') startPairs(n); else { E.stage(n, KG.diff(), land ? 6 : 7, land ? 7 : 6); startM3(n); } if (cardKind === 'intro' && cardAct) cardAct('ok'); return this.state; },
    stageOf, starsOf, stageSpec(n, diff, R, C) { return E.stage(n, diff || KG.diff(), R || (land ? 6 : 7), C || (land ? 7 : 6)); }, pairsSpec: pStage,
    get goal() { if (!M) return null; const g = E.goalInfo(M.B); return { stage: M.n, kind: M.st.goal.kind, done: g.done, items: g.items, moves: M.B.moves, max: M.B.max, score: M.B.score, text: goalPlain(M.st) }; },
    end() { if (mode === 'm3' && M && !M.over) { M.B.moves = 0; if (!M.busy) m3End(gen); } else if (mode === 'pairs' && P && !P.over) { P.over = true; P.win = false; S.playing = false; pairsEnd(); } },
    speed(x) { SPD = x > 0 ? x : 1; return SPD; },
    // 3개 맞추기: 칸의 화면 자리, 간식 판, 둘 수 있는 수, 봇
    cellRect(r, c) { const g = gridEl.getBoundingClientRect(); return { x: g.left + (c + 0.5) * cell, y: g.top + (r + 0.5) * cell, size: cell }; },
    types() { return M ? Array.from({ length: M.rows }, (_, r) => Array.from({ length: M.cols }, (_, c) => { const p = pAt(r, c); return !p ? null : p.k === 's' ? (p.sp === 'c' ? 'c' : p.t + (p.sp || '')) : p.k; })) : null; },
    board() { return M ? M.B.cells.map(c => c.h ? null : { f: c.f, k: c.p ? c.p.k : '', t: c.p ? c.p.t : -1, sp: c.p ? c.p.sp : null, ice: c.p ? c.p.ice : 0, leash: c.p ? c.p.leash : false, hp: c.p ? c.p.hp : 0 }) : null; },
    findMove() { if (!M) return null; const m = E.validMoves(M.B)[0]; return m ? [rc(m[0]), rc(m[1])] : null; },
    moves() { return M ? E.validMoves(M.B).map(m => [rc(m[0]), rc(m[1])]) : []; },
    trySwap,
    // 봇이 한 수 둔다 ('greedy' | 'random'). 그 수가 끝나 판이 가라앉으면 풀린다 → 둔 수 또는 null
    async botMove(kind) { if (!canM3()) return null; const m = E.botMove(M.B, kind || 'greedy'); if (!m) return null; const a = rc(m[0]), b = rc(m[1]); await trySwap(a, b); await settle(); return [a, b]; },
    // 봇이 판이 끝날 때까지 둔다 → { win, stage, left, score, stars }
    async botPlay(kind) { for (let k = 0; k < 200 && M && !M.over; k++) { if (!canM3()) { await new Promise(r => setTimeout(r, 10)); continue; } await this.botMove(kind); } return M && { win: M.win, stage: M.n, left: M.B.moves, score: M.B.score, stars: M.stars || 0 }; },
    engine: E,
    // 짝 맞추기: 카드 그림(시험용), 카드의 화면 자리, 뒤집기
    cards() { return P ? P.cards.map(c => ({ emoji: c.emoji, up: c.up, done: c.done, ice: c.ice, slot: c.slot })) : null; },
    cardRect(i) { const r = P.cards[i].el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; },
    flip: flipCard, kong, layout
  };

  paintMenu(); layout(); requestAnimationFrame(frame);
})();
</script>
