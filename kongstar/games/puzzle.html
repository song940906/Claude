<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 퍼즐</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 퍼즐: 고르는 화면 → 간식 3개 맞추기 / 카드 짝 맞추기 */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; }
button { border: 0; background: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

/* ── 고르는 화면 */
#menu { position: fixed; inset: 0; z-index: 1; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: calc(var(--sat) + 66px) calc(var(--sar) + 16px) calc(var(--sab) + 20px) calc(var(--sal) + 16px); box-sizing: border-box; }
.minner { margin: auto; width: 100%; max-width: 440px; }
.hero { position: relative; height: 158px; margin-bottom: 4px; }
.hero h1 { position: absolute; left: 4px; top: 30px; margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.4px; text-shadow: 0 2px 10px rgba(0,0,0,.35); max-width: 60%; }
.hero p { position: absolute; left: 4px; top: 102px; margin: 0; font-size: 14px; color: #C9D1F2; max-width: 60%; }
.hero .kspot { position: absolute; right: 78px; bottom: 6px; width: 0; height: 0; }
.pick { display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; background: var(--card); color: var(--ink); border-radius: 20px; padding: 16px; margin-top: 10px; text-align: left; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.pick:active { transform: scale(.985); filter: brightness(.97); }
.pick .ico { flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.pick .txt { flex: 1; min-width: 0; }
.pick b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.pick small { display: block; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--sub); }
.pick .rec { flex: none; text-align: right; font-size: 12px; color: var(--sub); line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pick .rec strong { display: block; font-size: 15px; color: var(--pri); }
.pick .rec span { display: block; }
.pick .rec span i { font-style: normal; font-weight: 700; color: var(--pri); }
body.land .minner { max-width: 760px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; align-items: center; }
body.land .hero { height: auto; margin: 0; padding-top: 140px; text-align: center; }
body.land .hero h1, body.land .hero p { position: static; max-width: none; }
body.land .hero h1 { font-size: 22px; }
body.land .hero p { margin-top: 6px; }
body.land .hero .kspot { right: auto; left: 50%; bottom: auto; top: 136px; }
body.land .pick:first-child { margin-top: 0; }

/* ── 놀이 화면 (자리는 layout() 이 잡는다) */
#play { position: fixed; inset: 0; z-index: 1; }
#play .kspot { position: absolute; width: 0; height: 0; z-index: 3; }
.stat { position: absolute; z-index: 4; padding: 0 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .lb { font-size: 12px; font-weight: 500; color: #C9D1F2; }
.stat b { font-size: 17px; font-weight: 700; letter-spacing: -.2px; min-width: 1.2em; text-align: right; }
.stat.warn b { color: var(--gold); }
#btnOther { position: absolute; z-index: 4; font-size: 14px; white-space: nowrap; }
#combo { position: absolute; z-index: 5; transform: translate(-50%, 0) scale(.6); opacity: 0; pointer-events: none; white-space: nowrap; background: var(--gold); color: #4A3200; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1); }
#combo.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* 간식 3개 맞추기 */
#board { position: absolute; z-index: 2; background: #fff; border-radius: 22px; box-shadow: 0 12px 34px rgba(0,0,0,.3); }
#grid { position: absolute; left: 8px; top: 8px; overflow: hidden; border-radius: 14px; touch-action: none; cursor: pointer; }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); transition: transform var(--d, .16s) cubic-bezier(.3, .2, .35, 1.12); will-change: transform; }
.tile.now { transition: none; }
.tile .in { position: absolute; inset: 3px; border-radius: 30%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .54); line-height: 1; transition: transform .16s, opacity .16s, box-shadow .16s; }
.tile.t0 .in { background: #F3E6FA; } .tile.t1 .in { background: #FFEAD6; } .tile.t2 .in { background: #FFE1E4; }
.tile.t3 .in { background: #FFF3C4; } .tile.t4 .in { background: #E2ECFC; } .tile.t5 .in { background: #DFF3E1; }
.tile.sel .in { transform: scale(1.08); box-shadow: 0 0 0 3px var(--pri); }
.tile.pop .in { transform: scale(.25); opacity: 0; transition-duration: .22s; }
.tile.hint .in { animation: wig .7s ease-in-out infinite; }
.tile.sp .in { background: #FFF6DC; box-shadow: inset 0 0 0 2.5px var(--gold), 0 0 0 1px rgba(255,200,97,.5); }
.tile.sp::after { position: absolute; right: 1px; bottom: 1px; width: calc(var(--cell) * .4); height: calc(var(--cell) * .4); border-radius: 50%; background: var(--pri); color: #fff; font-size: calc(var(--cell) * .25); font-weight: 800; line-height: calc(var(--cell) * .4); text-align: center; box-shadow: 0 0 0 2px #fff; }
.tile[data-sp=h]::after { content: '↔'; } .tile[data-sp=v]::after { content: '↕'; } .tile[data-sp=x]::after { content: '✦'; }
.tile.born .in { animation: born .4s cubic-bezier(.3,1.6,.5,1); }
.cur { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); box-sizing: border-box; border: 3px solid #7C8CF0; border-radius: 30%; transform: translate(calc(var(--cell) * var(--c)), calc(var(--cell) * var(--r))); pointer-events: none; z-index: 2; }
.beam { position: absolute; z-index: 3; pointer-events: none; border-radius: 99px; background: linear-gradient(90deg, rgba(255,200,97,0), #FFD98A 20%, #fff 50%, #FFD98A 80%, rgba(255,200,97,0)); animation: beam .38s ease-out forwards; }
.beam.v { background: linear-gradient(180deg, rgba(255,200,97,0), #FFD98A 20%, #fff 50%, #FFD98A 80%, rgba(255,200,97,0)); }
@keyframes wig { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.06); } 75% { transform: rotate(7deg) scale(1.06); } }
@keyframes born { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes beam { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

/* 카드 짝 맞추기 */
#pboard { position: absolute; z-index: 2; touch-action: none; }
.pcard { position: absolute; left: 0; top: 0; perspective: 700px; cursor: pointer; transition: transform .25s; animation: deal .34s cubic-bezier(.3,1.3,.5,1) backwards; }
.pcard .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .36s cubic-bezier(.4,.1,.3,1); }
.pcard.up .flip { transform: rotateY(180deg); }
.pcard .face { position: absolute; inset: 0; border-radius: 14px; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 14px rgba(0,0,0,.22); }
.pcard .back { background: linear-gradient(155deg, #5562CC, #2C3577); border: 2.5px solid rgba(255,255,255,.9); box-sizing: border-box; }
.pcard .back svg { width: 46%; height: 46%; opacity: .92; }
.pcard .front { background: #fff; transform: rotateY(180deg); line-height: 1; transition: background .25s, box-shadow .25s; }
.pcard.done .front { background: #FFF8E6; box-shadow: inset 0 0 0 2.5px var(--gold), 0 5px 14px rgba(0,0,0,.18); }
.pcard.done { cursor: default; }
.pcard.yay .flip { animation: yay .45s ease-out; }
.pcard.nope .flip { animation: nope .36s ease-in-out; }
.pcard.kcur .face { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.pcard:active:not(.up) { transform: scale(.96); }
@keyframes deal { 0% { opacity: 0; transform: translateY(18px) scale(.8); } 100% { opacity: 1; transform: none; } }
@keyframes yay { 0% { transform: rotateY(180deg) scale(1); } 45% { transform: rotateY(180deg) scale(1.1); } 100% { transform: rotateY(180deg) scale(1); } }
@keyframes nope { 0%,100% { transform: rotateY(180deg) translateX(0); } 30% { transform: rotateY(180deg) translateX(4px); } 70% { transform: rotateY(180deg) translateX(-4px); } }

/* 날아가는 간식·하트·점수 */
#fx { position: fixed; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
#fx > * { position: absolute; left: 0; top: 0; }
.plus { font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(20,24,70,.75), 0 0 2px rgba(20,24,70,.9); font-variant-numeric: tabular-nums; white-space: nowrap; }
.heart { color: #FF7FA2; text-shadow: 0 2px 6px rgba(0,0,0,.2); }

/* 카드(시작·결과·멈춤) 덧붙임 */
.kg-card .ico-lg { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.kg-card .big small { font-size: 18px; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.kg-card .newrec { display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 14px; background: #FFF1CF; color: #8A5A00; font-size: 13px; font-weight: 700; }
.kg-card .paws { display: flex; justify-content: center; gap: 10px; margin: 10px 0 2px; }
.kg-card .paws span { width: 30px; height: 30px; }
.kg-card .paws svg { width: 100%; height: 100%; fill: #FFB938; }
.kg-card .paws .off svg { fill: #E8EBF0; }
.kg-card .tip { font-size: 13px; background: var(--soft); border-radius: 12px; padding: 9px 12px; margin-top: 10px; color: var(--sub); }
.kg-card .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.kg-card .opt { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 16px; border-radius: 16px; background: var(--soft); color: var(--ink); text-align: left; }
.kg-card .opt:active { filter: brightness(.96); }
.kg-card .opt b { font-size: 16px; font-weight: 700; }
.kg-card .opt span { font-size: 13px; color: var(--sub); }
.kg-card .opt em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--pri); font-weight: 700; font-variant-numeric: tabular-nums; }
.kg-card .opt.rc { background: var(--pri); color: #fff; }
.kg-card .opt.rc span { color: #C9D1F2; } .kg-card .opt.rc em { color: var(--gold); }
.kg-card .link { display: block; margin: 10px auto 0; height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--sub); border-radius: 12px; }
.kg-card a.kg-btn { text-decoration: none; }
@media (max-height: 420px) { .kg-card { padding: 16px 18px 12px; } .kg-card .ico-lg { display: none; } .kg-card .row { margin-top: 12px; } .kg-card .big { font-size: 34px; margin: 4px 0 0; } .kg-card .opts { flex-direction: row; } .kg-card .opt { flex: 1; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; padding: 0 12px; } .kg-card .opt em { margin-left: 0; } .kg-card .link { margin-top: 6px; height: 34px; } .kg-card .tip { margin-top: 6px; padding: 6px 10px; } }
@media (prefers-reduced-motion: reduce) { .tile.hint .in, .pcard.yay .flip, .pcard.nope .flip, .pcard { animation: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="menu">
  <div class="minner">
    <div class="hero">
      <h1 id="mTitle">어떤 퍼즐을<br>해 볼까요?</h1>
      <p id="mSub">콩이가 옆에서 구경할게요</p>
      <div class="kspot" id="spotMenu"></div>
    </div>
    <div class="picks">
      <button class="pick" id="pickM3"><span class="ico emo" style="background:#FFF1E3">🍠</span><span class="txt"><b>간식 3개 맞추기</b><small>같은 간식을 3개 이어서 냠냠</small></span><span class="rec" id="recM3"></span></button>
      <button class="pick" id="pickPairs"><span class="ico emo" style="background:#E9ECFB">🐾</span><span class="txt"><b>카드 짝 맞추기</b><small>카드를 뒤집어 같은 그림 찾기</small></span><span class="rec" id="recPairs"></span></button>
    </div>
  </div>
</div>

<div id="play" hidden>
  <div class="kspot" id="spotPlay"></div>
  <div class="kg-pill stat" id="statA"><span class="lb" id="lbA"></span><b id="valA"></b></div>
  <div class="kg-pill stat" id="statB"><span class="lb" id="lbB"></span><b id="valB"></b></div>
  <div id="combo"></div>
  <div id="board" hidden><div id="grid"></div></div>
  <div id="pboard" hidden></div>
  <button class="kg-pill" id="btnOther">다른 퍼즐</button>
</div>

<div id="fx"></div>
<div class="kg-scrim" id="scrim" hidden></div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, best, setBest, sfx, tone, voice, toast, rand, clamp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const nameGa = J(name, '이/가'), nameUi = J(name, '의');
  const escH = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const nameGaH = escH(nameGa);   // 카드는 innerHTML 로 만든다 — 이름에 < & 가 들어 있어도 글이 깨지지 않게

  // ── 화면 요소
  const menuEl = $('menu'), playEl = $('play'), boardEl = $('board'), gridEl = $('grid'), pboardEl = $('pboard'), fxEl = $('fx'), scrim = $('scrim');
  const statA = $('statA'), statB = $('statB'), lbA = $('lbA'), lbB = $('lbB'), valA = $('valA'), valB = $('valB'), comboEl = $('combo'), btnOther = $('btnOther');
  const tb = KG.topbar({ title: nameUi + ' 퍼즐', back: 'index.html' });
  document.title = nameUi + ' 퍼즐';
  $('mSub').textContent = nameGa + ' 옆에서 구경할게요';
  const btnPause = document.createElement('button'); btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  tb.right(btnPause);

  // ── 상태
  let mode = 'menu';            // 'menu' | 'm3' | 'pairs'
  let gen = 0;                  // 판이 바뀌면 올라간다 — 기다리던 비동기 흐름이 스스로 그만두게
  const S = { playing: false, paused: false };
  let W = 0, H = 0, land = false, cell = 50;
  let M = null, P = null;       // 3개 맞추기 판 / 짝 맞추기 판
  let lastDiff = 'easy';
  let lastInput = 0, T = 0;
  const cur = { r: 0, c: 0, on: false };   // 키보드 커서

  // ── 콩이
  const kong = KG.kong($('spotMenu'), 170); kong.setPose('sit'); kong.place(0, 0);
  const K = { happy: 0, wrong: 0, tilt: 0, munch: 0, hop: -1, hopH: 60, hopMax: 60, lookAt: null, lookT: 0 };
  function kongTo(spot, size) { if (kong.el.parentNode !== spot) spot.appendChild(kong.el); kong.setSize(size); kong.place(0, 0); }
  function kongPt(p) { const r = kong.el.parentNode.getBoundingClientRect(); return { x: r.left + p.x, y: r.top + p.y }; }
  const mouthPt = () => kongPt(kong.mouth()), headPt = () => kongPt(kong.head());
  function kongHappy(sec) { K.happy = Math.max(K.happy, sec || 1.2); K.wrong = 0; }
  function kongHop(h) { if (reduceMotion) return; if (K.hop < 0) { K.hop = 0; K.hopH = Math.min(h || 60, K.hopMax); } }
  function kongWrong() { K.wrong = 0.9; K.happy = 0; }
  let munchAt = 0;
  function munch() { K.munch = 0.4; const n = performance.now(); if (n - munchAt > 90) { munchAt = n; sfx('munch'); } }
  function hearts(n) {
    if (reduceMotion) n = Math.min(n, 1);
    const h = headPt(), u = kong.size / 400;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'heart'; el.textContent = '♥'; el.style.fontSize = Math.round(rand(16, 26)) + 'px';
      const x = h.x + rand(-70, 70) * u, y = h.y - rand(40, 90) * u, dx = rand(-14, 14);
      fxEl.appendChild(el);
      const a = el.animate([{ transform: 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(.4)', opacity: 0 }, { transform: 'translate(' + (x + dx * 0.4) + 'px,' + (y - 16) + 'px) translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.25 }, { transform: 'translate(' + (x + dx) + 'px,' + (y - 56) + 'px) translate(-50%,-50%) scale(.9)', opacity: 0 }], { duration: 950, delay: i * 90, easing: 'ease-out', fill: 'both' });
      a.onfinish = () => el.remove();
    }
  }
  function plusText(txt, x, y) {
    const el = document.createElement('div'); el.className = 'plus'; el.textContent = txt; fxEl.appendChild(el);
    const a = el.animate([{ transform: 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(.6)', opacity: 0 }, { transform: 'translate(' + x + 'px,' + (y - 10) + 'px) translate(-50%,-50%) scale(1.1)', opacity: 1, offset: 0.2 }, { transform: 'translate(' + x + 'px,' + (y - 38) + 'px) translate(-50%,-50%) scale(1)', opacity: 0 }], { duration: 800, easing: 'ease-out', fill: 'both' });
    a.onfinish = () => el.remove();
  }
  function flyToMouth(emoji, x, y, delay, size) {
    const m = mouthPt(), el = document.createElement('div'); el.className = 'emo'; el.textContent = emoji; el.style.fontSize = size + 'px'; el.style.lineHeight = '1'; fxEl.appendChild(el);
    const mx = (x + m.x) / 2, my = Math.min(y, m.y) - 26;
    const kf = reduceMotion
      ? [{ transform: 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%)', opacity: 1 }, { transform: 'translate(' + m.x + 'px,' + m.y + 'px) translate(-50%,-50%) scale(.4)', opacity: 0 }]
      : [{ transform: 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: 'translate(' + mx + 'px,' + my + 'px) translate(-50%,-50%) scale(.85)', opacity: 1, offset: 0.55 }, { transform: 'translate(' + m.x + 'px,' + m.y + 'px) translate(-50%,-50%) scale(.35)', opacity: 0.9 }];
    const a = el.animate(kf, { duration: 430, delay: delay || 0, easing: 'ease-in-out', fill: 'both' });
    a.onfinish = () => { el.remove(); munch(); };
  }
  let comboT = 0;
  function showCombo(txt) { comboEl.textContent = txt; comboEl.classList.add('on'); clearTimeout(comboT); comboT = setTimeout(() => comboEl.classList.remove('on'), 1100); }

  // ── 카드(시작·결과·멈춤)
  let cardAct = null, cardKind = '';   // cardKind: 'pause'(멈춤·그만할까요) 일 때만 Esc·계속하기로 닫힌다
  function showCard(html, onAct, kind) {
    scrim.innerHTML = '<div class="kg-card" role="dialog" aria-modal="true">' + html + '</div>'; scrim.hidden = false; cardAct = onAct; cardKind = kind || '';
    const f = scrim.querySelector('.pri, .rc, button'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
  }
  function hideCard() { scrim.hidden = true; scrim.innerHTML = ''; cardAct = null; cardKind = ''; }
  scrim.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && cardAct) { sfx('tap'); cardAct(b.dataset.act); } });
  const pawsHtml = n => '<div class="paws" role="img" aria-label="발바닥 셋 중 ' + n + '개">' + [0, 1, 2].map(i => '<span class="' + (i < n ? '' : 'off') + '">' + PAW + '</span>').join('') + '</div>';
  const endRow = '<div class="row"><button class="kg-btn pri" data-act="again">다시 하기</button><a class="kg-btn" href="index.html">게임 고르기</a></div><button class="link" data-act="menu">다른 퍼즐 하기</button>';

  // ── 고르는 화면
  function paintMenu() {
    const b = best('match3'); $('recM3').innerHTML = b > 0 ? '최고<strong>' + fmt(b) + '점</strong>' : '';

    valA.textContent = '0번'; valB.textContent = '0:00'; layout();
  }
  // 카드 i 의 자리는 세로 판(a 칸 × b 줄) 기준으로 정해져 있고, 가로 화면에서는 행↔열을 바꿔 놓는다(돌려도 이웃이 그대로)
  const pIdx = (r, c) => P.cols === DIFF[P.diff].a ? r * P.cols + c : c * P.rows + r;
  const canP = () => mode === 'pairs' && P && S.playing && !S.paused && !P.over;
  function closeOpen() { if (!P) return; clearTimeout(P.backT); for (const cd of P.open) { cd.up = false; cd.el.classList.remove('up', 'nope'); } P.open = []; }
  function flipCard(i) {
    if (!canP()) return; const cd = P.cards[i]; if (!cd || cd.done) return;
    if (P.open.length === 2) closeOpen();   // 덮이기를 기다리지 않고 바로 다음 카드를 뒤집을 수 있다 (보이던 두 장 중 하나를 눌러도)

    } else {

      P.backT = setTimeout(() => { if (g === gen && P.open[0] === x && P.open[1] === y) closeOpen(); }, 1000);
    }
  }
  // 기록은 마지막 짝을 맞춘 순간 남긴다 (결과 카드가 뜨기 전에 나가도 남게)
  function pairsSave() { if (P.saved) return; const k = 'pairs.' + P.diff; P.saved = true; P.prev = best(k); P.rec = setBest(k, P.tries, true); }
  function pairsEnd() {
    pairsSave(); S.paused = false;
    const k = 'pairs.' + P.diff, prev = P.prev, rec = P.rec, pairs = P.n / 2;
    const paws = P.tries <= Math.ceil(pairs * 1.5) ? 3 : P.tries <= Math.ceil(pairs * 2.2) ? 2 : 1;
    sfx('win'); kongHappy(3); kongHop(70); hearts(4); voice('bark', 0.5, 1.2);
    showCard((rec ? '<div class="newrec">새 기록이에요!</div>' : '') + '<h2>다 맞췄어요!</h2>' + pawsHtml(paws) + '<div class="big">' + P.tries + '<small>번</small></div><p>' + DIFF[P.diff].label + ' · 걸린 시간 ' + mmss(P.time) + '</p><p>' +
      (rec ? (prev > 0 ? '지난 최고 ' + fmt(prev) + '번보다 적게 뒤집었어요' : '첫 기록을 남겼어요') : '최고 기록 ' + fmt(best(k)) + '번') + '</p>' + endRow,
      a => { if (a === 'again') startPairs(P.diff); else goMenu(); });
  }
  function openPairs() {
    enterPlay('pairs', '카드 짝 맞추기'); lbA.textContent = '뒤집기'; lbB.textContent = '시간'; S.playing = false; S.paused = false; pairsNew(lastDiff);
    const opts = Object.keys(DIFF).map(k => { const d = DIFF[k], b = best('pairs.' + k); return '<button class="opt' + (k === lastDiff ? ' rc' : '') + '" data-act="' + k + '"><b>' + d.label + '</b><span>' + d.a + '×' + d.b + ' · ' + (d.a * d.b / 2) + '쌍</span><em>' + (b > 0 ? '최고 ' + fmt(b) + '번' : '') + '</em></button>'; }).join('');
    showCard('<div class="ico-lg emo" style="background:#E9ECFB">🐾</div><h2>카드 짝 맞추기</h2><p>두 장씩 뒤집어 같은 그림을 찾아요.<br>적게 뒤집을수록 좋은 기록이에요.</p><div class="opts">' + opts + '</div><button class="link" data-act="menu">다른 퍼즐 하기</button>',
      a => { if (DIFF[a]) startPairs(a); else goMenu(); });
  }
  function startPairs(diff) { enterPlay('pairs', '카드 짝 맞추기'); lbA.textContent = '뒤집기'; lbB.textContent = '시간'; hideCard(); pairsNew(DIFF[diff] ? diff : 'easy'); S.playing = true; S.paused = false; }
  pboardEl.addEventListener('pointerdown', e => {
    const el = e.target.closest('.pcard'); if (!el) return; cur.on = false; paintCur();
    K.lookAt = { x: e.clientX, y: e.clientY }; K.lookT = 2; flipCard(+el.dataset.i);
  });

  // ── 키보드
  addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P' || k === 'ㅔ') { if (S.paused) resume(); else pause(); return; }
    if (!scrim.hidden || mode === 'menu') return;   // 카드·고르는 화면은 단추에 초점이 가 있다 (Enter·Tab)
    const dir = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[k], act = k === ' ' || k === 'Enter';
    if (!dir && !act) return; e.preventDefault();
    const G = mode === 'm3' ? M : P; if (!G) return;
    if (mode === 'm3' && M.sel && canM3()) { if (cur.r !== M.sel[0] || cur.c !== M.sel[1]) cur.on = false; cur.r = M.sel[0]; cur.c = M.sel[1]; }   // 마우스로 집어 둔 간식이 있으면 커서를 그 칸으로
    if (!cur.on) { cur.on = true; cur.r = clamp(cur.r, 0, G.rows - 1); cur.c = clamp(cur.c, 0, G.cols - 1); paintCur(); if (dir) return; }
    if (mode === 'm3') {
      if (!canM3()) return; noteInput();
      if (dir) {
        const nr = clamp(cur.r + dir[0], 0, M.rows - 1), nc = clamp(cur.c + dir[1], 0, M.cols - 1);
        if (M.sel && (nr !== cur.r || nc !== cur.c)) trySwap([cur.r, cur.c], [nr, nc]);   // 집은 채로 방향키 → 바꾸기
        cur.r = nr; cur.c = nc;
      } else if (M.sel) setSel(null); else { setSel([cur.r, cur.c]); sfx('tap'); }
    } else {
      if (dir) { cur.r = clamp(cur.r + dir[0], 0, P.rows - 1); cur.c = clamp(cur.c + dir[1], 0, P.cols - 1); }
      else flipCard(pIdx(cur.r, cur.c));
    }
    paintCur();
  });

  // ── 자리 잡기
  const sky = $('sky'), sc = sky.getContext('2d');
  function drawSky() {
    const d = Math.min(2, devicePixelRatio || 1); sky.width = Math.round(W * d); sky.height = Math.round(H * d); sc.setTransform(d, 0, 0, d, 0, 0);
    const g = sc.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0B1030'); g.addColorStop(0.55, '#1D2466'); g.addColorStop(1, '#474BA0'); sc.fillStyle = g; sc.fillRect(0, 0, W, H);
    const gl = sc.createRadialGradient(W / 2, H * 1.15, 0, W / 2, H * 1.15, Math.max(W, H) * 0.7); gl.addColorStop(0, 'rgba(255,190,150,.32)'); gl.addColorStop(1, 'rgba(255,190,150,0)'); sc.fillStyle = gl; sc.fillRect(0, 0, W, H);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    sc.fillStyle = '#fff'; const n = Math.round(W * H / 5200);
    for (let i = 0; i < n; i++) { sc.globalAlpha = 0.25 + rnd() * 0.6; sc.beginPath(); sc.arc(rnd() * W, rnd() * H, 0.5 + rnd() * 1.1, 0, TAU); sc.fill(); }
    sc.globalAlpha = 1;
  }
  // 좁은 휴대폰에서 위 줄 제목이 말줄임표로 잘리지 않게 글씨를 조금 줄인다
  const titleEl = tb.el.querySelector('.kg-title');
  function fitTitle() { if (!titleEl) return; titleEl.style.fontSize = ''; titleEl.style.letterSpacing = ''; for (let f = 15; f >= 12 && titleEl.scrollWidth > titleEl.clientWidth + 0.5; f--) { titleEl.style.fontSize = f + 'px'; titleEl.style.letterSpacing = '-.5px'; } }
  const VIS = 0.85;   // 앉은 콩이의 보이는 키 / 그림 크기
  function layout() {
    W = innerWidth; H = innerHeight; land = W > H * 1.1; document.body.classList.toggle('land', land);
    const s = KG.safe(), top = s.t + 62, bot = s.b + 10, L = s.l + 12, R = s.r + 12;
    drawSky(); fitTitle();
    if (mode === 'menu') { kongTo($('spotMenu'), land ? clamp((H - top - bot) * 0.6, 130, 190) : 170); return; }
    // 판 크기: 칸 수·칸 모양에 맞춰 화면 안에 들어가게
    let cols, rows, asp, gap, pad, maxW;
    if (mode === 'm3') { cols = M.cols; rows = M.rows; asp = 1; gap = 0; pad = 8; maxW = 70; }
    else { const d = DIFF[P.diff]; cols = land ? d.b : d.a; rows = land ? d.a : d.b; if (P.cols !== cols && d.a !== d.b) { const t = cur.r; cur.r = cur.c; cur.c = t; } P.cols = cols; P.rows = rows; asp = 1.2; gap = W < 500 || H < 500 ? 8 : 12; pad = 0; maxW = 118; }
    const fit = (aw, ah) => Math.max(20, Math.min((aw - 2 * pad - (cols - 1) * gap) / cols, (ah - 2 * pad - (rows - 1) * gap) / rows / asp, maxW));
    let cw, bw, bh, bx, by, kx, ky, ksize;
    const size = () => { bw = cols * cw + (cols - 1) * gap + 2 * pad; bh = rows * cw * asp + (rows - 1) * gap + 2 * pad; };
    const put = (el, x, y, align) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = align ? 'translateX(' + align + ')' : ''; };
    if (!land) {
      const footH = 54, minStage = 92, aw = W - L - R, ah = H - top - bot;
      cw = fit(aw, ah - footH - minStage); size();
      const stage = clamp(ah - footH - bh, minStage, 158), y0 = top + Math.max(0, (ah - stage - bh - footH) / 2);
      bx = L + (aw - bw) / 2; by = y0 + stage; kx = L + aw / 2; ky = by + 5; ksize = (stage - 2) / VIS;
      ksize = Math.min(ksize, (aw - 236) / 0.46);   // 양옆 점수 알약 자리
      const px = Math.max(L, Math.min(bx, kx - 168));
      put(statA, px, by - 54); put(statB, W - px, by - 54, '-100%');
      put(btnOther, kx, by + bh + 10, '-50%');
      comboEl.style.left = kx + 'px'; comboEl.style.top = (by - 16) + 'px';
    } else {
      const ah = H - top - bot, aw = W - L - R, sideW = clamp(aw * 0.26, 170, 280), gapS = clamp(aw * 0.03, 16, 40);
      cw = fit(aw - sideW - gapS, ah); size();
      const x0 = L + (aw - sideW - gapS - bw) / 2, kv = clamp(ah - 3 * 52 - 4, 64, 190), stackH = kv + 3 * 52, ys = top + (ah - stackH) / 2;
      bx = x0 + sideW + gapS; by = top + (ah - bh) / 2; kx = x0 + sideW / 2; ky = ys + kv; ksize = kv / VIS;
      put(statA, kx, ky + 10, '-50%'); put(statB, kx, ky + 62, '-50%'); put(btnOther, kx, ky + 114, '-50%');
      comboEl.style.left = kx + 'px'; comboEl.style.top = Math.max(s.t + 8, ky - ksize * VIS - 36) + 'px';   // 가로 화면: 머리 위
    }
    const spot = $('spotPlay'); spot.style.left = kx + 'px'; spot.style.top = ky + 'px'; kongTo(spot, ksize);
    K.hopMax = Math.max(12, (ky - ksize * VIS - (s.t + 16)) * 400 / ksize);   // 폴짝 뛰어도 화면 위로 나가지 않게
    if (mode === 'm3') {
      cell = cw; boardEl.style.cssText = 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + bh + 'px';
      gridEl.style.width = cols * cw + 'px'; gridEl.style.height = rows * cw + 'px'; gridEl.style.setProperty('--cell', cw + 'px');
    } else {
      pboardEl.style.cssText = 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + bh + 'px';
      const ch = cw * asp, pa = DIFF[P.diff].a, flipRC = cols !== pa;
      P.cards.forEach((cd, i) => { const st = cd.el.style; st.width = cw + 'px'; st.height = ch + 'px'; const r0 = Math.floor(i / pa), c0 = i % pa, cc = flipRC ? r0 : c0, rr = flipRC ? c0 : r0; st.left = cc * (cw + gap) + 'px'; st.top = rr * (ch + gap) + 'px'; cd.el.querySelector('.front').style.fontSize = Math.round(cw * 0.5) + 'px'; });
      if (cur.on) { cur.r = clamp(cur.r, 0, rows - 1); cur.c = clamp(cur.c, 0, cols - 1); paintCur(); }
    }
  }
  let rzT = 0; addEventListener('resize', () => { layout(); clearTimeout(rzT); rzT = setTimeout(layout, 250); });
  addEventListener('orientationchange', () => setTimeout(layout, 300));

  // ── 매 프레임: 콩이 표정, 시간, 점수 올라가기, 귀띔
  let last = 0, acc = 0, tiltNow = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (ms - last) / 1000)); last = ms; if (document.hidden) return; T += dt;
    if (mode === 'pairs' && P && P.started && !P.over && !S.paused) { P.time += dt; const s = Math.floor(P.time); if (s !== P.shownS) { P.shownS = s; valB.textContent = mmss(s); } }
    if (mode === 'm3' && M) {
      if (M.shown !== M.score) { M.shown += (M.score - M.shown) * Math.min(1, dt * 9); if (Math.abs(M.score - M.shown) < 1) M.shown = M.score; valB.textContent = fmt(M.shown); }
      if (canM3() && !M.hinted && T - lastInput > 7) { const mv = findMove(); if (mv) { M.hinted = true; for (const [r, c] of mv) M.grid[r][c].el.classList.add('hint'); } }
    }
    K.happy = Math.max(0, K.happy - dt); K.wrong = Math.max(0, K.wrong - dt); K.munch = Math.max(0, K.munch - dt); K.lookT = Math.max(0, K.lookT - dt);
    let hop = 0, squash = 0;
    if (K.hop >= 0) { K.hop += dt / 0.48; if (K.hop >= 1) K.hop = -1; else { hop = Math.sin(K.hop * Math.PI) * K.hopH; squash = K.hop < 0.12 ? -0.3 : K.hop > 0.9 ? -0.25 : 0.15; } }
    const tiltTo = K.wrong > 0.25 ? 15 : K.happy > 0 ? Math.sin(T * 9) * 4 : Math.sin(T * 0.7) * 4;
    tiltNow += (tiltTo - tiltNow) * Math.min(1, dt * 11);
    acc += dt; if (K.hop < 0 && acc < 1 / 31) return; acc = 0;
    let look;
    if (K.lookT > 0 && K.lookAt) { const h = headPt(); look = [clamp((K.lookAt.x - h.x) / 160, -1, 1), clamp((K.lookAt.y - h.y) / 160, -1, 1)]; }
    else look = mode === 'menu' ? [Math.sin(T * 0.5) * 0.4, 0.1] : land ? [0.7, 0.15] : [Math.sin(T * 0.4) * 0.3, 0.7];
    const happy = K.happy > 0, idleSmile = mode === 'menu' && Math.sin(T * 0.35) > 0.7;
    kong.render({ t: T, hop, squash, tilt: tiltNow, look, eyes: happy || idleSmile ? 'happy' : 'open', mouth: K.munch > 0 ? (Math.sin(T * 26) > 0 ? 'open' : 'closed') : happy || idleSmile ? 'open' : 'closed', blush: happy, earLift: K.wrong > 0 ? 6 : 0, tailAmp: happy ? 28 : mode === 'menu' ? 18 : 10, tailRate: happy ? 5.2 : 2.6 });
  }

  // ── 시험·바깥에서 쓰기
  window.GAME = {
    get mode() { return mode; }, get playing() { return S.playing; }, get paused() { return S.paused; },
    get state() {
      return { mode, playing: S.playing, paused: S.paused, land,
        match3: M && { score: M.score, moves: M.moves, chain: M.chain, bestChain: M.bestChain, eaten: M.eaten, busy: M.busy, over: M.over, cols: M.cols, rows: M.rows },
        pairs: P && { diff: P.diff, tries: P.tries, found: P.found, pairs: P.n / 2, time: P.time, over: P.over, cols: P.cols, rows: P.rows } };
    },
    menu: goMenu, openMatch3: openM3, startMatch3: startM3, openPairs, startPairs, pause, resume,
    end() { if (mode === 'm3' && M && !M.over) { M.moves = 0; if (!M.busy) m3End(gen); } else if (mode === 'pairs' && P && !P.over) { P.over = true; S.playing = false; pairsEnd(); } },
    // 3개 맞추기: 칸의 화면 자리, 간식 판, 둘 수 있는 수
    cellRect(r, c) { const g = gridEl.getBoundingClientRect(); return { x: g.left + (c + 0.5) * cell, y: g.top + (r + 0.5) * cell, size: cell }; },
    types() { return M ? M.grid.map(row => row.map(t => t ? t.type + (t.sp || '') : null)) : null; },
    findMove() { return M ? findMove() : null; }, trySwap,
    // 짝 맞추기: 카드 그림(시험용), 카드의 화면 자리, 뒤집기
    cards() { return P ? P.cards.map(c => ({ emoji: c.emoji, up: c.up, done: c.done })) : null; },
    cardRect(i) { const r = P.cards[i].el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; },
    flip: flipCard, kong, layout
  };

  paintMenu(); layout(); requestAnimationFrame(frame);
})();
