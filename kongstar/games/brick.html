<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 벽돌깨기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 벽돌깨기: 밤하늘(bg) → 콩이(stage) → 간식 상자·공·받침대·글자(cv, 손가락도 여기서 받는다) → 점수판 순서로 겹친다 */
#bg, #cv { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
#cv { z-index: 2; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .lf { gap: 2px; }
#hud .lf svg { width: 15px; height: 15px; display: block; transition: opacity .2s, transform .2s; }
#hud .lf svg.off { opacity: .28; transform: scale(.82); }
#hud .lf.hurt { animation: lfHurt .5s; }
@keyframes lfHurt { 25% { transform: translateX(-3px); background: rgba(229,72,77,.7); } 75% { transform: translateX(3px); } }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
/* 가로 낮은 화면: 상자 판을 위 줄 높이까지 올리고 점수판은 판 오른쪽에 세로로 */
#hud.col { flex-direction: column; align-items: flex-start; transform: none; }
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="cv" aria-label="간식 상자를 깨는 판"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
  <div class="lv"><span id="hudLv">1</span><small>판</small></div>
  <div class="lf" id="hudLf"></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 벽돌깨기</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>화면을 끌면 뼈다귀 받침대가 따라와요.</b></p>
      <p>손을 떼면 공이 출발! 공으로 <b>간식 상자</b>를 모두 깨요.</p>
      <p id="stKeys" hidden><b>← →</b> 움직이기 · <b>스페이스·↑</b> 공 출발</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">공을 다 놓쳤어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>도착<b id="edLv"></b></span><span>깬 상자<b id="edBrk"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'brick', TITLE = J(name, '의') + ' 벽돌깨기';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 판: 가로 12 단위 · 세로 16.5 단위. 상자는 가로 8칸(한 칸 1.5×0.7), 위에서 BY0 부터 최대 10줄 ═══════
  const FW = 12, FH = 16.5, COLS = 8, BW = FW / COLS, BH = 0.7, BY0 = 1.3, MAXR = 10;
  const BR = 0.26;                       // 공 반지름
  const PY = 15.0, PH = 0.46;            // 받침대 가운데 높이 · 두께
  const AMAX = 60 * Math.PI / 180;       // 받침대 끝에 맞으면 이만큼 기울어 튄다
  const MINA = 17 * Math.PI / 180;       // 공이 수평에서 이 각도보다 눕지 않게 (끝없는 좌우 왕복 막기)
  const SUB = 0.08;                      // 한 걸음 최대 길이 (상자 두께 0.7 보다 훨씬 짧아 뚫고 지나가지 않는다)
  const ITEM_V = 3.6, ITEM_W = 1.15, ITEM_H = 0.56;
  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   sp 첫 공 빠르기(단위/초) · up 판마다 빨라지는 몫 · spMax 가장 빠른 값 · pad 받침대 길이(단위) · hard 보통 상자가 단단한 상자로 바뀔 몫(판마다 +0.025, 0.6까지)
  //   hp3 단단한 상자 중 세 번 맞아야 깨지는 몫 · stone 씨앗 판의 돌 쌍 최대 수 · item 상자에서 아이템이 떨어질 확률 · bad 나쁜 아이템(받침대 짧아짐) 섞기
  //   첫 판은 공이 8% 느리고 단단한 상자가 절반이라 어느 난이도든 처음 한 판은 해 볼 만하다
  const DIFF = {
    easy:   { sp: 7.2,  up: 0.25, spMax: 10.5, pad: 3.0,  hard: 0.06, hp3: 0,    stone: 1, item: 0.18, bad: false },
    normal: { sp: 8.2,  up: 0.3,  spMax: 12,   pad: 2.5,  hard: 0.14, hp3: 0.25, stone: 2, item: 0.14, bad: false },
    hard:   { sp: 9.2,  up: 0.35, spMax: 13.5, pad: 2.15, hard: 0.24, hp3: 0.4,  stone: 3, item: 0.12, bad: true },
    vhard:  { sp: 10.2, up: 0.4,  spMax: 15,   pad: 1.85, hard: 0.34, hp3: 0.55, stone: 4, item: 0.10, bad: true }
  };
  let diffId = 'normal', D = DIFF.normal;
  const lvSpeed = L => Math.min(D.spMax, D.sp + (L - 1) * D.up) * (L === 1 ? 0.92 : 1);
  const lvHard = L => L === 1 ? D.hard * 0.5 : Math.min(0.6, D.hard + (L - 1) * 0.025);
  const P_BOX = 10, P_HIT = 5, P_ITEM = 25;
  // 손으로 짠 판: '.' 빈칸 · '1' 보통 · '2' 두 번 · '3' 세 번 · '#' 깨지지 않는 돌 (8칸)
  const HAND = [
    ['........', '11111111', '11111111', '11111111', '11111111'],                                    // 간식 선반
    ['.11..11.', '11111111', '11211211', '11111111', '.111111.', '..1111..', '...11...'],            // 하트
    ['........', '22....22', '21111112', '.111111.', '.111111.', '21111112', '22....22'],            // 뼈다귀
    ['.22..22.', '.22..22.', '2......2', '2.1111.2', '..1111..', '.111111.', '.111111.', '..1111..'], // 발바닥
    ['11111111', '1#1111#1', '11222211', '11233211', '#111111#', '11111111']                          // 돌 사이 간식
  ];
  // 상자 색: 간식 맛 여섯 가지 (줄마다 바뀐다)
  const COLORS = [
    { a: '#FFC2CA', b: '#E8485E' },   // 딸기
    { a: '#FFD7A6', b: '#EE8A2A' },   // 고구마
    { a: '#FFF1B0', b: '#E0A800' },   // 바나나
    { a: '#B5F2CF', b: '#25AE6B' },   // 사과
    { a: '#B5DDFF', b: '#3A86DD' },   // 우유
    { a: '#E1D3FF', b: '#8660E6' }    // 블루베리
  ];
  // 아이템: 받침대로 받으면 효과. short 는 나쁜 아이템(Hard 이상)
  const ITEMS = {
    long:  { col: '#2FB57A', txt: '받침대 쭉!' },
    multi: { col: '#E39A2A', txt: '공이 셋!' },
    slow:  { col: '#3A86DD', txt: '천천히~' },
    life:  { col: '#E8485E', txt: '목숨 하나 더!' },
    short: { col: '#7D4B9E', txt: '받침대가 줄었어요' }
  };

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '공을 튕겨 간식 상자를 깨요. 판을 비우면 다음 판!';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 100);

  // ═══════ 상태 ═══════
  let state = 'ready', phase = 'serve';  // state: ready · play · pause · over · result   phase: serve(공이 받침대 위) · run · lost(공을 놓친 잠깐) · clear
  let cells = [], level = 1, score = 0, broken = 0, cleared = 0, lives = 3, combo = 0, bestCombo = 0, hits = 0, seed = 1;
  let balls = [], items = [], parts = [], floats = [], flashes = [];
  let padX = FW / 2, padW = 2.5, padMul = 1, padMulT = 1, longT = 0, shortT = 0, slowT = 0, phaseT = 0, serveT = 0, overT = 0, overAt = 0, isNew = false, quit = false, shake = 0;
  let mood = 'idle', moodT = 0, tAnim = 0, launched = 0;
  let W = 0, H = 0, DPR = 1, S = 20, ox = 0, oy = 0, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 }, KSZ = 100, kx = 0, ky = 0;
  const sprites = {};

  const sx = x => ox + x * S, sy = y => oy + y * S;
  const cellAt = (r, c) => r >= 0 && r < MAXR && c >= 0 && c < COLS ? cells[r][c] : null;
  const solid = (r, c) => { const b = cellAt(r, c); return !!(b && (b.stone || b.hp > 0)); };
  const left = () => { let n = 0; for (const row of cells) for (const b of row) if (b && !b.stone && b.hp > 0) n++; return n; };
  const speed = () => lvSpeed(level) * (1 + Math.min(0.12, hits * 0.004)) * (slowT > 0 ? 0.7 : 1);

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function buildBg() {
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.6, '#1D1F5E'); lg.addColorStop(1, '#3A2F7E');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.8, H * 0.15, Math.max(W, H) * 0.5, 'rgba(130,140,255,.13)'); blob(W * 0.15, H * 0.85, Math.max(W, H) * 0.45, 'rgba(255,180,120,.10)');
    const rnd = mulberry32(53), n = Math.round(clamp(W * H / 2600, 80, 420));
    for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * H, r = rnd() < 0.07 ? 1.1 + rnd() * 0.7 : 0.4 + rnd() * 0.7; c.globalAlpha = 0.3 + rnd() * 0.6; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
  }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H * 1.1;
    const titled = wide && W >= 760, top = SAF.t + 62 + (titled ? 46 : 0);
    let col = false;
    if (wide) {   // 가로: 가운데 판, 왼쪽에 콩이. 점수판은 위 줄 가운데
      const kw = clamp(W * 0.17, 84, 200);
      const fit = tp => { const aw = W - SAF.l - SAF.r - kw * 2 - 16, ah = H - tp - SAF.b - 6; return { ah, S: Math.max(4, Math.min(ah / (FH + 0.4), aw / (FW + 1), 44)) }; };
      let f = fit(top), tp = top;
      if (H < 440) {   // 낮은 가로 화면: 위 줄 가운데(단추 사이)까지 판을 올리고, 점수판은 판 오른쪽 빈 곳에 세로로
        const g2 = fit(SAF.t + 8), gx = (W - FW * g2.S) / 2 + (SAF.l - SAF.r) / 2;
        if (g2.S > f.S && gx - SAF.l >= 112 && W - SAF.r - (gx + FW * g2.S) >= 124) { f = g2; tp = SAF.t + 8; col = true; }
      }
      S = f.S;
      ox = (W - FW * S) / 2 + (SAF.l - SAF.r) / 2; oy = tp + 0.2 * S + Math.max(0, f.ah - (FH + 0.4) * S) * 0.5;
      if (col) { hud.style.top = (SAF.t + 64) + 'px'; hud.style.left = (ox + FW * S + 12) + 'px'; }
      else { hud.style.top = (SAF.t + (titled ? 66 : 16)) + 'px'; hud.style.left = (W / 2) + 'px'; }
      KSZ = clamp(Math.min(kw * 1.1, H * 0.45), 70, 190); kx = Math.max(SAF.l + KSZ * 0.4, ox - KSZ * 0.5 - 8); ky = oy + FH * S - 2;
    } else {      // 세로: 위에 점수판, 그 아래 판, 판 아래 띠(손가락·콩이 자리)
      const hudH = 42, strip = 60, ah = H - top - hudH - SAF.b - strip, aw = W - SAF.l - SAF.r - 16;
      S = Math.max(4, Math.min(ah / (FH + 0.3), aw / (FW + 0.6), 44));
      ox = (W - FW * S) / 2 + (SAF.l - SAF.r) / 2; oy = top + hudH + 0.15 * S + Math.max(0, ah - (FH + 0.3) * S) * 0.4;
      hud.style.top = (oy - 0.15 * S - hudH + 2) + 'px'; hud.style.left = (W / 2) + 'px';
      const room = H - SAF.b - (oy + FH * S);
      KSZ = clamp(room * 1.25, 60, 130); kx = Math.max(SAF.l + KSZ * 0.42, ox + KSZ * 0.3); ky = H - SAF.b - 2;
    }
    bar.setTitle(wide ? (W < 760 || col ? '' : TITLE) : W < 350 ? '벽돌깨기' : TITLE);
    hud.classList.toggle('col', col);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    K.setSize(KSZ);
    hud.classList.toggle('tight', W < 340);
    buildBg(); buildSprites();

  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { drag.on = false; drag.id = null; keys.l = keys.r = false; });

  // ═══════ 입력: 손가락은 화면 어디서든 끄는 만큼 받침대가 따라 움직인다(받침대를 직접 잡지 않아도 된다).
  //   마우스는 받침대가 마우스 가로 위치를 그대로 따라간다. 공이 받침대 위에 있을 때 손을 떼면(마우스는 누르면) 출발 ═══════
  const drag = { on: false, id: null, lx: 0, mouse: false };
  const keys = { l: false, r: false, slow: false };
  const fieldX = px => (px - ox) / S;
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    if (drag.on && e.pointerId !== drag.id) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    drag.on = true; drag.id = e.pointerId; drag.lx = e.clientX; drag.mouse = e.pointerType === 'mouse'; keys.l = keys.r = false;
    if (drag.mouse) movePad(fieldX(e.clientX));
  });
  cv.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse') { movePad(fieldX(e.clientX)); return; }
    if (!drag.on || e.pointerId !== drag.id) return;
    movePad(padX + (e.clientX - drag.lx) / S); drag.lx = e.clientX;
  });
  cv.addEventListener('pointerup', e => {
    if (!drag.on || e.pointerId !== drag.id) return;
    drag.on = false; drag.id = null;
    if (state === 'play' && phase === 'serve') launch();
  });
  cv.addEventListener('pointercancel', e => { if (e.pointerId === drag.id) { drag.on = false; drag.id = null; } });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'A' || k === 'd' || k === 'D') {
      if (state !== 'play') { if (state === 'pause' && k.startsWith('Arrow')) e.preventDefault(); return; }
      e.preventDefault(); keys.slow = e.shiftKey; if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true; else keys.r = true;
    } else if (k === ' ' || k === 'ArrowUp' || k === 'Enter') {
      if (state === 'play') { e.preventDefault(); if (e.repeat || KG.rulesOpen || k === 'Enter') return; launch(); return; }
      if (k === 'ArrowUp') return;
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false; else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false; else if (k === 'Shift') keys.slow = false;
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; padW = D.pad; level = 1; newBoard(); serveBall(); paintHud(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; padW = D.pad; newBoard(); serveBall(); phase = 'serve';
  layout(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '뼈다귀 받침대로 테니스공을 튕겨 간식 상자를 깨는 놀이예요.', items: [
    ['👆', '화면 어디서든 끌면 받침대가 따라와요. 손을 떼면 공이 출발해요' + (KEYS_OK ? ' (← → 움직이기 · 스페이스 출발).' : '.')],
    ['🦴', '받침대 끝에 맞을수록 공이 비스듬히 튀어요. 공을 놓치면 하트가 하나 줄어요.'],
    ['🎁', '보통 상자는 한 번, 통조림은 두세 번 맞아야 깨져요. 회색 돌은 깨지지 않아요.'],
    ['✨', '떨어지는 아이템을 받으면 받침대가 길어지거나 공이 늘어나요' + (DIFF.hard.bad ? '. Hard 부터는 받침대가 짧아지는 보라색도 있어요.' : '.')]
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, HAND, get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get level() { return level; }, get lives() { return lives; },
    get broken() { return broken; }, get combo() { return combo; }, get padX() { return padX; }, get padW() { return padW; }, get diff() { return diffId; }, get slowT() { return slowT; }, get longT() { return longT; }, get shortT() { return shortT; },
    balls: () => balls.map(b => Object.assign({}, b)), items: () => items.map(i => Object.assign({}, i)), left, speed,
    cells: () => cells.map(r => r.map(b => b ? (b.stone ? '#' : b.hp > 0 ? String(b.hp) : '.') : '.').join('')),
    field: () => ({ W, H, S, ox, oy, wide, KSZ, kx, ky, field: [ox, oy, FW * S, FH * S], padY: sy(PY), hud: hud.getBoundingClientRect().toJSON() }),
    toScreen: (x, y) => ({ x: sx(x), y: sy(y) }), genRows: L => genRows(L, mulberry32(L)),
    start, end, pause, resume, launch,
    setLevel: n => { level = n; newBoard(); serveBall(); paintHud(); },
    clearAll: () => { for (const row of cells) for (const b of row) if (b && !b.stone) b.hp = 0; },
    leaveOne: () => { let kept = false; for (const row of cells) for (const b of row) if (b && !b.stone && b.hp > 0) { if (kept) b.hp = 0; else kept = true; } },
    giveItem: k => catchItem({ x: padX, y: PY, k }), dropItem: (x, y, k) => items.push({ x, y, k }),
    setBall: (x, y, dx, dy) => { balls = [{ x, y, dx, dy, stuck: false, nb: 0 }]; phase = 'run'; },
    setLives: n => { lives = n; paintHud(); }, setPad: x => movePad(x), BR, BW, BH, BY0, FW, FH, PY, PH, COLS,
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
</body>
</html>
