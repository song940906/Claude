<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 수면보장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 수면보장: 어둑한 방(bg) → 콩이(stage) → 이불·Zzz·손·말풍선(fx, 쓰다듬기 누름도 여기서) → 방 안 물건 단추(objs) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#objs { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.obj { position: absolute; left: 0; top: 0; box-sizing: border-box; pointer-events: auto; border: 0; padding: 0; border-radius: 50%; background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.17), rgba(255,255,255,.05) 70%); box-shadow: 0 0 0 1px rgba(255,255,255,.13), 0 4px 14px rgba(0,0,0,.25); display: grid; place-items: center; touch-action: manipulation; transition: box-shadow .2s, background .2s; }
.obj .ico { display: block; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); transition: transform .2s, opacity .2s; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
.obj .ring { position: absolute; inset: -5px; border-radius: inherit; pointer-events: none; opacity: 0; --p: 0; background: conic-gradient(#FFC861 calc(var(--p) * 1turn), rgba(255,200,97,.16) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
.obj .bang { position: absolute; right: -6px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: #FFC861; color: #3A2A00; font-size: 17px; font-weight: 800; line-height: 26px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
.obj .k { position: absolute; left: -2px; bottom: -4px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box; background: rgba(18,22,52,.8); border: 1px solid rgba(255,255,255,.25); color: #DDE3FF; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; pointer-events: none; }
.obj.floor::before { content: ''; position: absolute; left: 8%; right: 8%; bottom: -9px; height: 11px; border-radius: 50%; background: rgba(0,0,0,.26); pointer-events: none; }   /* 바닥 물건 그림자 (나온 물건만 보이게 단추에 붙인다) */
.obj.win { border-radius: 16px; background: transparent; box-shadow: none; }
.obj.win .ico { opacity: 0; transform: translateY(30%) scale(.7); }
.obj.win.warn .ico, .obj.win.loud .ico { opacity: 1; transform: none; }
.obj.warn { background: radial-gradient(circle at 50% 42%, rgba(255,226,160,.42), rgba(255,200,97,.12) 72%); box-shadow: 0 0 0 2px rgba(255,200,97,.9), 0 0 26px rgba(255,200,97,.55); }
.obj.win.warn { background: rgba(255,226,160,.14); }
.obj.warn .ring { opacity: 1; }
.obj.warn .bang { opacity: 1; transform: none; }
.obj.warn .ico { animation: objShake .32s ease-in-out infinite; }
.obj.loud { background: radial-gradient(circle at 50% 42%, rgba(255,150,150,.4), rgba(229,72,77,.14) 72%); box-shadow: 0 0 0 2px rgba(255,130,130,.9), 0 0 28px rgba(229,72,77,.6); }
.obj.loud .ico { animation: objShake .12s linear infinite; }
.obj.hush { box-shadow: 0 0 0 2px rgba(160,200,255,.85), 0 0 22px rgba(140,180,255,.5); }
.obj.hush .ico { transform: scale(.88); opacity: .75; }
.obj:focus { outline: none; }
.obj:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 3px; }
@keyframes objShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-11deg) translateX(-1px); } 75% { transform: rotate(11deg) translateX(1px); } }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
#hud .hs { gap: 2px; padding: 0 9px; }
#hud .hs svg { width: 17px; height: 17px; display: block; transition: transform .25s, opacity .25s; }
#hud .hs svg.off { opacity: .28; transform: scale(.82); }
#hud .hs.hurt { animation: hsHurt .5s; }
@keyframes hsHurt { 0%,100% { transform: none; } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
#hud .gg { flex: 1 1 auto; min-width: 96px; padding: 0 8px 0 10px; gap: 7px; }
#hud .gg small { font-size: 12px; font-weight: 600; color: #C9D1F2; }
#hud .bar { position: relative; flex: 1; min-width: 40px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.14); overflow: hidden; }
#hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, #8E9BFF, #C7A8FF 55%, #FFE19A); }
#hud .gg.peek { border-color: rgba(255,200,97,.8); }
#hud .gg.peek small { color: #FFE3A6; }
#hud .gg b { font-size: 15px; line-height: 1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
#hud.tight .gg small { display: none; }
#say { position: fixed; z-index: 10; pointer-events: none; text-align: center; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
#say.show { opacity: 1; transform: none; }
#say span { display: inline-block; max-width: 100%; box-sizing: border-box; background: rgba(255,255,255,.94); color: var(--ink); font-size: 13.5px; font-weight: 600; letter-spacing: -.3px; line-height: 1.35; padding: 6px 13px; border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
body .kg-top .kg-title { pointer-events: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .info { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stInfo { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  /* 시작 카드: 순위 카드 옆 좁은 폭에서 안내 세 줄이 접혀 「시작」을 밀어내므로 숨긴다(「규칙 보기」로 볼 수 있다) */
  #cardStart .how { display: none; }
  body .kg-rbwrap > .kg-card #stRec { margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { .obj.warn .ico, .obj.loud .ico, #hud .hs.hurt { animation: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx" role="img" aria-label="콩이가 자는 방 — 콩이를 누르고 있으면 쓰다듬어요"></canvas>
<div id="objs"></div>
<div id="say" role="status" aria-live="polite"><span></span></div>

<div id="hud" aria-hidden="true">
  <div class="hs" id="hudHearts"></div>
  <div class="nt"><span id="hudNight">1</span><small>번째 밤</small></div>
  <div class="gg" id="hudGauge"><small id="hudGLabel">졸음</small><div class="bar"><i id="hudFill"></i></div><b>🌙</b></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 수면보장</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b id="stHow1"></b> 졸음이 차올라요.</p>
      <p>물건이 흔들리면 <b>소리 나기 전에 톡</b> 눌러 꺼요.</p>
      <p><b>실눈을 뜨면 손을 떼고</b> 기다려요.</p>
    </div>
    <p class="info" id="stInfo"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">콩이가 깨 버렸어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>밤</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>끈 소리<b id="edHush"></b></span><span>쓰다듬기<b id="edPet"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const KEY = 'sleep', TITLE = J(name, '의') + ' 수면보장';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   pet 쓰다듬을 때 1초에 차는 졸음(가득 100) · petMin 밤이 깊어져도 이 배율 아래로는 안 줄어듦 · decay 손을 떼고 있을 때 1초에 빠지는 졸음(실눈 뜰 때는 안 빠짐)
  //   start 밤을 시작할 때 졸음 · startle 소리를 못 꺼 깜짝 깰 때 빠지는 졸음 · annoyHit 실눈 뜰 때 쓰다듬어 깰 때 빠지는 졸음 · reset 완전히 깬 뒤 다시 시작하는 졸음
  //   k0 첫 밤 물건 수 · kStep 몇 밤마다 물건이 하나씩 늘까 · warn [첫 밤, 가장 짧은] 예고 시간(초) · gap [첫 밤, 가장 짧은] 소리와 소리 사이(초)
  //   dualFrom 두 물건이 겹쳐 울리기 시작하는 밤 · dual 그 확률(밤마다 조금씩 오름, dualMax 까지) · first 밤마다 첫 소리까지 쉬는 시간(초)
  //   peekGap 실눈 사이(초) · toss 실눈 뜨기 전 뒤척이는 시간(미리 알림) · peekDur 실눈 뜨고 있는 시간 · grace 실눈을 뜬 뒤 손을 뗄 여유 · annoyMax 그 뒤로 이만큼 더 쓰다듬으면 깸
  //   ramp 몇 밤에 걸쳐 가장 어려운 값에 닿나 · heal 몇 밤마다 하트 하나 회복(3개까지)
  //   lateGap ramp 를 지난 밤마다 소리 사이가 줄어드는 비율(70% 까지) · lateHit 그 뒤 깜짝 깰 때 빠지는 졸음이 밤마다 1씩 늘어 닿는 상한
  //   (실눈: peekDur 는 grace + annoyMax 보다 넉넉히 길어야 「계속 만지면 깸」이 실제로 일어난다)
  const DIFF = {
    easy:   { pet: 10,  petMin: 0.8,  decay: 0.4, start: 30, startle: 22, annoyHit: 18, reset: 30, k0: 2, kStep: 2, warn: [3.4, 2.3], gap: [7.5, 4.2], dualFrom: 7, dual: 0.15, dualMax: 0.3,
              first: 3.5, peekGap: [10, 15], toss: 0.9, peekDur: 2.3, grace: 0.9, annoyMax: 0.8, ramp: 10, heal: 2, lateGap: 0.025, lateHit: 12 },
    normal: { pet: 8.5, petMin: 0.75, decay: 0.9, start: 22, startle: 36, annoyHit: 28, reset: 24, k0: 2, kStep: 1, warn: [2.4, 1.5], gap: [5.4, 2.8], dualFrom: 4, dual: 0.25, dualMax: 0.45,
              first: 2.8, peekGap: [7, 11], toss: 0.7, peekDur: 1.8, grace: 0.6, annoyMax: 0.6, ramp: 9, heal: 3, lateGap: 0.04, lateHit: 20 },
    hard:   { pet: 7.5, petMin: 0.7,  decay: 1.4, start: 16, startle: 44, annoyHit: 36, reset: 18, k0: 3, kStep: 1, warn: [1.8, 1.15], gap: [4.2, 2.3], dualFrom: 3, dual: 0.35, dualMax: 0.55,
              first: 2.2, peekGap: [5.5, 9], toss: 0.55, peekDur: 2.0, grace: 0.48, annoyMax: 0.45, ramp: 8, heal: 4, lateGap: 0.025, lateHit: 12 },
    vhard:  { pet: 7,   petMin: 0.7,  decay: 1.8, start: 12, startle: 50, annoyHit: 44, reset: 14, k0: 4, kStep: 1, warn: [1.5, 1.0], gap: [3.5, 1.9], dualFrom: 2, dual: 0.45, dualMax: 0.65,
              first: 1.8, peekGap: [4.5, 7.5], toss: 0.45, peekDur: 2.2, grace: 0.4, annoyMax: 0.35, ramp: 8, heal: 5, lateGap: 0.025, lateHit: 12 }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로
  const rampT = n => clamp((n - 1) / D.ramp, 0, 1);
  const warnOf = n => lerp(D.warn[0], D.warn[1], rampT(n));
  //   ramp 를 지난 밤부터는(late) 소리 사이가 조금씩 더 줄고(70% 까지) 깜짝 깰 때 빠지는 졸음이 밤마다 1씩 는다(+lateHit 까지) — 끝없이 쉬워지지 않게
  const lateOf = n => Math.max(0, n - 1 - D.ramp);
  const gapOf = n => lerp(D.gap[0], D.gap[1], rampT(n)) * Math.max(0.7, 1 - lateOf(n) * D.lateGap);
  const startleOf = n => D.startle + Math.min(D.lateHit, lateOf(n));
  const kindsOf = n => Math.min(OBJS.length, D.k0 + Math.floor((n - 1) / D.kStep));
  const dualOf = n => n < D.dualFrom ? 0 : Math.min(D.dualMax, D.dual + (n - D.dualFrom) * 0.03);
  const petOf = n => D.pet * Math.max(D.petMin, 1 - (n - 1) * 0.025);
  const HEARTS = 3;

  // ═══════ 방 안 물건: 나오는 차례대로. 창문은 고양이·귀뚜라미 둘 중 하나가 온다 ═══════
  const OBJS = [
    { id: 'clock',  name: '알람 시계',     ico: '⏰', word: '따르릉!' },
    { id: 'window', name: '창밖',          ico: '🐱', win: true, vars: [{ ico: '🐱', name: '창밖 고양이', word: '야옹~' }, { ico: '🦗', name: '창밖 귀뚜라미', word: '찌르르' }] },
    { id: 'toy',    name: '삑삑이 장난감', ico: '🐤', word: '삑!' },
    { id: 'phone',  name: '휴대폰',        ico: '📱', word: '드르르' },
    { id: 'drip',   name: '물방울',        ico: '🚰', word: '똑, 똑' }
  ];
  const INTRO_TIP = {
    clock: '⏰ 시계가 흔들리면 울리기 전에 톡 눌러요',
    window: '🪟 창밖에 누가 오면 창문을 톡 눌러 쉿!',
    toy: '🐤 삑삑이가 흔들리면 톡 눌러 조용히',
    phone: '📱 휴대폰이 떨리기 전에 톡 눌러 꺼요',

      c.globalAlpha = 1;
    }
    paintFrame();
  }
  // 예고 고리·점수판 (매 장면)
  let lastFill = -1, lastPeek = null;
  function paintFrame() {
    for (const e of events) { const o = OBJS[e.i]; o.ring.style.setProperty('--p', (1 - e.t / e.dur).toFixed(3)); }
    const f = Math.round(drowsy * 2) / 2; if (f !== lastFill) { lastFill = f; $('hudFill').style.width = f + '%'; }
    const pk = state === 'play' && phase === 'night' && mood === 'peek'; if (pk !== lastPeek) { lastPeek = pk; $('hudGauge').classList.toggle('peek', pk); $('hudGLabel').textContent = pk ? '쉿!' : '졸음'; }
  }
  function paintEvents() {
    OBJS.forEach((o, i) => {
      const e = events.find(x => x.i === i);
      o.el.classList.toggle('warn', !!e);
      o.el.setAttribute('aria-label', (o.win && e ? o.vars[e.v].name : o.name) + (e ? ' — 지금 눌러서 조용히 시켜요' : ''));

  }
  function paintHud() {

    [...$('hudHearts').children].forEach((s, i) => s.classList.toggle('off', i >= hearts));
  }
  let last = 0;
  // 절전: 놀이 중이 아니면(시작·멈춤·결과 카드) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임, 그 뒤로는 0.2초에 한 번만 그린다
  let calmKey = '', calmAt = 0, drawnAt = -1e9;
  function calmSkip(now) {
    const key = state + '|' + W + 'x' + H;
    if (key !== calmKey) { calmKey = key; calmAt = now; }
    if ((state !== 'ready' && state !== 'pause' && state !== 'result') || now - calmAt < 1000 || now - drawnAt >= 200) { drawnAt = now; return false; }
    return true;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (calmSkip(now)) return;
    draw();
  }

  // ═══════ 입력: 콩이를 누르고 있으면 쓰다듬기 (손가락 여러 개도 됨), 물건은 단추로 ═══════
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    if (inZone(e.clientX, e.clientY, 1.15)) { try { fx.setPointerCapture(e.pointerId); } catch (err) {} pets.set(e.pointerId, { x: e.clientX, y: e.clientY }); }
    else if (!petHint && phase === 'night') { petHint = true; say('🤚 ' + J(name, '을/를') + ' 직접 꾹 누르고 있어요', 2200); }
  });
  fx.addEventListener('pointermove', e => { const p = pets.get(e.pointerId); if (!p) return; p.x = e.clientX; p.y = e.clientY; if (!inZone(p.x, p.y, 1.5)) pets.delete(e.pointerId); });
  const upPet = e => { pets.delete(e.pointerId); };
  fx.addEventListener('pointerup', upPet); fx.addEventListener('pointercancel', upPet); fx.addEventListener('lostpointercapture', upPet);
  window.addEventListener('blur', () => { pets.clear(); petKey = false; });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (KG.rulesOpen) return;
    if (k === ' ' || k === 'Enter') {
      if (state === 'play') {
        if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 초점이 간 단추(물건·멈춤)는 Enter·Space 로 단추가 눌린다
        e.preventDefault(); if (k === ' ' && !e.repeat) petKey = true;
        return;
      }
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k >= '1' && k <= '5') { if (state === 'play' && !e.repeat) { e.preventDefault(); tapObj(+k - 1); } }
    else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => { if (e.key === ' ') petKey = false; });
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = b + '밤';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = e + '밤';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
    const Dn = DIFF[KG.diff()] || DIFF.normal;
    $('stInfo').textContent = '예고 ' + Dn.warn[0].toFixed(1) + '초 · 방해꾼 ' + Dn.k0 + '개부터 · ' + Dn.heal + '밤마다 하트 회복';
  }
  function onDiff() { paintBest(); if (state === 'ready') paintObjs(); }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);   // 결과 카드 바로 아래(가로 낮은 화면은 오른쪽) 가족 순위 — 방금 판 난이도
  KG.startRank($('cardStart'), KEY);   // 시작 카드 아래에 고른 난이도의 가족 순위
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
  layout(); paintBest(); paintHud(); paintObjs();
  const RULES = { key: KEY, title: TITLE, lead: '꾸벅꾸벅 조는 ' + J(name, '을/를') + ' 방해꾼에게서 지켜 푹 재워요.', items: [
    ['🤚', J(name, '을/를') + ' 꾹 누르고 있으면 살살 쓰다듬어 졸음이 차올라요' + (KEYS_OK ? ' (스페이스를 눌러도 돼요).' : '.')],
    ['❗', '물건이 흔들리며 ❗가 뜨면 소리 나기 전에 톡 눌러 꺼요' + (KEYS_OK ? ' (숫자 키도 돼요).' : '.')],
    ['👀', '뒤척이다 실눈을 뜨면 손을 떼고 기다려요. 계속 만지면 귀찮아서 깨요.'],
    ['❤️', '완전히 깨면 하트가 하나 줄어요. 졸음을 끝까지 채우면 다음 밤!']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  //   autoplay(cfg): 화면 없이 빨리 돌리는 봇. react 반응 시간(초) · jitter 그 흔들림 비율 · miss 소리를 놓칠 확률 · peekMiss 실눈을 늦게 알아챌 확률
  //   oneHand 손 하나(물건을 누를 때 쓰다듬기를 잠깐 멈춤) · maxNights · maxTime(초) → { nights, time, hearts, hushed, missed, wakes, perNight }
  function autoplay(cfg) {
    cfg = Object.assign({ react: 0.4, jitter: 0.35, miss: 0, peekMiss: 0, oneHand: true, maxNights: 30, maxTime: 3600, dt: 1 / 30 }, cfg || {});
    if (state !== 'play') start();
    const plan = new Map(); let busy = 0, peekPlan = null, peekKey = -1, t0 = simT, nightStart = simT; const perNight = [];

      // 물건: 예고를 보고 반응 시간 뒤에 누른다 (놓칠 확률)
      for (const e of events) if (!plan.has(e)) plan.set(e, Math.random() < cfg.miss ? Infinity : e.born + cfg.react * (1 + rand(-cfg.jitter, cfg.jitter)));
      for (const e of events.slice()) if (simT >= plan.get(e)) { tapObj(e.i); if (cfg.oneHand) busy = 0.28; }
      // 실눈: 반응 시간 뒤에 손을 뗀다
      if (mood === 'peek' && phase === 'night' && peekKey !== peekN) { peekKey = peekN; peekPlan = Math.random() < cfg.peekMiss ? D.grace + D.annoyMax * 1.2 : cfg.react * (1 + rand(-cfg.jitter, cfg.jitter)); }
      const wantPet = phase !== 'clear' && busy <= 0 && !(mood === 'peek' && peekAge >= peekPlan) && mood !== 'startle' && phase !== 'wake';
      petKey = wantPet;
      busy -= cfg.dt;
      tAnim += cfg.dt; update(cfg.dt);
      if (night !== lastNight) { perNight.push(+(simT - nightStart).toFixed(1)); nightStart = simT; lastNight = night; }
    }
    petKey = false;
    return { nights, time: +(simT - t0).toFixed(1), hearts, hushed, missed, wakes, peeksOk, state, perNight };
  }
  window.GAME = {
    DIFF, OBJS,
    get state() { return state; }, get phase() { return phase; }, get mood() { return mood; }, get score() { return nights; }, get nights() { return nights; }, get night() { return night; },
    get hearts() { return hearts; }, get drowsy() { return drowsy; }, get diff() { return diffId; }, get peekAge() { return peekAge; }, get grace() { return D.grace; },
    get events() { return events.map(e => ({ i: e.i, id: OBJS[e.i].id, t: e.t, dur: e.dur })); }, get petting() { return petting(); }, get stats() { return { hushed, missed, wakes, petTime, peeksOk }; },
    start, end, pause, resume, tap: tapObj, petDown() { petKey = true; }, petUp() { petKey = false; },
    step: dt => { let left = dt; while (left > 1e-6) { const d = Math.min(0.05, left); left -= d; tAnim += d; if (state !== 'pause') update(d); } },
    autoplay,
    field: () => ({ W, H, wide, KS, kx, ky, top0, zone: petZone(), head: kongHead(), objs: OBJS.map(o => ({ id: o.id, x: o.x, y: o.y, w: o.w, h: o.h, hidden: o.el.hidden })), hud: hud.getBoundingClientRect().toJSON() }),
    set: o => { if ('drowsy' in o) drowsy = o.drowsy; if ('night' in o) { night = o.night; paintObjs(); paintHud(); } if ('hearts' in o) { hearts = o.hearts; paintHud(); } if ('nextNoise' in o) nextNoise = o.nextNoise; if ('nextPeek' in o) nextPeek = o.nextPeek; },
    spawn: () => spawnNoise()
  };
})();
</script>
