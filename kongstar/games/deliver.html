<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 로켓배송</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 로켓배송: 밤하늘·동네 지도(bg) → 집·길(map) → 콩이(stage) → 날아다니는 것(fx) → 점수판·단추 순서로 겹친다 */
#bg, #map, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#map { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: pointer; }
#hud { position: fixed; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .df { color: #D5DBFF; font-weight: 500; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-right: 2px; }
#hud .fu { margin-left: auto; }
#hud .fu.out { border-color: rgba(255,170,150,.7); color: #FFD9CF; }
#hud .hs.all { border-color: rgba(255,200,97,.75); color: #FFE9B8; }
#hud.tight .df { display: none; }
#hud.col .fu { margin-left: 0; }
#say { position: fixed; z-index: 10; pointer-events: none; text-align: center; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
#say.show { opacity: 1; transform: none; }
#say span { display: inline-block; max-width: 100%; box-sizing: border-box; background: rgba(255,255,255,.94); color: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: -.3px; line-height: 1.35; padding: 5px 12px; border-radius: 13px; box-shadow: 0 3px 10px rgba(0,0,0,.2); }
#say.one span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; padding: 3px 10px; }
#ctl { position: fixed; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; }
#ctl button { flex: 1 1 0; min-width: 0; height: 46px; box-sizing: border-box; border-radius: 16px; border: 1px solid var(--glass-line); background: rgba(18,22,52,.62); color: #fff; font-size: 14px; font-weight: 600; letter-spacing: -.3px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; white-space: nowrap; }
#ctl button:active { background: rgba(60,68,130,.7); }
#ctl button:disabled { opacity: .38; }
#ctl button b { min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
#ctl #btnGo { flex: 1 0 100%; height: 52px; font-size: 16px; background: #fff; color: var(--pri); border-color: #fff; }
#ctl #btnGo:active { background: #EEF0FA; }
#ctl #btnGo:disabled { opacity: .45; }
#ctl #btnGo.ready { background: var(--gold); border-color: var(--gold); color: #3A2A00; animation: goNudge 1.1s ease-in-out infinite; }
@keyframes goNudge { 0%,100% { box-shadow: 0 0 0 2px rgba(255,200,97,.4); } 50% { box-shadow: 0 0 0 7px rgba(255,200,97,.12); } }
#ctl.short { gap: 6px; }
#ctl.short button { height: 44px; }
#ctl.short #btnGo { height: 46px; }
#ctl.col { flex-direction: column; flex-wrap: nowrap; gap: 6px; }
#ctl.col button, #ctl.col #btnGo { flex: 0 0 44px; height: 44px; width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .info { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 0; }
.kg-card .stars svg { width: 38px; height: 38px; display: block; }
.kg-card .stars svg path { fill: #E6E9EF; }
.kg-card .stars svg.on path { fill: #FFC23D; }
.kg-card .stars svg.on { animation: starIn .45s both; }
.kg-card .stars svg.on:nth-child(2) { animation-delay: .12s; }
.kg-card .stars svg.on:nth-child(3) { animation-delay: .24s; }
@keyframes starIn { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: none; opacity: 1; } }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } #ctl { gap: 6px; } #ctl button { font-size: 12.5px; letter-spacing: -.6px; padding: 0 3px; gap: 3px; } #hud { gap: 4px; } #hud > div { padding: 0 9px; font-size: 13px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .kg-diff { margin-top: 10px; }
  body .kg-card .stars { margin-top: 6px; }
  body .kg-card .stars svg { width: 32px; height: 32px; }
  body .kg-card .big { font-size: 34px; margin: 4px 0 0; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 430px); padding: 12px 20px; }
  body .kg-card h2 { margin-bottom: 2px; font-size: 19px; }
  #stLead, #edText { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 7px 14px; }
  body .kg-card .info { margin-top: 5px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .stars { margin-top: 2px; }
  body .kg-card .stars svg { width: 28px; height: 28px; }
  body .kg-card .big { font-size: 28px; margin: 0; }
  body .kg-card .new { margin-top: 0; }
}
/* 가로 낮은 화면에서 순위 카드가 옆에 붙어 결과 카드가 좁아지면(약 300px) 이 게임만 있는 별·기록 칩 두 줄 때문에 「다음 단계」 단추가 카드 아래로 밀려난다 → 기록 칩을 한 줄로 */
@media (orientation: landscape) and (max-height: 430px) { body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 6px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 9px; font-size: 12px; white-space: nowrap; } }
@media (prefers-reduced-motion: reduce) { #ctl #btnGo.ready, .kg-card .stars svg.on { animation: none; } }
/* 가로 낮은 화면에서 순위 카드와 나란히 설 때(11-23 결과 단추 정리): 「새 기록」 딱지를 점수 옆에 붙여 한 줄을 아끼고, 단추 줄(「다른 게임」 포함)이 카드 안에 들어오게 */
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="map" aria-hidden="true"></canvas>
<div id="stage"></div>
<canvas id="fx" role="img" aria-label="동네 지도"></canvas>
<div id="say" role="status" aria-live="polite"><span></span></div>

<div id="hud" aria-hidden="true">
  <div class="st" id="hudStage">1단계</div>
  <div class="df" id="hudDiff">Normal</div>
  <div class="hs" id="hudHouseBox"><small>집</small><span id="hudHouse">0/0</span></div>
  <div class="fu" id="hudFuelBox"><small>걸음</small><span id="hudFuel">0/0</span></div>
</div>
<div id="ctl" hidden>
  <button type="button" id="btnUndo">한 칸 되돌리기</button>
  <button type="button" id="btnRestart">처음부터</button>
  <button type="button" id="btnHint">힌트<b id="hintN"></b></button>
  <button type="button" id="btnGo">출발</button>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 로켓배송</h2>
    <p id="stLead"></p>
    <div class="how"><p><b id="stHow1"></b> 집마다 들르는 길을 긋고 <b>출발</b>을 눌러요.</p></div>
    <p class="info" id="stInfo"></p>
    <div class="rec" id="stRec"><span>이번에 할 단계<b id="stStage"></b></span><span id="stBestBox">최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">단계 완료!</h2>
    <p id="edText"></p>
    <div class="stars" id="edStars" role="img"></div>
    <div class="big"><span id="edSteps">0</span><small>걸음</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>가장 짧은 길<b id="edOpt"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnStop" type="button">그만하기</button><button class="kg-btn pri" id="btnNext">다음 단계</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const TITLE = J(name, '의') + ' 로켓배송';

  // ═══════ 난이도 표 ═══════
  //   cols×rows 지도 크기 · houses 집 수(처음, 단계가 오른 뒤) · wall 못 지나가는 칸 비율 · kinds 한 단계에 섞이는 장애 종류 수(울타리·연못 빼고)
  //   intro 그 요소가 처음 나오는 단계 · slack(L, n) 가장 짧은 길 L 에 더해 주는 걸음 여유 · hints 단계당 힌트 횟수 · show 힌트 한 번에 보여 주는 칸 수
  //   mean 짓궂은 배치(가장 짧은 길을 일부러 막는 골목·흙길·뒤섞은 번호)가 나올 확률 · one 골목 수 · softN 흙길 최대 수 · bridges 다리 수
  //   len 가장 짧은 길 길이 범위(벗어나면 다시 만든다) · turns 꺾이는 횟수 하한(너무 뻔한 배치 거르기)
  const DIFF = {
    easy:   { cols: 5, rows: 5, houses: [3, 4], wall: 0.08, kinds: 1, hints: 5, show: 6, mean: 0,    one: [1, 1], softN: 1, bridges: [2, 2], len: [6, 20],  turns: 2,
              intro: { wall: 2, river: 4, oneway: 7, wood: 10, num: 13, soft: 16, dog: 19 }, slack: (L, n) => Math.max(5, Math.ceil(L * 0.6)) },
    normal: { cols: 6, rows: 6, houses: [4, 5], wall: 0.12, kinds: 2, hints: 3, show: 5, mean: 0.35, one: [1, 2], softN: 2, bridges: [1, 2], len: [10, 30], turns: 3,
              intro: { wall: 1, river: 3, oneway: 5, wood: 7, num: 9, soft: 11, dog: 13 }, slack: (L, n) => Math.max(3, Math.ceil(L * 0.2)) },
    hard:   { cols: 7, rows: 8, houses: [5, 6], wall: 0.15, kinds: 3, hints: 2, show: 4, mean: 0.6,  one: [2, 3], softN: 2, bridges: [1, 2], len: [16, 46], turns: 4,
              intro: { wall: 1, river: 2, oneway: 3, wood: 5, num: 7, soft: 9, dog: 11 }, slack: (L, n) => n <= 6 ? 3 : 2 },
    vhard:  { cols: 8, rows: 9, houses: [6, 7], wall: 0.17, kinds: 4, hints: 1, show: 3, mean: 0.85, one: [2, 4], softN: 3, bridges: [1, 3], len: [22, 62], turns: 5,
              intro: { wall: 1, river: 2, oneway: 3, wood: 4, num: 5, soft: 6, dog: 7 }, slack: (L, n) => n % 2 ? 1 : 0 }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 지도 규칙 ═══════
  //   칸 종류. 길(PLAIN)·돌다리·집·뼈다귀 칸은 몇 번이든 지나도 된다. 나무다리·무른 흙길은 한 번 밟으면 다시 못 지난다.
  //   골목(ONE)은 화살표 방향으로만 들어가고 나온다. 큰 개(DOG)는 뼈다귀를 주운 뒤에만 지나간다. 번호 집은 앞 번호를 다 돌아야 배달된다.
  //   로켓 가방은 제자리에서 뒤로 돌지 못한다 → 바로 앞 칸으로 되돌아가는 것은 「길 지우기」다.
  const PLAIN = 0, FENCE = 1, POND = 2, BUSH = 3, RIVER = 4, BRIDGE = 5, WOOD = 6, SOFT = 7, ONE = 8, HOUSE = 9, DOG = 10, BONE = 11;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 0 위 · 1 오른쪽 · 2 아래 · 3 왼쪽
  const MAXBITS = 12;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const pop2 = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  const nbr = (S, c, d) => { const x = c % S.cols + DX[d], y = (c / S.cols | 0) + DY[d]; return x < 0 || y < 0 || x >= S.cols || y >= S.rows ? -1 : y * S.cols + x; };
  const dirOf = (S, a, b) => { const d = b - a; return d === -S.cols ? 0 : d === 1 ? 1 : d === S.cols ? 2 : d === -1 ? 3 : -1; };
  const manh = (S, a, b) => Math.abs(a % S.cols - b % S.cols) + Math.abs((a / S.cols | 0) - (b / S.cols | 0));
  const blocked = t => t === FENCE || t === POND || t === BUSH || t === RIVER;
  // 지도에 비트 자리 매기기: 집 → 한 번만 지나는 칸(나무다리·흙길) → 뼈다귀 → 큰 개
  function compile(S) {
    const N = S.cols * S.rows; S.n = N; S.bit = new Int8Array(N).fill(-1); S.need = new Int32Array(N); S.items = [];
    let b = 0; S.houses.forEach((h, i) => { h.bit = b; S.bit[h.cell] = b++; });
    S.H = S.houses.length; S.HM = (1 << S.H) - 1;
    for (const h of S.houses) if (h.num) { let m = 0; for (const o of S.houses) if (o.num && o.num < h.num) m |= 1 << o.bit; S.need[h.cell] = m; }
    S.BONEM = 0; S.DOGM = 0;
    for (const k of [WOOD, SOFT, BONE, DOG]) for (let c = 0; c < N; c++) if (S.t[c] === k) { S.bit[c] = b; S.items.push({ cell: c, kind: k, bit: b }); if (k === BONE) S.BONEM |= 1 << b; if (k === DOG) S.DOGM |= 1 << b; b++; }
    S.bits = b; return b <= MAXBITS ? S : null;
  }
  // 한 걸음: (칸, 온 방향, 상태) 에서 d 쪽으로 → 새 상태(0 이상) 또는 못 가는 까닭(음수)
  //   -1 지도 밖 · -2 울타리·연못 · -3 강 · -4 뒤로 돌기 · -5 골목 방향 · -6 무너진 칸 · -7 큰 개
  function move(S, pos, dir, mask, d) {
    if (dir < 4 && d === ((dir + 2) & 3)) return -4;
    if (S.t[pos] === ONE && S.arrow[pos] !== d) return -5;
    const n = nbr(S, pos, d); if (n < 0) return -1;
    const t = S.t[n]; let b;
    switch (t) {
      case FENCE: case POND: case BUSH: return -2;
      case RIVER: return -3;
      case ONE: return S.arrow[n] === d ? mask : -5;
      case WOOD: case SOFT: b = 1 << S.bit[n]; return mask & b ? -6 : mask | b;
      case HOUSE: b = 1 << S.bit[n]; return !(mask & b) && (mask & S.need[n]) === S.need[n] ? mask | b : mask;
      case BONE: return mask | (1 << S.bit[n]);
      case DOG: b = 1 << S.bit[n]; return mask & b ? mask : pop2(mask & S.BONEM) - pop2(mask & S.DOGM) > 0 ? mask | b : -7;
    }
    return mask;
  }
  // 가장 짧은 길 찾기(너비 우선). from = { pos, dir(4 = 아직 안 움직임), mask }, goal 'all'(모든 집) | 'next'(새 집 하나 더)
  //   → { len, path: [칸…] (from.pos 부터) } 또는 null
  let PAR = new Int32Array(0), QUE = new Int32Array(0);
  function solve(S, from, goal) {
    from = from || { pos: S.start, dir: 4, mask: 0 };
    const bits = S.bits, N = (S.n * 5) << bits, HM = S.HM, startH = from.mask & HM, mm = (1 << bits) - 1;
    const done = goal === 'next' ? m => (m & HM) !== startH : m => (m & HM) === HM;
    if (done(from.mask)) return { len: 0, path: [from.pos], nodes: 0 };
    if (PAR.length < N) { PAR = new Int32Array(N); QUE = new Int32Array(N); }
    PAR.fill(-1, 0, N);
    const s0 = ((from.pos * 5 + from.dir) << bits) | from.mask; PAR[s0] = s0; QUE[0] = s0;
    let qh = 0, qt = 1, end = -1;
    while (qh < qt && end < 0) {
      const cur = QUE[qh++], pd = cur >> bits, pos = pd / 5 | 0, dir = pd % 5, mask = cur & mm;
      for (let d = 0; d < 4; d++) {
        const nm = move(S, pos, dir, mask, d); if (nm < 0) continue;
        const ni = ((nbr(S, pos, d) * 5 + d) << bits) | nm; if (PAR[ni] !== -1) continue;
        PAR[ni] = cur; if (done(nm)) { end = ni; break; } QUE[qt++] = ni;

    else if (k === 'r' || k === 'R') restart();
    else if (k === 'h' || k === 'H') useHint();
  });

  // ═══════ 시작 ═══════
  $('stRec').parentNode.insertBefore(KG.diffPicker(null, () => { if (state === 'ready') preview(); else paintCards(); }), $('stInfo'));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  KG.resultActions($('cardEnd').querySelector('.kg-card'), { guard: late });   // 단계 완료 카드: 단추 줄 아래 「다른 게임」(게임 고르기로) — 막 뜬 카드의 누름은 넘긴다
  const rb = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'deliver');   // 단계 완료 카드 바로 아래(가로 화면은 오른쪽)에 붙는 별도의 가족 순위 카드
  KG.startRank($('cardStart'), 'deliver');   // 시작 카드 아래에 고른 난이도의 가족 순위
  preview();
  const RULES = { key: 'deliver', title: TITLE, lead: '로켓 가방을 멘 ' + J(name, '이/가') + ' 동네 집집마다 간식을 배달해요.', items: [
    ['👆', name + '에서부터 손가락으로 옆 칸으로 길을 그어요. 왔던 칸으로 되돌아가면 길이 지워져요.'],
    ['🏠', '정해진 걸음 수 안에 모든 집에 들르는 길을 만들고 「출발」을 눌러요.'],
    ['⭐', '걸음이 적을수록 별이 많아요. 가장 짧은 길이면 별 3개예요.'],
    ['💡', '막히면 한 칸 되돌리기·처음부터·힌트를 써요. 시간 제한은 없어요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용
  const stepN = dt => { let left = dt; while (left > 1e-6) { const d = Math.min(0.05, left); left -= d; tAnim += d; if (state !== 'pause') update(d); } drawKong(); };
  const ascii = St => { const ch = '.#~%=Hw:>h!b', ar = '^>v<'; let s = ''; for (let i = 0; i < St.n; i++) { const t = St.t[i]; s += i === St.start ? 'K' : t === ONE ? ar[St.arrow[i]] : t === HOUSE ? String(St.houses.find(h => h.cell === i).num || 'h') : ch[t]; if (i % St.cols === St.cols - 1) s += '\n'; } return s; };
  // 가까운 집부터 가는 단순한 봇: 지금 자리에서 「새 집 하나 더」까지의 가장 짧은 길을 이어 붙인다 → { ok(걸음 수 안에 다 돌았나), steps }
  function greedy(St) {
    let cur = { pos: St.start, dir: 4, mask: 0 }, total = 0; const p = [St.start];
    while ((cur.mask & St.HM) !== St.HM) { const r = solve(St, cur, 'next'); if (!r) return { ok: false, steps: total, stuck: true, path: p }; const w = walk(St, p.concat(r.path.slice(1))); for (const c of r.path.slice(1)) p.push(c); total += r.len; cur = { pos: p[p.length - 1], dir: w.dir, mask: w.mask }; }
    return { ok: total <= St.fuel, steps: total, stuck: false, path: p };
  }
  window.GAME = {
    get state() { return state; }, get score() { return cleared; }, get stage() { return stageNo; }, get steps() { return steps(); }, get diff() { return diffId; }, get D() { return D; },
    get map() { return S; }, get ascii() { return ascii(S); }, get path() { return path.slice(); }, set path(p) { setPath(p); }, get mask() { return W0.mask; }, get done() { return isDone(W0.mask); }, get hintsLeft() { return hintsLeft; }, get hint() { return hint.slice(); },
    get stars() { return lastStars; }, get mood() { return mood; },
    start, begin, next, pause, resume, end: quit, step: stepN, go, setPath, dir: stepDir, undo, restart, useHint,
    solve: () => solve(S).path, greedy: () => greedy(S),
    // 자동으로 n 단계 풀기 (화면 없이): 가장 짧은 길을 넣고 출발 → [{ stage, opt, fuel, stars, kinds }]
    autoSolve: (n, how) => {
      const out = [];
      for (let i = 0; i < (n || 1); i++) {
        if (state === 'result') next(); else if (state !== 'play') start();
        const p = how === 'greedy' ? greedy(S).path : S.sol, rec = { stage: stageNo, opt: S.opt, fuel: S.fuel, kinds: S.kinds.join('+'), tries: S.tries };
        rec.set = setPath(p); rec.go = go(); let g = 0; while ((state === 'run' || state === 'clear' || state === 'fail') && g++ < 400) stepN(0.1);
        rec.state = state; rec.stars = state === 'result' ? lastStars : 0; out.push(rec); if (state !== 'result') break;
      }
      return out;
    },
    layout: () => ({ W, H, land, CELL, BX, BY, KS, cols: S.cols, rows: S.rows }),
    cellXY: c => cellXY(c),
    lib: { DIFF, makeStage, solve, walk, move, greedy, ascii, compile, turnsOf, TIPS }
  };
})();
</script>
