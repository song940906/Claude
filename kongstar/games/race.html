<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이는 달리기왕</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이는 달리기왕: 강아지 다섯 마리 달리기 시합 — 배경 캔버스(운동장·상대 강아지) · 콩이(SVG) · 효과 캔버스를 차례로 겹친다 */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: #9FD3F7; }
#bg, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#dog { position: absolute; inset: 0; pointer-events: none; }
#fx { pointer-events: none; }
/* 점수판 */
#hud { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(var(--sat) + 62px); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.hp { height: 34px; border-radius: 17px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; background: rgba(18,22,52,.5); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; white-space: nowrap; }
.hp .num { font-size: 16px; font-weight: 700; min-width: 1ch; text-align: right; }
.hp .unit { font-size: 12px; font-weight: 500; opacity: .8; margin-left: -3px; }
.hp .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); margin: 0 4px; }
#hRank { color: #FFE08A; }
#hudL { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
#hDiff { height: 22px; border-radius: 11px; padding: 0 9px; font-size: 11px; letter-spacing: 0; opacity: .92; }
#note { position: fixed; z-index: 10; left: 50%; top: calc(var(--sat) + 166px); transform: translate(-50%, -6px); padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.94); color: #191F28; font-size: 14px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; max-width: 92vw; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#note.show { opacity: 1; transform: translate(-50%, 0); }
/* 발 단추: 엄지 두 개로 번갈아 누른다 (동시에 눌려도 각각 먹게 pointerdown 으로 받는다) */
#pad { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); bottom: calc(var(--sab) + 12px); display: flex; gap: 8px; touch-action: none; }
#pad button { height: 76px; border: 2px solid transparent; border-radius: 22px; background: rgba(255,255,255,.96); color: #191F28; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; font-size: 16px; font-weight: 700; letter-spacing: -.3px; box-shadow: 0 6px 18px rgba(20,30,70,.18); touch-action: none; transition: transform .06s, border-color .12s, background .12s; }
#pad button i { font-style: normal; font-size: 22px; line-height: 1; }
#pad .foot { flex: 1 1 0; min-width: 0; }
#pad .foot.next { border-color: #FFC861; background: #FFFBF0; }
#pad #bL i { transform: scaleX(-1) rotate(-14deg); display: inline-block; }
#pad #bR i { transform: rotate(-14deg); display: inline-block; }
#pad #bH { flex: none; width: 86px; background: #EEF2FF; color: #2C3577; }
#pad button.down { transform: scale(.95); background: #E9EDFB; }
#pad #bH.down { background: #DDE4FF; }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
#cardStart .tip { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; }
#cardStart .tip span { flex: 1; min-width: 0; }
#btnRules { flex: none; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); color: var(--pri); font-size: 13.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#btnRules:active { filter: brightness(.96); }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
/* 경기 결과 카드: 시상대가 보이게 아래(가로 화면은 오른쪽)에 붙인다 */
#cardRace { background: rgba(8,10,28,.1); align-items: flex-end; pointer-events: none; }   /* 거의 투명한 막이라 위 줄(게임 · 소리)은 그대로 눌리게 */
#cardRace .kg-card { pointer-events: auto; }
#cardRace .kg-card { padding: 16px 16px 14px; }
#cardRace h2 { font-size: 19px; margin-bottom: 2px; }
#cardRace p { font-size: 13.5px; }
#rkList { list-style: none; margin: 10px 0 0; padding: 0; }
#rkList li { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #3A4552; text-align: left; }
#rkList li.me { background: #FFF4DA; color: #191F28; font-weight: 700; }
#rkList li b { flex: none; width: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
#rkList li i { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.14); }
#rkList li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rkList li em { flex: none; font-style: normal; font-variant-numeric: tabular-nums; color: var(--sub); font-size: 13px; }
#rkList li.me em { color: #8A5A00; }
#rcPts { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 10px; }
#rcPts span { padding: 4px 9px; border-radius: 10px; background: var(--soft); font-size: 12.5px; font-weight: 600; color: #3A4552; white-space: nowrap; font-variant-numeric: tabular-nums; }
#rcPts span.off { color: #A6AEB8; font-weight: 500; }
#rcSum { margin-top: 10px; font-size: 14px; color: var(--sub); }
#rcSum b { color: var(--ink); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
#cardRace .row { margin-top: 12px; }
/* 세로 화면: 시작 카드를 위로 올려 아래 출발선의 강아지들이 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body #cardStart, body #cardPause { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  #note { top: calc(var(--sat) + 102px); }
  #hDiff { display: none; }
  #pad button { height: 72px; }
  #pad .foot { flex: none; width: 164px; }
  #pad #bL { margin-right: auto; }
  body .kg-card { padding: 16px 18px 14px; width: min(100%, 440px); }
  .kg-card .tip { margin-top: 8px; padding: 9px 12px; }
  #cardStart .tip { padding: 5px 6px 5px 12px; }
  body .kg-card .big { font-size: 32px; margin: 2px 0 0; }
  body .kg-card .row { margin-top: 12px; }
  body .kg-card .row .kg-btn { height: 46px; }
  .kg-card .stats { margin-top: 8px; }
  .kg-card .stats div { padding: 7px 4px 6px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
  #cardRace { align-items: center; justify-content: flex-end; padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }   /* 위 줄(제목 · 소리 단추) 아래에 */
  body #cardRace .kg-card { width: min(100%, 330px); padding: 8px 14px 8px; }
  #cardRace h2 { font-size: 17px; margin: 0; }
  #cardRace p { font-size: 12.5px; margin: 0; }
  #rkList { margin-top: 5px; }
  #rkList li { height: 22px; font-size: 13px; }
  #rcPts { margin-top: 5px; } #rcPts span { padding: 2px 8px; font-size: 12px; }
  #rcSum { margin-top: 5px; font-size: 13px; } #rcSum b { font-size: 16px; }
  body #cardRace .row { margin-top: 6px; } body #cardRace .row .kg-btn { height: 44px; }
}
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats div { padding-left: 1px; padding-right: 1px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; white-space: nowrap; }
  #pad #bH { width: 76px; }
  #rcPts span { padding: 4px 7px; font-size: 12px; }
}
@media (max-height: 600px) and (orientation: portrait) {
  #cardRace .kg-card { padding: 12px 14px 12px; }
  #rkList { margin-top: 6px; } #rkList li { height: 25px; font-size: 13.5px; }
  #rcPts { margin-top: 7px; } #rcSum { margin-top: 7px; } #cardRace .row { margin-top: 9px; }
}
/* 낮은 가로 화면: 이 게임의 대회 결과 카드는 키가 커서(통과 경기·등수·최고 칸 + 난이도 + 단추) 순위 카드 옆으로 비켜 왼쪽에 붙으면
   844×390 에서는 위 줄의 「게임」 단추를 덮고, 568×320 에서는 폭이 줄어 줄이 늘면서 「다시 하기」가 화면 밖으로 나간다
   → 결과 카드를 조여 위 줄 아래에 들어가게 한다. 568×320 처럼 그래도 안 들어가는 높이는 원래(순위 카드 전)처럼 위 줄과 겹치게 두고 단추가 화면 안에 오게 한다 */
@media (orientation: landscape) and (max-height: 430px) {
  #cardOver.kg-rbwrap { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  #cardOver.kg-rbwrap > .kg-rbox { margin-top: auto !important; max-height: 100%; }
  #cardOver.kg-rbwrap .kg-card { padding-top: 12px; padding-bottom: 12px; }
  #cardOver.kg-rbwrap .badge { margin-bottom: 2px; padding: 3px 10px; }
  #cardOver.kg-rbwrap .kg-card .big { font-size: 28px; margin: 0; }
  #cardOver.kg-rbwrap .kg-card .stats { margin-top: 6px; }
  #cardOver.kg-rbwrap .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; white-space: nowrap; }
  #cardOver.kg-rbwrap .kg-card .kg-diff { margin-top: 6px; }
  #cardOver.kg-rbwrap .kg-card .row { margin-top: 8px; }
  #cardOver.kg-rbwrap .kg-card .row .kg-btn { height: 42px; }
}
@media (orientation: landscape) and (max-height: 350px) {
  #cardOver.kg-rbwrap { padding-top: calc(var(--sat) + 6px); }
  #cardOver.kg-rbwrap > .kg-rbox { margin-top: 50px !important; max-height: calc(100% - 50px); }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dog"></div>
  <canvas id="fx"></canvas>
</div>

<div id="hud" hidden>
  <div id="hudL">
    <div class="hp"><span class="num" id="hRank">1등</span><span class="sep"></span><span id="hLeft">100m 남음</span></div>
    <div class="hp" id="hDiff"></div>
  </div>
  <div class="hp"><span class="num" id="hScore">0</span><span class="unit">점</span></div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<div id="pad" hidden>
  <button type="button" class="foot" id="bL" aria-label="왼발"><i aria-hidden="true">🐾</i><span>왼발</span></button>
  <button type="button" id="bH" aria-label="폴짝 뛰기"><i aria-hidden="true">⤴</i><span>폴짝</span></button>
  <button type="button" class="foot" id="bR" aria-label="오른발"><i aria-hidden="true">🐾</i><span>오른발</span></button>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이는 달리기왕</h2>
    <p id="stSub"></p>
    <div class="tip"><span><b>왼발 · 오른발</b>을 번갈아 눌러 달리고, 허들은 <b>폴짝!</b></span><button type="button" id="btnRules">규칙 보기</button></div>
    <div class="key" id="stKey"></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="paTitle">
    <h2 id="paTitle">잠깐 쉬는 중이에요</h2>
    <p id="paSub"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardRace" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="rcTitle">
    <h2 id="rcTitle"></h2>
    <p id="rcSub"></p>
    <ol id="rkList"></ol>
    <div id="rcPts"></div>
    <div id="rcSum"></div>
    <div class="row"><button class="kg-btn pri" id="btnNext">다음 경기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardOver" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="ovTitle">
    <div class="badge" id="ovBadge" hidden>새 기록이에요!</div>
    <h2 id="ovTitle">잘 달렸어요!</h2>
    <p id="ovSub"></p>
    <div class="big"><span id="ovScore">0</span><small>점</small></div>
    <div class="stats">
      <div><b id="ovRaces">0경기</b><small>통과한 경기</small></div>
      <div><b id="ovTop">-</b><small>가장 좋은 등수</small></div>
      <div><b id="ovBest">0점</b><small id="ovBestL">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  // ── 난이도 (수치는 여기 한 곳에)
  //   o0 첫 경기 상대 기준 빠르기(m/초) · od 경기마다 빨라지는 만큼 · jit 상대의 들쭉날쭉함(작을수록 한결같이 빠름) · trip 상대가 허들·웅덩이에 걸릴 확률
  //   h0·hd·hmax 허들 수(처음 · 경기마다 · 가장 많을 때) · p0·pd·pmax 물웅덩이 수 · same 같은 발을 연달아 눌렀을 때 남는 빠르기 · fs 부정 출발 벌칙(초)
  //   fall 허들에 걸려 넘어져 있는 시간(초) · hh 허들 높이(뛴 높이 0~1 중 이만큼은 떠 있어야 넘는다) · hopT 한 번 뛰어 떠 있는 시간 · mul 점수 배율
  const DIFF = {
    easy:   { o0: 5.2, od: 0.20, jit: 0.10, trip: 0.24, h0: 2, hd: 0.5, hmax: 6,  p0: 0, pd: 0.34, pmax: 2, same: 0.96, fs: 0.3, fall: 0.6,  hh: 0.20, hopT: 0.56, mul: 0.8 },
    normal: { o0: 6.4, od: 0.27, jit: 0.07, trip: 0.15, h0: 3, hd: 0.7, hmax: 8,  p0: 1, pd: 0.40, pmax: 3, same: 0.86, fs: 0.5, fall: 0.8,  hh: 0.30, hopT: 0.50, mul: 1 },
    hard:   { o0: 7.3, od: 0.30, jit: 0.05, trip: 0.09, h0: 4, hd: 0.8, hmax: 9,  p0: 1, pd: 0.50, pmax: 4, same: 0.78, fs: 0.7, fall: 0.95, hh: 0.36, hopT: 0.48, mul: 1.25 },
    vhard:  { o0: 8.1, od: 0.32, jit: 0.03, trip: 0.05, h0: 5, hd: 0.9, hmax: 10, p0: 2, pd: 0.50, pmax: 4, same: 0.70, fs: 0.9, fall: 1.1,  hh: 0.42, hopT: 0.46, mul: 1.5 }
  };
  let D = DIFF[KG.diff()] || DIFF.normal, runKey = KG.dkey('race'), runDiff = KG.diff();   // 판을 시작할 때 한 번 정해 그 판 동안 그대로

  // ── 달리기: 번갈아 누르는 박자(1초에 c 번)가 빠를수록 빠르지만 점점 덜 는다. 박자가 고르면(even 1) 10% 더
  //   빠르기 = VTOP · c/(c+C0) · (0.9 + 0.1·even)   → 1초 3번 ≈ 5.9, 5번 ≈ 7.7, 7번 ≈ 8.8, 9번 ≈ 9.6 m/초
  const VTOP = 14, C0 = 4, HALF = 0.2, PUD = 0.5, LINE = 0.6;
  const ZMUL = { down: 1.2, wind: 0.82 };
  const RANK_PTS = [1000, 700, 500, 200, 100];
  const LENS = [90, 100, 110, 120], LEN_MAX = 125;
  // 대회: 동네 → 공원 → 시 → 전국 → 왕중왕전(끝없이)
  const TIERS = [
    { name: '동네 대회', sky: ['#9FD3F7', '#E8F6FF'], track: '#EBD3B0', track2: '#F2DFC2', grass: '#9BD27F', back: 'town', stand: '#fff' },
    { name: '공원 대회', sky: ['#8ECDF0', '#E3F6E6'], track: '#BFE0A6', track2: '#CBE8B5', grass: '#86C56A', back: 'park', stand: '#fff' },
    { name: '시 대회', sky: ['#B9A9EA', '#FFD9C4'], track: '#F2AE9B', track2: '#F6BEAE', grass: '#8FCB8B', back: 'stand', stand: '#F3EEF9' },
    { name: '전국 대회', sky: ['#5F6CC3', '#F5BBCB'], track: '#EC9A9A', track2: '#F1ACAC', grass: '#79BE8C', back: 'stand', stand: '#E9E6F8', lights: true },
    { name: '왕중왕전', sky: ['#141A4A', '#3B4391'], track: '#8C92D6', track2: '#9BA1DF', grass: '#4E8F86', back: 'stand', stand: '#C9CCF0', lights: true, night: true }
  ];
  const tier = r => TIERS[Math.min(4, r)];
  const raceName = r => r < 4 ? TIERS[r].name : '왕중왕전 ' + (r - 3) + '회';
  // 상대 강아지 넷 (색·귀·몸집이 서로 다르다. 콩이는 살구빛 푸들이라 살구·주황은 쓰지 않는다)
  const DOGS = [
    { name: '보리', col: '#F4E2B6', dark: '#DEC48C', belly: '#FFFDF6', collar: '#5B8DEF', bl: 0.62, bh: 0.27, leg: 0.12, hr: 0.165, ear: 'point', tail: 'nub', dot: '#F1D99A' },
    { name: '초코', col: '#70503F', dark: '#573A2C', belly: '#8A6753', collar: '#FFD25E', bl: 0.8,  bh: 0.21, leg: 0.1,  hr: 0.15,  ear: 'long',  tail: 'thin', dot: '#70503F' },
    { name: '구름', col: '#FFFFFF', dark: '#DCE3EE', belly: '#FFFFFF', collar: '#FF8FB1', bl: 0.5,  bh: 0.3,  leg: 0.15, hr: 0.2,   ear: 'fluff', tail: 'pom',  dot: '#FFFFFF' },

    ['🏅', '3등 안에 들면 다음 대회, 실수 없으면 더 큰 점수']
  ] };
  // 안내를 닫은 키(Enter·스페이스)를 아직 누르고 있는 동안에는 그 키가 방금 초점을 받은 「시작」 단추를 누르지 못하게 한다
  let closeKey = false;
  addEventListener('keydown', e => { if (!closeKey) return; if (e.repeat) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); } } else closeKey = false; }, true);
  addEventListener('keyup', e => { if (!closeKey) return; closeKey = false; if (e.code === 'Enter' || e.code === 'Space') e.preventDefault(); }, true);
  addEventListener('pointerdown', () => { closeKey = false; }, true);
  function showRules(force) { return KG.rules(RULES, force).then(shown => { if (S.mode !== 'ready') return; if (shown) closeKey = true; try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} }); }
  $('btnRules').addEventListener('click', () => { sfx('tap'); showRules(true); });
  showRules(false);

  // ── 시험용
  window.GAME = {
    S, K, O, DIFF, get state() { return S.mode; }, get score() { return S.total; }, get rank() { return S.rank; }, get race() { return S.race; }, get last() { return S.last; },
    get ranks() { return [{ name, x: K.x, fin: K.fin, me: true }].concat(O.map(o => ({ name: o.d.name, x: o.x, fin: o.fin }))).sort((a, b) => (a.fin >= 0 ? a.fin - 1e6 : -a.x) - (b.fin >= 0 ? b.fin - 1e6 : -b.x)).map((r, i) => Object.assign(r, { rank: i + 1 })); },
    get metrics() { return { W, H, SZ, PPM, KX, laneH, trackTop, trackBot, land, mini, pod, diff: runDiff }; },
    start, end() { quit(); }, pause, resume, next, step, tapL() { tap('L'); }, tapR() { tap('R'); }, hop,
    // 화면 없이 한 판(대회 전체)을 돌린다: n 1초에 번갈아 누르는 횟수 · p 허들·웅덩이를 넘는 확률 · jit 박자 흔들림 · react 출발 반응(초) · max 여기까지만
    sim(o) {
      o = o || {}; const keep = { sim: S.sim, bot: S.bot };
      S.sim = true; S.bot = { n: o.n || 5, p: o.p == null ? 1 : o.p, jit: o.jit == null ? 0.08 : o.jit, react: o.react == null ? 0.22 : o.react, side: 'L', next: 0 };
      if (o.diff && DIFF[o.diff]) { D = DIFF[o.diff]; Object.assign(S, { race: 0, total: 0, last: null, hist: [], topRank: 9 }); beginRace(); } else start();
      let g = 0, time = 0; const max = o.max || 60;
      while (S.mode !== 'over' && g++ < 4e6) { step(1 / 60); if (S.mode === 'podium') { time += S.last.dnf ? 30 : S.last.time; if (S.last.rank > 3 || S.hist.length >= max) S.mode = 'over'; else next(); } }
      const out = { score: S.total, races: S.hist.length, passed: S.hist.filter(h => h.rank <= 3).length, ranks: S.hist.map(h => h.rank), times: S.hist.map(h => h.time), avgTime: +(time / Math.max(1, S.hist.length)).toFixed(1) };
      S.sim = keep.sim; S.bot = keep.bot; S.mode = 'ready'; Object.assign(S, { race: 0, total: 0, last: null, hist: [] }); D = DIFF[KG.diff()] || DIFF.normal; buildCourse(0); resetDogs();
      return out;
    }
  };
  buildCourse(0); resetDogs();
})();
</script>
