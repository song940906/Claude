<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 공 던지기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 공 던지기: 저녁 하늘·잔디(bg) → 콩이(stage) → 공·바구니·장애물(fx) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; cursor: default; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div, #wind { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .bl i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4FFB0, #CDEB5A 70%); box-shadow: inset 0 0 0 1px rgba(120,150,30,.45); flex: none; }
#hud .bl.pop i { animation: blPop .45s; }
@keyframes blPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
#hud .bl small, #hud .sc small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .wv { color: #D5DBFF; font-weight: 500; }
#hud .sc { margin-left: auto; }
#wind { position: fixed; z-index: 10; pointer-events: none; height: 28px; border-radius: 14px; padding: 0 10px; font-size: 13px; font-weight: 500; color: #D5DBFF; }
#wind svg { width: 22px; height: 14px; display: block; }
#wind b { font-weight: 600; color: #fff; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } }
/* 낮은 세로 화면(320×568 쯤): 카드가 위 줄 단추에 닿지 않게 조금 촘촘하게 */
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .how p + p { margin-top: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면(높이 360px 이하): 결과 카드가 300px 안팎으로 좁아져 기록 칸이 두 줄이 되고 「다시 하기」가 카드 밖으로 잘린다 — 공통 배치로는 안 되는 이 게임 결과 카드의 높이만 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card #edText { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>

<div id="hud" aria-hidden="true">
  <div class="bl" id="hudBl"><i></i><span id="hudBalls">10</span><small>개</small></div>
  <div class="wv" id="hudStage">1단계</div>
  <div class="sc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div id="wind" aria-hidden="true" hidden><span>바람</span><svg viewBox="0 0 22 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h17M13.5 2.5L19 7l-5.5 4.5"/></svg><b id="windN">1</b></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 공 던지기</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>공을 뒤로 당겼다 놓으면</b> 반대쪽으로 날아가요.</p>
      <p id="stKeys" hidden><b>← →</b> 각도 · <b>↑ ↓</b> 힘 · <b>스페이스</b> 던지기</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">공을 다 던졌어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>도착한 단계<b id="edStage"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'throw', TITLE = J(name, '의') + ' 공 던지기';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 놀이판: 가로 360 단위로 고정 (땅이 y=0, 하늘이 -y). 세로·가로 화면 모두 같은 놀이판이라 풀이도 같다 ═══════
  const WW = 360, HT = 1 / 120, G = 520, VMAX = 500, BR = 8, BH = 34;   // 놀이판 폭 · 물리 한 걸음(초) · 중력 · 가장 센 던지기 · 공 반지름 · 바구니 깊이
  const OX = 84, OY = -12, HOME = 34, KS = 92, MO = 27, RUN = 430;       // 공 자리 · 콩이 자리 · 콩이 그림 한 변 · 발밑에서 입까지 · 달리는 빠르기
  const AMIN = 8, AMAX = 86, PMIN = 0.2;
  let W = 0, H = 0, DPR = 1, S = 1, FX = 0, GYP = 600, TOPY = 60, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 }, XMAX = WW + 60, XMIN = -30;
  const bg = $('bg'), fx = $('fx'), ctx = fx.getContext('2d'), stage = $('stage');
  const FONT = getComputedStyle(document.body).fontFamily;

  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '공을 바구니에 넣으면 ' + J(name, '이/가') + ' 물어 와요.';
  $('stKeys').hidden = !KEYS_OK;

  const K = kong(stage, KS);

  // ═══════ 난이도 표 ═══════
  //   balls 한 판의 공 · bonus 이만큼 연달아 넣으면 공 +1 · bw 바구니 입구 폭(공 지름은 16) · ramp 이 단계쯤에서 가장 어려워진다
  //   dots 예상 길 점선 길이(초) · trail 지난번에 던진 길을 흐리게 남겨 준다
  //   wind 바람 세기(가장 셀 때의 가로 가속) · windFrom 바람이 불기 시작하는 단계
  //   obsFrom 장애물이 나오는 단계 · obsP 나올 확률 · obsH 장애물 높이 곱 · obs2 장애물이 둘씩 나오기 시작하는 진행도(0~1, 9 는 없음)
  //   moveFrom 바구니가 움직이기 시작하는 단계 · moveP 움직일 확률 · move 움직이는 빠르기(rad/초)
  //   cells 단계를 만들 때 풀이 칸이 이만큼은 있어야 한다(각도 1.5° × 힘 1.25% 가 한 칸)
  const DIFF = {
    easy:   { balls: 14, bonus: 2, bw: 68, ramp: 18, dots: 1.20, trail: true,  wind: 26,  windFrom: 8, obsFrom: 6, obsP: 0.45, obsH: 0.70, obs2: 9,    moveFrom: 10, moveP: 0.35, move: 0.7, cells: 14 },
    normal: { balls: 10, bonus: 3, bw: 54, ramp: 12, dots: 0.62, trail: true,  wind: 58,  windFrom: 4, obsFrom: 4, obsP: 0.60, obsH: 1.00, obs2: 9,    moveFrom: 6,  moveP: 0.45, move: 1.1, cells: 8 },
    hard:   { balls: 10, bonus: 4, bw: 46, ramp: 9,  dots: 0.34, trail: false, wind: 88,  windFrom: 3, obsFrom: 3, obsP: 0.75, obsH: 1.15, obs2: 0.55, moveFrom: 4,  moveP: 0.55, move: 1.5, cells: 5 },
    vhard:  { balls: 8,  bonus: 5, bw: 40, ramp: 7,  dots: 0.16, trail: false, wind: 118, windFrom: 2, obsFrom: 2, obsP: 0.90, obsH: 1.30, obs2: 0.30, moveFrom: 3,  moveP: 0.65, move: 2.0, cells: 4 }
  };
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // ═══════ 물리: 한 걸음(1/120초)씩. 놀이와 풀이 찾기가 같은 함수를 쓴다 ═══════
  const bkX = (lv, t) => lv.mv && lv.mv.axis === 'x' ? lv.bx + Math.sin(t * lv.mv.w + lv.mv.ph) * lv.mv.amp : lv.bx;
  const bkY = (lv, t) => lv.mv && lv.mv.axis === 'y' ? lv.by + Math.sin(t * lv.mv.w + lv.mv.ph) * lv.mv.amp : lv.by;
  function launch(angDeg, pw) {
    const a = angDeg * Math.PI / 180, v = pw * VMAX;
    return { x: OX, y: OY, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, g: 0, hit: 0, off: 0, prel: -1, pop: 0, t: 0, still: 0 };
  }
  // 공이 (cx, cy) 에 닿았으면 밀어내고 튕긴다
  function bump(b, cx, cy, e) {
    let dx = b.x - cx, dy = b.y - cy; const d2 = dx * dx + dy * dy;
    if (d2 >= BR * BR) return;
    let d = Math.sqrt(d2); if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
    const nx = dx / d, ny = dy / d; b.x = cx + nx * BR; b.y = cy + ny * BR;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      const vt = -b.vx * ny + b.vy * nx; b.vx += 0.12 * vt * ny; b.vy -= 0.12 * vt * nx;
      if (-vn > b.hit) b.hit = -vn;
    }
  }
  function bumpSeg(b, ax, ay, qx, qy, e) {
    const ex = qx - ax, ey = qy - ay, l2 = ex * ex + ey * ey, u = l2 > 0 ? clamp(((b.x - ax) * ex + (b.y - ay) * ey) / l2, 0, 1) : 0;
    bump(b, ax + ex * u, ay + ey * u, e);
  }
  // 한 걸음: 0 날아가는 중 · 1 바구니에 들어감(b.off = 가운데에서 벗어난 정도 0~1) · 3 멈춤.  b.g = 땅에 닿은 적 있음, b.hit = 이번에 부딪친 세기
  function tickBall(b, lv, t) {
    b.t += HT;
    if (b.y < -BR - 0.5) b.vx += lv.wind * HT;
    b.vy += G * HT; b.x += b.vx * HT; b.y += b.vy * HT;
    if (!b.pop) {
      for (const c of lv.cols) {
        if (c.r) { const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy) || 1; if (d < c.r + BR) bump(b, c.x + dx / d * Math.min(d, c.r), c.y + dy / d * Math.min(d, c.r), 0.45); }
        else bump(b, clamp(b.x, c.x0, c.x1), clamp(b.y, c.y0, c.y1), 0.4);
      }
      const bx = bkX(lv, t), by = bkY(lv, t), half = lv.bw / 2, hb = half * 0.74;
      bumpSeg(b, bx - half, by, bx - hb, by + BH, 0.35); bumpSeg(b, bx + half, by, bx + hb, by + BH, 0.35); bumpSeg(b, bx - hb, by + BH, bx + hb, by + BH, 0.35);
      if (by + BH < -6) bumpSeg(b, bx, by + BH, bx, 0, 0.35);
      const rel = b.y - by, was = b.prel; b.prel = rel;
      if (was < 0 && rel >= 0 && Math.abs(b.x - bx) < half) { b.off = Math.abs(b.x - bx) / half; return 1; }
    }
    // 장애물·바구니 위에 얹혀 멈춘 공: 잠깐 뒤 툭 떨어뜨린다 (그대로 두면 시간이 다 될 때까지 아무것도 못 한다)
    if (!b.pop && b.y < -BR - 1) { if (b.vx * b.vx + b.vy * b.vy < 900) { b.still += HT; if (b.still > 0.4) { b.pop = 1; b.vx = -24; } } else b.still = 0; }
    if (b.y >= -BR) {
      b.y = -BR; b.g = 1;
      if (b.vy > 0) { if (b.vy > b.hit) b.hit = b.vy; b.vy = b.vy > 70 && !b.pop ? -b.vy * 0.42 : 0; b.vx *= b.pop ? 0.3 : 0.72; }
      if (b.vy === 0) { b.vx *= 1 - 3 * HT; if (Math.abs(b.vx) < 10) { b.vx = 0; return 3; } }
    }
    if (b.x > XMAX || b.x < XMIN) { b.x = clamp(b.x, XMIN, XMAX); b.y = -BR; b.vx = b.vy = 0; b.g = 1; return 3; }
    if (b.t > 7) { b.vx = b.vy = 0; b.g = 1; return 3; }
    return 0;
  }
  // 풀이 찾기용: 던져서 들어가면 벗어난 정도(0~1), 아니면 -1. 땅에 닿으면 그만 본다(땅에서 튀어 들어가는 요행은 세지 않는다)
  function simulate(lv, t0, ang, pw) {
    const b = launch(ang, pw); let t = t0;
    for (let i = 0; i < 840; i++) { t += HT; const r = tickBall(b, lv, t); if (r === 1) return b.off; if (r || b.g || b.x > WW + 40) return -1; }
    return -1;
  }
  // 지금(t0) 던지면 들어가는 각도·힘을 찾는다. { angle(도), power(0~1), cells(들어가는 칸 수), off } 또는 null
  const SA0 = 14, SAS = 1.5, SAN = 48, SP0 = 0.3, SPS = 0.0125, SPN = 57;
  const grid = new Float32Array(SAN * SPN);
  function solve(lv, t0) {
    let cells = 0;
    for (let i = 0; i < SAN; i++) for (let j = 0; j < SPN; j++) { const o = simulate(lv, t0, SA0 + i * SAS, SP0 + j * SPS); grid[i * SPN + j] = o; if (o >= 0) cells++; }
    if (!cells) return null;
    let bi = 0, bj = 0, bs = -1;
    for (let i = 0; i < SAN; i++) for (let j = 0; j < SPN; j++) {
      const o = grid[i * SPN + j]; if (o < 0) continue;
      let n = 0;   // 둘레 칸도 들어가는 곳일수록 좋다(조금 어긋나도 들어가는 풀이)
      for (let a = -2; a <= 2; a++) for (let p = -3; p <= 3; p++) { const ii = i + a, jj = j + p; if (ii >= 0 && ii < SAN && jj >= 0 && jj < SPN && grid[ii * SPN + jj] >= 0) n++; }
      const sc = n + (1 - o) * 0.9; if (sc > bs) { bs = sc; bi = i; bj = j; }
    }
    return { angle: SA0 + bi * SAS, power: +(SP0 + bj * SPS).toFixed(4), cells, off: +grid[bi * SPN + bj].toFixed(3) };
  }

  // ═══════ 단계 만들기: 풀이가 있는 것만 내보낸다 ═══════
  function buildCols(lv) {
    lv.cols = [];
    for (const o of lv.obs) {
      if (o.k === 'fence') lv.cols.push({ x0: o.x - o.w / 2, x1: o.x + o.w / 2, y0: -o.h, y1: 20 });
      else if (o.k === 'tree') { lv.cols.push({ x0: o.x - 4, x1: o.x + 4, y0: -o.h, y1: 20 }); lv.cols.push({ x: o.x, y: -o.h - o.r * 0.7, r: o.r }); }
      else lv.cols.push({ x: o.x, y: -o.h, r: o.r });

  const RULES = { key: KEY, title: TITLE, lead: '공을 던지면 ' + J(name, '이/가') + ' 신나게 물어 와요.', items: [
    ['👆', '화면을 누른 채 뒤로 당겼다 놓으면 공이 날아가요. 길게 당길수록 세요' + (KEYS_OK ? ' (방향키·스페이스도 돼요).' : '.')],
    ['🧺', '바구니에 넣으면 다음 단계로 가요. 한가운데에, 한 번에 넣으면 점수가 커요.'],
    ['🍃', '단계가 오르면 바람이 불고, 장애물이 길을 막고, 바구니가 움직여요.'],
    ['🎾', '공을 다 쓰면 끝나요. 연달아 넣으면 공을 하나 더 받아요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  (async () => { await KG.rules(RULES); focusStart(); })();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get stage() { return stageN; }, get balls() { return balls; },
    get made() { return made; }, get thrown() { return thrown; }, get diff() { return diffId; }, get D() { return D; }, get level() { return lv; }, get ball() { return ball; }, get ballSt() { return ballSt; }, get aim() { return aim; }, get time() { return lt; }, get preview() { calcPreview(); return preview.slice(); },
    field: () => ({ W, H, S, FX, GYP, TOPY, wide, XMAX, XMIN, kx, basket: { x: bkX(lv, lt), y: bkY(lv, lt) } }),
    start, end, pause, resume, skip, over: showResult,
    // 화면 없이 빨리 돌리기 (dt 초)
    step: dt => { tAnim += dt; update(dt); },
    // 풀이: 지금 바로 던지면 들어가는 각도(도)·힘(0~1). 움직이는 바구니는 때를 놓치면 null 일 수 있다(조금 뒤 다시)
    solve: () => solve(lv, lt),
    simulate: (ang, pw) => simulate(lv, lt, ang, pw),
    // 봇 입력: 겨누기만(aimAt) · 던지기(throwAt)
    aimAt: (ang, pw) => { aim.ang = clamp(ang, AMIN, AMAX); aim.pw = clamp(pw, 0, 1); aim.show = true; aim.kb = true; },
    throwAt: (ang, pw) => throwBall(ang, pw),
    // 단계 만들기 시험: n 단계를 난이도 id 로 지어 돌려준다(sol 에 풀이)
    gen: (n, id) => makeLevel(n, DIFF[id || diffId] || D),
    setStage: n => { stageN = bestStage = n; missHere = 0; lv = makeLevel(n, D); lt = 0; lvT = 1; lastTrail = []; phase = 'aim'; ballSt = 'tee'; paintHud(); return lv; },
    setLevel: o => { lv = buildCols(Object.assign(plainLevel(stageN, D), o)); lt = 0; lvT = 1; paintHud(); return lv; }
  };
})();
</script>
