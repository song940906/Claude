<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 간식바구니</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 간식바구니: 하늘에서 떨어지는 간식 받아먹기 — 배경 캔버스 · 콩이(SVG) · 간식/바구니/효과 캔버스를 차례로 겹친다 */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: pointer; background: #BFE3FF; }
#bg, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#dog { position: absolute; inset: 0; pointer-events: none; }
#fx { pointer-events: none; }
/* 점수판: 위 줄 바로 아래 */
#hud { position: fixed; z-index: 10; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); top: calc(var(--sat) + 62px); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.hp { height: 34px; border-radius: 17px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; background: rgba(18,22,52,.46); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.2px; white-space: nowrap; }
.hp svg { width: 17px; height: 17px; display: block; transition: transform .25s, opacity .25s; }
.hp svg.off { opacity: .32; transform: scale(.82); }
.hp svg.off path { fill: #fff; }
.hp .num { font-size: 16px; font-weight: 700; min-width: 1ch; text-align: right; }
.hp .unit { font-size: 12px; font-weight: 500; opacity: .8; margin-left: -3px; }
#hudL { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
#hudR { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#hDiff { height: 22px; border-radius: 11px; padding: 0 9px; font-size: 11px; letter-spacing: 0; opacity: .92; }
#combo { height: 28px; padding: 0 11px; font-size: 13px; background: rgba(255,200,97,.94); color: #4A3200; border-color: rgba(255,255,255,.5); }
#combo b { font-size: 14px; font-weight: 800; }
#note { position: fixed; z-index: 10; left: 50%; top: calc(var(--sat) + 146px); transform: translate(-50%, -6px); max-width: calc(100vw - 32px); box-sizing: border-box; padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.94); color: #191F28; font-size: 14px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#note.show { opacity: 1; transform: translate(-50%, 0); }
/* 카드 안 */
.kg-card .tip { margin: 12px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 14px; font-size: 14px; line-height: 1.55; color: #3A4552; text-align: left; }
.kg-card .tip b { color: var(--pri); font-weight: 700; }
.kg-card .key { margin-top: 8px; font-size: 12.5px; color: #8A94A0; }
.kg-card .stats { display: flex; gap: 8px; margin-top: 12px; }
.kg-card .stats div { flex: 1; min-width: 0; background: var(--soft); border-radius: 14px; padding: 10px 4px 9px; }
.kg-card .stats b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.kg-card .stats small { display: block; margin-top: 1px; font-size: 12px; color: var(--sub); white-space: nowrap; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.badge { display: inline-block; margin-bottom: 6px; padding: 5px 11px; border-radius: 12px; background: #FFF1D6; color: #B36B00; font-size: 13px; font-weight: 700; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.lnk { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin: 4px auto -8px; padding: 0 16px; border: 0; background: none; color: var(--pri); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(44,53,119,.35); }
/* 세로 화면: 카드를 위로 올려 아래에 앉은 콩이와 바구니가 보이게 */
@media (orientation: portrait) and (min-height: 620px) { body .kg-scrim:not(.kg-rules) { align-items: flex-start; padding-top: calc(var(--sat) + 74px); } }
@media (max-height: 430px) {
  body .kg-scrim:not(.kg-rules) .kg-card { padding: 12px 18px 12px; width: min(100%, 460px); }
  .kg-card h2 { font-size: 18px; margin-bottom: 2px; }
  .kg-card .tip { margin-top: 6px; padding: 7px 12px; font-size: 13px; line-height: 1.45; }
  .kg-card .key { margin-top: 5px; }
  body .kg-card .big { font-size: 30px; margin: 0; }
  body .kg-card .row { margin-top: 8px; }
  body .kg-card .row .kg-btn { height: 44px; }
  .kg-card .stats { margin-top: 6px; }
  .kg-card .stats div { padding: 6px 4px 5px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  .kg-card .kg-diff button { height: 34px; }
  .lnk { margin: 0 auto -6px; }
  .badge { margin-bottom: 2px; padding: 3px 10px; }
  #cardOver .kg-card > p { display: none; }
}
@media (max-width: 340px) {
  .kg-card .kg-diff button { font-size: 12px; letter-spacing: -.5px; }
  .kg-card .stats { gap: 6px; }
  .kg-card .stats div { padding-left: 1px; padding-right: 1px; }
  .kg-card .stats small { font-size: 11px; letter-spacing: -.5px; }
  .hp { padding: 0 10px; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dog"></div>
  <canvas id="fx"></canvas>
</div>

<div id="hud" hidden>
  <div id="hudL">
    <div class="hp" id="hearts" role="img" aria-label="하트 3개"></div>
    <div class="hp" id="hDiff"></div>
  </div>
  <div id="hudR">
    <div class="hp"><span class="num" id="hScore">0</span><span class="unit">점</span></div>
    <div class="hp" id="combo" hidden><span>콤보</span><b id="cNum">0</b><span id="cMul"></span></div>
  </div>
</div>
<div id="note" role="status" aria-live="polite"></div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card" role="dialog" aria-labelledby="stTitle">
    <h2 id="stTitle">콩이의 간식바구니</h2>
    <p id="stSub"></p>
    <div class="tip" id="stTip"></div>
    <div class="key" id="stKey"></div>
    <button type="button" class="lnk" id="btnRules">규칙 보기</button>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="paTitle">
    <h2 id="paTitle">잠깐 쉬는 중이에요</h2>
    <p id="paSub"></p>
    <div class="row"><button class="kg-btn" id="btnQuit">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardOver" hidden>
  <div class="kg-card" role="dialog" aria-labelledby="ovTitle">
    <div class="badge" id="ovBadge" hidden>새 기록이에요!</div>
    <h2 id="ovTitle">배부르게 먹었어요!</h2>
    <p id="ovSub"></p>
    <div class="big"><span id="ovScore">0</span><small>점</small></div>
    <div class="stats">
      <div><b id="ovTreat">0개</b><small>받은 간식</small></div>
      <div><b id="ovCombo">0</b><small>최고 콤보</small></div>
      <div><b id="ovBest">0점</b><small id="ovBestL">최고 기록</small></div>
    </div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const KEY = 'basket';

  // ── 난이도 (수치는 여기 한 곳)
  //   fall [처음, 나중] 간식이 입까지 떨어지는 데 걸리는 시간(초) · gap [처음, 나중] 다음 것이 나오기까지(초) · bad [처음, 나중] 먹으면 안 되는 것 비율
  //   tau 「나중」 값에 가까워지는 빠르기(초, 클수록 천천히) · drift 그 뒤로도 초마다 조금씩 더 빨라지는 정도
  //   aim 먹으면 안 되는 것이 콩이 머리 위를 겨냥해 떨어질 확률 · pair 간식 바로 옆에 먹으면 안 되는 것이 함께 떨어질 확률
  //   jump 이어지는 간식 사이 가장 먼 거리(콩이 몸 너비 배수) · hgap 하트 간식이 다시 나오기까지(초) · hgrow tau 뒤로 그 틈이 초마다 늘어나는 정도(Easy 만 — 없으면 오래 버틸수록 하트가 잃는 것보다 빨리 차서 판이 끝나지 않는다) · gold 황금 간식 확률 · mul 점수 배율
  const DIFF = {
    easy:   { fall: [3.4, 2.3],  gap: [1.5, 0.9],   bad: [0.10, 0.22], tau: 90, drift: 0.0045, aim: 0.2,  pair: 0,    jump: 1.5, hgap: 22, hgrow: 0.009, gold: 0.06,  mul: 0.8 },
    normal: { fall: [2.7, 1.65], gap: [1.15, 0.62], bad: [0.16, 0.30], tau: 70, drift: 0.0032, aim: 0.35, pair: 0.12, jump: 2.1, hgap: 30, gold: 0.05,  mul: 1 },
    hard:   { fall: [2.2, 1.3],  gap: [0.9, 0.47],  bad: [0.22, 0.36], tau: 55, drift: 0.0030, aim: 0.48, pair: 0.22, jump: 2.7, hgap: 38, gold: 0.045, mul: 1.25 },
    vhard:  { fall: [1.8, 1.05], gap: [0.72, 0.37], bad: [0.28, 0.42], tau: 45, drift: 0.0040, aim: 0.6,  pair: 0.32, jump: 3.3, hgap: 52, gold: 0.04,  mul: 1.5 }
  };
  let D = DIFF[KG.diff()] || DIFF.normal, runDiff = KG.diff(), runKey = KG.dkey(KEY);   // 판을 시작할 때 한 번 정해 그 판 동안 그대로
  const HEARTS = 3, FALL_MIN = 0.6, GAP_MIN = 0.22;   // 하트 수 · 아무리 오래 버텨도 이보다 빨라지지 않는다(떨어지는 시간 · 나오는 틈)
  const MAXV = 10, KEYV = 4.6;          // 손가락을 따라가는 가장 빠른 속도 · 키보드 속도 (콩이 몸 너비/초)
  const RG = 0.33, RB = 0.2;            // 받아먹는 너비(너그럽게) · 먹으면 안 되는 것에 닿는 너비(좁게) — 콩이 몸 너비 배수
  const INV = 1.5;                      // 잘못 먹은 뒤 잠깐 봐주는 시간

  // 떨어지는 것들
  const GOOD = [['🦴', '뼈다귀'], ['🍠', '고구마'], ['🍗', '닭고기'], ['🥕', '당근'], ['🍎', '사과']];
  const BAD = [['🍫', '초콜릿'], ['🧅', '양파'], ['🍇', '포도']];
  const EMO = GOOD.map(g => g[0]).concat(BAD.map(b => b[0]), ['🦴', '💗']);   // 그림 번호: 간식 0~4 · 안 되는 것 5~7 · 황금 8 · 하트 9
  const E_GOLD = 8, E_HEART = 9;

  // ── 화면
  const stage = $('stage'), bg = $('bg'), fx = $('fx');
  const c = bg.getContext('2d', { alpha: false }), f = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1, SZ = 108, GY = 500, FONT = 'sans-serif';
  let laneL = 0, laneR = 360, KMIN = 30, KMAX = 330, MOX = 0, MOY = -60, HDY = -70;   // 놀이 줄 · 콩이가 갈 수 있는 범위 · 발밑에서 입·머리까지
  let BX = 300, BY = 700, BW = 90, slots = [], side = false, sky = null, sprites = [], raws = [];
  const TITLE = J(name, '의') + ' 간식바구니';
  const bar = topbar({ title: TITLE, back: 'index.html' });
  document.title = TITLE;
  const btnPause = document.createElement('button'); btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  bar.right(btnPause);
  const k = kong($('dog'), 108); k.setPose('sit');

  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;
  $('stTitle').textContent = TITLE;
  $('stSub').textContent = '하늘에서 간식이 떨어져요!';
  $('stTip').innerHTML = '화면을 <b>좌우로 끌어</b> ' + J(name, '을/를') + ' 움직여요. 간식은 <b>입으로 쏙</b> 받고, 빨간 표시가 붙은 <b>초콜릿·양파·포도</b>는 피해요.';
  const HEART = '<svg viewBox="0 0 24 24"><path fill="#FF6B81" d="M12 20.6c-.3 0-.6-.1-.8-.3C6.3 16 3 13.100 3 9.300 3 6.600 5.100 4.500 7.700 4.500c1.700 0 3.300.9 4.300 2.300 1-1.400 2.600-2.300 4.300-2.300C18.900 4.500 21 6.600 21 9.300c0 3.800-3.300 6.700-8.200 11-.2.200-.5.300-.8.300z"/></svg>';
  $('hearts').innerHTML = HEART + HEART + HEART;

  // ── 상태
  const S = {
    mode: 'ready', t: 0, pt: 0, kx: 180, target: 180, vx: 0, keyDir: 0,
    hearts: HEARTS, score: 0, combo: 0, maxCombo: 0, caught: 0, ate: 0, missed: 0,
    items: [], fly: [], pile: [], parts: [],
    spawnT: 0, lastX: 180, nextHeart: 0, badSeen: false, goldSeen: false,
    inv: 0, munch: 0, hurt: 0, cheer: 0, shake: 0, freeze: 0, endT: 0, say: 0, sayText: '',
    bot: false, simulating: false
  };
  // 시험용 자동 놀이(사람 흉내): react 보고 움직이기까지(초) · speed 움직이는 빠르기 · miss 먹으면 안 되는 것을 못 알아볼 확률 · noise 자리 어긋남
  const BOT = { react: 0.3, speed: 4.2, miss: 0.12, noise: 0.14 };

  const mouthY = () => GY + MOY;
  const prog = t => 1 - Math.exp(-t / D.tau);
  const drift = t => 1 + Math.max(0, t - D.tau) * D.drift;
  const fallT = t => Math.max(FALL_MIN, lerp(D.fall[0], D.fall[1], prog(t)) / drift(t));
  const gapT = t => Math.max(GAP_MIN, lerp(D.gap[0], D.gap[1], prog(t)) / drift(t));
  const badP = t => lerp(D.bad[0], D.bad[1], prog(t));
  const mult = n => 1 + Math.min(4, Math.floor(n / 5));

  // ── 배경 · 그림 조각
  const circ = (g, x, y, r) => { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); };
  function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r); g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r); g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r); g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath(); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const EFONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
  // 떨어지는 것 한 장: 동그란 바탕 + 이모지 (+ 먹으면 안 되는 것은 빨간 테두리와 ✕ 표시, 황금은 금빛)
  function mkSprite(i, raw) {
    const px = Math.ceil(SZ * (raw ? 0.3 : 0.44)), cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(px * DPR);
    const g = cv.getContext('2d'); g.scale(DPR, DPR); const m = px / 2, kind = i === E_GOLD ? 'gold' : i === E_HEART ? 'heart' : i >= GOOD.length ? 'bad' : 'good';
    if (!raw) {
      const r = px * 0.44;
      if (kind === 'gold') { const gr = g.createRadialGradient(m, m, r * 0.2, m, m, r); gr.addColorStop(0, '#FFF6C9'); gr.addColorStop(0.7, '#FFD25E'); gr.addColorStop(1, '#F5B93A'); g.fillStyle = gr; }
      else g.fillStyle = kind === 'bad' ? 'rgba(255,238,240,.94)' : kind === 'heart' ? 'rgba(255,228,236,.94)' : 'rgba(255,255,255,.86)';
      g.beginPath(); g.arc(m, m, r, 0, TAU); g.fill();
      g.lineWidth = Math.max(2, px * 0.05); g.strokeStyle = kind === 'bad' ? '#E5484D' : kind === 'gold' ? '#FFFFFF' : kind === 'heart' ? '#FF8FA3' : 'rgba(255,255,255,.95)'; g.stroke();
    }
    g.font = Math.round(px * (raw ? 0.82 : 0.5)) + 'px ' + EFONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (kind === 'gold' && !raw) { g.save(); g.shadowColor = 'rgba(160,100,0,.5)'; g.shadowBlur = 4; g.fillText(EMO[i], m, m + px * 0.03); g.restore(); }
    else g.fillText(EMO[i], m, m + px * 0.03);
    if (kind === 'bad' && !raw) {
      const bx = m + px * 0.3, by = m - px * 0.3, br = px * 0.15;
      g.fillStyle = '#E5484D'; g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = Math.max(1.5, px * 0.035); g.stroke();
      g.lineCap = 'round'; g.lineWidth = Math.max(1.8, px * 0.045); g.beginPath(); g.moveTo(bx - br * 0.42, by - br * 0.42); g.lineTo(bx + br * 0.42, by + br * 0.42); g.moveTo(bx + br * 0.42, by - br * 0.42); g.lineTo(bx - br * 0.42, by + br * 0.42); g.stroke();
    }
    return { cv, px };
  }
  function buildSky() {
    sky = document.createElement('canvas'); sky.width = Math.round(W * DPR); sky.height = Math.round(H * DPR);
    const g = sky.getContext('2d'); g.scale(DPR, DPR); const rnd = mulberry32(31), hz = GY - SZ * 0.5;
    const sg = g.createLinearGradient(0, 0, 0, hz); sg.addColorStop(0, '#9FD2FA'); sg.addColorStop(0.6, '#D4EDFD'); sg.addColorStop(1, '#FFF1E0'); g.fillStyle = sg; g.fillRect(0, 0, W, hz + 2);
    // 해 · 구름
    const sx = W * 0.8, sy = Math.max(hz * 0.3, 110), sr = SZ * 0.9, sun = g.createRadialGradient(sx, sy, 2, sx, sy, sr); sun.addColorStop(0, 'rgba(255,250,220,.95)'); sun.addColorStop(0.3, 'rgba(255,244,200,.5)'); sun.addColorStop(1, 'rgba(255,244,200,0)'); g.fillStyle = sun; g.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    g.fillStyle = 'rgba(255,255,255,.9)';
    const nc = Math.max(3, Math.round(W / 190));

      g.lineTo(BX + BW * 0.4, BY - BW * 0.06); g.quadraticCurveTo(BX + BW * 0.39, BY, BX + BW * 0.33, BY); g.lineTo(BX - BW * 0.33, BY); g.quadraticCurveTo(BX - BW * 0.39, BY, BX - BW * 0.4, BY - BW * 0.06); g.closePath();
      const bg2 = g.createLinearGradient(0, top, 0, BY); bg2.addColorStop(0, '#EBBF83'); bg2.addColorStop(1, '#D9A566'); g.fillStyle = bg2; g.fill();
      g.save(); g.clip(); g.strokeStyle = 'rgba(150,98,48,.32)'; g.lineWidth = Math.max(1, BW * 0.014);
      g.beginPath(); for (let i = 1; i <= 3; i++) { const y = top + BH * i / 4 + BW * 0.05; g.moveTo(BX - BW * 0.5, y - BW * 0.05); g.quadraticCurveTo(BX, y + BW * 0.05, BX + BW * 0.5, y - BW * 0.05); }
      for (let i = -4; i <= 4; i++) { g.moveTo(BX + i * BW * 0.11, top); g.lineTo(BX + i * BW * 0.088, BY); } g.stroke(); g.restore();
      g.strokeStyle = '#F6D7A5'; g.lineWidth = BW * 0.05; g.lineCap = 'round'; g.beginPath(); g.moveTo(BX - BW * 0.49, top + BW * 0.01); g.bezierCurveTo(BX - BW * 0.3, top + BW * 0.115, BX + BW * 0.3, top + BW * 0.115, BX + BW * 0.49, top + BW * 0.01); g.stroke();
      // 받은 수
      const fs = clamp(BW * 0.16, 12, 17), txt = S.caught.toLocaleString() + '개'; g.font = '700 ' + fs + 'px ' + FONT; const tw = g.measureText(txt).width + fs * 1.1, th = fs * 1.55, ty = top + BH * 0.62;
      g.fillStyle = 'rgba(255,255,255,.94)'; rr(g, BX - tw / 2, ty - th / 2, tw, th, th / 2); g.fill(); g.fillStyle = '#7A4E1D'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, BX, ty + 1);

  }
  function bubble(text, x, y, a) {
    f.save(); f.globalAlpha = clamp(a, 0, 1); const fs = clamp(SZ * 0.15, 14, 20); f.font = '700 ' + fs + 'px ' + FONT;
    const tw = f.measureText(text).width, bw = tw + fs * 1.5, bh = fs * 2.1, px = clamp(x, bw / 2 + 8, W - bw / 2 - 8);
    f.fillStyle = 'rgba(0,0,0,.12)'; rr(f, px - bw / 2, y - bh + 3, bw, bh, bh / 2); f.fill();
    f.fillStyle = '#fff'; rr(f, px - bw / 2, y - bh, bw, bh, bh / 2); f.fill();
    f.beginPath(); f.moveTo(x - 7, y - 2); f.lineTo(x, y + 8); f.lineTo(x + 7, y - 2); f.closePath(); f.fill();
    f.fillStyle = '#191F28'; f.textAlign = 'center'; f.textBaseline = 'middle'; f.fillText(text, px, y - bh / 2 + 1); f.restore();
  }
  function draw() {
    if (!sky) return;
    const t = S.t, my = mouthY();
    c.drawImage(sky, 0, 0, W, H);
    // 콩이 그림자
    c.fillStyle = 'rgba(60,60,40,.16)'; c.beginPath(); c.ellipse(S.kx, GY + SZ * 0.01, SZ * 0.3, SZ * 0.05, 0, 0, TAU); c.fill();

    // 콩이: 가장 먼저 닿을 것을 올려다보고, 간식이 가까우면 입을 벌린다
    let near = null, ne = 9;
    if (S.mode === 'play') for (const it of S.items) { if (it.done || it.pass) continue; const e = (my - it.y) / it.vy; if (e > -0.05 && e < ne) { ne = e; near = it; } }
    const lean = clamp(S.vx / (5 * SZ), -1, 1), ending = S.mode === 'ending' || (S.mode === 'over' && !ovNew), sad = S.hurt > 0 || ending;
    const wantOpen = near && near.kind !== 'bad' && ne < 0.55 && Math.abs(near.x - (S.kx + MOX)) < SZ * 0.7;
    const hopA = S.cheer > 0 ? Math.abs(Math.sin(t * 13)) * 26 : S.munch > 0 ? Math.sin((1 - S.munch / 0.45) * Math.PI) * 12 : Math.abs(lean) > 0.25 ? Math.abs(Math.sin(t * 15)) * 9 : 0;
    k.el.style.opacity = S.inv > 0 && S.mode === 'play' ? (reduceMotion ? 0.7 : (Math.floor(t * 11) % 2 ? 0.5 : 0.95)) : 1;
    k.place(S.kx, GY + SZ * 0.03);
    k.render({ t, hop: reduceMotion ? 0 : hopA, tilt: sad ? 0 : lean * 9,
      roll: S.hurt > 0.4 ? Math.sin(t * 24) * (reduceMotion ? 2 : 6) * S.hurt : 0, rollPivot: [200, 380],
      look: near ? [clamp((near.x - S.kx) / (SZ * 1.2), -1, 1), -1] : [0, sad ? 0.6 : -0.2], nod: sad ? 6 : 0,
      eyes: sad ? 'closed' : (S.munch > 0 || S.cheer > 0 || (S.mode === 'over' && ovNew)) ? 'happy' : 'open',
      mouth: sad ? 'closed' : S.munch > 0 ? (Math.sin(t * 34) > 0 ? 'open' : 'closed') : (wantOpen || S.cheer > 0 || (S.mode === 'over' && ovNew)) ? 'open' : 'closed',
      blush: S.cheer > 0 || S.munch > 0, earLift: sad ? -8 : 3 + Math.abs(lean) * 6 + (S.cheer > 0 ? 6 : 0),
      tailAmp: sad ? 2 : 12 + Math.min(S.combo, 20) * 0.8 + (S.cheer > 0 ? 10 : 0), tailRate: sad ? 1 : 3 + Math.min(S.combo, 20) * 0.12 });
    stage.style.transform = S.shake > 0 ? 'translate(' + (Math.sin(t * 70) * 4 * S.shake / 0.26).toFixed(1) + 'px,' + (Math.cos(t * 55) * 3 * S.shake / 0.26).toFixed(1) + 'px)' : '';

    f.clearRect(0, 0, W, H);
    // 바구니 (뒤 → 쌓인 간식 → 앞)
    if (S.bump > 0) S.bump = Math.max(0, S.bump - 0.016);
    drawBasket(f, true);
    const ps = BW * 0.25;
    for (let i = 0; i < S.pile.length; i++) { const p = S.pile[i], sl = slots[i], sp = raws[p.e]; if (p.pop > 0) p.pop = Math.max(0, p.pop - 0.016); const s = ps * (1 + (p.pop > 0 ? Math.sin(p.pop / 0.25 * Math.PI) * 0.3 : 0)); f.save(); f.translate(sl.x, sl.y); f.rotate(sl.rot); f.drawImage(sp.cv, -s / 2, -s / 2, s, s); f.restore(); }

    // 떨어지는 것
    for (const it of S.items) {
      const sp = sprites[it.e], s = sp.px * (it.kind === 'gold' ? 1.06 + 0.06 * Math.sin(t * 9 + it.seed) : 1);
      f.save(); f.globalAlpha = it.fade > 0 ? Math.max(0, 1 - it.fade) : it.pass ? 0.45 : 1; f.translate(it.x, it.y); f.rotate(reduceMotion ? 0 : Math.sin(t * 2.2 + it.seed) * 0.16 + it.rot * 0.12);
      f.drawImage(sp.cv, -s / 2, -s / 2, s, s); f.restore();
      if (it.kind === 'gold' && !it.fade) for (let q = 0; q < 3; q++) { const a = t * 3 + it.seed + q * TAU / 3, x = it.x + Math.cos(a) * s * 0.56, y = it.y + Math.sin(a) * s * 0.56, r = 3.2 + Math.sin(t * 8 + q) * 1.2; f.fillStyle = '#FFFFFF'; f.beginPath(); f.moveTo(x, y - r * 1.5); f.quadraticCurveTo(x, y, x + r * 1.5, y); f.quadraticCurveTo(x, y, x, y + r * 1.5); f.quadraticCurveTo(x, y, x - r * 1.5, y); f.quadraticCurveTo(x, y, x, y - r * 1.5); f.fill(); }
    }
    // 바구니로 날아가는 간식
    for (const q of S.fly) { const u = q.t / q.dur, e = u * u * (3 - 2 * u), tx = BX, ty = BY - BW * 0.75, x = lerp(q.x0, tx, e), y = lerp(q.y0, ty, e) - Math.sin(u * Math.PI) * SZ * 0.55, s = lerp(SZ * 0.3, BW * 0.27, e); f.save(); f.translate(x, y); f.rotate(u * 5); f.drawImage(raws[q.e].cv, -s / 2, -s / 2, s, s); f.restore(); }
    // 효과
    for (const p of S.parts) {
      const a = 1 - p.life / p.max;
      if (p.kind === 'dot') { f.globalAlpha = a; f.fillStyle = p.col; f.beginPath(); f.arc(p.x, p.y, p.r * (0.6 + 0.6 * (1 - a)), 0, TAU); f.fill(); }
      else if (p.kind === 'star') { f.globalAlpha = a; f.fillStyle = p.col; const r = p.r * (0.5 + a * 0.7); f.beginPath(); f.moveTo(p.x, p.y - r * 1.5); f.quadraticCurveTo(p.x, p.y, p.x + r * 1.5, p.y); f.quadraticCurveTo(p.x, p.y, p.x, p.y + r * 1.5); f.quadraticCurveTo(p.x, p.y, p.x - r * 1.5, p.y); f.quadraticCurveTo(p.x, p.y, p.x, p.y - r * 1.5); f.fill(); }
      else { f.globalAlpha = Math.min(1, a * 2.2); f.font = '700 ' + p.size + 'px ' + FONT; f.textAlign = 'center'; f.textBaseline = 'middle'; f.lineJoin = 'round'; f.lineWidth = 4; f.strokeStyle = 'rgba(30,36,70,.55)'; f.strokeText(p.text, p.x, p.y); f.fillStyle = p.col; f.fillText(p.text, p.x, p.y); }
    }

    if (S.say > 0 && S.sayText) bubble(S.sayText, S.kx, headTop, Math.min(1, S.say * 4, (S.sayMax - S.say) * 8));

    if (S.mode !== 'ready' && cHud.s !== S.score) { cHud.s = S.score; $('hScore').textContent = S.score.toLocaleString(); }
  }

  // ── 흐름
  function start() {
    if (KG.rulesOpen) return;
    runDiff = KG.diff(); D = DIFF[runDiff] || DIFF.normal; runKey = KG.dkey(KEY); $('hDiff').textContent = KG.diffLabel();
    const mid = (KMIN + KMAX) / 2;
    Object.assign(S, { mode: 'play', pt: 0, kx: mid, target: mid, vx: 0, keyDir: keyDir(), hearts: HEARTS, score: 0, combo: 0, maxCombo: 0, caught: 0, ate: 0, missed: 0,
      items: [], fly: [], pile: [], parts: [], spawnT: 0.9, lastX: mid, nextHeart: D.hgap * 0.6, badSeen: false, goldSeen: false, inv: 0, munch: 0, hurt: 0, cheer: 0, shake: 0, freeze: 0, endT: 0, say: 0, sayText: '' });
    ovNew = false; paintHearts(); cHud.s = cHud.c = -1; paintCombo();
    $('cardStart').hidden = true; $('cardOver').hidden = true; $('cardPause').hidden = true; $('hud').hidden = false; btnPause.hidden = false;
    note(KEYS_OK ? '좌우로 끌거나 ← → 키로 움직여요' : '화면을 좌우로 끌어 움직여요'); last = 0;

  }
  let ovNew = false, overAt = 0;   // 이번 판이 새 기록이었나 · 결과 카드가 뜬 때(두드리던 손가락에 바로 넘어가지 않게)

    if (S.mode === 'over') return; S.mode = 'over'; overAt = performance.now();
    ovNew = S.score > 0 && KG.setBest(runKey, S.score);

    $('ovSub').textContent = '바구니에 간식 ' + S.caught.toLocaleString() + '개를 담았어요';
    $('ovScore').textContent = S.score.toLocaleString(); $('ovTreat').textContent = S.caught.toLocaleString() + '개'; $('ovCombo').textContent = S.maxCombo.toLocaleString();
    paintBest(); $('combo').hidden = true;
    $('cardOver').hidden = false;
    if (ovNew) { sfx('win'); voice('bark', 0.3, 1.1); S.cheer = 2; S.hurt = 0; }
    try { $('btnAgain').focus({ preventScroll: true }); } catch (e) {}
  }
  // 난이도 고르기: 시작 · 결과 카드에만. 시작 카드는 고른 난이도의 기록, 결과 카드는 방금 끝난 판 난이도의 기록(다른 난이도를 골라 두었으면 이름을 붙인다)
  const fmt = v => Math.round(v).toLocaleString();
  function paintBest() {
    const b = KG.best(KG.dkey(KEY)), txt = [KEYS_OK ? '← → 키로도 움직여요' : '', b > 0 ? '최고 기록 ' + fmt(b) + '점' : ''].filter(Boolean).join('  ·  ');
    $('stKey').textContent = txt; $('stKey').hidden = !txt;
    const e = KG.best(KG.dkey(KEY, runDiff));
    $('ovBest').textContent = fmt(S.mode === 'over' ? Math.max(e, S.score) : e) + '점';
    $('ovBestL').textContent = KG.diff() === runDiff ? '최고 기록' : KG.diffLabel(runDiff) + ' 최고';
    $('ovBadge').hidden = !ovNew;
  }
  $('cardStart').querySelector('.kg-card').insertBefore(KG.diffPicker(null, paintBest), $('btnRules'));
  $('cardOver').querySelector('.row').before(KG.diffPicker(null));
  paintBest();
  function pause() {
    if (S.mode !== 'play') return; S.mode = 'pause'; S.keyDir = 0; held.clear(); dragId = null;
    $('paSub').textContent = '지금까지 간식 ' + S.caught.toLocaleString() + '개 · ' + S.score.toLocaleString() + '점이에요';
    $('cardPause').hidden = false; draw();
    try { $('btnResume').focus({ preventScroll: true }); } catch (e) {}
  }
  function resume() { if (S.mode !== 'pause') return; S.mode = 'play'; S.freeze = 0.7; S.target = S.kx; $('cardPause').hidden = true; last = 0; }

  // ── 입력: 화면을 누르거나 끌면 그 자리로 콩이가 따라온다 · ← → (A D) 키
  let dragId = null;
  const held = new Set(), keyDir = () => (held.has('R') ? 1 : 0) - (held.has('L') ? 1 : 0);
  const aim = e => { if (S.mode === 'play' && !S.bot) S.target = clamp(e.clientX, KMIN, KMAX); };
  stage.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); dragId = e.pointerId; aim(e); });
  addEventListener('pointermove', e => { if (e.pointerId === dragId || (e.pointerType === 'mouse' && dragId == null && S.mode === 'play' && e.buttons === 0 && stage.contains(e.target))) aim(e); });
  const ptrUp = e => { if (e.pointerId === dragId) dragId = null; };

  $('cardOver').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });

      e.preventDefault(); KG.unlockAudio();
      if (S.mode === 'ready') start();
      else if (S.mode === 'over') { if (performance.now() - overAt >= 450) start(); }
      else if (S.mode === 'pause') resume();
    } else if (e.code === 'KeyP' || e.code === 'Escape') { if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); }
  });
  addEventListener('keyup', e => { const d = DIRK[e.code]; if (d) { held.delete(d); S.keyDir = S.mode === 'play' ? keyDir() : 0; } });

  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  addEventListener('orientationchange', () => setTimeout(layout, 200));

  // ── 돌리기
  let last = 0;

  requestAnimationFrame(frame);

  // ── 규칙 안내: 앱을 켠 뒤 처음 열 때 시작 카드보다 먼저 한 번 (공통이 기억), 시작 카드의 「규칙 보기」 로 다시
  const RULES = { key: KEY, title: TITLE, lead: '떨어지는 간식을 ' + J(name, '이/가') + ' 받아먹어요.', items: [
    ['👆', '화면을 좌우로 끌어 간식을 입으로 받아요' + (KEYS_OK ? ' (← → 키도 돼요).' : '.')],
    ['🍫', '빨간 표시가 붙은 초콜릿·양파·포도를 먹으면 하트가 줄어요.'],
    ['✨', '연달아 받으면 콤보로 점수가 커져요. 놓치면 콤보만 끊겨요.'],
    ['💗', '황금 간식은 큰 점수, 하트 간식은 하트를 채워 줘요.']
  ] };
  const focusStart = () => { if (S.mode === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (S.mode !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  (async () => { await KG.rules(RULES); focusStart(); })();

  // ── 시험용
  window.GAME = {
    S, DIFF, BOT, get state() { return S.mode; }, get score() { return S.score; }, get hearts() { return S.hearts; }, get combo() { return S.combo; }, get caught() { return S.caught; }, get time() { return S.pt; }, get items() { return S.items; },
    get metrics() { return { W, H, SZ, GY, laneL, laneR, KMIN, KMAX, MOX, MOY, mouthY: mouthY(), BX, BY, BW, side, diff: runDiff }; },
    start, end: endRun, over: showOver, pause, resume, step, fallT, gapT, badP,
    moveTo(x) { S.target = clamp(x, KMIN, KMAX); }, moveFrac(u) { S.target = lerp(KMIN, KMAX, clamp(u, 0, 1)); }, key(dir) { S.keyDir = Math.sign(dir || 0); },
    drop(kind, x, T) { return addItem(kind, kind === 'bad' ? GOOD.length : kind === 'gold' ? E_GOLD : kind === 'heart' ? E_HEART : 0, x == null ? S.kx + MOX : x, T || 1); },
    set bot(v) { S.bot = !!v; }, get bot() { return S.bot; },
    // 자동 놀이로 한 판을 빨리 돌린다 (하트가 다 없어지거나 maxSec 초까지)
    sim(maxSec, dt) { dt = dt || 1 / 60; const bot = S.bot; S.bot = true; S.simulating = true; start(); for (let t = 0; t < (maxSec || 600) && S.mode === 'play'; t += dt) step(dt); const r = { t: +S.pt.toFixed(1), score: S.score, caught: S.caught, missed: S.missed, ate: S.ate, maxCombo: S.maxCombo, hearts: S.hearts, dead: S.mode !== 'play' }; S.bot = bot; S.simulating = false; if (S.mode === 'play') endRun(); return r; }
  };
})();
