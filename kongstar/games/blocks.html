<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 블록채우기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 블록채우기(간식 조각 놓기): 밤하늘(bg) → 콩이(stage) → 간식 판·조각 상자·끄는 조각·글자(fx) → 점수판 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
#fx { z-index: 2; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud.mid { transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .cb { color: #FFE08A; }
#hud .sc.bump, #hud .cb.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
.kg-pill.undo { position: relative; }
.kg-pill.undo b { position: absolute; right: -3px; top: -3px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box; background: var(--gold); color: #3B2A00; font-size: 11px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.kg-pill.undo:disabled { opacity: .4; cursor: default; }
.kg-pill.undo.nudge:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,97,.35); }
#stuck { position: fixed; z-index: 12; box-sizing: border-box; width: min(300px, calc(100vw - 32px)); background: #fff; color: var(--ink); border-radius: 20px; padding: 16px 16px 14px; text-align: center; box-shadow: 0 12px 36px rgba(0,0,0,.32); transform: translate(-50%, -50%); }
#stuck b { display: block; font-size: 17px; letter-spacing: -.3px; }
#stuck p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--sub); }
#stuck .row { display: flex; gap: 8px; margin-top: 12px; }
#stuck .kg-btn { flex: 1; min-width: 0; height: 46px; padding: 0 8px; font-size: 15px; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .dnote { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stHow2 { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .dnote { margin-top: 5px; font-size: 12px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  #stuck { padding: 12px 14px 10px; } #stuck .row { margin-top: 8px; } #stuck .kg-btn { height: 40px; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  #stDNote { display: none; }
}
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 6px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 9px; font-size: 12px; white-space: nowrap; } }
/* 낮은 가로 화면: 결과 칩 세 개가 한 줄을 넘치지 않게 「최고 콤보」는 뺀다 */
@media (orientation: landscape) and (max-height: 430px) { #cardEnd .rec span:nth-child(2) { display: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="간식 블록 판 — 아래 조각을 끌어다 판에 놓아요"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
  <div class="bs" id="hudBs"><small>최고</small><span id="hudBest">0</span></div>
  <div class="cb" id="hudCb" hidden>콤보 <span id="hudCombo">0</span></div>
</div>

<div id="stuck" role="alertdialog" aria-labelledby="stuckT" hidden>
  <b id="stuckT">놓을 자리가 없어요</b>
  <p id="stuckP">되돌리기로 한 수 물러 볼까요?</p>
  <div class="row"><button class="kg-btn" id="btnGiveUp" type="button">끝내기</button><button class="kg-btn pri" id="btnStuckUndo" type="button">되돌리기</button></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 블록채우기</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>간식 조각을 끌어다</b> 판에 놓아요.</p>
      <p id="stHow2"><b>가로나 세로 한 줄</b>을 꽉 채우면 사라지며 점수를 받아요.</p>
    </div>
    <p class="dnote" id="stDNote"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">판이 꽉 찼어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>지운 줄<b id="edLines"></b></span><span>최고 콤보<b id="edCombo"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, toast, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'blocks', TITLE = J(name, '의') + ' 블록채우기';

  // ═══════ 조각 모양: 1~5칸 폴리오미노. 쉬운(s) · 보통(m) · 어려운(h) 모양 묶음. 문자열 '/' 는 줄 바꿈, '#' 이 칸 ═══════
  //   모양마다 돌리고 뒤집은 모든 방향을 미리 만들어 두고, 나올 때 모양을 고른 뒤 방향을 고른다 (방향이 많은 모양이 더 자주 나오지 않게)
  const SHAPE_SRC = {
    s: ['#', '##', '###', '##/#.'],
    m: ['##/##', '####', '###/.#.', '##./.##', '###/#..', '#####', '###/#../#..'],
    h: ['##/##/#.', '#.#/###', '###/.#./.#.', '#../##./.##', '.#./###/.#.', '.##/##./.#.', '##../.###', '####/.#..', '##./.#./.##', '####/#...']
  };
  function norm(cells) {
    const r0 = Math.min(...cells.map(p => p[0])), c0 = Math.min(...cells.map(p => p[1]));
    const out = cells.map(p => [p[0] - r0, p[1] - c0]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    return out;
  }
  const ckey = cells => cells.map(p => p.join(',')).join(';');
  const rot90 = cells => norm(cells.map(([r, c]) => [c, -r]));   // 시계 방향 90°
  function orients(src) {
    let cells = []; src.split('/').forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') cells.push([r, c]); });
    cells = norm(cells);
    const seen = new Map();
    for (const base of [cells, norm(cells.map(([r, c]) => [r, -c]))]) { let x = base; for (let i = 0; i < 4; i++) { seen.set(ckey(x), x); x = rot90(x); } }
    return [...seen.values()];
  }
  const SHAPES = {}; for (const k in SHAPE_SRC) SHAPES[k] = SHAPE_SRC[k].map(orients);

  // ═══════ 간식 무늬 (칸 색) — 탁하지 않은 밝은 파스텔 ═══════
  const TREATS = [
    { a: '#FFB3BE', b: '#F27D91', m: 'heart' },    // 딸기 하트 쿠키
    { a: '#FFD98A', b: '#F0AE45', m: 'bone' },     // 뼈다귀 비스킷
    { a: '#A6E3BE', b: '#5FBF8A', m: 'paw' },      // 발바닥 젤리
    { a: '#A9D2FF', b: '#5E9FEA', m: 'star' },     // 별 사탕
    { a: '#D3BDFF', b: '#9E7DEB', m: 'berry' },    // 블루베리
    { a: '#FFC69E', b: '#EE915A', m: 'cookie' }    // 초코칩 쿠키
  ];
  const ROCK = 9;

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   n 판 크기 · w 모양 묶음 비율 [쉬운, 보통, 어려운] · ramp [이만큼 놓으면, 어려운 모양 비율이 여기까지 오른다(쉬운 모양 몫에서 덜어 냄)] · fair 조각 나눠 주기 (2: 세 조각 모두 놓일 자리가 있게 · 1: 적어도 하나는 · 0: 그냥 무작위)
  //   undo 되돌리기 횟수 · rotate 조각을 톡 눌러 돌리기 · grace 줄을 못 지운 채 이만큼 놓으면 콤보가 끊긴다 · rockEvery 이만큼 놓을 때마다 돌멩이 한 개 · rock0 처음 돌멩이
  const DIFF = {
    easy:   { n: 9, w: [0.55, 0.40, 0.05], ramp: [300, 0.15], fair: 1, undo: 3, rotate: true,  grace: 3, rockEvery: 0,  rock0: 0 },
    normal: { n: 8, w: [0.40, 0.46, 0.14], ramp: [200, 0.32], fair: 1, undo: 1, rotate: false, grace: 3, rockEvery: 0,  rock0: 0 },
    hard:   { n: 8, w: [0.32, 0.48, 0.20], ramp: [160, 0.36], fair: 0, undo: 0, rotate: false, grace: 2, rockEvery: 15, rock0: 0 },
    vhard:  { n: 8, w: [0.25, 0.45, 0.30], ramp: [120, 0.45], fair: 0, undo: 0, rotate: false, grace: 1, rockEvery: 8,  rock0: 2 }
  };
  const DNOTE = { easy: '9×9 큰 판 · 조각을 톡 눌러 돌리기 · 되돌리기 3번', normal: '8×8 판 · 되돌리기 1번', hard: '어려운 모양이 자주 · ' + DIFF.hard.rockEvery + '번 놓을 때마다 돌멩이', vhard: '어려운 모양 가득 · ' + DIFF.vhard.rockEvery + '번마다 돌멩이 · 콤보는 쉬지 않고 지울 때만' };
  const MASTER = { easy: 6000, normal: 5000, hard: 2000, vhard: 800 };   // 「블록채우기 달인」 점수 — 미리 보는 봇 시험(11-27): Hard 가운데 1,127·상위 25% 1,757 / Very Hard 가운데 468·상위 25% 668·최고 1,109
  let diffId = 'normal', D = DIFF.normal, N = 8;
  const lineScore = L => 10 * L * (L + 1) / 2;   // 한 번에 지운 줄: 1줄 10 · 2줄 30 · 3줄 60 · 4줄 100 …

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnUndo = document.createElement('button');
  btnUndo.className = 'kg-pill kg-round undo'; btnUndo.type = 'button'; btnUndo.setAttribute('aria-label', '한 수 되돌리기'); btnUndo.hidden = true;
  btnUndo.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><b id="undoN">0</b>';
  bar.right(btnUndo);
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.type = 'button'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '간식 조각으로 판을 채워요. 한 줄이 꽉 차면 냠냠 사라져요.';
  const bg = $('bg'), fx = $('fx'), stage = $('stage'), hud = $('hud'), stuckEl = $('stuck');
  const g = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 80); K.setPose('sit');

  // ═══════ 상태 ═══════
  let state = 'ready';        // ready · play · stuck · pause · over · result
  let grid = new Uint8Array(64), tray = [null, null, null];
  let score = 0, combo = 0, bestCombo = 0, miss = 0, placed = 0, lines = 0, undoLeft = 0, isNew = false, quit = false, overT = 0, overAt = 0, wipes = 0, pauseFrom = 'play';
  let undoStack = [];
  let drag = null, rets = [], pops = [], clears = [], parts = [], floats = [], drops = [], deals = [0, 0, 0], grayT = 0;
  let W = 0, H = 0, DPR = 1, SAF = { t: 0, b: 0, l: 0, r: 0 }, low = false, side = false;
  let bx = 0, by = 0, cs = 30, tc = 16, slots = [], KSZ = 80, kx = 0, ky = 0, tAnim = 0;
  const kg = { happyT: 0, bigT: 0, sadT: 0, peekT: 0, nodT: 0 };
  const at = (r, c) => grid[r * N + c];

  // ═══════ 판 계산 ═══════
  function fitsAt(cells, r0, c0, gr) {
    gr = gr || grid;
    for (const [r, c] of cells) { const rr = r0 + r, cc = c0 + c; if (rr < 0 || cc < 0 || rr >= N || cc >= N || gr[rr * N + cc]) return false; }
    return true;
  }
  function anyFit(cells, gr) {
    const h = Math.max(...cells.map(p => p[0])) + 1, w = Math.max(...cells.map(p => p[1])) + 1;
    for (let r = 0; r <= N - h; r++) for (let c = 0; c <= N - w; c++) if (fitsAt(cells, r, c, gr)) return true;
    return false;
  }
  // 이 조각이 지금 판에 놓일 수 있나 (돌리기가 되는 난이도면 네 방향 모두 본다)
  function canPlace(p, gr) {
    if (!p) return false;
    if (anyFit(p.cells, gr)) return true;
    if (!D.rotate) return false;
    let x = p.cells; for (let i = 0; i < 3; i++) { x = rot90(x); if (anyFit(x, gr)) return true; }
    return false;
  }
  // 놓았을 때 꽉 차는 줄 (판은 그대로 두고 셈만)
  function fullLines(gr) {
    const rows = [], cols = [];
    for (let r = 0; r < N; r++) { let ok = true; for (let c = 0; c < N; c++) if (!gr[r * N + c]) { ok = false; break; } if (ok) rows.push(r); }
    for (let c = 0; c < N; c++) { let ok = true; for (let r = 0; r < N; r++) if (!gr[r * N + c]) { ok = false; break; } if (ok) cols.push(c); }
    return { rows, cols };
  }
  function mkPiece(cells) {
    return { cells, h: Math.max(...cells.map(p => p[0])) + 1, w: Math.max(...cells.map(p => p[1])) + 1, t: Math.floor(Math.random() * TREATS.length) };
  }
  function randPiece() {

    $('edScore').textContent = fmt(score); $('edLines').textContent = fmt(lines) + '줄'; $('edCombo').textContent = bestCombo + '번';
    $('edTitle').textContent = master ? '블록채우기 달인이에요!' : quit ? '여기까지 했어요' : score > 0 ? '판이 꽉 찼어요' : '다시 해 봐요';
    $('edText').textContent = score > 0 ? (lines ? J(name, '이/가') + ' 간식 줄을 ' + fmt(lines) + '줄 지웠어요.' : '아직 한 줄도 못 지웠어요.') + (wipes ? ' 판을 ' + wipes + '번 싹 비웠어요!' : '') : '한 줄을 꽉 채우면 사라져요.';
    paintBest(); paintUndo(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win'); else if (score > 0 && !quit) KG.lick(1.0, 0.45);   // 11-28: 결과가 좋으면 할짝 — 신기록 때는 공통이 짖으니 겹치지 않게 뺀다
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  $('btnGiveUp').addEventListener('click', () => { sfx('tap'); end(); });
  $('btnStuckUndo').addEventListener('click', () => { sfx('tap'); undo(); });
  btnUndo.addEventListener('click', () => { if (state === 'play' || state === 'stuck') undo(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { if (drag) dropDrag(true); });
  document.addEventListener('keydown', e => {
    const kk = e.key;
    if (kk === ' ' || kk === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      if (KG.rulesOpen) return;
      if (state === 'ready' && !$('cardStart').hidden) { e.preventDefault(); start(); } else if (state === 'result') { e.preventDefault(); if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') { e.preventDefault(); resume(); }
    } else if (kk === 'Escape' || kk === 'p' || kk === 'P') { if (state === 'play' || state === 'stuck') pause(); else if (state === 'pause') resume(); }
    else if ((kk === 'z' || kk === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
    $('stDNote').textContent = DNOTE[KG.diff()] || '';
  }
  function onDiff() { paintBest(); if (state === 'ready') { reset(); previewBoard(); paintHud(); } }
  // 시작 카드 뒤 판: 고른 난이도의 빈 판과 조각 세 개를 미리 보여 준다 (Very Hard 는 돌멩이도)
  function previewBoard() { for (let i = 0; i < D.rock0; i++) addRock(false); tray = [randPiece(), randPiece(), randPiece()]; deals = [1, 1, 1]; }
  $('stDNote').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; N = D.n;
  layout(); reset(); previewBoard(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '간식 조각으로 판을 채우는 놀이예요. 점수가 기록이에요.', items: [
    ['👆', '아래 간식 조각을 끌어다 판에 놓아요. Easy 에서는 톡 누르면 돌아가요.'],
    ['✨', '가로나 세로 한 줄을 꽉 채우면 사라져요. 여러 줄을 한꺼번에 지우면 덤이 커요.'],
    ['🔥', '줄을 연달아 지우면 콤보로 점수가 불어나요. 판을 싹 비우면 300점 더.'],
    ['🪨', '놓을 자리가 없으면 끝나요. Hard 부터는 돌멩이가 떨어져요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  //   봇: GAME.tray() 조각 칸들, GAME.grid() 판, GAME.place(i, r, c) 로 놓는다. GAME.fits(i, r, c). 끝나면 state 가 'stuck'(되돌리기 남음) 또는 'over' → 'result'
  window.GAME = {
    DIFF, MASTER, get state() { return state; }, get score() { return score; }, get combo() { return combo; }, get bestCombo() { return bestCombo; }, get lines() { return lines; },
    get placed() { return placed; }, get N() { return N; }, get diff() { return diffId; }, get undoLeft() { return undoLeft; }, get wipes() { return wipes; },
    grid: () => Array.from(grid), tray: () => tray.map(p => p && { cells: p.cells.map(q => q.slice()), h: p.h, w: p.w, t: p.t }),
    fits: (i, r, c) => !!tray[i] && fitsAt(tray[i].cells, r, c), place, undo, rotate: rotatePiece, start, end, pause, resume, over: showResult,
    field: () => ({ W, H, cs, tc, bx, by, N, slots: slots.map(s => ({ ...s })), kong: K.el.getBoundingClientRect().toJSON(), KSZ, kx, ky, hud: hud.getBoundingClientRect().toJSON(), side, low }),
    slotCenter: i => { const s = slots[i]; return [s.x + s.w / 2, s.y + s.h / 2]; },
    cellCenter: (r, c) => [bx + (c + 0.5) * cs, by + (r + 0.5) * cs],
    get drag() { return drag && { i: drag.i, snap: drag.snap, touch: drag.touch }; },
    setGrid: a => { for (let i = 0; i < N * N; i++) grid[i] = a[i] || 0; paintHud(); checkStuck(); },   // 시험용: 판을 통째로 바꾸고 막혔는지 본다
    step: dt => update(dt)
  };
})();
</script>
</body>
</html>
