<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 리듬스타</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 리듬스타: 밤하늘(bg) → 레인·노트·누름판(cv) → 콩이(stage) → 점수판 순서로 겹친다 */
#bg, #cv { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; touch-action: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.hud { position: fixed; z-index: 10; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; width: max-content; max-width: 100%; }
.hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hudL { align-items: flex-start; }
#hudR { align-items: flex-end; }
#hudSc.bump { animation: scBump .3s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.en { gap: 6px !important; }
.en i { font-style: normal; font-size: 13px; }
.en .bar { width: 64px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
.en .bar b { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #7DE3B0, #B6F0A0); transition: width .15s; }
.en.low .bar b { background: linear-gradient(90deg, #FF8FA3, #FFB3A0); }
.en.low.blink { animation: enBlink .8s infinite; }
@keyframes enBlink { 50% { background: rgba(229,72,77,.55); } }
/* 가로 화면: 점수판을 레인 오른쪽에 세로로 쌓는다 */
.hud.side { align-items: flex-start !important; }
body .kg-top .kg-title { pointer-events: none; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
.calbtn { display: flex; align-items: center; justify-content: center; gap: 6px; width: max-content; max-width: 100%; box-sizing: border-box; height: 44px; margin: 8px auto -6px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; font-size: 14.5px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.calbtn:active { background: var(--soft); }
.calbtn span { color: var(--pri); font-variant-numeric: tabular-nums; }
/* 박자 맞추기 카드 */
#calPad { width: 132px; height: 132px; margin: 24px auto 4px; border: 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 35%, #FFF1E2, #FFC9A3 70%, #F2A27A); color: #7A3E1D; font-size: 15px; font-weight: 700; box-shadow: 0 6px 18px rgba(226,130,90,.35); touch-action: none; transition: transform .06s; }
#calPad:active { transform: scale(.95); }
#calPad svg { width: 46px; height: 46px; display: block; margin: 0 auto 2px; }
#calRing { position: relative; width: 132px; height: 0; margin: 0 auto; }
#calRing i { position: absolute; left: 50%; top: -140px; width: 140px; height: 140px; margin-left: -70px; border-radius: 50%; border: 3px solid #2C3577; opacity: 0; pointer-events: none; }
.dots { display: flex; justify-content: center; gap: 7px; margin: 22px 0 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--pri); }
#calRes { min-height: 22px; font-weight: 600; color: var(--ink) !important; }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } .en .bar { width: 50px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
  #calPad { width: 112px; height: 112px; margin-top: 18px; }
  .dots { margin-top: 18px; }
  #calRing { width: 112px; } #calRing i { top: -120px; width: 120px; height: 120px; margin-left: -60px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys, #calLead { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  .calbtn { height: 36px; margin: 4px auto -6px; }
  #calPad { width: 92px; height: 92px; margin-top: 14px; font-size: 13px; }
  #calPad svg { width: 32px; height: 32px; }
  #calRing { width: 92px; } #calRing i { top: -100px; width: 100px; height: 100px; margin-left: -50px; }
  .dots { margin: 20px 0 2px; }
}
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd, #cardCal { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  #cardStart .how { display: none; }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  #cardCal .kg-card p:not(#calRes) { display: none; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv" aria-label="박자에 맞춰 누르는 리듬 레인"></canvas>
<div id="stage"></div>

<div class="hud" id="hudL" aria-hidden="true">
  <div id="hudSc"><span id="hudScore">0</span><small>점</small></div>
</div>
<div class="hud" id="hudR" aria-hidden="true">
  <div class="en" id="hudEn"><i>💖</i><span class="bar"><b id="hudEnBar"></b></span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 리듬스타</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>발자국이 아래 선에 닿을 때</b> 그 줄을 눌러요.</p>
      <p id="stHow2">긴 노트는 끝까지 <b>꾹</b>, 뼈다귀 두 개는 <b>함께</b>!</p>
      <p id="stKeys" hidden>키보드 <b>D F J K</b> (세 줄은 <b>F J K</b> · <b>← ↓ →</b>)</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
    <button class="calbtn" id="btnCal" type="button">🎚️ 박자 맞추기 <span id="calNow"></span></button>
  </div>
</div>

<div class="kg-scrim" id="cardCal" hidden>
  <div class="kg-card" role="dialog" aria-label="박자 맞추기">
    <h2>박자 맞추기</h2>
    <p id="calLead">똑딱 소리(소리를 껐다면 동그라미)에 맞춰 아래 단추를 8번 두드려요. 폰마다 다른 소리 늦음을 재요.</p>
    <button id="calPad" type="button" aria-label="박자에 맞춰 두드리기"><span><svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><ellipse cx="24" cy="31" rx="10" ry="8.5"/><circle cx="11" cy="20" r="4.6"/><circle cx="19" cy="12" r="4.6"/><circle cx="29" cy="12" r="4.6"/><circle cx="37" cy="20" r="4.6"/></svg>톡!</span></button>
    <div id="calRing"><i></i></div>
    <div class="dots" id="calDots"></div>
    <p id="calRes"></p>
    <div class="row"><button class="kg-btn" id="btnCalReset" type="button">처음값</button><button class="kg-btn pri" id="btnCalDone" type="button">다 했어요</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">기운이 다 떨어졌어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>최고 콤보<b id="edCombo"></b></span><span>도착<b id="edSec"></b></span><span>딱 맞아요<b id="edPf"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'rhythm', TITLE = J(name, '의') + ' 리듬스타';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const OFF_KEY = 'kongstar.game.rhythm.offset';

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   lanes 레인 수 · bpm0 첫 구간 빠르기 · bpmStep 구간마다 더해지는 빠르기 · bpmMax 가장 빠른 빠르기
  //   travel 노트가 위에서 판정선까지 내려오는 시간(초) — 빠르기가 끝에 닿은 뒤로는 구간마다 3%씩 짧아진다(LATE_MIN 배까지)
  //   pw 「딱 맞아요」 창 · gw 「좋아요」 창(±초, 휴대폰마다 소리 늦음이 달라 넉넉하게)
  //   pQ→pQmax 박자마다 노트가 나올 확률(구간이 지날수록 커진다) · pE→pEmax 반 박자(엇박) 노트 확률
  //   hold 긴 노트 확률 · holdMax 긴 노트 가장 긴 박 수 · dbl 두 줄 동시 노트 확률 · burst 16분음표 이어치기(빠르기 140 이하에서만)
  //   dmg 놓쳤을 때 줄어드는 기운(100 중) · heal 「딱 맞아요」 때 차는 기운
  //   빠르기가 끝에 닿은 뒤(늦은 구간)에는 끝없이 이어지지 않게: healDrop 구간마다 회복이 줄어드는 비율(HEAL_MIN 배까지) · drain 기운이 저절로 줄어드는 양(초당, DRAIN_N 구간에 걸쳐 커진다)
  //   목표(잘 치는 사람 기준): Easy 15분 · Normal 10분 · Hard 7분 · Very Hard 5분 안팎
  const DIFF = {
    easy:   { lanes: 3, bpm0: 84,  bpmStep: 4, bpmMax: 112, travel: 2.0,  pw: 0.09,  gw: 0.17,  pQ: 0.45, pQmax: 0.75, pE: 0,    pEmax: 0.08, hold: 0,    holdMax: 0, dbl: 0,    burst: 0,    dmg: 5,  heal: 2,   healDrop: 0.017, drain: 0.78 },
    normal: { lanes: 4, bpm0: 94,  bpmStep: 5, bpmMax: 132, travel: 1.65, pw: 0.075, gw: 0.15,  pQ: 0.6,  pQmax: 0.85, pE: 0.1,  pEmax: 0.3,  hold: 0.12, holdMax: 2, dbl: 0,    burst: 0,    dmg: 8,  heal: 1.5, healDrop: 0.022, drain: 0.95 },
    hard:   { lanes: 4, bpm0: 104, bpmStep: 6, bpmMax: 148, travel: 1.4,  pw: 0.065, gw: 0.13,  pQ: 0.72, pQmax: 0.92, pE: 0.22, pEmax: 0.45, hold: 0.14, holdMax: 3, dbl: 0.12, burst: 0,    dmg: 10, heal: 1.2, healDrop: 0.034, drain: 1.1 },
    vhard:  { lanes: 4, bpm0: 114, bpmStep: 7, bpmMax: 164, travel: 1.2,  pw: 0.055, gw: 0.115, pQ: 0.82, pQmax: 0.95, pE: 0.36, pEmax: 0.6,  hold: 0.16, holdMax: 3, dbl: 0.18, burst: 0.1,  dmg: 12, heal: 1,   healDrop: 0.045, drain: 1.15 }
  };
  const LATE_MIN = 0.78, EARLY = 0.12, BARS = 8, DMG_LATE = 0.06, DMG_LATE_N = 25;          // 가장 짧아지는 내려오기 배율 · 「너무 빨라요」 창 · 구간 하나의 마디 수
  const P_PERFECT = 100, P_GOOD = 50, P_TAIL = 50;         // 점수: 딱 맞아요 · 좋아요 · 긴 노트 끝까지
  const mult = c => 1 + Math.min(4, Math.floor(c / 20)) * 0.25;   // 콤보 20마다 ×0.25 (최대 ×2)
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 곡: 직접 만든 네 가지 느낌을 이어 붙인 끝없는 메들리 (화음 진행은 흔한 일반 진행, 멜로디는 노트 자리마다 그 줄의 화음 음) ═══════
  const STYLES = [
    { name: '산책길',   lead: 'squeak',  bass: 'tri',    drum: 'walk',    pad: false, prog: [[0, 4, 5, 3], [0, 3, 4, 4]] },
    { name: '간식 시간', lead: 'marimba', bass: 'walk',   drum: 'shuffle', pad: true,  prog: [[5, 3, 0, 4], [0, 5, 3, 4]] },
    { name: '공놀이',   lead: 'beep',    bass: 'octave', drum: 'four',    pad: false, prog: [[0, 3, 4, 3], [0, 4, 5, 4]] },
    { name: '별빛 낮잠', lead: 'bell',    bass: 'long',   drum: 'half',    pad: true,  prog: [[3, 4, 2, 5], [5, 3, 4, 0]] }
  ];
  const KEYS_ROOT = [0, 5, 2, 7, 3, 9];                    // 구간마다 바뀌는 으뜸음 (도·파·레·솔·미♭·라)
  const SCALE = [0, 2, 4, 5, 7, 9, 11];
  const mfreq = m => 440 * Math.pow(2, (m - 69) / 12);
  const chordTones = (root, deg) => [0, 2, 4].map(i => root + SCALE[(deg + i) % 7] + 12 * Math.floor((deg + i) / 7));
  // 레인 색 (3줄은 분홍·노랑·하늘)
  const LC4 = ['#FF8FA3', '#FFB86B', '#6FD6A8', '#7CB8FF'], LC3 = ['#FF8FA3', '#FFD36B', '#7CB8FF'];
  let LC = LC4;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = J(name, '과/와') + ' 함께 박자에 맞춰 발자국을 눌러요. 곡이 바뀔수록 조금씩 빨라져요!';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), stage = $('stage'), hudL = $('hudL'), hudR = $('hudR');
  const g = cv.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 120);

  // ═══════ 상태 ═══════
  let state = 'ready';            // ready · cal · play · pause · over · result
  let notes = [], sections = [], musicEv = [], holding = [];
  let score = 0, combo = 0, maxCombo = 0, energy = 100, nPf = 0, nGd = 0, nMs = 0, secIdx = 0, shownSec = -1, isNew = false, quit = false;
  let pos = 0, vis = 0, off = 0, overT = 0, overAt = 0, lastSched = 0, genUntil = 0, seed = 1, rng = Math.random, tAnim = 0, pausedPos = 0, resumeT = 0;
  const laneDown = [0, 0, 0, 0], laneFx = [0, 0, 0, 0], ptrLane = new Map(), keyLane = new Map();
  const missLog = [];   // 시험용: 최근 놓친 노트
  let floats = [], rings = [], parts = [], judgeFx = null, banner = null, missT = 0, hitT = 0;
  let W = 0, H = 0, DPR = 1, SAF = { t: 0, b: 0, l: 0, r: 0 }, wide = false;
  let fx0 = 0, fw = 0, laneW = 0, fTop = 0, fBot = 0, jY = 0, NRAD = 20, KSZ = 120, kx = 0, ky = 0;
  const nl = () => D.lanes;
  const laneX = l => fx0 + laneW * (l + 0.5);

  // ═══════ 소리: 게임 전용 AudioContext (박자 시계로도 쓴다). 소리를 끄면 performance.now 로 화면만으로 ═══════
  const MU = { ctx: null, out: null, bus: null, nb: null };
  function muEnsure() {
    if (!KG.soundOn) { if (MU.ctx && MU.ctx.state === 'running') { try { MU.ctx.suspend(); } catch (e) {} } return; }
    try {
      if (!MU.ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        const ctx = new C({ latencyHint: 'interactive' }); MU.ctx = ctx;

    // 계속하기 세는 동안은 시계를 보지 않는다(소리를 켜고 꺼도). 세기가 끝나면 멈춘 자리에서 시계·소리 예약을 함께 다시 잡는다
    if (resumeT > 0) { resumeT -= dt; if (resumeT <= 0) { resumeT = 0; clockSet(pausedPos); lastSched = pausedPos; if (CLK.src === 'audio') busNew(); else busKill(); } pos = pausedPos; vis = pos - off; return; }

    const dr = drainAt(secIdx);
    if (dr > 0) { const e0 = Math.ceil(energy); energy = Math.max(0, energy - dr * dt); if (Math.ceil(energy) !== e0) paintHud(); checkOver(); if (state !== 'play') return; }
    if (notes.length > 80) notes = notes.filter(n => !(n.st >= 2 && n.t + n.len < vis - 1.5));

    const s = sectionAt(vis); if (s) { secIdx = s.i; if (s.i !== shownSec && vis >= s.tN - s.beat * 2) { shownSec = s.i; banner = { t: 0, text: '🎶 ' + (s.i + 1) + '구간 · ' + s.name + ' · ' + s.bpm + ' BPM' }; if (s.i > 0) { tone(1047, 0.1, 'triangle', 0.03); } } }
  }

  // ═══════ 시작·멈춤·끝 ═══════
  function showCard(id, btn) { for (const k of ['cardStart', 'cardPause', 'cardEnd', 'cardCal']) $(k).hidden = k !== id; if (id !== 'cardEnd') rbox.hide(); if (btn) { try { $(btn).focus({ preventScroll: true }); } catch (e) {} } }
  // close: 멈춤·창 바뀜처럼 손을 뗀 게 아닌데 잡기가 끊길 때. 끝 무렵이면 성공, 아니면 벌 없이 닫는다(영원히 「잡는 중」으로 남지 않게)
  function resetLanes(close) {
    if (close) for (const n of holding) { if (n.st !== 1) continue; if (vis >= n.t + n.len - D.gw) tailOk(n); else n.st = 2; }
    laneDown.fill(0); ptrLane.clear(); keyLane.clear(); holding = [];
  }
  function start() {
    diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; LC = D.lanes === 3 ? LC3 : LC4;
    score = 0; combo = 0; maxCombo = 0; energy = 100; nPf = nGd = nMs = 0; secIdx = 0; shownSec = -1; quit = false; isNew = false; resumeT = 0;
    notes = []; sections = []; musicEv = []; floats = []; rings = []; parts = []; judgeFx = null; banner = null; missT = 0; resetLanes();
    seed = (Math.random() * 1e9) | 0; rng = mulberry32(seed); genUntil = 0;
    layout();
    KG.unlockAudio(); muEnsure();
    state = 'play'; clockSet(-0.4); off = calcOff(); pos = -0.4; vis = pos - off; lastSched = -1;
    if (CLK.src === 'audio') busNew(); else busKill();
    ensureGen(10);
    paintHud(); showCard(null); btnPause.hidden = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function pause() {
    if (state !== 'play') return;
    pausedPos = resumeT > 0 ? pausedPos : clockPos(); state = 'pause'; resetLanes(true); busKill(); paintHud();
    if (MU.ctx && MU.ctx.state === 'running') { try { MU.ctx.suspend(); } catch (e) {} }
    $('psText').textContent = (secIdx + 1) + '구간 · ' + fmt(score) + '점이에요. ' + J(name, '이/가') + ' 기다리고 있어요.';
    showCard('cardPause', 'btnResume'); if (document.activeElement === btnPause) btnPause.blur();
  }
  // 계속하기: 1.5초 세고 멈춘 자리부터 (곡은 멈춘 자리에서 다시)
  function resume() { if (state !== 'pause') return; muEnsure(); state = 'play'; showCard(null); resumeT = 1.5; lastSched = pausedPos; last = performance.now(); }
  function gameOver() {
    if (state !== 'play') return;
    state = 'over'; overT = 1.4; btnPause.hidden = true; resetLanes(); paintHud();
    if (MU.bus && MU.ctx) { try { MU.bus.gain.setTargetAtTime(0.0001, MU.ctx.currentTime, 0.15); } catch (e) {} }
    sfx('lose');
  }
  function end() {   // 「그만하기」: 지금 점수로 끝낸다
    if (state === 'pause') { state = 'play'; showCard(null); }
    if (state !== 'play') return;
    quit = true; state = 'over'; overT = 0.3; btnPause.hidden = true; resetLanes(); busKill(); paintHud();
  }
  function showResult() {
    if (state !== 'over') return;
    state = 'result'; overAt = performance.now(); busKill();
    isNew = score > 0 && setBest(KG.dkey(KEY, diffId), score);
    $('edScore').textContent = fmt(score); $('edCombo').textContent = fmt(maxCombo); $('edSec').textContent = (secIdx + 1) + '구간'; $('edPf').textContent = fmt(nPf) + '번';
    $('edTitle').textContent = quit ? '여기까지 했어요' : secIdx >= 5 ? '리듬스타 달인이에요!' : '기운이 다 떨어졌어요';
    if (!quit && secIdx >= 5 && KG.master) KG.master('rhythm');   // 업적 「게임 달인」 (11-27)
    const tot = nPf + nGd + nMs;
    $('edText').textContent = score > 0 ? '맞힌 노트 ' + fmt(nPf + nGd) + '개 중 딱 맞음 ' + Math.round(nPf / Math.max(1, nPf + nGd) * 100) + '%' + (tot ? ' · 놓침 ' + fmt(nMs) + '개' : '') + '.' : '발자국이 선에 닿을 때 그 줄을 눌러 봐요.';
    paintBest(); paintHud(); showCard('cardEnd', 'btnAgain'); rbox.show(diffId);
    if (isNew) sfx('win');
  }
  function paintHud() {
    $('hudScore').textContent = fmt(score);
    $('hudEnBar').style.width = Math.max(0, energy) + '%';
    const en = $('hudEn'); en.classList.toggle('low', energy <= 30); en.classList.toggle('blink', !reduceMotion && energy <= 30 && state === 'play');
  }
  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); if (state === 'cal') calClose(); if (MU.ctx) { try { MU.ctx.suspend(); } catch (e) {} } } });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { if (state === 'play') { const t = vis; for (const [id, l] of ptrLane) release(l, t, 'p' + id); for (const [id, l] of keyLane) release(l, t, 'k' + id); } resetLanes(state === 'play'); });
  // 소리 단추·화면 누름: 그 손짓 안에서 게임 소리를 켜고 끈다
  document.addEventListener('click', () => muEnsure());
  document.addEventListener('pointerdown', () => { if (KG.soundOn && (state === 'play' || state === 'cal')) muEnsure(); }, true);

  // ═══════ 박자 맞추기 (보정) ═══════
  const CB = 0.75, CAL_N = 8;
  let calTaps = [], calDone = false;
  function paintCalNow() { const v = loadOff(); $('calNow').textContent = v == null ? '' : '· ' + (v > 0 ? '+' : '') + Math.round(v) + 'ms'; }
  function paintDots() { const d = $('calDots'); d.textContent = ''; for (let i = 0; i < CAL_N; i++) { const e = document.createElement('i'); if (i < calTaps.length) e.className = 'on'; d.appendChild(e); } }
  function calOpen() {
    if (state !== 'ready' || KG.rulesOpen) return;
    KG.unlockAudio(); muEnsure(); state = 'cal'; calTaps = []; calDone = false; paintDots();
    const v = loadOff(); $('calRes').textContent = v == null ? '지금은 기본값이에요' : '지금 값: ' + (v > 0 ? '+' : '') + Math.round(v) + 'ms';
    clockSet(-0.6); lastSched = -1; if (CLK.src === 'audio') busNew();
    showCard('cardCal', 'calPad');
  }
  function calClose() { if (state !== 'cal') return; busKill(); state = 'ready'; paintCalNow(); showCard('cardStart', 'btnStart'); }
  function calUpdate() {
    clockSync(); pos = clockPos();
    const k = Math.floor(pos / CB), bp = pos - k * CB;
    if (CLK.src === 'audio' && MU.bus) { const ahead = pos + 0.25; for (let j = Math.max(0, Math.ceil(lastSched / CB)); j * CB <= ahead; j++) { if (j * CB <= lastSched) continue; const at = ctxAt(j * CB); INST.stick(Math.max(at, MU.ctx.currentTime), { v: 1.4, f: j % 4 ? 1600 : 2200 }); INST.kick(Math.max(at, MU.ctx.currentTime), { v: 0.6 }); } }
    lastSched = Math.max(lastSched, pos + 0.25);
    const ring = $('calRing').firstElementChild;
    if (pos >= 0) { const u = clamp(bp / 0.35, 0, 1); ring.style.opacity = String(1 - u); ring.style.transform = 'scale(' + (1 + u * 0.12).toFixed(3) + ')'; } else ring.style.opacity = '0';
  }
  function calTap(ts) {
    if (state !== 'cal') return;
    if (calDone) { calTaps = []; calDone = false; }
    const p = posAtEvent(ts), k = Math.floor((p + 0.25) / CB), d = p - k * CB;
    if (k < 1) return;
    calTaps.push(d); tone(1100, 0.03, 'sine', 0.03); paintDots();
    if (calTaps.length >= CAL_N) {
      const s = calTaps.slice().sort((a, b) => a - b), med = (s[3] + s[4]) / 2, ms = Math.round(clamp(med * 1000, -150, 400));
      try { localStorage.setItem(OFF_KEY, String(ms)); } catch (e) {}
      calDone = true; sfx('match');
      $('calRes').textContent = (Math.abs(ms) < 25 ? '박자가 잘 맞는 폰이에요' : ms > 0 ? '소리가 ' + ms + 'ms 늦게 들려요' : '조금 일찍 누르는 편이에요 (' + ms + 'ms)') + ' · 맞췄어요!';

    } else $('calRes').textContent = (CAL_N - calTaps.length) + '번 더 두드려요';
  }
  $('btnCal').addEventListener('click', () => { sfx('tap'); calOpen(); });
  $('calPad').addEventListener('pointerdown', e => { e.preventDefault(); calTap(e.timeStamp); });
  $('calPad').addEventListener('click', e => { if (e.detail === 0) calTap(e.timeStamp); });   // 키보드로 단추를 누른 경우
  $('btnCalDone').addEventListener('click', () => { sfx('tap'); calClose(); });
  $('btnCalReset').addEventListener('click', () => { sfx('tap'); try { localStorage.removeItem(OFF_KEY); } catch (e) {} calTaps = []; calDone = false; paintDots(); $('calRes').textContent = '처음값(기본)으로 돌렸어요'; paintCalNow(); });

  // ═══════ 입력: 레인 세로 띠 어디든 누르면 그 줄 (여러 손가락 동시), 키보드 D F J K / F J K · ← ↓ → ═══════
  function laneAt(x) {
    const m = Math.min(40, laneW * 0.5); if (x < fx0 - m || x > fx0 + fw + m) return -1;
    return clamp(Math.floor((x - fx0) / laneW), 0, nl() - 1);
  }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse' && e.button > 0) return;
    e.preventDefault();
    if (e.clientY < fTop - 30) return;
    const l = laneAt(e.clientX); if (l < 0) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    ptrLane.set(e.pointerId, l); press(l, posAtEvent(e.timeStamp) - off, 'p' + e.pointerId);
  });
  const ptrUp = e => { if (!ptrLane.has(e.pointerId)) return; const l = ptrLane.get(e.pointerId); ptrLane.delete(e.pointerId); release(l, posAtEvent(e.timeStamp) - off, 'p' + e.pointerId); };
  // 빠른 연타에 공통의 「두 번 눌러 확대 막기」(touchend 취소)가 걸리면 브라우저가 경고를 남긴다 — 레인은 touch-action:none 이라 확대가 없으니 여기서 멈춘다
  cv.addEventListener('touchend', e => e.stopPropagation(), { passive: true });
  cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp); cv.addEventListener('lostpointercapture', ptrUp);
  // 레인 키는 자판 자리(e.code)로 읽는다: 한/영이 한글이어도(e.key 가 ㅇ·ㄹ·ㅓ·ㅏ) 같은 줄이 눌리고, 누를 때와 뗄 때 같은 열쇠를 쓴다
  const HANGUL_KEY = { 'ㅇ': 'KeyD', 'ㄹ': 'KeyF', 'ㅓ': 'KeyJ', 'ㅏ': 'KeyK' };
  function keyId(e) {
    if (e.code) return e.code;

  }
  function keyToLane(id) {
    if (nl() === 3) return { KeyF: 0, KeyJ: 1, KeyK: 2, KeyD: 0, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 1, ArrowRight: 2 }[id];

  }

    const k = e.key, kid = keyId(e);

    }
  });
  document.addEventListener('keyup', e => { const kid = keyId(e); if (!keyLane.has(kid)) return; const l = keyLane.get(kid); keyLane.delete(kid); if (state === 'play') release(l, posAtEvent(e.timeStamp) - off, 'k' + kid); else laneDown[l] = Math.max(0, laneDown[l] - 1); });

  // ═══════ 시험 봇: 노트마다 미리 정한 실수(빗나감 σ·놓침 확률·긴 노트 일찍 떼기)로 판정 함수를 직접 부른다 ═══════
  const BOT = { on: false, sigma: 0.03, miss: 0, early: 0 };
  function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

  function botTick() {
    for (const n of notes) {
      if (n.t - 0.5 > vis) break;
      const b = n.bot || (n.bot = botPlan()); if (b.skip) continue;

    }

  }

  // ═══════ 매 프레임 ═══════
  // 절전: 놀이 중이 아니면(카드가 떠 있을 때) 상태가 바뀐 뒤 1초만 매 프레임, 그 뒤엔 0.2초에 한 번만 그린다 (박자 맞추기 cal 은 매 프레임)
  let pwKey = '', pwAt = 0, pwLast = 0;
  function pwSkip(now, key, active) {
    if (key !== pwKey) { pwKey = key; pwAt = now; }
    if (active || now - pwAt < 1000 || now - pwLast >= 200) { pwLast = now; return false; }
    return true;
  }
  window.addEventListener('resize', () => { pwAt = performance.now(); });   // 화면이 바뀌면 다시 1초 동안 매 프레임
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (manual) { draw(); drawKong(); return; }
    if (state !== 'pause') { tAnim += dt; update(dt); }
    if (!KG.soundOn && MU.ctx && MU.ctx.state === 'running') { try { MU.ctx.suspend(); } catch (e) {} }
    if (pwSkip(now, state, state === 'play' || state === 'over' || state === 'cal')) { drawKong(); return; }   // 솎는 프레임에도 콩이(SVG)는 매 프레임 — 카드 밖으로 보이고 기분 타이머도 제때 준다
    draw(); drawKong();
  }

  // ═══════ 처음 화면 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew; paintHow();
  }
  // 시작 카드 둘째 줄: 그 난이도에 나오는 노트만 말한다 (Easy 는 긴 노트·뼈다귀가 없다)
  function paintHow() {

  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; LC = D.lanes === 3 ? LC3 : LC4; layout(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; LC = D.lanes === 3 ? LC3 : LC4;
  layout(); paintBest(); paintHud(); paintCalNow();
  const RULES = { key: KEY, title: TITLE, lead: '음악에 맞춰 내려오는 발자국을 누르는 놀이예요.', items: [
    ['🐾', '발자국이 아래 선에 닿을 때 그 줄을 눌러요. 줄 아래쪽 넓은 판 어디를 눌러도 돼요' + (KEYS_OK ? ' (D F J K).' : '.')],
    ['🦴', '긴 노트는 끝까지 꾹(Normal 부터), 뼈다귀 두 개는 함께 눌러요(Hard 부터).'],
    ['💖', '놓치면 기운이 줄고, 다 떨어지면 끝! 딱 맞히면 조금씩 다시 차요.'],
    ['🎚️', '박자가 어긋나 보이면 시작 카드의 「박자 맞추기」로 폰에 맞춰요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, STYLES, get state() { return state; }, get score() { return score; }, get combo() { return combo; }, get maxCombo() { return maxCombo; }, get energy() { return energy; },
    get pos() { return pos; }, get vis() { return vis; }, get off() { return off; }, get secIdx() { return secIdx; }, get diff() { return diffId; }, get clock() { return CLK.src; },
    get missLog() { return missLog; }, get counts() { return { perfect: nPf, good: nGd, miss: nMs }; }, get notes() { return notes; }, get sections() { return sections.map(s => ({ i: s.i, t0: s.t0, tN: s.tN, t1: s.t1, bpm: s.bpm, name: s.name, tr: s.tr })); },
    field: () => ({ W, H, wide, fx0, fw, laneW, fTop, fBot, jY, NRAD, KSZ, kx, ky, lanes: nl(), laneX: Array.from({ length: nl() }, (_, l) => laneX(l)), padY: (jY + NRAD + 8 + fBot) / 2, hudL: hudL.getBoundingClientRect().toJSON(), hudR: hudR.getBoundingClientRect().toJSON() }),
    bot: (o) => { Object.assign(BOT, o || {}); BOT.on = o ? o.on !== false : true; for (const n of notes) n.bot = null; },
    start, end, pause, resume, press: (l, t) => press(l, t == null ? vis : t, 'g' + l), release: (l, t) => release(l, t == null ? vis : t, 'g' + l),
    // 화면 없이 빨리 돌리기: 시계를 직접 센 시간으로 바꾼다 (한 번 부르면 그 판은 계속 이 시계)
    step: dt => { if (!manual) { const p = state === 'play' ? clockPos() : 0; manual = true; manualT = 0; clockSet(p, 'manual'); busKill(); } manualT += dt; tAnim += dt; update(dt); },
    realtime: () => { manual = false; clockSet(clockPos(), wantSrc()); },
    calPos: () => clockPos()
  };
})();
