<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 간식컬링</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 간식컬링: 밤하늘(bg) → 탁자·간식(cv) → 콩이(stage) → 끄는 화살표·날아가는 간식·글자(fx) → 점수판 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .tr i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE2A8, #D99A4E 75%); box-shadow: inset 0 0 0 1px rgba(120,70,20,.4); flex: none; transition: opacity .2s, transform .2s; }
#hud .tr i.j { background: radial-gradient(circle at 35% 30%, #E9907A, #9C402B 75%); }
#hud .tr i.off { opacity: .22; transform: scale(.8); }
#hud .sc.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud .wd { color: #D5DBFF; font-weight: 500; font-size: 13px; }
#hud .wd b { color: #fff; font-weight: 700; }
#hud .wd svg { width: 20px; height: 14px; display: block; transition: transform .25s; }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card #edText { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="간식을 접시 쪽으로 밀어 보내는 탁자"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>점</small></div>
  <div class="tr" id="hudTr"></div>
  <div class="wd" id="hudWind" hidden><span>킁킁바람</span><svg id="windSvg" viewBox="0 0 22 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h17M13.5 2.5L19 7l-5.5 4.5"/></svg><b id="windN">1</b></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 간식컬링</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>간식을 누른 채 접시 쪽으로 휙</b> 밀었다 놓아요.</p>
      <p id="stKeys" hidden><b>← →</b> 방향 · <b>↑ ↓</b> 세기 · <b>스페이스</b> 밀기</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">간식을 다 밀었어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>한가운데<b id="edCenter"></b></span><span id="edEatBox">냠냠<b id="edEat"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, pick, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'curl', TITLE = J(name, '의') + ' 간식컬링';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 탁자: 폭 40 × 길이 100 단위 (y=0 이 먼 끝·접시 쪽, y=100 이 내 쪽). 세로 화면은 그대로, 가로 화면은 왼쪽→오른쪽으로 눕혀 그린다 ═══════
  const TW = 40, TL = 100, PR = 3, HT = 1 / 120, N = 5;          // 탁자 폭·길이 · 간식 반지름 · 물리 한 걸음(초) · 한 판 간식 수
  const START = { x: 20, y: 90 }, HOG = 74, SHORT = 56, PC = { x: 20, y: 24 };   // 출발점 · 여기까지 밀고 놓기(손 떼는 선) · 이 선을 못 넘으면 콩이 몫 · 접시 가운데
  const RING = [3.2, 6.4, 9.6, 13], RPTS = [100, 50, 25, 10];   // 접시 고리 반지름(Normal 기준) · 점수
  const A0 = 5, VMIN = 22, VMAX = 300, GAIN = 0.8;              // 늘 걸리는 마찰(감속) · 너무 약한 밀기 · 가장 센 밀기 · 손가락 빠르기 → 간식 빠르기 배율
  const WZ0 = 34, WZ1 = 68, WSTEP = 7;                          // 킁킁바람이 부는 곳(y) · 바람 한 단계의 세기
  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   ring 접시 고리 크기 배율 · k 미끄럼 마찰(빠를수록 더 깎임: 작을수록 멀리·오래 미끄러져 부딪힘이 커진다) · rails 긴 옆면 울타리(튕겨 나옴)
  //   cups 길을 막는 컵 수 · wind 킁킁바람 최대 단계(0 이면 없음) · guide 끄는 동안 보이는 도움('path' 멈출 자리까지 · 'mark' 세기 막대에 접시 표시 · 'none' 세기만)
  const DIFF = {
    easy:   { ring: 1.30, k: 1.70, rails: true,  cups: 0, wind: 0, guide: 'path' },
    normal: { ring: 1.00, k: 1.50, rails: false, cups: 0, wind: 0, guide: 'mark' },
    hard:   { ring: 0.85, k: 1.35, rails: false, cups: 1, wind: 0, guide: 'none' },
    vhard:  { ring: 0.68, k: 1.20, rails: false, cups: 2, wind: 3, guide: 'none' }
  };
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '간식을 휙 밀어 접시 한가운데에 멈춰요. 한 판에 간식 5개!';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 140);
  for (let i = 0; i < N; i++) { const e = document.createElement('i'); if (i % 2) e.className = 'j'; $('hudTr').appendChild(e); }

  // ═══════ 상태 ═══════
  // 절전(11-25): 놀이 중이 아니면(카드가 떠 있을 때) 상태·화면 크기가 바뀐 뒤 1초만 매 프레임 그리고, 그 뒤로는 0.2초에 한 번만 그린다
  let lzKey = '', lzAt = 0, lzLast = 0;
  function lzWake() { lzAt = performance.now(); }
  function lzDraw(now, key) {   // key: 놀이 중이면 '' (늘 그림), 아니면 상태 이름
    if (key !== lzKey) { lzKey = key; lzAt = now; }
    if (!key || now - lzAt < 1000 || now - lzLast >= 200) { lzLast = now; return true; }
    return false;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lzWake(); });
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.kg-diff')) lzWake(); }, true);   // 카드에서 난이도를 바꾸면 카드 뒤 장면도 바로 매 프레임 그린다
  let state = 'ready', phase = 'aim';     // state: ready · play · pause · over · result   phase: aim · roll · next · done
  let pucks = [], cur = null, cups = [], anims = [], floats = [];
  let score = 0, thrown = 0, eaten = 0, acc = 0, rollT = 0, nextT = 0, overT = 0, shortDone = false, tAnim = 0, overAt = 0, isNew = false, quit = false;
  let wind = { dir: 1, lv: 0 };
  let lastShot = null, rollPred = null;   // 지난번 샷(갈 거리·멈춘 자리) · Easy: 놓은 직후 잠깐 보여 줄 예상 길
  let mood = 'idle', moodT = 0, eatT = 0, lastVoice = -99;
  let W = 0, H = 0, DPR = 1, S = 5, ox = 0, oy = 0, wide = false, SAF = { t: 0, b: 0, l: 0, r: 0 }, KSZ = 140, kx = 0, ky = 0;
  const stat = document.createElement('canvas'), sg = stat.getContext('2d');   // 탁자·접시·컵 (판마다 한 번 그려 둔다)

  // ── 좌표 바꾸기 (탁자 단위 ↔ 화면 px)
  const toScreen = (x, y) => wide ? { x: ox + (TL - y) * S, y: oy + x * S } : { x: ox + x * S, y: oy + y * S };
  const dScreenToWorld = (dx, dy) => wide ? { x: dy / S, y: -dx / S } : { x: dx / S, y: dy / S };
  const vWorldToScreen = (vx, vy) => wide ? { x: -vy * S, y: vx * S } : { x: vx * S, y: vy * S };
  function setWorld(c) { if (wide) c.setTransform(0, S * DPR, -S * DPR, 0, (ox + TL * S) * DPR, oy * DPR); else c.setTransform(S * DPR, 0, 0, S * DPR, ox * DPR, oy * DPR); }
  const ringR = i => RING[i] * D.ring;
  function ptsAt(x, y) { const d = Math.hypot(x - PC.x, y - PC.y); for (let i = 0; i < 4; i++) if (d <= ringR(i)) return RPTS[i]; return 0; }

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function buildBg() {
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.55, '#1B2060'); lg.addColorStop(1, '#3F3790');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.2, H * 0.18, Math.max(W, H) * 0.5, 'rgba(130,130,255,.14)'); blob(W * 0.85, H * 0.8, Math.max(W, H) * 0.45, 'rgba(255,170,120,.10)');
    const rnd = mulberry32(53), n = Math.round(clamp(W * H / 2600, 80, 420));
    for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * H, r = rnd() < 0.07 ? 1.1 + rnd() * 0.7 : 0.4 + rnd() * 0.7; c.globalAlpha = 0.3 + rnd() * 0.6; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
    // 탁자 밑 둥근 깔개 (콩이 자리까지 이어지는 느낌)
    const t0 = toScreen(0, TL), t1 = toScreen(TW, 0), cx = (t0.x + t1.x) / 2, cy = (t0.y + t1.y) / 2, rw = Math.abs(t1.x - t0.x) / 2 + 26, rh = Math.abs(t1.y - t0.y) / 2 + 26;
    c.fillStyle = 'rgba(255,214,170,.07)'; c.beginPath(); c.ellipse(cx, cy, rw, rh, 0, 0, TAU); c.fill();
  }
  function layout() {
    lzWake();
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H * 1.1;
    const titled = wide && W >= 760, top = SAF.t + 62 + (titled ? 46 : 0);   // 넓은 가로 화면: 위 줄 가운데에 제목을 두고 점수판은 그 아래로
    if (wide) {   // 가로: 왼쪽 기둥에 콩이, 오른쪽에 눕힌 탁자(내 쪽이 왼쪽, 접시가 오른쪽). 점수판은 위 줄 가운데
      const kw = clamp(W * 0.15, 84, 170);
      const aw = W - SAF.l - SAF.r - kw - 20, ah = H - top - SAF.b - 10;
      S = Math.max(2, Math.min(aw / (TL + 3.4), ah / (TW + 3.4), 9));   // + 테두리·울타리 몫
      const tw = TL * S, th = TW * S;
      ox = SAF.l + kw + 10 + (aw - tw) / 2; oy = top + (ah - th) / 2;
      hud.style.top = (SAF.t + (titled ? 66 : 16)) + 'px'; hud.style.left = (W / 2) + 'px';
      KSZ = clamp(Math.min(kw * 1.05, H * 0.42), 70, 170); kx = SAF.l + kw / 2 + 6; ky = Math.min(H - SAF.b - 6, oy + th + 6);
    } else {      // 세로: 위에 점수판, 가운데 세운 탁자, 아래 콩이
      const hudH = 42, ka = clamp(H * 0.16, 80, 150);
      const ah = H - top - hudH - ka - SAF.b - 6, aw = W - SAF.l - SAF.r - 24;
      S = Math.max(2, Math.min(ah / (TL + 3.4), aw / (TW + 3.4), 9));
      const tw = TW * S, th = TL * S;
      ox = (W - tw) / 2 + (SAF.l - SAF.r) / 2; oy = top + hudH + Math.max(0, ah - th) * 0.35;
      hud.style.top = (top - 4) + 'px'; hud.style.left = (W / 2) + 'px';
      KSZ = clamp(ka * 1.02, 70, 160); kx = Math.min(W - SAF.r - KSZ * 0.32, ox + tw * 0.86); ky = H - SAF.b - 4;

  const kb = { on: false, ang: 0, pw: 0.75 };
  let lastRel = null;   // 시험용: 마지막으로 뗀 손가락
  function sample(e) { drag.samples.push({ t: e.timeStamp, x: e.clientX, y: e.clientY }); if (drag.samples.length > 40) drag.samples.shift(); }
  function fingerVel(now) {
    const sm = drag.samples; if (sm.length < 2) return { x: 0, y: 0 };
    const lastS = sm[sm.length - 1]; if (now - lastS.t > 70) return { x: 0, y: 0 };   // 멈췄다 뗐다
    let o = sm[sm.length - 2]; for (let i = sm.length - 2; i >= 0; i--) { if (lastS.t - sm[i].t > 90) break; o = sm[i]; }
    // 멈췄다가 한 번에 튕긴 손짓: 그 긴 틈을 그대로 나누면 아주 약한 밀기가 되므로 틈을 50ms 로 자른다
    const gap = lastS.t - o.t, dt = (gap > 90 ? 50 : Math.max(8, gap)) / 1000; return { x: (lastS.x - o.x) / dt, y: (lastS.y - o.y) / dt };
  }
  function moveTo(e) {
    const dw = dScreenToWorld(e.clientX - drag.sx, e.clientY - drag.sy);
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
    const nx = clamp(drag.px + dw.x, PR + 0.5, TW - PR - 0.5), ny = drag.py + dw.y;
    const fv = fingerVel(e.timeStamp), wv = dScreenToWorld(fv.x, fv.y); drag.vwx = wv.x * GAIN; drag.vwy = wv.y * GAIN;
    if (ny < HOG) { cur.x = nx; cur.y = HOG; return true; }   // 놓는 선에 닿았다
    cur.x = nx; cur.y = Math.min(ny, TL - PR - 1);
    return false;
  }
  function release(e) {
    const fv = fingerVel(e ? e.timeStamp : performance.now()), wv = dScreenToWorld(fv.x, fv.y);
    const vx = wv.x * GAIN, vy = wv.y * GAIN, sp = Math.hypot(vx, vy), moved = drag.moved;
    lastRel = { t: e ? e.timeStamp : 0, vx, vy, samples: drag.samples.slice(-8) };
    drag.on = false; drag.id = null; drag.moved = false;
    if (state !== 'play' || phase !== 'aim' || !cur) return;
    if (sp >= VMIN && vy < -4 && -vy > Math.abs(vx) * 0.25) { shoot(vx, vy); return; }
    // 취소: 간식은 놓은 자리에 그대로 (선에 닿아 저절로 놓였는데 약하면 출발점으로)
    if (cur.y <= HOG + 0.01) { cur.y = HOG + 4; }
    const s = toScreen(cur.x, cur.y);
    if (moved && sp >= VMIN) { addFloat(s.x, s.y - 26, '접시 쪽으로 밀어요', '#FFD2D6'); tone(240, 0.08, 'sine', 0.03); }
    else if (moved && sp > 6) { addFloat(s.x, s.y - 26, '더 세게 휙 밀어요', '#FFD2D6'); tone(240, 0.08, 'sine', 0.03); }
  }
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    if (phase !== 'aim' || !cur || drag.on) return;
    try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    drag.on = true; drag.id = e.pointerId; drag.sx = e.clientX; drag.sy = e.clientY; drag.px = cur.x; drag.py = cur.y; drag.samples = []; drag.moved = false; drag.vwx = drag.vwy = 0; kb.on = false;
    sample(e);
  });
  fx.addEventListener('pointermove', e => {
    if (!drag.on || e.pointerId !== drag.id) return;
    if (state !== 'play' || phase !== 'aim' || !cur) { drag.on = false; return; }
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    for (const ev of list && list.length ? list : [e]) { sample(ev); if (moveTo(ev)) { release(ev); return; } }
  });
  fx.addEventListener('pointerup', e => { if (!drag.on || e.pointerId !== drag.id) return; const ls = drag.samples[drag.samples.length - 1]; if (!ls || ls.x !== e.clientX || ls.y !== e.clientY) sample(e); if (state === 'play' && phase === 'aim' && cur && moveTo(e)) { release(e); return; } release(e); });
  fx.addEventListener('pointercancel', e => { if (e.pointerId === drag.id) { drag.on = false; drag.id = null; drag.moved = false; } });
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown') {
      if (state !== 'play') { if (state === 'pause') e.preventDefault(); return; }
      e.preventDefault(); if (phase !== 'aim' || drag.on || !cur) return;
      kb.on = true;
      const lr = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, ud = k === 'ArrowUp' ? 1 : k === 'ArrowDown' ? -1 : 0;
      // 가로 화면은 탁자가 누워 있으니 화면의 위·아래가 탁자의 옆이다
      const side = wide ? -ud : lr, power = wide ? lr : ud;
      if (e.shiftKey && side) cur.x = clamp(cur.x + side, PR + 0.5, TW - PR - 0.5);
      else if (side) kb.ang = clamp(kb.ang + side, -35, 35);
      if (power) kb.pw = clamp(kb.pw + power * 0.01, 0.1, 1.3);
    } else if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (state === 'play') {
        e.preventDefault(); if (KG.rulesOpen) return;
        if (phase === 'aim' && cur && !drag.on) { if (!kb.on) kb.on = true; else { const v = aimVel(); if (v) shoot(v.vx, v.vy); } }
        return;
      }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
  }
  function onDiff() { paintBest(); if (state === 'ready') { D = DIFF[KG.diff()] || DIFF.normal; makeCups(); buildStatic(); } }
  $('stRec').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);   // 결과 카드 바로 아래(가로 낮은 화면은 오른쪽) 가족 순위 — 방금 판 난이도
  KG.startRank($('cardStart'), KEY);   // 시작 카드 아래에 고른 난이도의 가족 순위
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal; makeCups();
  layout(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '간식을 미끄러뜨려 접시 한가운데에 멈추는 놀이예요.', items: [
    ['👆', '간식을 누른 채 접시 쪽으로 휙 밀었다 놓아요. 손가락이 빠를수록 멀리 가요' + (KEYS_OK ? ' (방향키·스페이스도 돼요).' : '.')],
    ['🎯', '가운데부터 100·50·25·10점. 5개를 다 밀고 나서 접시 위 간식 점수를 더해요.'],
    ['💥', '부딪히면 서로 밀려나요. 탁자에서 떨어지거나 점선을 못 넘으면 ' + J(name, '이/가') + ' 냠!'],
    ['🥤', 'Hard 는 컵이 길을 막고, Very Hard 는 킁킁바람이 옆으로 밀어요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get thrown() { return thrown; }, get eaten() { return eaten; }, get diff() { return diffId; }, get D() { return D; },
    get cups() { return cups; }, get lastRel() { return lastRel; }, get lastShot() { return lastShot; }, get wind() { return wind; }, get anims() { return anims.length; },
    pucks: () => pucks.map(p => ({ x: +p.x.toFixed(2), y: +p.y.toFixed(2), st: p.st, pts: p.pts, n: p.n })),
    field: () => ({ W, H, S, ox, oy, wide, KSZ, kx, ky, table: [toScreen(0, 0), toScreen(TW, TL)], hud: hud.getBoundingClientRect().toJSON() }),
    toScreen, travel, speedFor, start, end, pause, resume, over: showResult,
    shoot: (vx, vy) => shoot(vx, vy), place: (x) => { if (cur && phase === 'aim') cur.x = clamp(x, PR + 0.5, TW - PR - 0.5); },
    // 풀이: 지금 자리에서 (x, y) 에 멈추는 빠르기 (바람·부딪힘 없이)
    aimAt: (x, y) => { if (!cur) return null; const dx = x - cur.x, dy = y - cur.y, d = Math.hypot(dx, dy), v = speedFor(d, D.k); return { vx: dx / d * v, vy: dy / d * v }; },
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
</body>
</html>
