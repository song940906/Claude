<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 산책행렬</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 산책행렬: 밤 공원(bg) → 잔디·울타리·화단(cv, 판마다 한 번 그린 그림 + 간식·친구들) → 콩이(stage) → 안내·글자(fx, 손가락 받기) → 점수판 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .sc svg { width: 18px; height: 16px; display: block; }
#hud .sc.bump { animation: scBump .35s; }
#hud .sc.gold { background: rgba(176,122,0,.75); }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.kg-card .unit { margin: 0; font-size: 13px; color: var(--sub); }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .unit { display: none; }
  body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; }
  body .kg-rbwrap > .kg-card .rec span { white-space: nowrap; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="콩이와 친구들이 산책하는 공원. 화면을 밀어 방향을 바꿔요"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><svg viewBox="0 0 18 16" fill="#FFC861"><ellipse cx="9" cy="11" rx="4.2" ry="3.4"/><circle cx="3.6" cy="6.4" r="1.9"/><circle cx="7" cy="3.4" r="1.9"/><circle cx="11" cy="3.4" r="1.9"/><circle cx="14.4" cy="6.4" r="1.9"/></svg><small>친구</small><span id="hudN">0</span><small>마리</small></div>
  <div class="bs" id="hudBs"><small>최고</small><span id="hudBest">0</span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 산책행렬</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>화면을 위·아래·왼쪽·오른쪽으로 밀어</b> 방향을 바꿔요.</p>
      <p id="stKeys" hidden><b>방향키 · WASD</b> 방향 · <b>P</b> 멈춤</p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">산책 끝!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edN">0</span><small>마리</small></div>
    <p class="unit" id="edUnit">행렬에 함께 선 친구 수</p>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>간식<b id="edEat"></b></span><span>황금 간식<b id="edGold"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const KEY = 'parade', TITLE = J(name, '의') + ' 산책행렬';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   wrap 울타리를 지나 반대편으로 나온다(Easy) · obs 장애물 칸 비율(판 넓이 기준) · v0 처음 빠르기(칸/초) · inc 친구 한 마리마다 더해지는 빠르기 · vmax 가장 빠른 빠르기
  //   gold 황금 간식이 나오기까지 먹을 간식 수 [최소, 최대] · goldT 황금 간식이 머무는 시간(초, 달리는 동안만 줄어든다)
  const DIFF = {
    easy:   { wrap: true,  obs: 0,     v0: 3.6, inc: 0.08, vmax: 6.5,  gold: [3, 5], goldT: 8 },
    normal: { wrap: false, obs: 0,     v0: 4.4, inc: 0.10, vmax: 8.0,  gold: [4, 6], goldT: 7 },
    hard:   { wrap: false, obs: 0.035, v0: 5.0, inc: 0.11, vmax: 9.0,  gold: [4, 7], goldT: 6.5 },
    vhard:  { wrap: false, obs: 0.065, v0: 6.0, inc: 0.12, vmax: 10.5, gold: [5, 8], goldT: 6 }
  };
  const GOLD_ADD = 2;   // 황금 간식 = 친구 2마리
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '간식을 먹을 때마다 친구 강아지가 ' + J(name, '을/를') + ' 줄줄이 따라와요. 울타리와 내 행렬은 조심!';
  $('edUnit').textContent = '행렬에 함께 선 친구 수 (' + J(name, '은/는') + ' 빼고)';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 60);
  const HAS_REAR = K.has('rear');
  const stat = document.createElement('canvas'), sg = stat.getContext('2d');   // 잔디·울타리·장애물 (판마다 한 번)

  // ═══════ 상태 ═══════
  let state = 'ready', phase = 'wait';   // state: ready · play · pause · over · result   phase: wait(밀면 출발) · run · dead
  let cols = 12, rows = 18, gridFixed = false;   // 판이 시작되면 칸 수는 그대로 (화면이 바뀌면 칸 크기만 다시 맞춘다)
  let body = [], prev = [], pups = [], dir = { x: 1, y: 0 }, queue = [], grow = 0;
  let food = null, gold = null, nextGold = 4, obs = new Set(), shapes = [];
  let count = 0, eatN = 0, goldN = 0, acc = 0, stepT = 0.2, sps = 5, walkPh = 0, face = 1, isNew = false, quit = false;
  let deadT = 0, deadWhy = '', deadDir = { x: 0, y: 0 }, overT = 0, overAt = 0, tAnim = 0, floats = [], crumbs = [], waitHintT = 0, eatT = 0, backHintAt = -9, kClip = '';
  let W = 0, H = 0, DPR = 1, SAF = { t: 0, b: 0, l: 0, r: 0 }, cell = 24, bx = 0, by = 0, fence = 8, wide = false;
  const START = () => ({ x: Math.max(1, Math.floor(cols * 0.25)), y: Math.floor(rows / 2) });

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function area() {   // 놀이판이 쓸 수 있는 네모 (위 줄·점수판 아래)
    const titled = wide && W >= 760;
    let top, hudTop;
    if (wide) { hudTop = SAF.t + (titled ? 66 : 16); top = SAF.t + 62 + (titled ? 46 : 0); }
    else { hudTop = SAF.t + 62; top = hudTop + 42; }
    return { top, hudTop, x0: SAF.l + 8, w: W - SAF.l - SAF.r - 16, h: H - top - SAF.b - 10 };
  }
  function layout() {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2); SAF = safe();
    wide = W > H * 1.1;
    const a = area();
    if (!gridFixed) {   // 칸 수 정하기: 짧은 쪽이 13칸 남짓, 칸은 22~44px (손가락으로 보고 고르기 좋은 크기)
      const c0 = clamp(Math.min(a.w, a.h) / 13, 22, 44), f0 = c0 * 0.36;
      cols = clamp(Math.floor((a.w - 2 * f0) / c0), 8, 26); rows = clamp(Math.floor((a.h - 2 * f0) / c0), 8, 26);
    }
    const oldCell = cell;
    cell = Math.max(8, Math.min((a.w) / (cols + 0.72), (a.h) / (rows + 0.72), 44)); fence = cell * 0.36;
    if (state === 'play' && phase === 'run' && Math.abs(cell - oldCell) > oldCell * 0.15) setTimeout(pause, 0);   // 판 도중 화면을 돌리면 잠깐 멈춘다 (칸 수는 그대로라 칸 크기가 바뀐다)
    bx = Math.round(a.x0 + (a.w - cols * cell) / 2); by = Math.round(a.top + (a.h - rows * cell) / 2);
    hud.style.top = a.hudTop + 'px'; hud.style.left = (W / 2) + 'px';
    bar.setTitle(wide ? (W < 760 ? '' : TITLE) : W < 350 ? '산책행렬' : TITLE);   // 낮은 가로 화면은 점수판이 위 줄 가운데에 들어가니 제목을 지운다
    for (const c of [cv, fx]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    stat.width = cv.width; stat.height = cv.height;
    K.setSize(Math.round(cell * 2.1));
    buildBg(); buildStatic();
  }
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));

  function buildBg() {
    bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    const c = bg.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = c.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#0B1030'); lg.addColorStop(0.6, '#18245A'); lg.addColorStop(1, '#1F3A5A');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    const blob = (x, y, r, col) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(x - r, y - r, r * 2, r * 2); };
    blob(W * 0.15, H * 0.12, Math.max(W, H) * 0.5, 'rgba(130,130,255,.13)'); blob(W * 0.9, H * 0.9, Math.max(W, H) * 0.45, 'rgba(120,220,170,.08)');
    const rnd = mulberry32(77), n = Math.round(clamp(W * H / 2800, 70, 380));
    for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * H, r = rnd() < 0.07 ? 1.1 + rnd() * 0.7 : 0.4 + rnd() * 0.7; c.globalAlpha = 0.25 + rnd() * 0.55; c.fillStyle = rnd() < 0.3 ? '#FFE9C4' : '#EAF0FF'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
    c.globalAlpha = 1;
    // 공원 가로등 불빛 (판 네 귀퉁이 근처)
    const bw = cols * cell, bh = rows * cell;
    for (const [x, y] of [[bx, by], [bx + bw, by], [bx, by + bh], [bx + bw, by + bh]]) blob(x, y, cell * 4, 'rgba(255,214,140,.10)');
  }
  function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function buildStatic() {
    const c = sg; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, stat.width, stat.height); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bw = cols * cell, bh = rows * cell;
    // 그림자 + 잔디
    c.save(); c.shadowColor = 'rgba(4,6,24,.55)'; c.shadowBlur = 18; c.shadowOffsetY = 6; c.fillStyle = '#24563F'; rr(c, bx - fence, by - fence, bw + fence * 2, bh + fence * 2, fence * 1.2); c.fill(); c.restore();
    c.fillStyle = '#2F6B4C'; c.fillRect(bx, by, bw, bh);
    c.fillStyle = 'rgba(255,255,255,.045)'; for (let y = 0; y < rows; y++) for (let x = (y % 2); x < cols; x += 2) c.fillRect(bx + x * cell, by + y * cell, cell, cell);
    const rnd = mulberry32(5 + cols * 31 + rows); c.strokeStyle = 'rgba(160,230,170,.18)'; c.lineWidth = 1; c.lineCap = 'round';
    for (let i = 0; i < cols * rows * 0.5; i++) { const x = bx + rnd() * bw, y = by + rnd() * bh, l = cell * 0.12; c.beginPath(); c.moveTo(x, y); c.lineTo(x - l * 0.4, y - l); c.moveTo(x, y); c.lineTo(x + l * 0.3, y - l * 0.9); c.stroke(); }
    // 울타리: 나무 울타리(부딪히면 끝) · Easy 는 낮은 산울타리 점선(지나가면 반대편으로)
    if (!D.wrap) {
      c.strokeStyle = '#C08A55'; c.lineWidth = Math.max(2, fence * 0.42); c.lineJoin = 'round';
      c.strokeRect(bx - fence * 0.5, by - fence * 0.5, bw + fence, bh + fence);
      c.strokeStyle = 'rgba(255,236,200,.45)'; c.lineWidth = Math.max(1, fence * 0.12); c.strokeRect(bx - fence * 0.62, by - fence * 0.62, bw + fence * 1.24, bh + fence * 1.24);
      c.fillStyle = '#E3B47E'; const post = (x, y) => { c.beginPath(); c.arc(x, y, fence * 0.42, 0, TAU); c.fill(); };
      for (let x = 0; x <= cols; x += 2) { post(bx + x * cell, by - fence * 0.5); post(bx + x * cell, by + bh + fence * 0.5); }
      for (let y = 0; y <= rows; y += 2) { post(bx - fence * 0.5, by + y * cell); post(bx + bw + fence * 0.5, by + y * cell); }
    } else {
      c.strokeStyle = 'rgba(150,230,170,.75)'; c.lineWidth = Math.max(2, fence * 0.32); c.setLineDash([cell * 0.35, cell * 0.3]); c.lineCap = 'round';
      c.strokeRect(bx - fence * 0.5, by - fence * 0.5, bw + fence, bh + fence); c.setLineDash([]);
    }
    for (const s of shapes) drawShape(c, s);
  }
  function drawShape(c, s) {
    const x = bx + s.x * cell, y = by + s.y * cell, w = s.w * cell, h = s.h * cell, p = cell * 0.08;

  // ═══════ 판 만들기: 장애물은 울타리·서로에게서 한 칸씩 떨어뜨린다 (그래서 막힌 골목·갇힌 칸이 생기지 않는다). 출발 줄과 그 위아래 줄은 비운다 ═══════

  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);   // 결과 카드 바로 아래(가로 낮은 화면은 오른쪽) 가족 순위 — 방금 판 난이도
  KG.startRank($('cardStart'), KEY);   // 시작 카드 아래에 고른 난이도의 가족 순위
  diffId = KG.diff(); D = DIFF[diffId] || DIFF.normal;
  layout(); resetBoard(); paintBest(); paintHud(); hud.hidden = true;
  const RULES = { key: KEY, title: TITLE, lead: J(name, '이/가') + ' 앞장서고 친구 강아지들이 줄줄이 따라오는 산책 놀이예요.', items: [
    ['👆', '화면을 위·아래·왼쪽·오른쪽으로 밀면 ' + J(name, '이/가') + ' 그쪽으로 꺾어요' + (KEYS_OK ? ' (방향키·WASD 도 돼요).' : '.')],
    ['🦴', '간식을 먹을 때마다 친구가 한 마리씩 뒤에 붙어요. 잠깐 나오는 황금 간식은 친구 2마리!'],
    ['💥', '울타리나 내 행렬에 부딪히면 산책 끝. 행렬이 길어질수록 조금씩 빨라져요. 기록은 끝날 때 친구 수예요.'],
    ['🌷', 'Easy 는 울타리를 지나 반대편으로 나와요. Hard 부터 화단·벤치가 길을 막고, Very Hard 는 더 빠르고 많아요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  window.GAME = {
    DIFF, get state() { return state; }, get phase() { return phase; }, get count() { return count; }, get diff() { return diffId; }, get D() { return D; },
    get dir() { return dir; }, get queue() { return queue.slice(); }, get food() { return food; }, get gold() { return gold; }, get sps() { return sps; }, get deadWhy() { return deadWhy; },
    body: () => body.map(b => [b.x, b.y]), obs: () => [...obs], shapes: () => shapes.slice(),
    field: () => ({ W, H, cell, cols, rows, bx, by, bw: cols * cell, bh: rows * cell, fence, wide, hud: hud.getBoundingClientRect().toJSON() }),
    cellC, start, end, pause, resume, pushDir, go, over: showResult,
    setFood: (x, y) => { food = x == null ? null : { x, y, t: 0, ph: 0 }; }, setGold: (x, y) => { gold = { x, y, life: D.goldT, max: D.goldT, t: 0 }; },
    step: dt => { tAnim += dt; update(dt); }
  };
})();
</script>
</body>
</html>
