<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 볼링</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 볼링: 밤하늘(bg) → 레인·핀·공(cv) → 콩이(stage) → 손가락 자국·조준선·힘 막대·글자(fx) → 점수표 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#fx { z-index: 3; touch-action: none; }
/* 프레임 점수표: 작고 깔끔하게 (위 줄 아래, 낮은 가로 화면은 위 줄 가운데) */
#sheet { position: fixed; z-index: 10; display: grid; grid-template-columns: repeat(9, 1fr) 1.5fr; box-sizing: border-box; background: rgba(18,22,52,.66); border: 1px solid var(--glass-line); border-radius: 12px; overflow: hidden; pointer-events: none; font-variant-numeric: tabular-nums; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#sheet .fr { min-width: 0; text-align: center; transition: background .2s; }
#sheet .fr + .fr { border-left: 1px solid rgba(255,255,255,.1); }
#sheet .rl { display: flex; justify-content: flex-end; height: 16px; }
#sheet .rl span { flex: 0 0 50%; box-sizing: border-box; font-size: 11px; line-height: 16px; font-weight: 600; color: #C9D1F2; }
#sheet .rl span + span { border-left: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); border-bottom-left-radius: 3px; }
#sheet .f10 .rl span { flex-basis: 33.34%; }
#sheet .rl .x { color: #FFE08A; }
#sheet .rl .sp { color: #9EE6BC; }
#sheet .tt { height: 19px; line-height: 18px; font-size: 13px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
#sheet .fr.cur { background: rgba(255,200,97,.17); }
#sheet .fr.cur .tt { color: #FFE08A; }
#sheet.tight .rl span { font-size: 10px; }
#sheet.tight .tt { font-size: 12px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .dnote { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .dnote { margin-top: 5px; font-size: 12px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  #stDNote { display: none; }
}
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 4px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 6px; font-size: 12px; white-space: nowrap; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="볼링 레인 — 공을 위로 쭉 밀면 굴러가요"></canvas>

<div id="sheet" aria-hidden="true"></div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 볼링</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>위로 쭉 밀면</b> 공이 굴러가요. 길게 밀수록 세게 가요.</p>
      <p><b>옆으로 밀면</b> 공 자리를 옮기고, <b>휘게 그으면</b> 공도 휘어요.</p>
      <p id="stKeys" hidden><b>← →</b> 자리 · <b>Shift+← →</b> 방향 · <b>↑ ↓</b> 휘기 · <b>스페이스</b>를 눌렀다 떼면 굴려요.</p>
    </div>
    <p class="dnote" id="stDNote"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">이어 하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">10프레임을 마쳤어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>스트라이크<b id="edStrike"></b></span><span>스페어<b id="edSpare"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'bowling', TITLE = J(name, '의') + ' 볼링';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 레인: 위에서 본 세상. 단위 = 핀 사이 거리(약 30cm). x 는 오른쪽, y 는 파울 선(0)에서 핀 쪽으로 ═══════
  const L = 16;               // 파울 선 → 레인 끝(핀 뒤 구덩이)
  const BR = 0.36;            // 공 반지름
  const PR = 0.2, PRF = 0.3;  // 핀 반지름: 서 있을 때 · 쓰러져 누웠을 때(누운 핀이 옆 핀을 쓸어 간다)
  const BY = 0.7;             // 공이 출발하는 자리
  const GW = 0.42;            // 도랑 폭
  const HOOK_FROM = 4.5;      // 이 거리부터 공이 본격적으로 휜다
  const HDT = 1 / 240;        // 물리 한 걸음(초)

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   half 레인 반폭 · bump 범퍼(도랑 막이) · guide 조준선 길이(레인 길이 비율, 1 = 핀까지 휘는 길 전부) · wob/wobP 공 흔들림(각도°·힘 표준편차)
  //   tilt 프레임마다 바뀌는 레인 기울기 최대(칸/초²) · pinM/ballM 핀·공 무게 · knock 핀이 쓰러지는 빠르기 · sp 핀 사이 거리 · hook 휘는 힘 · vmin/vmax 공 빠르기
  const DIFF = {
    easy:   { half: 2.0,  bump: true,  guide: 1.0,  wob: 0,    wobP: 0,    tilt: 0,    pinM: 0.8,  ballM: 5.2, knock: 0.32, sp: 1.0,  hook: 2.4, vmin: 6, vmax: 15 },
    normal: { half: 1.85, bump: false, guide: 0.55, wob: 0.35, wobP: 0.02, tilt: 0,    pinM: 1.0,  ballM: 5.0, knock: 0.42, sp: 1.0,  hook: 2.2, vmin: 6, vmax: 15 },
    hard:   { half: 1.76, bump: false, guide: 0.25, wob: 0.8,  wobP: 0.04, tilt: 0,    pinM: 1.2,  ballM: 4.6, knock: 0.56, sp: 1.03, hook: 2.0, vmin: 6, vmax: 15 },
    vhard:  { half: 1.66, bump: false, guide: 0.08, wob: 1.15, wobP: 0.05, tilt: 0.6,  pinM: 1.4,  ballM: 4.2, knock: 0.7,  sp: 1.08, hook: 1.9, vmin: 6, vmax: 15 }
  };
  const DNOTE = { easy: '범퍼가 있어 도랑에 안 빠져요 · 조준선이 핀까지', normal: '조준선이 레인 절반까지 · 공이 살짝 흔들려요', hard: '짧은 조준선 · 넓은 도랑 · 무거운 핀', vhard: '조준선이 거의 없어요 · 프레임마다 레인이 기울어요' };
  const MASTER = { easy: 200, normal: 180, hard: 160, vhard: 120 };   // 「볼링 달인」: 이 난이도에서 한 판 이 점수 이상
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '공을 굴려 장난감 핀을 쓰러뜨려요. 10프레임, 최고 300점이에요.';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), sheet = $('sheet');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 90); K.setPose('stand');

  // 점수표 칸
  const cells = [];
  for (let i = 0; i < 10; i++) {
    const fr = document.createElement('div'); fr.className = 'fr' + (i === 9 ? ' f10' : '');
    const rl = document.createElement('div'); rl.className = 'rl';
    const boxes = []; for (let b = 0; b < (i === 9 ? 3 : 2); b++) { const s = document.createElement('span'); rl.appendChild(s); boxes.push(s); }
    const tt = document.createElement('div'); tt.className = 'tt';
    fr.appendChild(rl); fr.appendChild(tt); sheet.appendChild(fr);
    cells.push({ fr, boxes, tt });
  }

  // ═══════ 상태 ═══════
  let state = 'ready';        // ready · play · pause · over · result
  let phase = 'aim';          // aim · roll · settle · show · sweep
  let world = null;           // { ball, pins, D, tilt, hits }
  let rolls = [], frameI = 0, ballI = 0, standAtStart = 10, strikes = 0, spares = 0, isNew = false, quit = false, overT = 0, overAt = 0, phaseT = 0, tAnim = 0, throws = 0;
  let aim = { x: 0, ang: 0, spin: 0, pw: 0.6 };    // 놓기 전 공 자리·방향(°)·휘기(-1~1)·힘(0~1)
  let tilt = 0;               // 이번 프레임 레인 기울기(칸/초²)
  let mood = { kind: '', t: 0 }, floats = [], parts = [], lastResult = '';
  let W = 0, H = 0, DPR = 1, SAF = { t: 0, b: 0, l: 0, r: 0 }, S0 = 50, yN = 600, yF = 140, cx = 200, kP = 0.1, sFarV = 0.4, KSZ = 90, low = false, portrait = true, sheetBottom = 100, kongX = 50, kongY = 600;
  let lastCount = { n: 0, text: '' };

  // ═══════ 핀 놓기 ═══════
  const pinRow0 = d => L - 0.9 - 3 * 0.866 * d.sp;
  function rackPins(d) {
    const out = [], y0 = pinRow0(d);
    let n = 0;
    for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) { n++; out.push({ n, x: (i - r / 2) * d.sp, y: y0 + r * 0.866 * d.sp, vx: 0, vy: 0, r: PR, down: false, gone: false, rot: 0, spinR: 0, fade: 1, downT: 0, wob: 0 }); }
    return out;
  }
  function newBall(x, ang, pw, spin, d, tl) {
    const v = lerp(d.vmin, d.vmax, clamp(pw, 0, 1)), a = ang * Math.PI / 180;
    return { x, y: BY, vx: Math.sin(a) * v, vy: Math.cos(a) * v, spin: clamp(spin, -1, 1), gut: false, done: false, roll: 0, hit: false, tilt: tl || 0, t: 0 };
  }

  // ═══════ 물리 (world 하나만 바꾼다 — 시험 봇도 같은 함수로 미리 굴려 본다) ═══════
  function stepWorld(w, h) {
    const d = w.D, b = w.ball;
    if (b && !b.done) {
      b.t += h;
      if (b.gut) { b.y += b.vy * h; b.vy = Math.max(2, b.vy - 0.3 * h); }
      else {
        const hk = b.y > HOOK_FROM ? 1 : 0.2;
        b.vx += (-b.spin * d.hook * hk * (b.hit ? 0.3 : 1) + b.tilt) * h;
        b.vy = Math.max(0, b.vy - 0.12 * h);
        b.x += b.vx * h; b.y += b.vy * h;
        if (d.bump) { const lim = d.half - BR; if (Math.abs(b.x) > lim) { b.x = Math.sign(b.x) * lim; b.vx = -b.vx * 0.45; if (w.onBump) w.onBump(); } }
        else if (Math.abs(b.x) > d.half) { b.gut = true; b.x = Math.sign(b.x) * (d.half + GW / 2); b.vx = 0; if (w.onGutter) w.onGutter(); }
      }
      b.roll += Math.hypot(b.vx, b.vy) * h / BR;
      if (b.y > L + 0.6 || Math.hypot(b.vx, b.vy) < 0.15) b.done = true;
    }
    const ps = w.pins;
    // 공 ↔ 핀
    if (b && !b.done && !b.gut) for (const p of ps) {
      if (p.gone) continue;
      const dx = p.x - b.x, dy = p.y - b.y, rr = BR + p.r, dd = dx * dx + dy * dy;
      if (dd >= rr * rr || dd < 1e-9) continue;
      const dist = Math.sqrt(dd), nx = dx / dist, ny = dy / dist, rel = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
      const mb = d.ballM, mp = d.pinM;
      if (rel > 0) {
        const j = 1.55 * rel / (1 / mb + 1 / mp);
        b.vx -= j / mb * nx; b.vy -= j / mb * ny; p.vx += j / mp * nx; p.vy += j / mp * ny;
        b.hit = true; if (w.onHit) w.onHit(rel, p);
      }
      const ov = rr - dist, tm = mb + mp; b.x -= nx * ov * mp / tm; b.y -= ny * ov * mp / tm; p.x += nx * ov * mb / tm; p.y += ny * ov * mb / tm;
    }
    // 핀 ↔ 핀
    for (let i = 0; i < ps.length; i++) {
      const a = ps[i]; if (a.gone) continue;
      for (let k = i + 1; k < ps.length; k++) {
        const c = ps[k]; if (c.gone) continue;
        const dx = c.x - a.x, dy = c.y - a.y, rr = a.r + c.r, dd = dx * dx + dy * dy;
        if (dd >= rr * rr || dd < 1e-9) continue;
        const dist = Math.sqrt(dd), nx = dx / dist, ny = dy / dist, rel = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
        if (rel > 0) { const j = 1.5 * rel / 2; a.vx -= j * nx; a.vy -= j * ny; c.vx += j * nx; c.vy += j * ny; if (w.onClack && rel > 0.6) w.onClack(rel); }
        const ov = (rr - dist) / 2; a.x -= nx * ov; a.y -= ny * ov; c.x += nx * ov; c.y += ny * ov;
      }
    }
    // 핀 움직임 · 쓰러짐 · 구덩이/도랑
    const wall = d.half + GW + 0.1, deck0 = pinRow0(d) - 1.2;
    for (const p of ps) {
      if (p.gone) continue;
      const sp = Math.hypot(p.vx, p.vy);
      if (!p.down && sp > d.knock) { p.down = true; p.rot = Math.atan2(p.vx, p.vy) + (p.n % 2 ? 0.5 : -0.5); p.spinR = (p.n % 3 - 1) * 3; if (w.onDown) w.onDown(p); }
      if (p.down) { p.downT += h; p.r = Math.min(PRF, PR + p.downT * 0.8); p.rot += p.spinR * h * Math.min(1, sp); }
      const fr = p.down ? 1.7 : 11;
      const k = Math.exp(-fr * h); p.vx *= k; p.vy *= k;
      p.x += p.vx * h; p.y += p.vy * h;
      if (p.y > deck0 && Math.abs(p.x) > wall) { p.x = Math.sign(p.x) * wall; p.vx = -p.vx * 0.45; }
      if (p.y > L + 0.15) { p.gone = true; p.down = true; }
      else if (Math.abs(p.x) > d.half + 0.05 && Math.hypot(p.vx, p.vy) < 2) { p.down = true; p.gone = true; p.inGutter = true; }
      else if (p.y < deck0 - 1 && p.down && sp < 0.05) { /* 앞으로 튕겨 나온 누운 핀은 그 자리에 */ }
    }
  }
  const pinsMoving = w => w.pins.some(p => !p.gone && Math.hypot(p.vx, p.vy) > 0.06);

  // 놓기 전 공의 길 (조준선·봇): 핀 없이 굴려 본다
  function predictPath(x, ang, pw, spin, maxY) {
    const w = { D, ball: newBall(x, ang, pw, spin, D, tilt), pins: [] }, pts = [{ x: w.ball.x, y: w.ball.y }];

  const Href = () => clamp(H * 0.42, 150, 340);
  function strokeParams(pts) {
    if (pts.length < 2) return null;
    const a = pts[0], b = pts[pts.length - 1], dx = b.x - a.x, dy = b.y - a.y, fwd = -dy, len = Math.hypot(dx, dy);
    if (fwd < 4 || len < 4) return null;
    const px = -dy / len, py = dx / len;   // 진행 방향의 오른쪽
    let dev = 0; for (const q of pts) { const d = (q.x - a.x) * px + (q.y - a.y) * py; if (Math.abs(d) > Math.abs(dev)) dev = d; }
    const spin = clamp((dev / len) / 0.18, -1, 1);
    const ang = clamp(Math.atan2(dx, fwd) * 180 / Math.PI * 0.3 + spin * 2.2, -10, 10);
    return { x: aim.x, ang, pw: clamp(fwd / Href(), 0, 1), spin, fwd, show: true };
  }
  function curParams() {
    if (drag.on && drag.mode === 'throw') return strokeParams(drag.pts);
    if (kb.on) return { x: aim.x, ang: aim.ang, pw: kb.charging ? kb.pw : aim.pw, spin: aim.spin, show: true };
    return null;
  }
  function cancelDrag() { drag.on = false; drag.id = null; drag.mode = ''; drag.pts = []; }
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault();
    if (phase !== 'aim' || drag.on) return;
    try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    Object.assign(drag, { on: true, id: e.pointerId, mode: '', sx: e.clientX, sy: e.clientY, ax: aim.x, pts: [{ x: e.clientX, y: e.clientY, t: performance.now() }] });
    kb.on = false; kb.charging = false;
  });
  fx.addEventListener('pointermove', e => {
    if (!drag.on || e.pointerId !== drag.id) return;
    if (state !== 'play' || phase !== 'aim') { cancelDrag(); return; }
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    for (const ev of list && list.length ? list : [e]) moveDrag(ev.clientX, ev.clientY);
  });
  function moveDrag(x, y) {
    const dx = x - drag.sx, fwd = drag.sy - y;
    if (!drag.mode) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(fwd) * 1.3 && fwd < 10) drag.mode = 'move';
      else if (fwd > 12) drag.mode = 'throw';
    }
    if (drag.mode === 'move') {
      const s = proj(0, BY).s;
      aim.x = clamp(drag.ax + dx / s, -limX(), limX());
      if (fwd > 34) { drag.mode = 'throw'; drag.sx = x; drag.sy = y; drag.pts = [{ x, y, t: performance.now() }]; }   // 옮기다가 위로 밀면 그 자리에서 굴리기
      return;
    }
    drag.pts.push({ x, y, t: performance.now() });
    if (drag.pts.length > 400) drag.pts.splice(1, 1);
  }
  fx.addEventListener('pointerup', e => {
    if (!drag.on || e.pointerId !== drag.id) return;
    moveDrag(e.clientX, e.clientY);
    const mode = drag.mode, prm = mode === 'throw' ? strokeParams(drag.pts) : null;
    cancelDrag();
    if (mode !== 'throw') return;
    if (!prm || prm.fwd < 36) { addFloat(W / 2, yN - 40, '위로 쭉 밀어 굴려요', '#FFD2D6'); tone(240, 0.08, 'sine', 0.03); return; }
    launch(prm.x, prm.ang, Math.max(0.12, prm.pw), prm.spin);
  });
  fx.addEventListener('pointercancel', e => { if (e.pointerId === drag.id) cancelDrag(); });
  const kb = { on: false, charging: false, pw: 0.1, dir: 1 };
  document.addEventListener('keydown', e => {
    const kk = e.key;
    if (kk === 'ArrowLeft' || kk === 'ArrowRight' || kk === 'ArrowUp' || kk === 'ArrowDown') {
      if (state !== 'play') { if (state === 'pause') e.preventDefault(); return; }
      e.preventDefault(); if (KG.rulesOpen || phase !== 'aim' || drag.on) return;
      kb.on = true;
      const lr = kk === 'ArrowLeft' ? -1 : kk === 'ArrowRight' ? 1 : 0, ud = kk === 'ArrowUp' ? 1 : kk === 'ArrowDown' ? -1 : 0;
      if (e.shiftKey && lr) aim.ang = clamp(aim.ang + lr * 0.5, -10, 10);
      else if (lr) aim.x = clamp(aim.x + lr * 0.08, -limX(), limX());
      if (ud) aim.spin = clamp(aim.spin - ud * 0.1, -1, 1);
      return;
    }
    if (kk === ' ' || kk === 'Enter') {
      if (state === 'play') {
        e.preventDefault(); if (KG.rulesOpen || e.repeat || kk === 'Enter') return;
        if (phase === 'aim' && !drag.on && !kb.charging) { kb.on = true; kb.charging = true; kb.pw = 0.1; kb.dir = 1; }
        return;
      }
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (kk === 'Escape' || kk === 'p' || kk === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => {
    if (e.key === ' ' && kb.charging) { e.preventDefault(); kb.charging = false; if (state === 'play' && phase === 'aim') { aim.pw = kb.pw; launch(aim.x, aim.ang, kb.pw, aim.spin); } }
  });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '점';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '점';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
    $('stDNote').textContent = DNOTE[KG.diff()] || '';
  }
  function onDiff() { paintBest(); if (state === 'ready') { reset(); layout(); } }
  $('stDNote').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  reset(); layout(); paintBest();
  const RULES = { key: KEY, title: TITLE, lead: '공을 굴려 장난감 핀 10개를 쓰러뜨리는 놀이예요. 10프레임 점수가 기록이에요.', items: [
    ['👆', '공을 위로 쭉 밀면 굴러가요. 길게 밀수록 세게 가요' + (KEYS_OK ? ' (스페이스를 눌렀다 떼도 돼요).' : '.')],
    ['↔️', '옆으로 밀면 공 자리를 옮겨요. 휘게 그으면 공도 그쪽으로 나갔다가 휘어 들어와요.'],
    ['🎳', '한 프레임에 두 번 굴려요. 한 번에 다 넘기면 스트라이크, 두 번에 다 넘기면 스페어예요.'],
    ['⭐', '스트라이크는 다음 두 공, 스페어는 다음 한 공 점수를 덤으로 더해요. 최고 300점이에요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  //   GAME.roll(x, 각도°, 힘0~1, 휘기-1~1, 흔들림끔) 으로 굴리고, GAME.sim(…) 은 화면과 상관없이 새 핀 10개에 미리 굴려 쓰러진 수를 돌려준다
  function sim(x, ang, pw, spin, d) {
    d = d || D;
    const w = { D: d, ball: newBall(x, ang, pw, spin, d, 0), pins: rackPins(d) };
    let t = 0; while (t < 9) { stepWorld(w, HDT); t += HDT; if (w.ball.done && !pinsMoving(w)) break; }
    return w.pins.filter(p => p.down || p.gone).length;
  }
  window.GAME = {
    DIFF, MASTER, get state() { return state; }, get phase() { return phase; }, get frame() { return frameI; }, get ball() { return ballI; }, get rolls() { return rolls.slice(); }, get total() { return runningTotal(rolls); },
    get strikes() { return strikes; }, get spares() { return spares; }, get diff() { return diffId; }, get D() { return D; }, get tilt() { return tilt; }, get aim() { return Object.assign({}, aim); },
    pins: () => world.pins.map(p => ({ n: p.n, x: +p.x.toFixed(2), y: +p.y.toFixed(2), down: p.down, gone: p.gone })),
    field: () => ({ W, H, S0, yN, yF, cx, KSZ, sheet: sheet.getBoundingClientRect().toJSON(), kong: K.el.getBoundingClientRect().toJSON(), ballScreen: proj(aim.x, BY) }),
    start, end, pause, resume, roll: (x, ang, pw, spin, noWob) => launch(x, ang, pw, spin || 0, noWob), sim, scoreSheet, runningTotal,
    step: dt => update(dt)
  };
})();
</script>
