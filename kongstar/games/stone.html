<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 징검다리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 징검다리: 밤하늘·먼 물(bg) → 먼 언덕·돌·연잎·개구리(cv) → 콩이(stage) → 앞 물결·물방울·힘 막대·글자(fx) → 점수판 순서로 겹친다 */
#bg, #cv, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#cv { z-index: 1; pointer-events: none; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#stage.air #kong-shadow { opacity: 0; }   /* 공중·물속에서는 발밑 그림자를 감춘다 */
#fx { z-index: 3; touch-action: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; transform: translateX(-50%); }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud small { font-size: 12px; font-weight: 500; color: #C9D1F2; }
#hud .hp svg { width: 15px; height: 15px; display: block; transition: opacity .2s, transform .2s; }
#hud .hp svg.off { opacity: .28; transform: scale(.82); }
#hud .hp svg.bonus path { fill: #FFC861; }
#hud .cb { color: #FFE08A; }
#hud .sc.bump, #hud .cb.bump { animation: scBump .35s; }
@keyframes scBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
#hud.tight { gap: 4px; }
#hud.tight > div { padding: 0 8px; font-size: 13px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .dnote { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } .kg-card .rec span { padding: 7px 9px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules .tag { display: none; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #stKeys { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .dnote { margin-top: 5px; font-size: 12px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
}
/* 순위 카드와 나란히 서는 아주 낮은 가로 화면: 카드가 위 줄(게임·소리 단추) 밑에서 시작하게, 결과 카드 높이를 줄인다 */
@media (orientation: landscape) and (max-height: 360px) {
  #cardStart, #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 6px); }
  body .kg-rbwrap > .kg-card #edText { display: none; }
  body .kg-rbwrap > .kg-card h2 { font-size: 18px; }
  body .kg-rbwrap > .kg-card { padding: 12px 16px; }
  body .kg-rbwrap > .kg-card .big { font-size: 30px; }
  body .kg-rbwrap > .kg-card .new { margin-top: 2px; padding: 2px 8px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .rec { margin-top: 6px; gap: 4px 6px; }
  body .kg-rbwrap > .kg-card .rec span { padding: 4px 9px; font-size: 12px; }
  body .kg-rbwrap > .kg-card .kg-diff { margin-top: 6px; }
  body .kg-rbwrap > .kg-card .kg-diff button { height: 32px; }
  body .kg-rbwrap > .kg-card .row { margin-top: 8px; }
  body .kg-rbwrap > .kg-card .kg-btn { height: 40px; }
  #stDNote { display: none; }
}
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } body .kg-rbwrap > .kg-card .rec { flex-wrap: nowrap; gap: 6px; } body .kg-rbwrap > .kg-card .rec span { padding: 6px 9px; font-size: 12px; white-space: nowrap; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="cv"></canvas>
<div id="stage"></div>
<canvas id="fx" aria-label="징검다리 개울 — 꾹 눌렀다 떼면 콩이가 뛰어요"></canvas>

<div id="hud" aria-hidden="true">
  <div class="sc" id="hudSc"><span id="hudScore">0</span><small>개</small></div>
  <div class="hp" id="hudHp"></div>
  <div class="cb" id="hudCb" hidden>콤보 <span id="hudCombo">0</span></div>
</div>

<div class="kg-scrim" id="cardStart" hidden>
  <div class="kg-card">
    <h2 id="stTitle">콩이의 징검다리</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>꾹 누르고 있으면</b> 힘이 모이고, <b>떼면</b> 폴짝 뛰어요.</p>
      <p id="stKeys" hidden><b>스페이스</b>를 누르고 있다가 떼도 돼요.</p>
    </div>
    <p class="dnote" id="stDNote"></p>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">개울에 퐁당 빠졌어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>개</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>퍼펙트<b id="edPerf"></b></span><span>최고 콤보<b id="edCombo"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const KEY = 'stone', TITLE = J(name, '의') + ' 징검다리';
  const KEYS_OK = matchMedia('(hover: hover) and (pointer: fine)').matches;

  // ═══════ 개울: 옆에서 본 세상. 단위 = 「칸」(콩이 몸길이쯤). x 는 오른쪽으로, y 는 물 위로 높이 ═══════
  const MAXD = 10;            // 힘을 끝까지 모았을 때 뛰는 거리(칸)
  const REACH = 0.85;         // 돌은 늘 「최대 힘의 85%」 안에 놓는다
  const TOL = 0.25;           // 돌 끝에서 이만큼 비어져 나가도 발이 걸친다
  const GAP = 0.7;            // 돌과 돌 사이 최소 물길
  const STONE_UP = 0.45, LILY_UP = 0.07;   // 물 위로 나온 높이: 돌 · 연잎
  const FROG_MOVE = 0.35;     // 개구리가 물로 뛰어들고 · 돌아오는 시간(초)
  const COMBO_BONUS = 5;      // 퍼펙트 5번 연속마다 하트 하나 (처음 하트 수 + 1 까지)
  const jT = d => 0.36 + 0.034 * Math.abs(d);   // 뛰는 시간(초)
  const jH = d => 0.5 + 0.28 * Math.abs(d);     // 뛰는 높이(칸)

  // ═══════ 난이도 표 (수치는 여기 한 곳에만) ═══════
  //   hearts 처음 하트 · fill 힘 막대가 0→끝까지 차는 시간(초, 끝에 닿으면 다시 줄어드는 왕복) · w 돌 폭 [처음, 가장 어려울 때] · lo/hi 돌 가운데 사이 거리 범위 [처음, 끝]
  //   ramp 이 돌 수에서 가장 어려워진다 · perf 퍼펙트로 치는 가운데 반경(칸) · guide 착지 점선 ('all' 늘 · 숫자 = 처음 그 수만큼의 돌 · 0 없음)
  //   lily/moss/frog: [나오는 확률, 몇 번째 돌부터] · amp 연잎이 오가는 폭 · spd 연잎 빠르기(rad/s) · sink 이끼 돌이 가라앉기까지(초) · frogOn/frogOff 개구리가 앉아 있는/비우는 시간(초)
  const DIFF = {
    easy:   { hearts: 3, fill: 1.7,  w: [4.0, 2.4], lo: [3.2, 4.4], hi: [4.8, 7.0], ramp: 60, perf: 0.45, guide: 'all',
              lily: [0, 0],     moss: [0, 0],     frog: [0, 0],     amp: 0,   spd: 0,   sink: 0,   frogOn: [0, 0],     frogOff: [0, 0] },
    normal: { hearts: 2, fill: 1.4,  w: [3.4, 1.9], lo: [3.6, 5.0], hi: [5.4, 8.0], ramp: 50, perf: 0.40, guide: 5,
              lily: [0.16, 8],  moss: [0, 0],     frog: [0, 0],     amp: 1.0, spd: 0.7, sink: 0,   frogOn: [0, 0],     frogOff: [0, 0] },
    hard:   { hearts: 1, fill: 1.15, w: [3.0, 1.7], lo: [4.0, 5.5], hi: [6.0, 8.5], ramp: 45, perf: 0.32, guide: 0,
              lily: [0.18, 5],  moss: [0.15, 10], frog: [0.12, 15], amp: 1.4, spd: 0.85, sink: 2.6, frogOn: [1.2, 2.0], frogOff: [2.3, 2.8] },
    vhard:  { hearts: 1, fill: 0.95, w: [2.6, 1.4], lo: [4.5, 6.0], hi: [6.5, 8.5], ramp: 40, perf: 0.26, guide: 0,
              lily: [0.22, 3],  moss: [0.2, 5],   frog: [0.16, 8],  amp: 1.8, spd: 1.05, sink: 2.0, frogOn: [1.4, 2.2], frogOff: [2.0, 2.4] }
  };
  const DNOTE = { easy: '하트 3개 · 착지 점선이 늘 보여요', normal: '하트 2개 · 처음 5개만 점선 · 둥둥 연잎', hard: '하트 1개 · 연잎 · 이끼 돌 · 개구리', vhard: '하트 1개 · 더 작고 먼 돌 · 빠른 힘 막대' };
  let diffId = 'normal', D = DIFF.normal;

  // ═══════ 화면 조각 ═══════
  const bar = topbar({ title: TITLE, back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);
  document.title = TITLE; $('stTitle').textContent = TITLE;
  $('stLead').textContent = '개울의 돌을 폴짝폴짝 건너요. 몇 개까지 건널 수 있을까요?';
  if (KEYS_OK) $('stKeys').hidden = false;
  const bg = $('bg'), cv = $('cv'), fx = $('fx'), stage = $('stage'), hud = $('hud');
  const g = cv.getContext('2d'), fg = fx.getContext('2d');
  const FONT = getComputedStyle(document.body).fontFamily;
  const K = kong(stage, 80); K.setPose('stand');

  // ═══════ 상태 ═══════
  let state = 'ready';        // ready · play · pause · over · result
  let plats = [], tW = 0, tAnim = 0;
  let score = 0, hearts = 0, maxHearts = 0, combo = 0, bestCombo = 0, perfects = 0, jumps = 0, isNew = false, quit = false, overT = 0, overAt = 0;
  const k = { x: 0, y: STONE_UP, pi: 0, off: 0, phase: 'stand', pw: 0, dir: 1, held: false, j: null, vx: 0, vy: 0, fallT: 0, splashed: false, respT: 0, landT: 0, happyT: 0, sadT: 0, why: '' };
  let floats = [], parts = [], ripples = [], flies = [];
  let camX = 0, W = 0, H = 0, DPR = 1, S = 24, waterY = 300, SAF = { t: 0, b: 0, l: 0, r: 0 }, KSZ = 80, kongSX = 60, low = false;

  const sx = x => (x - camX) * S, sy = y => waterY - y * S;
  const P = i => { for (const p of plats) if (p.i === i) return p; return null; };
  const topOf = p => p.type === 'lily' ? LILY_UP : STONE_UP - (p.sink || 0);

  // ═══════ 돌 만들기: 언제나 닿을 수 있게 ═══════
  //   앞 발판에서 콩이가 설 수 있는 가장 뒤 자리(연잎이면 가장 뒤로 흘러간 때) → 다음 발판의 가장 먼 자리까지가 최대 힘의 85% 이내.
  //   다음 발판의 가장 가까운 자리는 앞 발판의 가장 앞 끝(연잎이면 가장 앞으로 흘러간 때)에서 GAP 이상 떨어진다.
  const backOf = p => p.cx - (p.A || 0) - p.w / 2 - TOL, frontOf = p => p.cx + (p.A || 0) + p.w / 2;
  const chance = (spec, i) => spec[0] > 0 && i >= spec[1] && Math.random() < spec[0];
  function makePlat(i, prev) {
    const u = clamp(i / D.ramp, 0, 1), u2 = clamp((i - D.ramp) / (D.ramp * 2), 0, 1);   // u2: 가장 어려워진 뒤에도 천천히 더 (돌 폭이 60% 까지 준다)
    if (!prev) return { i, type: 'stone', cx: 0, x: 0, w: Math.max(3.4, D.w[0]), A: 0, om: 0, ph: 0, sink: 0, mossT: 0, seed: Math.random() * 1000 };
    let type = 'stone';
    if (chance(D.lily, i)) type = 'lily'; else if (chance(D.moss, i)) type = 'moss'; else if (prev.type !== 'moss' && chance(D.frog, i)) type = 'frog';   // 이끼 돌 바로 다음엔 개구리를 두지 않는다 (가라앉는 돌에서 기다릴 수 없게 되므로)
    let w = clamp(lerp(D.w[0], D.w[1], u) * lerp(1, 0.6, u2) * rand(0.85, 1.15), 1.0, 5);
    let A = 0;
    if (type === 'lily') { w = Math.max(w, 2.0) * 1.1; A = D.amp * rand(0.7, 1); }
    let lo = frontOf(prev) + GAP + A + w / 2, hi = backOf(prev) + MAXD * REACH - A;   // hi: 가장 먼 자리의 가운데가 이 안
    if (hi < lo && A) { A *= 0.4; lo = frontOf(prev) + GAP + A + w / 2; hi = backOf(prev) + MAXD * REACH - A; }
    if (hi < lo) { type = 'stone'; A = 0; w = Math.max(1.2, w * 0.7); lo = frontOf(prev) + GAP + w / 2; hi = backOf(prev) + MAXD * REACH; }
    const gap = rand(lerp(D.lo[0], D.lo[1], u), lerp(D.hi[0], D.hi[1], u));
    const cx = clamp(prev.cx + gap, lo, Math.max(lo, hi));
    const p = { i, type, cx, x: cx, w, A, om: type === 'lily' ? D.spd * rand(0.8, 1.2) : 0, ph: rand(0, TAU), sink: 0, mossT: 0, seed: Math.random() * 1000 };
    if (type === 'lily') p.x = cx + A * Math.sin(p.om * tW + p.ph);
    if (type === 'frog') p.frog = { st: 'on', t: rand(0, 0.8), on: rand(D.frogOn[0], D.frogOn[1]), off: rand(D.frogOff[0], D.frogOff[1]), goneT: 0, hopT: 0 };
    return p;
  }
  function ensurePlats() {
    if (!plats.length) plats.push(makePlat(0, null));
    while (plats[plats.length - 1].i < k.pi + 5) { const last = plats[plats.length - 1]; plats.push(makePlat(last.i + 1, last)); }
    while (plats.length && plats[0].i < k.pi - 3) plats.shift();
  }

  // ═══════ 개구리: 앉아 있다(on) → 물로 퐁(leave) → 물에서 기다림(off, 끝 0.6초는 「개굴」 예고) → 돌아옴(back) → … 콩이가 그 돌에 서면 헤엄쳐 떠난다(gone) ═══════
  function frogAdvance(f, dt) {
    f.t += dt;
    for (let n = 0; n < 8; n++) {
      const dur = f.st === 'on' ? f.on : f.st === 'off' ? f.off : f.st === 'leave' || f.st === 'back' ? FROG_MOVE : Infinity;
      if (f.t < dur) break;
      f.t -= dur; f.st = f.st === 'on' ? 'leave' : f.st === 'leave' ? 'off' : f.st === 'off' ? 'back' : 'on';
    }
  }
  const frogBlocks = f => !!f && (f.st === 'on' || f.st === 'back');
  function frogBlockedAt(p, ahead) { if (!p || !p.frog || p.frog.st === 'gone') return false; const f = { st: p.frog.st, t: p.frog.t, on: p.frog.on, off: p.frog.off }; frogAdvance(f, ahead); return frogBlocks(f); }

  // ═══════ 화면 맞추기 ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function buildBg() {

  $('btnStart').addEventListener('click', () => { if (!KG.rulesOpen) { sfx('tap'); start(); } });
  $('btnAgain').addEventListener('click', () => { if (performance.now() - overAt < 450) return; sfx('tap'); start(); });
  $('cardEnd').addEventListener('click', e => { if (performance.now() - overAt < 450 && e.target.closest && e.target.closest('.kg-diff, a')) { e.stopPropagation(); e.preventDefault(); } }, true);
  $('btnResume').addEventListener('click', () => { sfx('tap'); resume(); });
  $('btnQuit').addEventListener('click', () => { sfx('tap'); end(); });
  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  window.addEventListener('blur', () => { keyDown = false; ptr = null; if (state === 'play') cancelHold(); });

  // ═══════ 입력: 화면 어디든 꾹 누르기 · 스페이스 ═══════
  let ptr = null;
  fx.addEventListener('pointerdown', e => {
    if (state !== 'play' || e.button > 0) return;
    e.preventDefault(); if (ptr != null) return;
    ptr = e.pointerId; try { fx.setPointerCapture(e.pointerId); } catch (err) {}
    down();
  });
  fx.addEventListener('pointerup', e => { if (e.pointerId !== ptr) return; ptr = null; up(); });
  fx.addEventListener('pointercancel', e => { if (e.pointerId !== ptr) return; ptr = null; cancelHold(); });
  let keyDown = false;
  document.addEventListener('keydown', e => {
    const kk = e.key;
    if (kk === ' ' || kk === 'Enter' || kk === 'ArrowUp') {
      if (state === 'play') {
        e.preventDefault(); if (KG.rulesOpen || e.repeat || keyDown) return;
        if (kk === 'Enter') return;
        keyDown = true; down(); return;
      }
      if (e.repeat) { e.preventDefault(); return; }
      if (kk === 'ArrowUp') return;
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault(); if (KG.rulesOpen) return;
      if (state === 'ready') start(); else if (state === 'result') { if (performance.now() - overAt >= 450) start(); } else if (state === 'pause') resume();
    } else if (kk === 'Escape' || kk === 'p' || kk === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  });
  document.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'ArrowUp') && keyDown) { keyDown = false; e.preventDefault(); up(); } });

  // ═══════ 시작 ═══════
  function paintBest() {
    const b = best(KG.dkey(KEY));
    $('stRec').hidden = !(b > 0); $('stBest').textContent = fmt(b) + '개';
    const e = best(KG.dkey(KEY, diffId));
    $('edRec').hidden = !(e > 0); $('edBest').textContent = fmt(e) + '개';
    $('edRec').firstChild.nodeValue = (KG.diff() === diffId ? '' : KG.diffLabel(diffId) + ' ') + '최고 기록';
    $('edNew').hidden = !isNew;
    $('stDNote').textContent = DNOTE[KG.diff()] || '';
  }
  function onDiff() { paintBest(); if (state === 'ready') reset(); }
  $('stDNote').before(KG.diffPicker(null, onDiff));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  const rbox = KG.rankBox($('cardEnd').querySelector('.kg-card'), KEY);
  KG.startRank($('cardStart'), KEY);
  layout(); reset(); paintBest(); paintHud();
  const RULES = { key: KEY, title: TITLE, lead: '개울의 돌을 폴짝폴짝 건너는 놀이예요. 건넌 돌 수가 기록이에요.', items: [
    ['👆', '화면 어디든 꾹 누르고 있으면 힘이 모이고, 떼면 그만큼 멀리 뛰어요' + (KEYS_OK ? ' (스페이스도 돼요).' : '.')],
    ['🔁', '힘 막대는 끝까지 차면 다시 줄어들어요. 알맞을 때 손을 떼요.'],
    ['✨', '돌 한가운데에 내리면 퍼펙트! 5번 연속이면 하트를 하나 받아요(처음보다 하나 더까지만).'],
    ['💦', '물에 빠지면 하트가 하나 줄어요. 높은 난이도엔 움직이는 연잎·가라앉는 이끼 돌·개구리가 나와요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(() => { if (state === 'ready') showCard('cardStart', 'btnStart'); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // ═══════ 시험·디버그용 ═══════
  //   봇: GAME.down() 으로 누르고, GAME.power 가 GAME.need() 를 지날 때 GAME.up(). 개구리는 GAME.safe() 로 확인. 화면 없이 GAME.step(dt) 로 빨리 돌린다
  function need() {
    const t = P(k.pi + 1); if (!t) return null;
    let d = t.x - k.x;
    for (let n = 0; n < 6; n++) { const px = t.type === 'lily' ? t.cx + t.A * Math.sin(t.om * (tW + jT(d)) + t.ph) : t.x; d = px - k.x; }
    return d / MAXD;
  }
  window.GAME = {
    DIFF, get state() { return state; }, get phase() { return k.phase; }, get score() { return score; }, get hearts() { return hearts; }, get combo() { return combo; }, get bestCombo() { return bestCombo; },
    get perfects() { return perfects; }, get power() { return k.pw; }, get powerDir() { return k.dir; }, get diff() { return diffId; }, get D() { return D; }, get guide() { return guideOn(); }, get jumps() { return jumps; }, get kong() { return { x: k.x, y: k.y, pi: k.pi, phase: k.phase }; },
    plats: () => plats.map(p => ({ i: p.i, type: p.type, x: +p.x.toFixed(2), cx: +p.cx.toFixed(2), w: +p.w.toFixed(2), A: +(p.A || 0).toFixed(2), frog: p.frog ? p.frog.st : null })),
    field: () => ({ W, H, S, waterY, KSZ, kongSX, camX, hud: hud.getBoundingClientRect().toJSON(), kong: K.el.getBoundingClientRect().toJSON() }),
    start, end, pause, resume, over: showResult, down, up, need,
    safe: pw => { const d = pw * MAXD, T = jT(d), tp = platAt(k.x + d, T); return !!tp && !(tp.frog && frogBlockedAt(tp, T)); },
    // 생성 검사: 다음 돌까지 「가장 나쁜 자리」에서의 거리 (모두 MAXD*REACH 이하여야 한다)
    reachCheck: () => { const out = []; for (let i = 1; i < plats.length; i++) { const a = plats[i - 1], b = plats[i]; out.push({ i: b.i, far: +(b.cx + (b.A || 0) - backOf(a)).toFixed(2), near: +(b.cx - (b.A || 0) - b.w / 2 - frontOf(a)).toFixed(2) }); } return out; },
    step: dt => update(dt)
  };
})();
</script>
</body>
</html>
