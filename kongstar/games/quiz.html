<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 퀴즈 퀴즈</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 퀴즈 퀴즈: 밤하늘(body·#sky) 위에 사회자 콩이(#host) → 문제 카드(#qcard) → 시간 막대 → 보기(#opts) → 찬스·해설(#foot) */
html body { background: linear-gradient(180deg, #0B1030 0%, #1A2057 52%, #343A82 100%); }
#sky { position: fixed; inset: 0; pointer-events: none; opacity: .75;
  background-image:
    radial-gradient(1.3px 1.3px at 8% 14%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 22% 31%, #DDE3FF 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 37% 9%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 51% 24%, #FFE9B8 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 66% 12%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 79% 29%, #DDE3FF 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 92% 17%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 14% 52%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 46% 61%, #DDE3FF 50%, transparent 52%), radial-gradient(1px 1px at 87% 56%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 30% 78%, #FFE9B8 50%, transparent 52%), radial-gradient(1px 1px at 71% 83%, #fff 50%, transparent 52%); }
#game { position: fixed; inset: 0; box-sizing: border-box; --kh: 78px; --oh: 52px; --fh: 68px;
  padding: calc(var(--sat) + 62px) calc(var(--sar) + 14px) calc(var(--sab) + 12px) calc(var(--sal) + 14px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
#left, #right { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
#left { flex: 1 1 auto; max-height: 340px; }
#right { flex: none; }
#host { display: flex; align-items: flex-end; gap: 8px; height: var(--kh); flex: none; }
#kongBox { position: relative; flex: none; width: calc(var(--kh) * .86); height: 100%; }
#hostR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; justify-content: flex-end; padding-bottom: 2px; }
#hud { display: flex; align-items: center; gap: 5px; }
#hud > div { height: 30px; box-sizing: border-box; border-radius: 15px; padding: 0 9px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 3px; font-size: 13.5px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .hp { gap: 2px; padding: 0 8px; }
#hud .hp svg { width: 14px; height: 14px; display: block; transition: opacity .25s, transform .25s; }
#hud .hp svg.off { opacity: .22; transform: scale(.82); }
#hud .hp svg.pop { animation: hpPop .45s; }
@keyframes hpPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(.82); } }
#hud .st { color: #FFE2A6; }
#hud .st small { font-size: 12px; font-weight: 500; color: #E9D7AE; margin-right: 2px; }
#hud .sc { margin-left: auto; }
#hud .sc small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-left: 1px; }
#say { align-self: flex-start; max-width: 100%; box-sizing: border-box; background: #fff; color: var(--ink); border-radius: 14px 14px 14px 4px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 10px rgba(5,8,30,.2); }
#say.ok { color: #1F9D5B; } #say.no { color: #D93D42; }
#qcard { flex: 1 1 0; min-height: 76px; box-sizing: border-box; background: #fff; color: var(--ink); border-radius: 20px; padding: 10px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(6px * var(--qs, 1)); text-align: center; overflow: hidden; box-shadow: 0 8px 24px rgba(5,8,30,.28); }
#qTag { flex: none; font-size: 12px; font-weight: 700; color: var(--pri); background: #EEF0FB; border-radius: 999px; padding: 3px 10px; letter-spacing: -.2px; }
#qBig { flex: none; font-size: calc(34px * var(--qs, 1)); line-height: 1.2; font-weight: 700; color: var(--pri); }
#qBig.cs { letter-spacing: .32em; margin-right: -.32em; font-size: calc(36px * var(--qs, 1)); }
#qBig.em { letter-spacing: .06em; font-weight: 400; color: var(--ink); }
#qText { flex: none; font-size: calc(17px * var(--qs, 1)); line-height: 1.4; font-weight: 600; letter-spacing: -.3px; text-wrap: balance; }
#qText.sub { font-size: calc(15px * var(--qs, 1)); font-weight: 500; color: #4E5968; }
#timer { flex: none; height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
#timer i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; background: var(--gold); border-radius: 4px; }
#timer.low i { background: #FF8A7A; }
#opts { display: grid; grid-template-columns: 1fr; grid-auto-rows: var(--oh); gap: 6px; --n: 4; }
#opts.ox { grid-template-columns: 1fr 1fr; grid-auto-rows: calc(var(--n) * var(--oh) + (var(--n) - 1) * 6px); gap: 8px; }
.opt { position: relative; box-sizing: border-box; min-width: 0; border: 2px solid transparent; border-radius: 16px; background: #fff; color: var(--ink); display: flex; align-items: center; gap: 10px; padding: 0 38px 0 10px; text-align: left; font-size: 15.5px; font-weight: 600; letter-spacing: -.3px; line-height: 1.22; overflow: hidden; box-shadow: 0 3px 10px rgba(5,8,30,.18); transition: opacity .2s, background .15s, border-color .15s; }
.opt:active { filter: brightness(.96); }
.opt .no { flex: none; width: 26px; height: 26px; border-radius: 9px; background: var(--soft); color: var(--sub); font-size: 13px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center; }
.opt .tx { flex: 1; min-width: 0; }
.opt .mk { position: absolute; right: 9px; top: 50%; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%; display: none; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; font-style: normal; line-height: 1; }
.opt.good { background: #E9F9EF; border-color: #2DB670; }
.opt.good .mk { display: flex; background: #2DB670; }
.opt.bad { background: #FDEDED; border-color: #E5484D; }
.opt.bad .mk { display: flex; background: #E5484D; }
.opt.gone { opacity: .3; box-shadow: none; }
.opt.rest { opacity: .55; }
.opt.oxb { flex-direction: column; justify-content: center; gap: 6px; padding: 0; text-align: center; font-size: 14px; color: var(--sub); font-weight: 600; }
.opt.oxb svg { width: 58px; height: 58px; display: block; }
.opt.oxb .mk { top: 12px; right: 12px; margin-top: 0; }
#foot { position: relative; flex: none; height: var(--fh); }
#life { display: flex; gap: 8px; height: 100%; align-items: center; }
#life button { flex: 1 1 0; min-width: 0; height: 48px; border-radius: 16px; border: 1px solid var(--glass-line); background: var(--glass); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -.2px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
#life button:active { filter: brightness(1.2); }
#life button b { background: rgba(255,255,255,.18); border-radius: 10px; padding: 1px 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
#life button:disabled { opacity: .36; }
#fb { position: absolute; inset: 0; width: 100%; box-sizing: border-box; border: 0; border-radius: 16px; background: #fff; color: var(--ink); text-align: left; padding: 6px 38px 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; box-shadow: 0 3px 12px rgba(5,8,30,.24); }
#fb b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#fb.ok b { color: #1F9D5B; } #fb.no b { color: #D93D42; }
#fb span { display: block; font-size: 13px; line-height: 1.3; font-weight: 500; color: #4E5968; letter-spacing: -.3px; }
#fb em { position: absolute; right: 12px; top: 50%; margin-top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--sub); font-style: normal; font-size: 15px; line-height: 22px; text-align: center; }
#fb u { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: #C9D1F2; transform-origin: 0 50%; text-decoration: none; }
/* 시작 전·일시정지 중에는 문제와 보기를 가린다 (멈춰 놓고 오래 생각하지 못하게) */
#game.veil #qcard > *, #game.veil #opts, #game.veil #fb { visibility: hidden; }
#game.idle #right, #game.idle #timer { visibility: hidden; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how p + p { margin-top: 6px; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 문제 종류 고르기(모두 섞기·상식·넌센스): 난이도 고르기와 같은 알약 단추, 바로 아래에 난이도가 붙는다 */
.kg-card .qmode + .kg-diff { margin-top: 6px; }
.kg-card .mnote { margin: 8px 0 0; font-size: 12.5px; line-height: 1.35; color: var(--sub); letter-spacing: -.3px; }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
/* 넉넉한 세로 화면: 콩이를 조금 크게 */
@media (min-height: 720px) and (orientation: portrait) { #game { --kh: 96px; gap: 10px; } #left { max-height: 380px; gap: 10px; } #right { gap: 10px; } }
/* 낮은 세로 화면(320×568 쯤): 콩이·해설 칸을 줄여 보기 네 개와 찬스 단추가 한 화면에 들어오게 */
@media (max-height: 620px) and (orientation: portrait) {
  #game { --kh: 66px; --fh: 62px; gap: 6px; padding-bottom: calc(var(--sab) + 8px); }
  #left, #right { gap: 6px; }
  #hud > div { height: 28px; }   /* 하트·점수 칸(28) + 간격(6) + 말풍선(30) + 아래 여백(2) = 66: 위 줄 단추 밑으로 삐져나오지 않게 */
  #qcard { padding: 8px 12px; border-radius: 18px; }
  #fb { padding: 4px 36px 6px 12px; } #fb b { font-size: 14px; } #fb span { font-size: 12.5px; line-height: 1.25; }
  #life button { height: 46px; }
  /* 결과 카드: 문제 종류 고르기 줄이 늘어 위 줄 단추와 겹치지 않게 — 한 줄 소개를 숨기고 「새 기록」 딱지를 점수 옆에, 카드는 위 줄 아래에 */
  #edText { display: none; }
  #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }
  #cardEnd .big { display: inline-block; vertical-align: middle; } #cardEnd .new { vertical-align: middle; margin: 0 0 0 8px; }
}
@media (max-width: 340px) {
  body .kg-card .kg-diff button { font-size: 12px; }
  #game { padding-left: calc(var(--sal) + 10px); padding-right: calc(var(--sar) + 10px); }
  #hud { gap: 4px; } #hud > div { padding: 0 7px; font-size: 13px; } #hud .st small { font-size: 11px; }
  #hud .hp svg { width: 13px; height: 13px; }
  .opt { font-size: 15px; gap: 8px; padding-left: 8px; }
  body .kg-card .rec { gap: 6px; } body .kg-card .rec span { padding: 6px 9px; font-size: 12.5px; letter-spacing: -.3px; }
}
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .how p + p { margin-top: 3px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 가로 휴대폰: 왼쪽에 콩이와 문제, 오른쪽에 보기(두 줄 두 칸)와 찬스 */
@media (orientation: landscape) and (max-height: 500px) {
  #game { flex-direction: row; align-items: stretch; justify-content: center; gap: 14px; --kh: 84px; --fh: 62px; padding-top: calc(var(--sat) + 60px); padding-bottom: calc(var(--sab) + 10px); }
  #left { flex: 1 1 0; max-width: 430px; max-height: none; gap: 6px; }
  #right { flex: 1 1 0; max-width: 430px; gap: 8px; }
  #opts { flex: 1 1 0; min-height: 0; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; grid-auto-rows: 1fr; gap: 8px; }
  #opts.n3 .opt:last-child { grid-column: 1 / -1; }
  #opts.ox { grid-template-rows: 1fr; grid-auto-rows: 1fr; }
  /* 칸이 좁다: ✓/✗ 자리를 오른쪽에 따로 비워 두지 않고, 결과를 보여 줄 때 번호 칸 자리에 겹쳐 놓는다 (글 칸이 넓어져 보기 글이 잘게 쪼개지지 않는다) */
  .opt { padding-right: 8px; gap: 8px; }
  .opt .no { width: 22px; height: 22px; border-radius: 8px; font-size: 12px; }
  .opt:not(.oxb) .mk { left: 9px; right: auto; width: 24px; height: 24px; }
  .opt.good .no, .opt.bad .no { visibility: hidden; }
  #fb b { font-size: 14px; } #fb span { font-size: 12.5px; line-height: 1.25; }
}
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 400px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 8px 14px; }
  body .kg-card .how p + p { margin-top: 2px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .qmode + .kg-diff { margin-top: 4px; }
  body .kg-card .mnote { margin-top: 5px; font-size: 12px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 34px; margin: 2px 0 0; }
  /* 결과 카드가 위 줄 제목을 덮지 않게: 한 줄 소개를 숨기고 기록 칸을 한 줄로 */
  #edText { display: none; }
  #cardEnd { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }
  #cardEnd .kg-card { width: min(100%, 440px); padding: 10px 20px; }
  #cardEnd .big { display: inline-block; vertical-align: middle; } #cardEnd .new { vertical-align: middle; margin: 0 0 0 8px; }   /* 「새 기록」 딱지를 점수 옆에 놓아 한 줄을 아낀다 */
  /* 시작 카드도 같다: 문제 종류 고르기가 한 줄 늘었으므로 수치 두 줄을 한 줄로 모으고 위 줄 아래에 놓는다 */
  #cardStart { padding-top: calc(var(--sat) + 58px); padding-bottom: calc(var(--sab) + 8px); }
  #cardStart .kg-card { width: min(100%, 440px); padding: 12px 20px; }
  #cardStart .how { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
  #cardStart .how p + p { margin-top: 0; }
  #cardEnd .rec { gap: 6px; flex-wrap: nowrap; } #cardEnd .rec span { padding: 6px 9px; font-size: 12.5px; letter-spacing: -.3px; white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) { .opt, #hud .hp svg { transition: none; } #hud .hp svg.pop { animation: none; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<div id="game" class="idle veil">
  <div id="left">
    <div id="host">
      <div id="kongBox" aria-hidden="true"></div>
      <div id="hostR">
        <div id="hud" aria-hidden="true">
          <div class="hp" id="hudHp"></div>
          <div class="st" id="hudStreak" hidden><small>연속</small><span id="hudStreakN">0</span></div>
          <div class="sc"><span id="hudScore">0</span><small>점</small></div>
        </div>
        <div id="say" role="status" aria-live="polite">문제를 준비했어요</div>
      </div>
    </div>
    <div id="qcard" aria-live="polite">
      <div id="qTag">퀴즈</div>
      <div id="qBig" hidden></div>
      <div id="qText"></div>
    </div>
    <div id="timer" aria-hidden="true"><i></i></div>
  </div>
  <div id="right">
    <div id="opts" role="group" aria-label="보기"></div>
    <div id="foot">
      <div id="life">
        <button type="button" id="btnHint"><span aria-hidden="true">💡</span>힌트<b id="nHint">0</b></button>
        <button type="button" id="btnSkip"><span aria-hidden="true">⏭️</span>넘기기<b id="nSkip">0</b></button>
      </div>
      <button type="button" id="fb" hidden><b id="fbT"></b><span id="fbX"></span><em aria-hidden="true">›</em><u></u></button>
    </div>
  </div>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 퀴즈 퀴즈</h2>
    <p id="stLead"></p>
    <div class="how">
      <p><b>제한 시간</b> <span id="stTime"></span> · <b>하트</b> <span id="stHearts"></span></p>
      <p><b>찬스</b> <span id="stLife"></span></p>
    </div>
    <div class="rec" id="stRec" hidden><span>최고 기록<b id="stBest"></b></span></div>
    <p class="mnote" id="stNote" hidden>가족 순위에는 모두 섞기 기록만 올라가요</p>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><a class="kg-btn" href="index.html">그만하기</a><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2>퀴즈가 끝났어요</h2>
    <p id="edText"></p>
    <div class="big"><span id="edScore">0</span><small>점</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>맞힌 문제<b id="edCorrect"></b></span><span>가장 긴 연속<b id="edStreak"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <p class="mnote" id="edNote" hidden>가족 순위에는 모두 섞기 기록만 올라가요</p>
    <div class="row"><a class="kg-btn" href="index.html">게임 고르기</a><button class="kg-btn pri" id="btnAgain">다시 하기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>

  // 한글 초성 뽑기 (가~힣)
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const chosung = s => Array.from(s).map(ch => { const c = ch.charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? CHO[Math.floor((c - 0xAC00) / 588)] : ch === ' ' ? '' : ch; }).join('');
  // 은행 자체 점검: 문제 목록(issues)이 비어야 한다
  function check() {
    const issues = [], types = {}, levels = {}, cats = {}, tl = {}, oxn = { O: 0, X: 0 }, seenQ = new Map(), seenA = new Map();
    const bad = (q, m) => issues.push('#' + q.id + ' [' + q.type + '] ' + (q.big ? q.big + ' ' : '') + q.q + ' → ' + m);
    for (const q of BANK) {
      types[q.type] = (types[q.type] || 0) + 1; levels[q.lv] = (levels[q.lv] || 0) + 1; cats[q.cat] = (cats[q.cat] || 0) + 1; tl[q.type + q.lv] = (tl[q.type + q.lv] || 0) + 1;
      if (!TYPES[q.type]) bad(q, '모르는 형식'); if (!CATS[q.cat]) bad(q, '모르는 분야'); if (![1, 2, 3, 4].includes(q.lv)) bad(q, '난이도 범위 밖');
      if (!q.q || !q.q.trim()) bad(q, '문제 글이 비었다'); if (!q.exp || !q.exp.trim()) bad(q, '해설이 비었다');
      if (q.q && q.q.length > 60) bad(q, '문제 글이 길다(' + q.q.length + ')'); if (q.exp && q.exp.length > 46) bad(q, '해설이 길다(' + q.exp.length + ')');
      if (!Array.isArray(q.opts) || !(q.ans >= 0 && q.ans < q.opts.length)) { bad(q, '정답 번호가 보기 범위 밖'); continue; }
      if (q.type === 'ox') { if (q.opts.length !== 2) bad(q, 'OX 보기는 둘'); oxn[q.ans === 0 ? 'O' : 'X']++; }
      else {
        if (q.opts.length !== 4) bad(q, '보기는 넷이어야 한다');
        const norm = q.opts.map(o => String(o).replace(/\s+/g, '')); if (new Set(norm).size !== norm.length) bad(q, '보기 중복'); if (norm.some(o => !o)) bad(q, '빈 보기');
        for (const o of q.opts) if (o.length > 16) bad(q, '보기가 길다: ' + o);
        const ak = q.type + ':' + norm[q.ans]; if (q.type !== 'mc') { if (seenA.has(ak)) bad(q, '같은 형식에서 정답이 겹친다(#' + seenA.get(ak) + ')'); seenA.set(ak, q.id); }
      }
      if (q.type === 'cs') {
        if (!q.big) bad(q, '초성이 없다'); else {
          if (chosung(q.opts[q.ans]) !== q.big) bad(q, '초성이 정답과 다르다(' + chosung(q.opts[q.ans]) + ')');
          q.opts.forEach((o, i) => { if (i !== q.ans && chosung(o) === q.big) bad(q, '오답의 초성이 같다: ' + o); if (i !== q.ans && Array.from(o).length !== Array.from(q.opts[q.ans]).length) bad(q, '오답의 글자 수가 다르다: ' + o); });
          if (q.q.includes(q.opts[q.ans])) bad(q, '힌트에 정답이 들어 있다');
        }
      }
      if (q.type === 'em' && !q.big) bad(q, '그림이 없다');
      const key = (q.type === 'cs' ? q.big + '|' + q.q : q.type === 'em' ? q.big : q.q).replace(/\s+/g, '');
      if (seenQ.has(key)) bad(q, '문제 글 중복(#' + seenQ.get(key) + ')'); seenQ.set(key, q.id);
    }
    if (BANK.length < 240) issues.push('문제 수 부족: ' + BANK.length);
    if ((types.ns || 0) < 80) issues.push('넌센스 문제 부족: ' + (types.ns || 0));
    for (const t in TYPES) { if ((types[t] || 0) < 40) issues.push('형식 ' + t + ' 문제 부족: ' + (types[t] || 0)); for (let l = 1; l <= 4; l++) if ((tl[t + l] || 0) < 10) issues.push(t + ' 난이도 ' + l + ' 문제 부족: ' + (tl[t + l] || 0)); }
    const r = oxn.O / Math.max(1, oxn.O + oxn.X); if (r < 0.45 || r > 0.55) issues.push('OX 정답이 한쪽으로 쏠렸다: O ' + oxn.O + ' · X ' + oxn.X);
    return { total: BANK.length, types, levels, typeLevel: tl, cats, ox: oxn, issues };
  }

  // ═══════ 난이도 표 ═══════
  //   time 문제당 제한 시간(초) · hearts 하트 · opts 보기 수 · hint/skip 찬스 횟수 · mult 점수 배율 · show 틀렸을 때 해설을 보여 주는 시간(초, 맞히면 0.6배)
  //   lv0 → lv1: 문제 난이도 1~4단계가 나올 비율(처음 → ramp 문제를 맞힌 뒤). 맞힌 수가 늘수록 lv1 쪽으로 옮겨 간다
  const DIFF = {
    easy:   { time: 20, hearts: 5, opts: 3, hint: 3, skip: 3, mult: 1.0, show: 4.6, lv0: [75, 25, 0, 0],   lv1: [35, 45, 17, 3],  ramp: 30 },
    normal: { time: 14, hearts: 3, opts: 4, hint: 2, skip: 2, mult: 1.2, show: 3.8, lv0: [45, 40, 15, 0],  lv1: [10, 35, 40, 15], ramp: 25 },
    hard:   { time: 10, hearts: 3, opts: 4, hint: 1, skip: 1, mult: 1.5, show: 3.2, lv0: [15, 45, 30, 10], lv1: [0, 20, 45, 35],  ramp: 20 },
    vhard:  { time: 7,  hearts: 2, opts: 4, hint: 1, skip: 0, mult: 2.0, show: 2.8, lv0: [0, 20, 45, 35],  lv1: [0, 5, 40, 55],   ramp: 15 }
  };
  const BASE = 100, TIME_BONUS = 50, STREAK_BONUS = 10, STREAK_CAP = 10;   // 한 문제 점수 = (기본 + 남은 시간 + 연속 정답) × 배율
  let diffId = 'normal', D = DIFF.normal;   // 판을 시작할 때 한 번 읽어 그 판 동안 그대로
  // ═══════ 문제 종류 ═══════
  //   all 모두 섞기(기존 네 형식 + 넌센스) · gen 상식 퀴즈(기존 네 형식만) · ns 넌센스 퀴즈(넌센스만)
  //   기록: all 은 공통 기록(KG.dkey('quiz') — 가족 순위에 올라간다). gen·ns 는 가족 순위 저장소가 모르는 열쇠라 공통 setBest 를 쓰지 않고
  //   여기서 직접 kongstar.game.quiz.<gen|ns>.<난이도> 에 둔다 (normal 도 난이도를 붙인다)
  const MODES = [{ id: 'all', label: '모두 섞기', short: '모두 섞기' }, { id: 'gen', label: '상식 퀴즈', short: '상식' }, { id: 'ns', label: '넌센스 퀴즈', short: '넌센스' }];
  const MODE_KEY = 'kongstar.game.quiz.mode';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let modeSel = lsGet(MODE_KEY); if (!MODES.some(m => m.id === modeSel)) modeSel = 'all';   // 카드에서 고른 종류
  let modeId = modeSel;                                                                     // 이 판의 종류 (시작할 때 한 번 읽어 그 판 동안 그대로)
  const inMode = q => modeId === 'all' || (modeId === 'ns') === (q.type === 'ns');
  const recOf = (m, d) => { if (m === 'all') return best(KG.dkey('quiz', d)); const v = parseFloat(lsGet('kongstar.game.quiz.' + m + '.' + d)); return isFinite(v) && v > 0 ? v : 0; };
  function putRec(m, d, v) { if (!(v > 0)) return false; if (m === 'all') return setBest(KG.dkey('quiz', d), v); if (v > recOf(m, d)) { lsSet('kongstar.game.quiz.' + m + '.' + d, String(Math.round(v))); return true; } return false; }
  const modePickers = [];
  const paintMode = () => { for (const el of modePickers) for (const b of el.children) { const on = b.dataset.m === modeSel; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); } };
  function setMode(id) { if (!MODES.some(m => m.id === id) || id === modeSel) return false; modeSel = id; lsSet(MODE_KEY, id); paintMode(); paintBest(); return true; }
  function modePicker() {
    const el = document.createElement('div'); el.className = 'kg-diff qmode'; el.setAttribute('role', 'radiogroup'); el.setAttribute('aria-label', '문제 종류');
    for (const m of MODES) { const b = document.createElement('button'); b.type = 'button'; b.dataset.m = m.id; b.textContent = m.label; b.setAttribute('role', 'radio'); b.addEventListener('click', () => { sfx('tap'); setMode(m.id); }); el.appendChild(b); }

  }

  const game = $('game'), optsEl = $('opts');
  const bar = topbar({ title: J(name, '의') + ' 퀴즈 퀴즈', back: 'index.html' });
  const btnPause = document.createElement('button');
  btnPause.className = 'kg-pill kg-round'; btnPause.setAttribute('aria-label', '잠깐 멈추기'); btnPause.hidden = true;
  btnPause.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
  bar.right(btnPause);

  // 글자 크기를 칸에 맞춰 줄인다 (문제 카드는 --qs 배율로, 보기·해설은 글자 크기로)
  function fitAll() {

    while (s > 0.6 && c.scrollHeight > c.clientHeight + 1) { s -= 0.05; c.style.setProperty('--qs', s.toFixed(2)); }
    for (const b of optsEl.children) {

    }

  }
  // 해설 머리글: 정답 낱말이 말줄임(…)으로 잘리지 않게, 칸 폭에 들어가는 가장 긴 후보를 쓴다
  function fitHead() {
    const b = $('fbT'), hs = cur && cur.heads; if (!hs || $('fb').hidden) return;

  }
  // 위 줄 제목: 놀이 중에는 멈춤 단추가 생겨 좁다 — 다 안 들어가면 짧은 이름으로
  const TITLE = J(name, '의') + ' 퀴즈 퀴즈';

  let phase = 'ask';              // 놀이 중: ask(답을 기다림) · show(정답과 해설을 보여 줌 — 시간은 흐르지 않는다)
  let score = 0, hearts = 3, streak = 0, maxStreak = 0, correct = 0, asked = 0, hints = 0, skips = 0;
  let cur = null, showT = 0, showLen = 1, tAnim = 0, mood = 'idle', moodT = 0, askAt = 0, showAt = 0, endAt = -1e9, lastTick = 0;
  let recNew = null;   // 이 판의 기록을 저장했는지(null: 아직) — 마지막 하트를 잃는 순간 바로 저장해, 해설을 보다 나가도 기록이 남게 한다
  const saveRec = () => { if (score > 0 && putRec(modeId, diffId, score)) recNew = true; return !!recNew; };   // 맞힐 때마다 바로 저장 — 하트가 남은 채 나가도 기록이 남게
  const used = new Set(); let runType = '', runN = 0, lastId = -1;
  const SEEN_KEY = 'kongstar.game.quiz.seen', SEEN_MAX = 120;
  let seen = [];
  function loadSeen() { try { const a = JSON.parse(localStorage.getItem(SEEN_KEY) || '[]'); seen = Array.isArray(a) ? a.filter(n => Number.isInteger(n) && n >= 0 && n < BANK.length).slice(-SEEN_MAX) : []; } catch (e) { seen = []; } }
  function pushSeen(id) { const i = seen.indexOf(id); if (i >= 0) seen.splice(i, 1); seen.push(id); if (seen.length > SEEN_MAX) seen.splice(0, seen.length - SEEN_MAX); try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} }

  // ═══════ 문제 고르기 ═══════
  function pickLevel() {

    ['💡', '어려우면 찬스를 써요. 「힌트」는 틀린 보기를 지우고 「넘기기」는 다음 문제로 가요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용
  window.GAME = {
    get state() { return state; }, get phase() { return phase; }, get score() { return score; }, get hearts() { return hearts; }, get streak() { return streak; }, get maxStreak() { return maxStreak; },
    get correct() { return correct; }, get asked() { return asked; }, get hints() { return hints; }, get skips() { return skips; }, get diff() { return diffId; }, get D() { return D; }, DIFF,
    start, pause, resume, end: () => { if (state === 'pause') resume(); if (state === 'play') { hearts = 0; paintHearts(); finish(); } },
    step: dt => { tAnim += dt; moodT += dt; update(dt); },   // 시험용: 화면 없이 빨리 돌리기
    cur: () => cur ? { id: cur.q.id, type: cur.q.type, cat: cur.q.cat, lv: cur.q.lv, q: cur.q.q, big: cur.q.big || '', exp: cur.q.exp, opts: cur.opts.map(o => o.t), gone: cur.opts.map(o => !!o.gone), answer: cur.ans, t: cur.t, limit: cur.limit, phase } : null,
    answer: i => resolve(i), next, hint, skip,
    bank: () => BANK.map(q => Object.assign({}, q, { opts: q.opts.slice() })), check, chosung,
    seen: () => seen.slice(),
    MODES, get mode() { return modeId; }, get modeSel() { return modeSel; }, setMode, rec: (m, d) => recOf(m || modeSel, d || KG.diff()), pool: () => BANK.filter(inMode).length
  };
})();
</script>
