<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>콩이의 사료그릇</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
/* 콩이의 사료그릇: 밤하늘(bg) → 사료통(fx) → 콩이(stage) → 그릇(bowl) → 점수판·단추 순서로 겹친다 */
#bg, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#fx { z-index: 1; touch-action: none; cursor: pointer; }
#stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#bowl { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; }
#bowl svg { display: block; width: 100%; height: 100%; overflow: visible; }
#say { position: fixed; z-index: 4; box-sizing: border-box; pointer-events: none; background: #fff; color: var(--ink); font-size: 13.5px; font-weight: 600; letter-spacing: -.2px; line-height: 1.35; padding: 8px 12px; border-radius: 14px 14px 14px 4px; box-shadow: 0 4px 14px rgba(0,0,0,.22); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
#say.show { opacity: 1; transform: none; }
#hud { position: fixed; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud > div { height: 32px; box-sizing: border-box; border-radius: 16px; padding: 0 11px; background: rgba(18,22,52,.62); border: 1px solid var(--glass-line); display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .df { color: #D5DBFF; font-weight: 500; }
#hud .mv small { font-size: 12px; font-weight: 500; color: #C9D1F2; margin-left: 1px; }
#ctl { position: fixed; z-index: 10; display: flex; gap: 8px; }
#ctl button { flex: 1 1 0; min-width: 0; height: 46px; box-sizing: border-box; border-radius: 16px; border: 1px solid var(--glass-line); background: rgba(18,22,52,.62); color: #fff; font-size: 14px; font-weight: 600; letter-spacing: -.3px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; white-space: nowrap; }
#ctl button:active { background: rgba(60,68,130,.7); }
#ctl button:disabled { opacity: .38; }
#ctl button b { min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; box-sizing: border-box; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
#ctl button.nudge:not(:disabled) { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,200,97,.35); animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 0%,100% { box-shadow: 0 0 0 2px rgba(255,200,97,.35); } 50% { box-shadow: 0 0 0 5px rgba(255,200,97,.12); } }
#ctl.col { flex-direction: column; }
#ctl.col button { flex: 0 0 44px; height: 44px; width: 100%; }
:focus { outline: none; }
:focus-visible { outline: 3px solid #9FB0FF; outline-offset: 2px; }
.kg-card .how { text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin: 14px 0 0; }
.kg-card .how p { font-size: 14px; color: #4E5968; margin: 0; }
.kg-card .how b { color: var(--ink); font-weight: 600; }
.kg-card .info { margin: 8px 0 0; font-size: 13px; color: var(--sub); }
.kg-card .rec { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.kg-card .rec span { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kg-card .rec span b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.kg-card .new { display: inline-block; margin-top: 4px; background: #FFF4D6; color: #B07A00; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 10px; }
.kg-card .big small { font-size: 18px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
a.kg-btn { text-decoration: none; box-sizing: border-box; }
.kg-card .row #btnRules { flex: 0 0 auto; padding: 0 16px; font-size: 15px; color: var(--sub); }
/* 카드가 떠 있어도 위 줄(게임 고르기·소리)은 눌려야 한다 */
body .kg-top { z-index: 26; }
@media (max-width: 340px) { body .kg-card .kg-diff button { font-size: 12px; } #ctl { gap: 6px; } #ctl button { font-size: 13px; letter-spacing: -.5px; } }
@media (max-height: 600px) {
  body .kg-card .how { margin-top: 10px; padding: 9px 14px; }
  body .kg-card .kg-diff { margin-top: 10px; }
}
@media (min-height: 431px) and (max-height: 600px) {
  body .kg-rules .kg-card { box-sizing: border-box; padding: 16px 16px 14px; }
  body .kg-rules li { padding: 8px 10px; font-size: 14px; }
  body .kg-rules ul { margin-top: 8px; }
  body .kg-rules .kg-btn { margin-top: 10px; height: 48px; }
}
/* 낮은 화면(가로 휴대폰): 난이도 단추까지 한 화면에 들어오게 카드를 촘촘하게 */
@media (max-height: 430px) {
  body .kg-card { box-sizing: border-box; width: min(100%, 420px); padding: 14px 20px; }
  body .kg-card h2 { margin-bottom: 2px; }
  #stLead, #edText { display: none; }
  body .kg-card .how { margin-top: 6px; padding: 7px 14px; }
  body .kg-card .info { margin-top: 5px; }
  body .kg-card .kg-diff { margin-top: 8px; }
  body .kg-card .kg-diff button { height: 36px; }
  body .kg-card .rec { margin-top: 8px; }
  body .kg-card .row { margin-top: 10px; }
  body .kg-card .kg-btn { height: 44px; }
  body .kg-card .big { font-size: 32px; margin: 0; }
}
@media (prefers-reduced-motion: reduce) { #ctl button.nudge { animation: none; } }
/* 가로 낮은 화면에서 순위 카드와 나란히 설 때(11-23 결과 단추 정리): 「새 기록」 딱지를 점수 옆에 붙여 한 줄을 아끼고, 단추 줄(「다른 게임」 포함)이 카드 안에 들어오게 */
@media (orientation: landscape) and (max-height: 430px) { #cardEnd.kg-rbwrap .big { display: inline-block; vertical-align: middle; } #cardEnd.kg-rbwrap .new { margin: 0 0 0 8px; vertical-align: middle; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx" role="img" aria-label="사료통"></canvas>
<div id="stage"></div>
<div id="bowl" aria-hidden="true"></div>
<div id="say" role="status" aria-live="polite"></div>

<div id="hud" aria-hidden="true">
  <div class="st" id="hudStage">1단계</div>
  <div class="df" id="hudDiff">Normal</div>
  <div class="mv"><span id="hudMoves">0</span><small>수</small></div>
</div>
<div id="ctl" hidden>
  <button type="button" id="btnUndo">되돌리기<b id="undoN"></b></button>
  <button type="button" id="btnRestart">처음부터</button>
  <button type="button" id="btnExtra">빈 통 하나 더</button>
</div>

<div class="kg-scrim" id="cardStart">
  <div class="kg-card">
    <h2 id="stTitle">콩이의 사료그릇</h2>
    <p id="stLead"></p>
    <div class="how"><p><b>통을 누르고 다른 통을 누르면</b> 맨 위 사료가 옮겨져요. 색깔별로 모아 주세요.</p></div>
    <p class="info" id="stInfo"></p>
    <div class="rec" id="stRec"><span>이번에 할 단계<b id="stStage"></b></span><span id="stBestBox">최고 기록<b id="stBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnRules" type="button">규칙 보기</button><button class="kg-btn pri" id="btnStart">시작</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardPause" hidden>
  <div class="kg-card">
    <h2>잠깐 쉬는 중이에요</h2>
    <p id="psText"></p>
    <div class="row"><button class="kg-btn" id="btnQuit" type="button">그만하기</button><button class="kg-btn pri" id="btnResume">계속하기</button></div>
  </div>
</div>

<div class="kg-scrim" id="cardEnd" hidden>
  <div class="kg-card">
    <h2 id="edTitle">단계 완료!</h2>
    <p id="edText"></p>
    <div class="big"><span id="edMoves">0</span><small>수 만에</small></div>
    <div id="edNew" class="new" hidden>새 기록이에요!</div>
    <div class="rec"><span>깬 단계<b id="edStage"></b></span><span id="edRec">최고 기록<b id="edBest"></b></span></div>
    <div class="row"><button class="kg-btn" id="btnStop" type="button">그만하기</button><button class="kg-btn pri" id="btnNext">다음 단계</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { name, J, kong, sfx, tone, noise, voice, best, setBest, topbar, toast, safe, rand, clamp, lerp, TAU, reduceMotion } = KG;
  const $ = id => document.getElementById(id);
  const bg = $('bg'), fx = $('fx'), ctx = fx.getContext('2d'), stage = $('stage'), bowlEl = $('bowl'), sayEl = $('say');
  const TITLE = J(name, '의') + ' 사료그릇';

  // ═══════ 난이도 표 ═══════
  //   colors [단계부터, 색 수] 를 차례로 (단계가 오르면 색·통이 는다) · cap 통 높이(칸) · empty 빈 통 수 · thin 이 수로 나눠떨어지는 단계는 빈 통을 하나 줄인다(0 이면 안 줄임)
  //   extra 「빈 통 하나 더」 횟수(단계당) · undo 되돌리기 횟수(단계당, Infinity = 마음껏) · warn 더는 풀 수 없는 길로 들어서면 바로 알려 준다
  const DIFF = {
    easy:   { colors: [[1, 3], [4, 4]],                    cap: 4, empty: 2, thin: 0, extra: 1, undo: Infinity, warn: true },
    normal: { colors: [[1, 4], [3, 5], [7, 6]],            cap: 4, empty: 2, thin: 0, extra: 1, undo: 5,        warn: true },
    hard:   { colors: [[1, 5], [3, 6], [6, 7], [10, 8]],   cap: 4, empty: 2, thin: 0, extra: 0, undo: 3,        warn: false },
    vhard:  { colors: [[1, 7], [4, 8], [9, 9]],            cap: 5, empty: 2, thin: 3, extra: 0, undo: 2,        warn: false }
  };
  const INFO = {
    easy: '색 3~4가지 · 되돌리기 마음껏 · 빈 통 하나 더 1번',
    normal: '색 4~6가지 · 되돌리기 5번 · 빈 통 하나 더 1번',
    hard: '색 5~8가지 · 되돌리기 3번 · 빈 통 추가 없음',
    vhard: '색 7~9가지 · 통 5→6칸 · 되돌리기 2→1번 · 갈수록 어려워져요'
  };
  const GEN_LIMIT = 30000, WARN_LIMIT = 20000;   // 풀이 탐색에서 들여다볼 배치 수 (만들 때 · 놀이 중 확인)
  let diffId = 'normal', D = DIFF.normal;        // 판을 시작할 때 한 번 읽어 그 판 동안 그대로

  // 사료 9가지: 색과 알갱이 모양을 함께 달리한다 (색각이 달라도 모양으로 구분)
  const COL = [
    { n: '빨강 동그라미', m: '#F2766B', l: '#FFE3DF', d: '#C24A40', s: 'circle' },
    { n: '노랑 별',       m: '#F4B833', l: '#FFF4D0', d: '#B88200', s: 'star' },
    { n: '초록 세모',     m: '#58C487', l: '#DDF7E8', d: '#2B915A', s: 'tri' },
    { n: '파랑 네모',     m: '#5AA2F5', l: '#DEECFF', d: '#2A6CC0', s: 'square' },
    { n: '보라 고리',     m: '#A78BF0', l: '#ECE5FF', d: '#6C4EC4', s: 'ring' },
    { n: '분홍 하트',     m: '#F58DB8', l: '#FFE5EF', d: '#C54F82', s: 'heart' },
    { n: '청록 뼈다귀',   m: '#3CC2C0', l: '#D9F7F6', d: '#1A8886', s: 'bone' },
    { n: '밤색 더하기',   m: '#BC8A64', l: '#F6E7DB', d: '#84573A', s: 'plus' },
    { n: '남색 마름모',   m: '#7481C2', l: '#E1E5F8', d: '#454F8C', s: 'diamond' }
  ];

  // ═══════ 퍼즐 논리 (화면과 따로 — 통은 [바닥 … 맨 위] 색 번호 배열) ═══════
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const uniform = t => { for (let i = 1; i < t.length; i++) if (t[i] !== t[0]) return false; return true; };
  const complete = (t, cap) => t.length === cap && uniform(t);
  const topRun = t => { let k = 0; for (let i = t.length - 1; i >= 0 && t[i] === t[t.length - 1]; i--) k++; return k; };
  const solved = (T, cap) => T.every(t => t.length === 0 || complete(t, cap));
  // i → j 로 옮겨지는 알갱이 층 수 (못 옮기면 0): 맨 위 같은 색 묶음을 통째로만 — 받는 통이 비었거나 맨 위가 같은 색이고,
  // 묶음이 다 들어갈 자리가 있어야 한다 (자리가 모자라 일부만 넘어가는 붓기는 없다)
  function movable(T, cap, i, j) {
    if (i === j || !T[i] || !T[j]) return 0; const s = T[i], d = T[j];
    if (!s.length || d.length >= cap) return 0;
    if (d.length && d[d.length - 1] !== s[s.length - 1]) return 0;
    const k = topRun(s); return k <= cap - d.length ? k : 0;
  }
  // 뜻이 있는 수만: 다 찬 통에서 꺼내기, 한 색뿐인 통을 빈 통으로 통째 옮기기(제자리걸음)는 뺀다. 빈 통은 하나만 본다. 좋은 수부터.
  function genMoves(T, cap) {
    const out = [];
    for (let i = 0; i < T.length; i++) {
      const s = T[i]; if (!s.length) continue;
      const k = topRun(s), uni = k === s.length; if (uni && s.length === cap) continue;
      let emptySeen = false;
      for (let j = 0; j < T.length; j++) {
        if (j === i) continue; const d = T[j]; if (d.length >= cap) continue;
        if (!d.length) { if (uni || emptySeen) continue; emptySeen = true; out.push([i, j, k, 1]); }
        else if (d[d.length - 1] === s[s.length - 1] && k <= cap - d.length) out.push([i, j, k, 4 + (uniform(d) ? 3 : 0) + (uni ? 0 : 2) + (d.length + k === cap ? 1 : 0)]);   // 묶음이 통째로 들어갈 때만
      }
    }
    return out.sort((a, b) => b[3] - a[3]);
  }
  // 풀이 탐색(깊이 우선 + 본 배치 기억). → { moves: [[from,to],…] | null, nodes, hit(한도에 걸려 끝까지 못 봄) }
  function solve(src, cap, limit) {
    const T = src.map(t => t.slice()), seen = new Set(), path = []; let nodes = 0, hit = false;
    const key = () => T.map(t => String.fromCharCode.apply(null, t.map(c => 65 + c))).sort().join('|');
    function rec() {
      if (solved(T, cap)) return true;
      if (++nodes > limit) { hit = true; return false; }
      const k = key(); if (seen.has(k)) return false; seen.add(k);
      for (const [i, j, c] of genMoves(T, cap)) {
        for (let n = 0; n < c; n++) T[j].push(T[i].pop());
        path.push([i, j]);
        if (rec()) return true;
        path.pop(); for (let n = 0; n < c; n++) T[i].push(T[j].pop());
        if (hit) return false;
      }
      return false;
    }
    const ok = rec();
    return { moves: ok ? path.slice() : null, nodes, hit };
  }
  const colorsAt = (d, st) => { let n = d.colors[0][1]; for (const [from, c] of d.colors) if (st >= from) n = c; return n; };
  // 씨앗으로 색을 고르고 섞어 통에 담는다 (색 nc 가지 · 통 cap 칸 · 빈 통 ne 개)
  function deal(rnd, nc, cap, ne) {
    const ids = COL.map((c, i) => i); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const bag = []; for (let c = 0; c < nc; c++) for (let k = 0; k < cap; k++) bag.push(ids[c]);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    const T = []; for (let c = 0; c < nc; c++) T.push(bag.slice(c * cap, c * cap + cap)); for (let e = 0; e < ne; e++) T.push([]);
    return T;
  }
  // 시시한 배치: 이미 다 모인 통이 있거나, 거의 다 모인 통이 너무 많다
  const dull = (T, cap, nc) => T.some(t => complete(t, cap)) || T.filter(t => t.length && topRun(t) >= cap - 1).length > nc / 3;

  // ═══════ Very Hard 계단 (11-27) ═══════
  //   9단계까지는 예전 판 그대로. 10단계부터 몇 단계마다 한 계단씩 어려워지고 130단계에서 끝(그 뒤로는 같은 조건)
  //   풀리는 후보를 여럿 만들어 봇 점수가 가장 낮은(같으면 풀이 탐색이 오래 걸린) 판을 쓴다 — 후보가 많을수록 어렵다
  //   (함정 비율로 고르는 방식은 얕은 함정만 골라 미리 따지는 사람에게 오히려 쉬워서 뺐다)
  //   [단계부터, 통 칸, 후보 수, 되돌리기]
  const VH_STEPS = [[101, 5, 2, 2], [111, 5, 4, 2], [121, 5, 8, 2], [136, 5, 16, 2], [151, 5, 24, 2], [171, 6, 8, 2], [191, 6, 16, 2], [221, 6, 24, 1]];   // 11-27 사용자 요청: 100단계까지는 예전 판 그대로, 101단계부터 계단 시작 (간격은 처음 표와 같게 +91)
  const vhStep = st => { let k = -1; for (let i = 0; i < VH_STEPS.length; i++) if (st >= VH_STEPS[i][0]) k = i; return k; };
  const undoAt = (id, st) => { const d = DIFF[id] || DIFF.normal, k = id === 'vhard' ? vhStep(st) : -1; return k < 0 ? d.undo : VH_STEPS[k][3]; };
  const bkey = T => T.map(t => String.fromCharCode.apply(null, t.map(c => 65 + c))).sort().join('|');
  const pour = (T, i, j, k) => { for (let n = 0; n < k; n++) T[j].push(T[i].pop()); };
  // 봇 점수: 뜻있는 수를 아무거나 두는 손(본 배치로는 안 돌아감)이 n 번 중 몇 번 푸는가 — 낮을수록 함정이 많다
  function botRate(src, cap, rnd, n) {
    let ok = 0;
    for (let r = 0; r < n; r++) {
      const T = src.map(t => t.slice()), seen = new Set([bkey(T)]);
      for (let s = 0; s < 400; s++) {
        if (solved(T, cap)) { ok++; break; }
        const ms = genMoves(T, cap).filter(m => { pour(T, m[0], m[1], m[2]); const k = bkey(T); pour(T, m[1], m[0], m[2]); return !seen.has(k); });
        if (!ms.length) break;
        const m = ms[Math.floor(rnd() * ms.length)]; pour(T, m[0], m[1], m[2]); seen.add(bkey(T));
      }
    }

  btnPause.addEventListener('click', () => { sfx('tap'); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (KG.rulesOpen) return;
    if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'play') pause(); else if (state === 'pause') resume(); return; }
    if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (e.target && e.target.closest && e.target.closest('button, a')) return;   // 단추 위에서는 단추가 알아서
      e.preventDefault();
      if (state === 'ready') start(); else if (state === 'result') { if (late()) next(); } else if (state === 'pause') resume(); else if (state === 'play') { curOn = true; tapTube(cur); }
      return;
    }
    if (state !== 'play') return;
    const R = RECT[cur], n = tubes.length;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { curOn = true; cur = (cur + (k === 'ArrowLeft' ? n - 1 : 1)) % n; e.preventDefault(); }
    else if ((k === 'ArrowUp' || k === 'ArrowDown') && R) {
      curOn = true; e.preventDefault(); let bi = -1, bd = 1e9;
      for (let i = 0; i < n; i++) if (RECT[i].row !== R.row) { const d = Math.abs(RECT[i].cx - R.cx); if (d < bd) { bd = d; bi = i; } }
      if (bi >= 0) cur = bi;
    }
    else if (/^[0-9]$/.test(k) || k === '-') { const i = k === '0' ? 9 : k === '-' ? 10 : +k - 1; if (i < n) { curOn = true; tapTube(i); } }
    else if (k === 'z' || k === 'Z' || k === 'Backspace') { undo(); e.preventDefault(); }
    else if (k === 'r' || k === 'R') restart();
    else if (k === 'e' || k === 'E' || k === '+') addTube();
  });

  // ═══════ 시작 ═══════
  layout();
  $('stRec').parentNode.insertBefore(KG.diffPicker(null, () => { if (state === 'ready') preview(); else paintCards(); }), $('stInfo'));
  $('cardEnd').querySelector('.row').before(KG.diffPicker(null));
  KG.resultActions($('cardEnd').querySelector('.kg-card'), { guard: late });   // 단계 완료 카드: 단추 줄 아래 「다른 게임」(게임 고르기로) — 막 뜬 카드의 누름은 넘긴다
  const rb = KG.rankBox($('cardEnd').querySelector('.kg-card'), 'bowl');   // 단계 완료 카드 바로 아래(가로 화면은 오른쪽)에 붙는 별도의 가족 순위 카드
  KG.startRank($('cardStart'), 'bowl');   // 시작 카드 아래에 고른 난이도의 가족 순위
  preview();
  const RULES = { key: 'bowl', title: TITLE, lead: '뒤섞인 사료를 색깔별로 모아 ' + J(name, '에게') + ' 주세요.', items: [
    ['🥣', '통을 누른 다음 다른 통을 누르면, 맨 위 사료가 그 통으로 옮겨져요.'],
    ['🎨', '빈 통이나 맨 위가 같은 색인 통에만 부어요. 맨 위 같은 색은 한꺼번에 옮겨지고, 다 들어갈 자리가 없으면 못 부어요.'],
    ['🐶', '통마다 한 가지 색으로 가득 채우면 ' + J(name, '이/가') + ' 달려와 맛있게 먹어요.'],
    ['↩️', '막히면 되돌리기나 처음부터를 눌러요. 시간 제한은 없어요.']
  ] };
  const focusStart = () => { if (state === 'ready' && !$('cardStart').hidden) { try { $('btnStart').focus({ preventScroll: true }); } catch (e) {} } };
  $('btnRules').addEventListener('click', () => { if (state !== 'ready' || KG.rulesOpen) return; sfx('tap'); KG.rules(RULES, true).then(focusStart); });
  KG.rules(RULES).then(focusStart);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  // 시험·디버그용
  const stepN = dt => { let left = dt; while (left > 1e-6) { const d = Math.min(0.05, left); left -= d; tAnim += d; update(d); } drawKong(); };
  window.GAME = {
    get state() { return state; }, get score() { return cleared; }, get stage() { return stageNo; }, get moves() { return moves; }, get diff() { return diffId; }, get D() { return D; },
    get tubes() { return tubes.map(t => t.slice()); }, get cap() { return cap; }, get sel() { return sel; }, get stuck() { return stuck; }, get undoLeft() { return undoLeft; }, get extraLeft() { return extraLeft; },
    start, begin, next, pause, resume, end: quit, step: stepN,
    tap: tapTube, move: (a, b) => doMove(a, b), undo, restart, extra: addTube,
    legal: () => genMoves(tubes, cap).map(m => [m[0], m[1]]),
    setTubes: T => { if (state !== 'play') return false; tubes = T.map(t => t.slice()); V = tubes.map(() => ({ lift: 0, shake: 0, arrN: 0, arrT: 0, glow: 0 })); hist = []; sel = -1; cur = 0; place(); checkStuck(); paintHud(); return true; },   // 시험용: 배치를 바꿔 끼운다
    solve: limit => solve(tubes, cap, limit || 200000).moves,
    // 자동으로 n 단계 풀기 (화면 없이): [{ stage, colors, tubes, moves }]
    autoSolve: n => {
      const out = [];
      for (let i = 0; i < (n || 1); i++) {
        if (state === 'result') next(); else if (state !== 'play') start();
        const sol = solve(tubes, cap, 400000).moves; if (!sol) { out.push({ stage: stageNo, fail: true }); break; }
        const rec = { stage: stageNo, colors: new Set([].concat.apply([], tubes)).size, tubes: tubes.length, moves: sol.length };
        for (const [a, b] of sol) if (!doMove(a, b)) { rec.fail = true; break; }
        let g = 0; while (state === 'clear' && g++ < 200) stepN(0.1);
        rec.state = state; out.push(rec); if (rec.fail) break;
      }
      return out;
    },
    layout: () => ({ W, H, land, AREA, TW, LH, CELLW, ROWH, RECT, KX0, KY, BX, KSZ }),
    lib: { DIFF, COL, makeStage, solve, genMoves, movable, solved, complete, colorsAt, VH_STEPS, vhStep, undoAt }
  };
})();
</script>
</body>
</html>
